<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="gin-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="gin-arr-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="490" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    GIN — mean/max 聚合的信息坍缩 vs. sum + MLP 聚合的单射映射
  </text>

  <!-- Top row: mean/max collapse -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="940" height="245" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="470" y="24" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">
      机制一 · mean / max 聚合不是单射的(两种不同的邻居多重集合 → 相同输出)
    </text>

    <!-- multiset A: 2 neighbors -->
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="150" height="110" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="75" y="18" text-anchor="middle" font-size="9.5" fill="#991b1b" font-weight="700">节点 A:2 个邻居</text>
      <circle cx="45" cy="55" r="14" fill="#fca5a5" stroke="#991b1b" stroke-width="1.3"/>
      <text x="45" y="59" text-anchor="middle" font-size="8" fill="#7f1d1d" font-weight="700">[1,0]</text>
      <circle cx="105" cy="55" r="14" fill="#fca5a5" stroke="#991b1b" stroke-width="1.3"/>
      <text x="105" y="59" text-anchor="middle" font-size="8" fill="#7f1d1d" font-weight="700">[1,0]</text>
      <text x="75" y="92" text-anchor="middle" font-size="8" fill="#991b1b">多重集合 {[1,0], [1,0]}</text>
    </g>

    <!-- multiset B: 1 neighbor -->
    <g transform="translate(30, 165)">
      <rect x="0" y="0" width="150" height="70" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="75" y="18" text-anchor="middle" font-size="9.5" fill="#991b1b" font-weight="700">节点 B:1 个邻居</text>
      <circle cx="75" cy="45" r="14" fill="#fca5a5" stroke="#991b1b" stroke-width="1.3"/>
      <text x="75" y="49" text-anchor="middle" font-size="8" fill="#7f1d1d" font-weight="700">[1,0]</text>
    </g>
    <text x="105" y="252" text-anchor="middle" font-size="8" fill="#991b1b"> </text>

    <line x1="185" y1="100" x2="230" y2="150" stroke="#dc2626" stroke-width="2" marker-end="url(#gin-arr-red)"/>
    <line x1="185" y1="200" x2="230" y2="160" stroke="#dc2626" stroke-width="2" marker-end="url(#gin-arr-red)"/>

    <!-- mean box -->
    <g transform="translate(235, 45)">
      <rect x="0" y="0" width="140" height="90" rx="6" fill="#fecaca" stroke="#991b1b" stroke-width="1.8"/>
      <text x="70" y="22" text-anchor="middle" font-size="10.5" fill="#7f1d1d" font-weight="700">mean 聚合</text>
      <text x="70" y="40" text-anchor="middle" font-size="8.5" fill="#7f1d1d">GCN 加权平均 /</text>
      <text x="70" y="53" text-anchor="middle" font-size="8.5" fill="#7f1d1d">GraphSAGE mean</text>
      <rect x="35" y="62" width="70" height="20" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.2"/>
      <text x="70" y="76" text-anchor="middle" font-size="9" fill="#fef2f2" font-weight="700">→ [1,0]</text>
    </g>

    <!-- max box -->
    <g transform="translate(235, 145)">
      <rect x="0" y="0" width="140" height="90" rx="6" fill="#fecaca" stroke="#991b1b" stroke-width="1.8"/>
      <text x="70" y="22" text-anchor="middle" font-size="10.5" fill="#7f1d1d" font-weight="700">max 聚合</text>
      <text x="70" y="40" text-anchor="middle" font-size="8.5" fill="#7f1d1d">GraphSAGE pooling</text>
      <text x="70" y="53" text-anchor="middle" font-size="8.5" fill="#7f1d1d">(FC + 逐元素取 max)</text>
      <rect x="35" y="62" width="70" height="20" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.2"/>
      <text x="70" y="76" text-anchor="middle" font-size="9" fill="#fef2f2" font-weight="700">→ [1,0]</text>
    </g>

    <text x="475" y="90" text-anchor="middle" font-size="26" fill="#dc2626" font-weight="700">=</text>
    <text x="475" y="150" text-anchor="middle" font-size="9" fill="#991b1b" font-weight="700">两种不同的邻居</text>
    <text x="475" y="163" text-anchor="middle" font-size="9" fill="#991b1b" font-weight="700">结构坍缩成同一个输出</text>

    <!-- outcome -->
    <g transform="translate(540, 45)">
      <rect x="0" y="0" width="380" height="190" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="190" y="26" text-anchor="middle" font-size="10.5" fill="#991b1b" font-weight="700">丢失的信息</text>
      <text x="20" y="52" font-size="9" fill="#7f1d1d">mean:只保留邻居特征的"比例分布",</text>
      <text x="20" y="68" font-size="9" fill="#7f1d1d">丢失"总共有多少个邻居"的计数信息。</text>
      <text x="20" y="94" font-size="9" fill="#7f1d1d">max:只保留"是否存在某特征取值",</text>
      <text x="20" y="110" font-size="9" fill="#7f1d1d">丢失"有多少个邻居具有该特征"。</text>
      <text x="20" y="140" font-size="9.5" fill="#991b1b" font-weight="700">两者都不是单射函数 →</text>
      <text x="20" y="158" font-size="9.5" fill="#991b1b" font-weight="700">严格弱于 WL test 的表达力</text>
      <text x="20" y="182" font-size="8.5" fill="#b91c1c">(GCN 加权平均本质仍是均值,同样受限)</text>
    </g>
  </g>

  <!-- divider arrow -->
  <line x1="490" y1="308" x2="490" y2="335" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#gin-arr)"/>
  <text x="600" y="325" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="700">GIN 的解法:换一种聚合方式,保留计数信息</text>

  <!-- Bottom row: sum + MLP injective -->
  <g transform="translate(20, 340)">
    <rect x="0" y="0" width="940" height="245" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
    <text x="470" y="24" text-anchor="middle" font-size="13" fill="#065f46" font-weight="700">
      机制二 · sum + MLP 聚合是单射的(不同多重集合 → 不同输出,信息保留)
    </text>

    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="150" height="110" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
      <text x="75" y="18" text-anchor="middle" font-size="9.5" fill="#065f46" font-weight="700">节点 A:2 个邻居</text>
      <circle cx="45" cy="55" r="14" fill="#86efac" stroke="#065f46" stroke-width="1.3"/>
      <text x="45" y="59" text-anchor="middle" font-size="8" fill="#064e3b" font-weight="700">[1,0]</text>
      <circle cx="105" cy="55" r="14" fill="#86efac" stroke="#065f46" stroke-width="1.3"/>
      <text x="105" y="59" text-anchor="middle" font-size="8" fill="#064e3b" font-weight="700">[1,0]</text>
      <text x="75" y="92" text-anchor="middle" font-size="8" fill="#065f46">Σ = [2,0]</text>
    </g>

    <g transform="translate(30, 165)">
      <rect x="0" y="0" width="150" height="70" rx="6" fill="#dcfce7" stroke="#047857" stroke-width="1.5"/>
      <text x="75" y="18" text-anchor="middle" font-size="9.5" fill="#065f46" font-weight="700">节点 B:1 个邻居</text>
      <circle cx="75" cy="45" r="14" fill="#86efac" stroke="#065f46" stroke-width="1.3"/>
      <text x="75" y="49" text-anchor="middle" font-size="8" fill="#064e3b" font-weight="700">[1,0]</text>
    </g>

    <line x1="185" y1="100" x2="230" y2="150" stroke="#059669" stroke-width="2" marker-end="url(#gin-arr)"/>
    <line x1="185" y1="200" x2="230" y2="160" stroke="#059669" stroke-width="2" marker-end="url(#gin-arr)"/>

    <g transform="translate(235, 45)">
      <rect x="0" y="0" width="140" height="90" rx="6" fill="#bbf7d0" stroke="#065f46" stroke-width="1.8"/>
      <text x="70" y="22" text-anchor="middle" font-size="10.5" fill="#064e3b" font-weight="700">sum(A) = [2,0]</text>
      <text x="70" y="40" text-anchor="middle" font-size="8.5" fill="#065f46">求和保留计数,</text>
      <text x="70" y="53" text-anchor="middle" font-size="8.5" fill="#065f46">再喂给 MLP</text>
      <rect x="30" y="62" width="80" height="20" rx="4" fill="#059669" stroke="#064e3b" stroke-width="1.2"/>
      <text x="70" y="76" text-anchor="middle" font-size="9" fill="#f0fdf4" font-weight="700">→ MLP([2,0])</text>
    </g>

    <g transform="translate(235, 145)">
      <rect x="0" y="0" width="140" height="90" rx="6" fill="#bbf7d0" stroke="#065f46" stroke-width="1.8"/>
      <text x="70" y="22" text-anchor="middle" font-size="10.5" fill="#064e3b" font-weight="700">sum(B) = [1,0]</text>
      <text x="70" y="40" text-anchor="middle" font-size="8.5" fill="#065f46">不同的求和结果,</text>
      <text x="70" y="53" text-anchor="middle" font-size="8.5" fill="#065f46">MLP 不会再混淆</text>
      <rect x="30" y="62" width="80" height="20" rx="4" fill="#059669" stroke="#064e3b" stroke-width="1.2"/>
      <text x="70" y="76" text-anchor="middle" font-size="9" fill="#f0fdf4" font-weight="700">→ MLP([1,0])</text>
    </g>

    <text x="475" y="90" text-anchor="middle" font-size="26" fill="#059669" font-weight="700">≠</text>
    <text x="475" y="150" text-anchor="middle" font-size="9" fill="#065f46" font-weight="700">两种不同的邻居</text>
    <text x="475" y="163" text-anchor="middle" font-size="9" fill="#065f46" font-weight="700">结构映射到不同输出</text>

    <g transform="translate(540, 45)">
      <rect x="0" y="0" width="380" height="190" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="190" y="26" text-anchor="middle" font-size="10.5" fill="#065f46" font-weight="700">GIN 更新公式</text>
      <text x="190" y="52" text-anchor="middle" font-size="9.5" fill="#064e3b" font-weight="700">h_v^(k) = MLP^(k)( (1+ε)·h_v^(k-1) + Σ_u h_u^(k-1) )</text>
      <text x="20" y="80" font-size="9" fill="#065f46">求和(而非 mean/max)保留邻居计数信息;</text>
      <text x="20" y="96" font-size="9" fill="#065f46">MLP(而非单层线性变换)提供足够的函数</text>
      <text x="20" y="112" font-size="9" fill="#065f46">逼近能力,实现对多重集合的单射映射。</text>
      <text x="20" y="138" font-size="9" fill="#065f46">ε 控制自身表征与邻居求和的混合权重,</text>
      <text x="20" y="154" font-size="9" fill="#065f46">类似 GCN 自环,防止自身信息被邻居淹没。</text>
      <text x="20" y="178" font-size="9.5" fill="#047857" font-weight="700">理论证明:达到 WL test 同等的最大表达力</text>
    </g>
  </g>

  <!-- readout note -->
  <text x="490" y="618" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="700">
    机制三:图分类任务把每一层的图级别求和表征拼接起来做 readout,而非只用最后一层,避免丢失浅层局部结构信息
  </text>
  <text x="490" y="638" text-anchor="middle" font-size="9" fill="#6d28d9">
    三件套协同:求和(计数信息)+ MLP(单射逼近能力)+ 多层拼接读出(不丢浅层结构)缺一不可,才能达到 WL test 等价的表达力上限
  </text>
</svg>
