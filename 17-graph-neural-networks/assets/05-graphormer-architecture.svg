<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="gf-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="490" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Graphormer — 中心性编码 + 空间编码(最短路径偏置)+ 边编码,全局自注意力替代逐跳消息传递
  </text>

  <!-- input: graph as nodes/tokens -->
  <g transform="translate(20, 65)">
    <rect x="0" y="0" width="150" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="75" y="-8" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">图 → 节点当 token</text>
    <circle cx="75" cy="75" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <text x="75" y="79" text-anchor="middle" font-size="8" fill="#78350f" font-weight="700">i</text>
    <circle cx="30" cy="40" r="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="120" cy="35" r="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="130" cy="90" r="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="105" cy="130" r="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="40" cy="115" r="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <line x1="34" y1="45" x2="67" y2="72" stroke="#b45309" stroke-width="1.3"/>
    <line x1="112" y1="40" x2="84" y2="70" stroke="#b45309" stroke-width="1.3"/>
    <line x1="122" y1="88" x2="85" y2="78" stroke="#b45309" stroke-width="1.3"/>
    <line x1="100" y1="125" x2="80" y2="84" stroke="#b45309" stroke-width="1.3"/>
    <line x1="45" y1="112" x2="69" y2="82" stroke="#b45309" stroke-width="1.3"/>
    <text x="75" y="145" text-anchor="middle" font-size="8.5" fill="#92400e">不再限制"只看邻居"</text>
  </g>

  <line x1="170" y1="140" x2="212" y2="140" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#gf-arr)"/>

  <!-- Mechanism 1: centrality encoding -->
  <g transform="translate(215, 45)">
    <rect x="0" y="0" width="195" height="190" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    <text x="97" y="22" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="700">机制一 · 中心性编码</text>
    <line x1="14" y1="32" x2="181" y2="32" stroke="#f472b6" stroke-dasharray="3,3"/>
    <text x="97" y="52" text-anchor="middle" font-size="9" fill="#9d174d">按节点度数索引</text>
    <text x="97" y="66" text-anchor="middle" font-size="9" fill="#9d174d">的可学习嵌入 z_deg</text>
    <rect x="30" y="80" width="65" height="24" rx="5" fill="#f9a8d4" stroke="#9d174d" stroke-width="1.3"/>
    <text x="62" y="96" text-anchor="middle" font-size="8.5" fill="#831843" font-weight="700">x_v</text>
    <text x="97" y="97" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="700">+</text>
    <rect x="100" y="80" width="65" height="24" rx="5" fill="#f9a8d4" stroke="#9d174d" stroke-width="1.3"/>
    <text x="132" y="96" text-anchor="middle" font-size="8.5" fill="#831843" font-weight="700">z_deg(v)</text>
    <rect x="47" y="115" width="100" height="26" rx="5" fill="#f472b6" stroke="#831843" stroke-width="1.5"/>
    <text x="97" y="133" text-anchor="middle" font-size="10" fill="#fdf2f8" font-weight="700">h_v^(0)</text>
    <text x="97" y="160" text-anchor="middle" font-size="8" fill="#9d174d">加到输入表征上</text>
    <text x="97" y="174" text-anchor="middle" font-size="8" fill="#9d174d">度数高 = 图里的"枢纽"</text>
  </g>

  <line x1="410" y1="140" x2="450" y2="140" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#gf-arr)"/>

  <!-- Mechanism 2 + 3: spatial + edge encoding as attention bias -->
  <g transform="translate(453, 45)">
    <rect x="0" y="0" width="260" height="190" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="130" y="22" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="700">机制二 + 三 · 结构偏置</text>
    <line x1="14" y1="32" x2="246" y2="32" stroke="#93c5fd" stroke-dasharray="3,3"/>
    <text x="130" y="48" text-anchor="middle" font-size="9" fill="#1e3a8a" font-weight="700">空间编码:最短路径距离分桶</text>
    <rect x="20" y="56" width="50" height="22" rx="4" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.2"/>
    <text x="45" y="71" text-anchor="middle" font-size="8" fill="#1e3a8a" font-weight="700">b_1</text>
    <rect x="105" y="56" width="50" height="22" rx="4" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.2"/>
    <text x="130" y="71" text-anchor="middle" font-size="8" fill="#1e3a8a" font-weight="700">b_2</text>
    <rect x="190" y="56" width="50" height="22" rx="4" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.2"/>
    <text x="215" y="71" text-anchor="middle" font-size="8" fill="#1e3a8a" font-weight="700">b_远</text>
    <text x="130" y="93" text-anchor="middle" font-size="8.5" fill="#1d4ed8">按 SPD 分桶,每桶一个可学习标量</text>
    <text x="130" y="112" text-anchor="middle" font-size="9" fill="#1e3a8a" font-weight="700">边编码:路径边特征加权平均</text>
    <text x="130" y="127" text-anchor="middle" font-size="8.5" fill="#1d4ed8">分子图化学键类型 → c_ij</text>
    <rect x="80" y="138" width="100" height="26" rx="6" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="130" y="156" text-anchor="middle" font-size="9.5" fill="#eff6ff" font-weight="700">b_ij + c_ij</text>
    <text x="130" y="178" text-anchor="middle" font-size="8" fill="#1e3a8a">加到注意力分数上(而非做掩码)</text>
  </g>

  <line x1="716" y1="140" x2="757" y2="140" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#gf-arr)"/>

  <!-- global self-attention -->
  <g transform="translate(760, 45)">
    <rect x="0" y="0" width="200" height="190" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2.5"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">全局多头自注意力</text>
    <line x1="14" y1="32" x2="186" y2="32" stroke="#86efac" stroke-dasharray="3,3"/>
    <text x="100" y="52" text-anchor="middle" font-size="9" fill="#047857" font-weight="700">A_ij = QK^T/√d + b_ij + c_ij</text>
    <circle cx="45" cy="90" r="9" fill="#4ade80" stroke="#065f46" stroke-width="1.3"/>
    <circle cx="100" cy="75" r="9" fill="#86efac" stroke="#065f46" stroke-width="1.3"/>
    <circle cx="155" cy="90" r="9" fill="#4ade80" stroke="#065f46" stroke-width="1.3"/>
    <circle cx="100" cy="115" r="9" fill="#bbf7d0" stroke="#065f46" stroke-width="1.3"/>
    <line x1="45" y1="90" x2="100" y2="75" stroke="#059669" stroke-width="1"/>
    <line x1="45" y1="90" x2="155" y2="90" stroke="#059669" stroke-width="1"/>
    <line x1="45" y1="90" x2="100" y2="115" stroke="#059669" stroke-width="1"/>
    <line x1="100" y1="75" x2="155" y2="90" stroke="#059669" stroke-width="1"/>
    <line x1="100" y1="75" x2="100" y2="115" stroke="#059669" stroke-width="1"/>
    <line x1="155" y1="90" x2="100" y2="115" stroke="#059669" stroke-width="1"/>
    <text x="100" y="140" text-anchor="middle" font-size="8" fill="#047857">任意两节点直接算分数</text>
    <text x="100" y="154" text-anchor="middle" font-size="8" fill="#047857">不受"是否有边"限制</text>
    <text x="100" y="172" text-anchor="middle" font-size="8" fill="#047857">不再逐层一跳一跳传</text>
  </g>

  <!-- loop back: stack layers -->
  <path d="M 900 260 C 900 320, 500 360, 490 260" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#gf-arr)"/>
  <text x="700" y="340" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="700">堆叠多层 Transformer block(每层复用同一套结构偏置)→ 不受层数限制的长程依赖,不会过平滑</text>

  <!-- three-piece synergy note -->
  <g transform="translate(20, 400)">
    <rect x="0" y="0" width="940" height="240" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="470" y="26" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="700">三件套协同 — 缺一不可</text>
    <text x="18" y="52" font-size="10" fill="#4c1d95">只有中心性编码(机制一)没有空间编码 + 边编码(机制二、三):模型知道"这个节点有多重要",但不知道"两个节点之间在图上是什么关系"——退化成加了点节点属性的普通 Transformer。</text>
    <text x="18" y="76" font-size="10" fill="#4c1d95">只有空间编码(机制二)没有中心性编码(机制一):模型知道节点间距离,但不知道每个节点自身的结构重要性(度数)。</text>
    <text x="18" y="100" font-size="10" fill="#4c1d95">只有前两者没有边编码(机制三):对分子图这类边携带关键化学信息(化学键类型)的场景,会丢失对性质预测至关重要的信息。</text>
    <text x="18" y="132" font-size="10.5" fill="#7c3aed" font-weight="700">三者组合 → 标准 Transformer 完全保留全局注意力优势的同时,充分利用图的拓扑结构信息,不需要为图数据重新设计专门架构。</text>
    <text x="18" y="160" font-size="9.5" fill="#6d28d9">在 OGB 大规模分子性质预测挑战赛(PCQM4M-LSC)上大幅领先消息传递 GNN 基线,拿到 KDD Cup 2021 冠军。</text>
    <text x="18" y="188" font-size="9.5" fill="#6d28d9">呼应 ViT 把 Transformer 搬到图像 patch 序列——"Transformer 统一多模态架构"叙事在图数据上的又一例证。</text>
    <text x="18" y="216" font-size="9.5" fill="#6d28d9">GCN → GraphSAGE → GAT → GIN 划定消息传递表达力上限,Graphormer 跳出这个框架,完整闭合本家族的演化叙事。</text>
  </g>
</svg>
