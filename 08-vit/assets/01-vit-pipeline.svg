<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="26" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    ViT Pipeline · 图像如何变成 token 序列再被分类
  </text>

  <!-- ============== Stage 1: Image + patchify ============== -->
  <text x="100" y="60" text-anchor="middle" font-size="13"
        fill="#374151" font-weight="600">① 切 Patch</text>

  <!-- Original image frame -->
  <rect x="30" y="80" width="140" height="140" rx="4"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#92400e">224×224×3</text>

  <!-- 4×4 grid overlay (简化展示, 实际 14×14) -->
  <g stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,2" fill="none" opacity="0.7">
    <line x1="65"  y1="110" x2="65"  y2="220"/>
    <line x1="100" y1="110" x2="100" y2="220"/>
    <line x1="135" y1="110" x2="135" y2="220"/>
    <line x1="30"  y1="137" x2="170" y2="137"/>
    <line x1="30"  y1="165" x2="170" y2="165"/>
    <line x1="30"  y1="192" x2="170" y2="192"/>
  </g>
  <!-- Fake patch colors -->
  <rect x="30"  y="110" width="35" height="27" fill="#fde68a" opacity="0.6"/>
  <rect x="65"  y="110" width="35" height="27" fill="#fcd34d" opacity="0.5"/>
  <rect x="100" y="137" width="35" height="28" fill="#f59e0b" opacity="0.4"/>
  <rect x="135" y="165" width="35" height="27" fill="#fbbf24" opacity="0.5"/>
  <rect x="30"  y="192" width="35" height="28" fill="#fde68a" opacity="0.5"/>

  <text x="100" y="240" text-anchor="middle" font-size="11" fill="#6b7280">
    14×14 = 196 个 patch
  </text>
  <text x="100" y="254" text-anchor="middle" font-size="11" fill="#6b7280">
    每个 16×16×3 = 768 维
  </text>

  <!-- Arrow to stage 2 -->
  <line x1="180" y1="150" x2="222" y2="150"
        stroke="#9d174d" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- ============== Stage 2: Linear proj + flatten ============== -->
  <text x="300" y="60" text-anchor="middle" font-size="13"
        fill="#374151" font-weight="600">② Linear Proj + Pos Emb</text>

  <!-- Show 5 patch tokens after projection -->
  <g>
    <rect x="240" y="95" width="120" height="22" rx="3"
          fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="300" y="111" text-anchor="middle" font-size="11" fill="#9d174d">patch₁ · 768d</text>

    <rect x="240" y="122" width="120" height="22" rx="3"
          fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="300" y="138" text-anchor="middle" font-size="11" fill="#9d174d">patch₂ · 768d</text>

    <rect x="240" y="149" width="120" height="22" rx="3"
          fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="300" y="165" text-anchor="middle" font-size="11" fill="#9d174d">patch₃ · 768d</text>

    <text x="300" y="187" text-anchor="middle" font-size="14" fill="#9d174d">⋮</text>

    <rect x="240" y="195" width="120" height="22" rx="3"
          fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="300" y="211" text-anchor="middle" font-size="11" fill="#9d174d">patch₁₉₆ · 768d</text>
  </g>

  <!-- + pos_emb label -->
  <text x="300" y="240" text-anchor="middle" font-size="11" fill="#1e40af" font-style="italic">
    + learned pos_emb (197×768)
  </text>
  <text x="300" y="254" text-anchor="middle" font-size="10" fill="#6b7280">
    告诉 Transformer 谁在第几格
  </text>

  <!-- Arrow to stage 3 -->
  <line x1="365" y1="150" x2="410" y2="150"
        stroke="#9d174d" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- ============== Stage 3: Prepend [CLS] ============== -->
  <text x="488" y="60" text-anchor="middle" font-size="13"
        fill="#374151" font-weight="600">③ Prepend [CLS]</text>

  <!-- CLS token highlighted -->
  <rect x="420" y="85" width="135" height="26" rx="4"
        fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="488" y="103" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">
    [CLS] · learnable
  </text>

  <!-- followed by patch tokens (compact) -->
  <g>
    <rect x="420" y="118" width="135" height="20" rx="3"
          fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="488" y="133" text-anchor="middle" font-size="11" fill="#9d174d">patch₁</text>

    <rect x="420" y="143" width="135" height="20" rx="3"
          fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="488" y="158" text-anchor="middle" font-size="11" fill="#9d174d">patch₂</text>

    <text x="488" y="180" text-anchor="middle" font-size="14" fill="#9d174d">⋮</text>

    <rect x="420" y="188" width="135" height="20" rx="3"
          fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="488" y="203" text-anchor="middle" font-size="11" fill="#9d174d">patch₁₉₆</text>
  </g>

  <text x="488" y="232" text-anchor="middle" font-size="11" fill="#065f46">
    序列长度 = 1 + 196 = 197
  </text>
  <text x="488" y="248" text-anchor="middle" font-size="10" fill="#6b7280">
    [CLS] 是"汇总位",专门吸收全局信息
  </text>

  <!-- Arrow to stage 4 -->
  <line x1="560" y1="150" x2="608" y2="150"
        stroke="#9d174d" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- ============== Stage 4: Transformer Encoder × 12 ============== -->
  <text x="730" y="60" text-anchor="middle" font-size="13"
        fill="#374151" font-weight="600">④ Transformer Encoder × 12</text>

  <!-- Encoder block 1 (示意层) -->
  <rect x="615" y="80" width="230" height="60" rx="6"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="100" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">
    Layer 1
  </text>
  <text x="730" y="118" text-anchor="middle" font-size="10" fill="#92400e">
    Multi-Head Self-Attn + Pre-LN
  </text>
  <text x="730" y="132" text-anchor="middle" font-size="10" fill="#92400e">
    + FFN(d_ff=3072) + residual
  </text>

  <!-- Encoder block 2 -->
  <rect x="615" y="148" width="230" height="60" rx="6"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="168" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">
    Layer 2
  </text>
  <text x="730" y="186" text-anchor="middle" font-size="10" fill="#92400e">
    (same structure)
  </text>

  <!-- ellipsis + ×12 -->
  <text x="730" y="225" text-anchor="middle" font-size="14" fill="#92400e">⋮</text>
  <text x="730" y="252" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700">
    × 12 层 (ViT-B/16)
  </text>

  <!-- callout: self-attn lets every patch see every patch from layer 1 -->
  <text x="730" y="275" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">
    每层每个 token 都能看到所有 token(global attention from layer 1)
  </text>

  <!-- ============== Stage 5: 顶部 CLS → MLP head → class ============== -->
  <!-- 顶部 horizontal flow -->

  <!-- Divider -->
  <line x1="40" y1="345" x2="860" y2="345"
        stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="450" y="380" text-anchor="middle" font-size="15"
        fill="#1f2937" font-weight="600">
    分类只取 [CLS] · 其他 196 个 patch 的输出在分类时被丢弃
  </text>

  <!-- Encoder output box -->
  <rect x="80" y="420" width="180" height="100" rx="6"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="445" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">
    Encoder 输出 [197, 768]
  </text>
  <rect x="100" y="460" width="140" height="20" rx="3"
        fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="170" y="475" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">
    [CLS] · 768d ← 取这个
  </text>
  <text x="170" y="500" text-anchor="middle" font-size="10" fill="#6b7280">
    其余 196 个 patch 输出忽略
  </text>

  <!-- Arrow -->
  <line x1="265" y1="470" x2="320" y2="470"
        stroke="#2563eb" stroke-width="2" marker-end="url(#arr-flow)"/>
  <text x="293" y="463" text-anchor="middle" font-size="10" fill="#1e40af">
    x[:, 0]
  </text>

  <!-- LayerNorm + MLP Head -->
  <rect x="330" y="430" width="170" height="80" rx="6"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="415" y="455" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">
    LayerNorm
  </text>
  <text x="415" y="475" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">
    +
  </text>
  <text x="415" y="495" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">
    Linear (768 → 1000)
  </text>

  <!-- Arrow -->
  <line x1="505" y1="470" x2="560" y2="470"
        stroke="#2563eb" stroke-width="2" marker-end="url(#arr-flow)"/>

  <!-- Softmax + class probability bars -->
  <rect x="570" y="420" width="260" height="100" rx="6"
        fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="442" text-anchor="middle" font-size="12" fill="#065f46" font-weight="600">
    Softmax → class probability
  </text>

  <!-- Mini bar chart -->
  <g font-size="10" fill="#065f46">
    <rect x="590" y="455" width="80" height="10" fill="#10b981"/>
    <text x="676" y="464">cat · 0.72</text>

    <rect x="590" y="470" width="22" height="10" fill="#34d399"/>
    <text x="676" y="479">dog · 0.18</text>

    <rect x="590" y="485" width="10" height="10" fill="#6ee7b7"/>
    <text x="676" y="494">fox · 0.06</text>

    <rect x="590" y="500" width="5" height="10" fill="#a7f3d0"/>
    <text x="676" y="509">... · 0.04</text>
  </g>

  <!-- ============== Bottom callout: 关键观察 ============== -->
  <rect x="60" y="555" width="780" height="68" rx="8"
        fill="#eff6ff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="450" y="577" text-anchor="middle" font-size="12"
        fill="#1e3a8a" font-weight="700">
    关键观察:整个 pipeline 没有一个卷积层 · "patch_embed" 实质是 stride=16 的 Conv2d,
  </text>
  <text x="450" y="595" text-anchor="middle" font-size="12" fill="#1e3a8a">
    但论文坚持称之为 "linear projection of flattened patches" —— 强调 "无视觉模块" 的概念
  </text>
  <text x="450" y="613" text-anchor="middle" font-size="11" fill="#1e3a8a" font-style="italic">
    ViT = BERT for vision · Patch as Token · 视觉与语言共用同一架构
  </text>
</svg>
