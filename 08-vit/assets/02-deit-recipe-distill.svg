<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="dt-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    DeiT 三件套 — 现代 recipe + Distill Token + 长训练
  </text>

  <!-- ============== TOP: 原版 ViT vs DeiT 训练对比 ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    原版 ViT 在 ImageNet-1K 上崩塌 → DeiT 三件套救回
  </text>

  <!-- 原版 ViT side -->
  <rect x="60" y="80" width="370" height="240" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="245" y="103" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">
    原版 ViT(ImageNet-1K 直接训)
  </text>

  <g font-size="11" fill="#991b1b">
    <text x="75" y="130" font-weight="600">训练 recipe:</text>
    <text x="200" y="130">Adam,简单增强(crop+flip)</text>

    <text x="75" y="152" font-weight="600">Weight decay:</text>
    <text x="200" y="152">0.1</text>

    <text x="75" y="174" font-weight="600">Mixup / CutMix:</text>
    <text x="200" y="174">无</text>

    <text x="75" y="196" font-weight="600">Stochastic Depth:</text>
    <text x="200" y="196">无</text>

    <text x="75" y="218" font-weight="600">训练 epoch:</text>
    <text x="200" y="218">90</text>

    <text x="75" y="240" font-weight="600">Distillation:</text>
    <text x="200" y="240">无</text>
  </g>

  <rect x="75" y="260" width="340" height="45" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="245" y="280" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">
    ViT-B/16: 76.5%
  </text>
  <text x="245" y="298" text-anchor="middle" font-size="11" fill="#dc2626">
    (远低于 ResNet-152 78.3%)
  </text>

  <!-- Arrow -->
  <line x1="440" y1="200" x2="465" y2="200" stroke="#7c3aed" stroke-width="3" marker-end="url(#dt-arr)"/>
  <text x="450" y="190" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">DeiT</text>

  <!-- DeiT side -->
  <rect x="470" y="80" width="370" height="240" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="655" y="103" text-anchor="middle" font-size="13" fill="#065f46" font-weight="700">
    DeiT(同 ImageNet-1K)
  </text>

  <g font-size="11" fill="#065f46">
    <text x="485" y="130" font-weight="600">训练 recipe:</text>
    <text x="615" y="130">AdamW,RandAug+Mixup+CutMix</text>

    <text x="485" y="152" font-weight="600">Weight decay:</text>
    <text x="615" y="152">0.05</text>

    <text x="485" y="174" font-weight="600">Mixup / CutMix:</text>
    <text x="615" y="174" font-weight="700">α=0.8 / α=1.0 ★</text>

    <text x="485" y="196" font-weight="600">Stochastic Depth:</text>
    <text x="615" y="196" font-weight="700">0.1 ★</text>

    <text x="485" y="218" font-weight="600">训练 epoch:</text>
    <text x="615" y="218" font-weight="700">300(3 倍)★</text>

    <text x="485" y="240" font-weight="600">Distillation:</text>
    <text x="615" y="240" font-weight="700">Distill Token + RegNet teacher</text>
  </g>

  <rect x="485" y="260" width="340" height="45" rx="4" fill="#fef3c7" stroke="#059669" stroke-width="2"/>
  <text x="655" y="280" text-anchor="middle" font-size="13" fill="#059669" font-weight="700">
    DeiT-B with distillation: 83.4% ★
  </text>
  <text x="655" y="298" text-anchor="middle" font-size="11" fill="#059669">
    (击败 EfficientNet-B7 82.9%)
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="350" x2="860" y2="350" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: Training cost comparison ============== -->
  <text x="450" y="378" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    训练成本对比 — 学界门槛从"TPU 集群"降到"单 V100"
  </text>

  <!-- 原版 ViT cost -->
  <rect x="60" y="395" width="370" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="245" y="418" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">原版 ViT</text>
  <g font-size="11" fill="#991b1b">
    <text x="75" y="442">• 数据:JFT-300M(Google 私有,~300M 图像)</text>
    <text x="75" y="462">• 硬件:TPUv3-2500 chips</text>
    <text x="75" y="482">• 时间:30 天</text>
  </g>

  <!-- DeiT cost -->
  <rect x="470" y="395" width="370" height="100" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="655" y="418" text-anchor="middle" font-size="12" fill="#065f46" font-weight="600">DeiT</text>
  <g font-size="11" fill="#065f46">
    <text x="485" y="442">• 数据:ImageNet-1K(公开,1.3M 图像)</text>
    <text x="485" y="462" font-weight="700">• 硬件:1 张 V100 GPU ★</text>
    <text x="485" y="482" font-weight="700">• 时间:4 天 ★</text>
  </g>

  <!-- Speedup callout -->
  <rect x="60" y="515" width="780" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="540" text-anchor="middle" font-size="13" fill="#92400e" font-weight="700">
    训练算力 ↓ ~1000× / 数据量 ↓ 230× / 精度 ↑ +5.5%
  </text>
  <text x="450" y="558" text-anchor="middle" font-size="11" fill="#92400e" font-style="italic">
    ViT 从"Google 内部技术"变成"学界共用基座"
  </text>

  <!-- bottom callout -->
  <rect x="60" y="585" width="780" height="60" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="610" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    2021 下半年所有 ViT 系工作(Swin / BEiT / MAE / DINO)以 DeiT 为 baseline
  </text>
  <text x="450" y="630" text-anchor="middle" font-size="11" fill="#fef3c7">
    "ViT 的成功一半来自架构,一半来自训练 recipe" — DeiT 给出的核心方法论
  </text>
</svg>
