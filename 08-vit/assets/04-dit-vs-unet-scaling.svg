<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    DiT vs U-Net · Scaling 曲线 (FID ↓ vs 参数量)
  </text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">
    U-Net 在 ~500M 处饱和;DiT 持续下降至 675M 并外推到 SD3 / Sora 的多十亿规模
  </text>

  <!-- Plot area -->
  <!-- x: 100..820  y: 90..440  -->
  <!-- Axes -->
  <line x1="100" y1="440" x2="820" y2="440" stroke="#374151" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="100" y1="440" x2="100" y2="90" stroke="#374151" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <!-- Axis labels -->
  <text x="460" y="478" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">
    参数量 (log scale)
  </text>
  <text x="50" y="265" text-anchor="middle" font-size="12" fill="#374151" font-weight="600"
        transform="rotate(-90 50 265)">
    FID (越低越好)
  </text>

  <!-- X tick marks: 33M, 130M, 458M, 675M, 2B, 8B -->
  <g font-size="10" fill="#6b7280" text-anchor="middle">
    <line x1="160" y1="440" x2="160" y2="445" stroke="#6b7280"/>
    <text x="160" y="458">33M</text>
    <line x1="260" y1="440" x2="260" y2="445" stroke="#6b7280"/>
    <text x="260" y="458">130M</text>
    <line x1="380" y1="440" x2="380" y2="445" stroke="#6b7280"/>
    <text x="380" y="458">458M</text>
    <line x1="450" y1="440" x2="450" y2="445" stroke="#6b7280"/>
    <text x="450" y="458">675M</text>
    <line x1="600" y1="440" x2="600" y2="445" stroke="#6b7280"/>
    <text x="600" y="458">2B</text>
    <line x1="760" y1="440" x2="760" y2="445" stroke="#6b7280"/>
    <text x="760" y="458">8B</text>
  </g>

  <!-- Y tick marks: 70, 35, 10, 5, 2 -->
  <g font-size="10" fill="#6b7280" text-anchor="end">
    <line x1="100" y1="110" x2="95" y2="110" stroke="#6b7280"/>
    <text x="92" y="114">70</text>
    <line x1="100" y1="190" x2="95" y2="190" stroke="#6b7280"/>
    <text x="92" y="194">35</text>
    <line x1="100" y1="290" x2="95" y2="290" stroke="#6b7280"/>
    <text x="92" y="294">10</text>
    <line x1="100" y1="350" x2="95" y2="350" stroke="#6b7280"/>
    <text x="92" y="354">5</text>
    <line x1="100" y1="410" x2="95" y2="410" stroke="#6b7280"/>
    <text x="92" y="414">2</text>
  </g>

  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="0.7" stroke-dasharray="2,3">
    <line x1="100" y1="110" x2="820" y2="110"/>
    <line x1="100" y1="190" x2="820" y2="190"/>
    <line x1="100" y1="290" x2="820" y2="290"/>
    <line x1="100" y1="350" x2="820" y2="350"/>
    <line x1="100" y1="410" x2="820" y2="410"/>
  </g>

  <!-- U-Net curve (red): drops, then saturates around 500M -->
  <!-- approximate points: (160,150)(260,210)(380,260)(450,275)(600,285)(760,288) -->
  <path d="M 160 150 Q 200 175, 260 210 Q 320 240, 380 260 Q 415 270, 450 275 Q 525 282, 600 285 L 760 288"
        stroke="#dc2626" stroke-width="2.8" fill="none"/>
  <!-- saturating dotted continuation -->
  <path d="M 600 285 L 760 287" stroke="#dc2626" stroke-width="2.2" fill="none" stroke-dasharray="6,4"/>

  <!-- U-Net data points -->
  <g fill="#dc2626">
    <circle cx="160" cy="150" r="4"/>
    <circle cx="260" cy="210" r="4"/>
    <circle cx="380" cy="260" r="4"/>
    <circle cx="450" cy="275" r="4"/>
    <circle cx="600" cy="285" r="4"/>
  </g>

  <!-- U-Net label -->
  <rect x="610" y="245" width="180" height="32" rx="4"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="700" y="258" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">
    U-Net (DDPM / ADM)
  </text>
  <text x="700" y="271" text-anchor="middle" font-size="10" fill="#991b1b">
    ~500M 后曲线平掉,饱和
  </text>

  <!-- DiT curve (blue): keeps falling -->
  <!-- approximate points: (160,170)(260,225)(380,335)(450,370)(600,390)(760,405) -->
  <path d="M 160 170 Q 210 200, 260 225 Q 320 280, 380 335 Q 415 355, 450 370"
        stroke="#2563eb" stroke-width="2.8" fill="none"/>
  <!-- extrapolated to SD3 / Sora region -->
  <path d="M 450 370 Q 525 383, 600 390 Q 680 398, 760 405"
        stroke="#2563eb" stroke-width="2.8" fill="none" stroke-dasharray="6,4"/>

  <!-- DiT data points -->
  <g fill="#2563eb">
    <circle cx="160" cy="170" r="4"/>
    <circle cx="260" cy="225" r="4"/>
    <circle cx="380" cy="335" r="4"/>
    <circle cx="450" cy="370" r="5"/>
  </g>
  <!-- extrapolated open dots -->
  <g fill="white" stroke="#2563eb" stroke-width="1.8">
    <circle cx="600" cy="390" r="4"/>
    <circle cx="760" cy="405" r="4"/>
  </g>

  <!-- DiT label -->
  <rect x="200" y="355" width="180" height="32" rx="4"
        fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="290" y="368" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="600">
    DiT (Peebles &amp; Xie 2022)
  </text>
  <text x="290" y="381" text-anchor="middle" font-size="10" fill="#1e3a8a">
    FID 单调下降,接近幂律
  </text>

  <!-- DiT-XL/2 annotation -->
  <line x1="450" y1="370" x2="490" y2="395" stroke="#2563eb" stroke-width="0.8"/>
  <text x="490" y="408" font-size="10" fill="#1e3a8a">DiT-XL/2 · FID 2.27</text>

  <!-- SD3 / Sora annotation -->
  <line x1="760" y1="405" x2="730" y2="425" stroke="#2563eb" stroke-width="0.8"/>
  <text x="660" y="432" font-size="10" fill="#1e3a8a">SD3 · MM-DiT 8B</text>

  <!-- Saturation shaded zone for U-Net -->
  <rect x="500" y="90" width="320" height="350" fill="#fef2f2" opacity="0.25"/>
  <text x="660" y="105" text-anchor="middle" font-size="10" fill="#991b1b" font-style="italic">
    U-Net 饱和区
  </text>

  <!-- ============== BOTTOM CALLOUT ============== -->
  <rect x="60" y="510" width="780" height="90" rx="8"
        fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="450" y="535" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="600">
    2023–2024 全线倒戈到 DiT 思路
  </text>
  <g font-size="12" fill="#7c2d12">
    <text x="80" y="562">
      <tspan font-weight="600">SD3 · Flux · Hunyuan-DiT · Pixart-α · OpenAI Sora</tspan>
      <tspan> 全部采用 DiT 系架构 (MM-DiT / spacetime DiT)</tspan>
    </text>
    <text x="80" y="585">
      U-Net 在 2023-2024 退出视觉生成主流,只剩 VAE 编/解码器仍是卷积 — Transformer 完成"理解 + 生成"全覆盖
    </text>
  </g>
</svg>
