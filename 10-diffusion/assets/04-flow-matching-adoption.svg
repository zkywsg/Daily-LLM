<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Flow Matching 极简代码 + 2024 行业全面采用
  </text>

  <!-- ============== TOP: Side-by-side code comparison ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    Flow Matching vs DDPM 训练 / 采样代码对比
  </text>

  <!-- LEFT: DDPM code -->
  <rect x="40" y="80" width="400" height="280" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="103" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">DDPM</text>

  <text x="55" y="125" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280"># 训练:复杂</text>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#991b1b">
    <text x="55" y="142">def training_step(self, x_0):</text>
    <text x="55" y="158">    t = randint(0, T)</text>
    <text x="55" y="174">    eps = randn_like(x_0)</text>
    <text x="55" y="190">    alpha_bar = self.alpha_bar[t]</text>
    <text x="55" y="206">    x_t = sqrt(alpha_bar)*x_0 +</text>
    <text x="55" y="222">          sqrt(1-alpha_bar)*eps</text>
    <text x="55" y="238">    eps_pred = self.unet(x_t, t)</text>
    <text x="55" y="254">    return MSE(eps_pred, eps)</text>
  </g>

  <text x="55" y="276" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280"># + alpha_bar 系列预计算</text>
  <text x="55" y="292" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280"># + scheduler.step() 复杂公式</text>
  <text x="55" y="308" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280"># + noise schedule 超参选择</text>

  <text x="240" y="340" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">复杂 + 多超参</text>

  <!-- RIGHT: Flow Matching code -->
  <rect x="460" y="80" width="400" height="280" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="660" y="103" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">Flow Matching ★</text>

  <text x="475" y="125" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280"># 训练:极简(5 行核心)</text>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#065f46">
    <text x="475" y="142">def training_step(self, x_0):</text>
    <text x="475" y="158">    x_1 = randn_like(x_0)</text>
    <text x="475" y="174">    t = rand(B)</text>
    <text x="475" y="190">    x_t = (1-t)*x_0 + t*x_1</text>
    <text x="475" y="206">    v_target = x_1 - x_0</text>
    <text x="475" y="222">    v_pred = self.v_net(x_t, t)</text>
    <text x="475" y="238">    return MSE(v_pred, v_target)</text>
  </g>

  <text x="475" y="270" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280"># 没有 alpha_bar</text>
  <text x="475" y="286" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280"># 没有 add_noise 复杂公式</text>
  <text x="475" y="302" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280"># 没有 noise schedule</text>

  <text x="660" y="340" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">5 行核心 / 0 超参</text>

  <!-- DIVIDER -->
  <line x1="40" y1="385" x2="860" y2="385" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: 2024 industry adoption ============== -->
  <text x="450" y="410" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    2024 行业全面采用 Flow Matching — DDPM 系训练目标退出主流
  </text>

  <!-- 2D grid of 2024 models -->
  <!-- Image generation row -->
  <text x="55" y="440" font-size="11" fill="#1f2937" font-weight="700">图像生成</text>

  <rect x="130" y="430" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="190" y="450" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">SD3</text>
  <text x="190" y="463" text-anchor="middle" font-size="9" fill="#065f46">Stability 2024.2</text>

  <rect x="260" y="430" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="320" y="450" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">Flux</text>
  <text x="320" y="463" text-anchor="middle" font-size="9" fill="#065f46">BFL 2024.8</text>

  <rect x="390" y="430" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="450" y="450" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">AuraFlow</text>
  <text x="450" y="463" text-anchor="middle" font-size="9" fill="#065f46">开源</text>

  <rect x="520" y="430" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="580" y="450" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">Hunyuan v1.2</text>
  <text x="580" y="463" text-anchor="middle" font-size="9" fill="#065f46">Tencent</text>

  <rect x="650" y="430" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="710" y="450" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">Pixart-Σ</text>
  <text x="710" y="463" text-anchor="middle" font-size="9" fill="#065f46">2024</text>

  <!-- Video row -->
  <text x="55" y="495" font-size="11" fill="#1f2937" font-weight="700">视频生成</text>

  <rect x="130" y="485" width="180" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="220" y="505" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">Sora(推测)</text>
  <text x="220" y="518" text-anchor="middle" font-size="9" fill="#9d174d">OpenAI 2024.2</text>

  <rect x="320" y="485" width="180" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="410" y="505" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">CogVideoX</text>
  <text x="410" y="518" text-anchor="middle" font-size="9" fill="#9d174d">Tsinghua 2024</text>

  <!-- 跨模态扩展 row -->
  <text x="55" y="550" font-size="11" fill="#1f2937" font-weight="700">跨模态扩展</text>

  <rect x="130" y="540" width="150" height="40" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="205" y="560" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="600">Stable Audio 2</text>
  <text x="205" y="573" text-anchor="middle" font-size="9" fill="#9a3412">音频生成</text>

  <rect x="290" y="540" width="150" height="40" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="365" y="560" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="600">InstantMesh</text>
  <text x="365" y="573" text-anchor="middle" font-size="9" fill="#9a3412">3D 生成</text>

  <rect x="450" y="540" width="150" height="40" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="525" y="560" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="600">AlphaFlow</text>
  <text x="525" y="573" text-anchor="middle" font-size="9" fill="#9a3412">蛋白质生成</text>

  <rect x="610" y="540" width="150" height="40" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="685" y="560" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="600">LCM-LoRA</text>
  <text x="685" y="573" text-anchor="middle" font-size="9" fill="#9a3412">少步生成</text>

  <!-- BOTTOM CALLOUT -->
  <rect x="60" y="600" width="780" height="50" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="625" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    Flow Matching 是 diffusion 训练目标的现代化定型
  </text>
  <text x="450" y="645" text-anchor="middle" font-size="11" fill="#fef3c7">
    DDPM 系训练目标在 2024-2025 逐步退出主流 / Consistency Models / LCM 的少步生成都建立在 Flow Matching 直线性质上
  </text>
</svg>
