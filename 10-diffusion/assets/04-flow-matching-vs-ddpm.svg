<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="fm-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Flow Matching vs DDPM — 直线 vs 曲线路径
  </text>

  <!-- ============== TOP: 2 paths visualization (side by side) ============== -->

  <!-- LEFT: DDPM curved path -->
  <text x="225" y="62" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">
    DDPM(曲线路径)
  </text>

  <rect x="50" y="80" width="350" height="280" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

  <!-- coordinate system -->
  <line x1="80" y1="320" x2="370" y2="320" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="80" y1="120" x2="80" y2="320" stroke="#1f2937" stroke-width="1.5"/>

  <!-- data point x_0 -->
  <circle cx="100" cy="300" r="8" fill="#059669" stroke="#065f46" stroke-width="2"/>
  <text x="100" y="335" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">x_0</text>
  <text x="100" y="350" text-anchor="middle" font-size="9" fill="#065f46">(真实图)</text>

  <!-- noise point x_T -->
  <circle cx="340" cy="140" r="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="340" y="135" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">x_T</text>
  <text x="340" y="120" text-anchor="middle" font-size="9" fill="#dc2626">(高斯噪声)</text>

  <!-- curved path -->
  <path d="M 100 300 Q 150 280, 180 220 Q 200 180, 240 200 Q 280 220, 290 180 Q 320 150, 340 140"
        stroke="#9d174d" stroke-width="2.5" fill="none" stroke-dasharray="5,3"/>

  <!-- intermediate points on curve -->
  <circle cx="180" cy="220" r="4" fill="#9d174d"/>
  <circle cx="240" cy="200" r="4" fill="#9d174d"/>
  <circle cx="290" cy="180" r="4" fill="#9d174d"/>

  <!-- tangent arrows at intermediate (different directions) -->
  <line x1="180" y1="220" x2="195" y2="210" stroke="#9d174d" stroke-width="1.5" marker-end="url(#fm-arr)"/>
  <line x1="240" y1="200" x2="265" y2="210" stroke="#9d174d" stroke-width="1.5" marker-end="url(#fm-arr)"/>
  <line x1="290" y1="180" x2="305" y2="160" stroke="#9d174d" stroke-width="1.5" marker-end="url(#fm-arr)"/>

  <text x="225" y="270" text-anchor="middle" font-size="10" fill="#9d174d" font-style="italic">每点切线方向不同</text>

  <!-- formula -->
  <rect x="60" y="170" width="200" height="55" rx="4" fill="#1f2937" stroke="none"/>
  <text x="160" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#fbbf24">
    x_t = √ā_t · x_0 + √(1-ā_t) · ε
  </text>
  <text x="160" y="208" text-anchor="middle" font-size="9" fill="#fef3c7">noise schedule(β_t)决定曲率</text>

  <!-- bottom info -->
  <line x1="60" y1="375" x2="390" y2="375" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <g font-size="11" fill="#991b1b">
    <text x="70" y="397" font-weight="600">• 训练:学预测噪声 ε</text>
    <text x="70" y="417">• 采样:SDE 反向(50+ 步)</text>
    <text x="70" y="437">• Schedule 是超参</text>
  </g>

  <!-- RIGHT: Flow Matching straight path -->
  <text x="675" y="62" text-anchor="middle" font-size="13" fill="#059669" font-weight="700">
    Flow Matching(直线路径)
  </text>

  <rect x="500" y="80" width="350" height="280" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>

  <!-- coordinate system -->
  <line x1="530" y1="320" x2="820" y2="320" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="530" y1="120" x2="530" y2="320" stroke="#1f2937" stroke-width="1.5"/>

  <!-- data point x_0 -->
  <circle cx="550" cy="300" r="8" fill="#059669" stroke="#065f46" stroke-width="2"/>
  <text x="550" y="335" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">x_0</text>
  <text x="550" y="350" text-anchor="middle" font-size="9" fill="#065f46">(真实图)</text>

  <!-- noise point x_1 -->
  <circle cx="790" cy="140" r="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="790" y="135" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">x_1</text>
  <text x="790" y="120" text-anchor="middle" font-size="9" fill="#dc2626">(高斯噪声)</text>

  <!-- straight line path -->
  <line x1="550" y1="300" x2="790" y2="140" stroke="#059669" stroke-width="3"/>

  <!-- intermediate points on line -->
  <circle cx="620" cy="253" r="4" fill="#059669"/>
  <circle cx="690" cy="207" r="4" fill="#059669"/>
  <circle cx="755" cy="163" r="4" fill="#059669"/>

  <!-- tangent arrows (all same direction - parallel to line) -->
  <line x1="620" y1="253" x2="635" y2="243" stroke="#059669" stroke-width="1.5" marker-end="url(#fm-arr)"/>
  <line x1="690" y1="207" x2="705" y2="197" stroke="#059669" stroke-width="1.5" marker-end="url(#fm-arr)"/>
  <line x1="755" y1="163" x2="770" y2="153" stroke="#059669" stroke-width="1.5" marker-end="url(#fm-arr)"/>

  <text x="675" y="240" text-anchor="middle" font-size="10" fill="#059669" font-style="italic" font-weight="700">所有切线方向相同 = v</text>

  <!-- formula -->
  <rect x="510" y="160" width="200" height="55" rx="4" fill="#1f2937" stroke="none"/>
  <text x="610" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24">
    x_t = (1-t)·x_0 + t·x_1
  </text>
  <text x="610" y="198" text-anchor="middle" font-size="9" fill="#fef3c7">无 schedule,只有线性插值</text>

  <!-- bottom info -->
  <line x1="510" y1="375" x2="840" y2="375" stroke="#059669" stroke-width="1" stroke-dasharray="3,2"/>
  <g font-size="11" fill="#065f46">
    <text x="520" y="397" font-weight="600">• 训练:学预测速度 v = x_1 - x_0</text>
    <text x="520" y="417">• 采样:ODE Euler(10-20 步够)</text>
    <text x="520" y="437">• 无需 schedule</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="465" x2="860" y2="465" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: side-by-side comparison table ============== -->
  <text x="450" y="490" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    详细对比 — Flow Matching 在每个维度都更简洁
  </text>

  <!-- table -->
  <rect x="100" y="510" width="700" height="28" fill="#1f2937"/>
  <text x="200" y="529" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">维度</text>
  <text x="450" y="529" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">DDPM</text>
  <text x="700" y="529" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">Flow Matching</text>

  <rect x="100" y="538" width="700" height="26" fill="#fef3c7"/>
  <text x="200" y="555" text-anchor="middle" font-size="11" fill="#92400e">网络预测</text>
  <text x="450" y="555" text-anchor="middle" font-size="11" fill="#92400e">噪声 ε</text>
  <text x="700" y="555" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">速度 v = x_1 - x_0</text>

  <rect x="100" y="564" width="700" height="26" fill="#ecfdf5"/>
  <text x="200" y="581" text-anchor="middle" font-size="11" fill="#065f46">x_t 构造</text>
  <text x="450" y="581" text-anchor="middle" font-size="11" fill="#065f46">√ā_t·x_0 + √(1-ā_t)·ε(曲线)</text>
  <text x="700" y="581" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">(1-t)·x_0 + t·x_1(直线)</text>

  <rect x="100" y="590" width="700" height="26" fill="#fef3c7"/>
  <text x="200" y="607" text-anchor="middle" font-size="11" fill="#92400e">Noise schedule</text>
  <text x="450" y="607" text-anchor="middle" font-size="11" fill="#92400e">需要(β_t / cosine)</text>
  <text x="700" y="607" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">不需要 ★</text>

  <rect x="100" y="616" width="700" height="26" fill="#ecfdf5"/>
  <text x="200" y="633" text-anchor="middle" font-size="11" fill="#065f46">采样路径</text>
  <text x="450" y="633" text-anchor="middle" font-size="11" fill="#065f46">SDE 反向(随机)</text>
  <text x="700" y="633" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">ODE 反向(确定)</text>
</svg>
