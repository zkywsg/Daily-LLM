<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    对齐胜过规模 — RLHF 关键发现
  </text>

  <!-- ============== TOP: bar chart - Reddit TL;DR human preference ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    Reddit TL;DR 人工评测 — % 时间被偏好(vs 参考摘要)
  </text>

  <!-- chart area -->
  <line x1="200" y1="380" x2="780" y2="380" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="200" y1="100" x2="200" y2="380" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis labels -->
  <g font-size="10" fill="#6b7280">
    <text x="193" y="383" text-anchor="end">0%</text>
    <text x="193" y="327" text-anchor="end">25</text>
    <text x="193" y="271" text-anchor="end">50</text>
    <text x="193" y="215" text-anchor="end">75</text>
    <text x="193" y="159" text-anchor="end">100</text>
  </g>
  <text x="155" y="240" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600" transform="rotate(-90 155 240)">% 被偏好</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="200" y1="327" x2="780" y2="327"/>
    <line x1="200" y1="271" x2="780" y2="271"/>
    <line x1="200" y1="215" x2="780" y2="215"/>
    <line x1="200" y1="159" x2="780" y2="159"/>
  </g>

  <!-- 50% baseline (参考摘要本身) -->
  <line x1="200" y1="271" x2="780" y2="271" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="790" y="275" font-size="10" fill="#7c3aed" font-weight="600">参考基准 50%</text>

  <!-- SFT 1.3B: 35% -->
  <rect x="220" y="302" width="80" height="78" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="260" y="295" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">35%</text>
  <text x="260" y="398" text-anchor="middle" font-size="10" fill="#1f2937">SFT</text>
  <text x="260" y="413" text-anchor="middle" font-size="10" fill="#1f2937">1.3B</text>

  <!-- SFT 6.7B: 41% -->
  <rect x="320" y="289" width="80" height="91" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="360" y="282" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">41%</text>
  <text x="360" y="398" text-anchor="middle" font-size="10" fill="#1f2937">SFT</text>
  <text x="360" y="413" text-anchor="middle" font-size="10" fill="#1f2937">6.7B</text>

  <!-- RLHF 1.3B: 62% (跨过 50%) -->
  <rect x="420" y="242" width="80" height="138" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="460" y="235" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">62% ★</text>
  <text x="460" y="398" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">RLHF</text>
  <text x="460" y="413" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">1.3B</text>

  <!-- 人类高质量摘要: 70% (灰色虚线参考) -->
  <line x1="200" y1="223" x2="780" y2="223" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="790" y="227" font-size="10" fill="#dc2626" font-weight="600">人工高质量 70%</text>

  <!-- RLHF 6.7B: 74% (超过人类) -->
  <rect x="520" y="214" width="80" height="166" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="560" y="207" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">74% ★★</text>
  <text x="560" y="398" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">RLHF</text>
  <text x="560" y="413" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">6.7B</text>

  <!-- 人类参考(基准) -->
  <rect x="640" y="158" width="80" height="222" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="680" y="151" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">70%</text>
  <text x="680" y="398" text-anchor="middle" font-size="10" fill="#1f2937">人工高质量</text>
  <text x="680" y="413" text-anchor="middle" font-size="10" fill="#1f2937">摘要</text>

  <!-- Annotation: 1.3B RLHF beats 6.7B SFT -->
  <path d="M 460 242 Q 410 200, 360 289" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="3,2"/>
  <text x="410" y="170" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">
    1.3B RLHF(62%)
  </text>
  <text x="410" y="186" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">
    &gt; 6.7B SFT(41%)
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="445" x2="860" y2="445" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: Key insight ============== -->
  <text x="450" y="470" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="700">
    核心发现:对齐胜过 5× 参数
  </text>

  <g transform="translate(60, 485)">
    <rect x="0" y="0" width="370" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="185" y="22" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">实证发现</text>
    <g font-size="11" fill="#991b1b">
      <text x="15" y="45">• 1.3B RLHF(62%)> 6.7B SFT(41%)</text>
      <text x="15" y="65">• 6.7B RLHF(74%)甚至超过人工摘要</text>
      <text x="15" y="85">• ROUGE 反而比 SFT 略低 — 指标失效</text>
    </g>

    <rect x="410" y="0" width="370" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="595" y="22" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700">工业意义</text>
    <g font-size="11" fill="#92400e">
      <text x="425" y="45">• 部署成本低 100× 的对齐小模型</text>
      <text x="425" y="65">  可以替代未对齐大模型</text>
      <text x="425" y="85" font-weight="700" fill="#dc2626">→ InstructGPT 1.3B &gt; GPT-3 175B</text>
    </g>
  </g>

  <rect x="60" y="600" width="780" height="30" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="620" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    Stiennon 2020 的发现 → 2 年后被 InstructGPT 推到极致 → 直接催生 ChatGPT
  </text>
</svg>
