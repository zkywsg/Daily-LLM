<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="rlhf-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Learning to Summarize — RLHF 三阶段完整流程
  </text>

  <!-- ============== STAGE 1: SFT ============== -->
  <text x="150" y="62" text-anchor="middle" font-size="13" fill="#9d174d" font-weight="700">
    Stage 1: SFT
  </text>

  <rect x="40" y="80" width="220" height="180" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>

  <rect x="60" y="100" width="180" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="125" text-anchor="middle" font-size="11" fill="#92400e">预训练 LM(GPT-3 6.7B)</text>

  <line x1="150" y1="140" x2="150" y2="160" stroke="#9d174d" stroke-width="1.5" marker-end="url(#rlhf-arr)"/>

  <rect x="60" y="165" width="180" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="150" y="183" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">参考摘要监督微调</text>
  <text x="150" y="200" text-anchor="middle" font-size="9" fill="#065f46">Reddit TL;DR + CNN/DM</text>

  <line x1="150" y1="205" x2="150" y2="225" stroke="#9d174d" stroke-width="1.5" marker-end="url(#rlhf-arr)"/>

  <rect x="60" y="230" width="180" height="22" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">π_SFT</text>

  <text x="150" y="280" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">
    拉到合格区
  </text>

  <line x1="270" y1="170" x2="290" y2="170" stroke="#7c3aed" stroke-width="3" marker-end="url(#rlhf-arr)"/>

  <!-- ============== STAGE 2: RM ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#9d174d" font-weight="700">
    Stage 2: Reward Model
  </text>

  <rect x="300" y="80" width="300" height="180" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>

  <rect x="320" y="100" width="260" height="35" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="450" y="121" text-anchor="middle" font-size="11" fill="#92400e">π_SFT 生成 4 候选(同 prompt)</text>

  <line x1="450" y1="135" x2="450" y2="153" stroke="#9d174d" stroke-width="1.5" marker-end="url(#rlhf-arr)"/>

  <rect x="320" y="156" width="260" height="35" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="177" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="700">人标注两两比较(64K 对)</text>

  <line x1="450" y1="191" x2="450" y2="208" stroke="#9d174d" stroke-width="1.5" marker-end="url(#rlhf-arr)"/>

  <rect x="320" y="210" width="260" height="40" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="227" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24" font-weight="700">L_RM = -log σ(r(y_w) - r(y_l))</text>
  <text x="450" y="243" text-anchor="middle" font-size="9" fill="#fef3c7">Bradley-Terry</text>

  <text x="450" y="282" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">
    RM 初始化 = SFT + scalar head
  </text>

  <line x1="610" y1="170" x2="630" y2="170" stroke="#7c3aed" stroke-width="3" marker-end="url(#rlhf-arr)"/>

  <!-- ============== STAGE 3: PPO ============== -->
  <text x="780" y="62" text-anchor="middle" font-size="13" fill="#9d174d" font-weight="700">
    Stage 3: PPO
  </text>

  <rect x="640" y="80" width="220" height="180" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>

  <rect x="660" y="100" width="180" height="32" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="750" y="120" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">RM 当 reward 函数</text>

  <line x1="750" y1="132" x2="750" y2="150" stroke="#9d174d" stroke-width="1.5" marker-end="url(#rlhf-arr)"/>

  <rect x="660" y="153" width="180" height="50" rx="4" fill="#1f2937" stroke="none"/>
  <text x="750" y="173" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#fbbf24">
    max E[r(x,y)]
  </text>
  <text x="750" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#fbbf24">
    - β·KL(π‖π_SFT)
  </text>

  <line x1="750" y1="205" x2="750" y2="222" stroke="#9d174d" stroke-width="1.5" marker-end="url(#rlhf-arr)"/>

  <rect x="660" y="225" width="180" height="28" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="750" y="244" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">π_RLHF(对齐模型)</text>

  <text x="750" y="282" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">
    PPO + KL 防 reward hacking
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="320" x2="860" y2="320" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== MIDDLE: 4 models in memory ============== -->
  <text x="450" y="345" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">
    PPO 工程恶梦 — 4 个模型同时常驻显存
  </text>

  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="180" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">Actor(被优化)</text>
    <text x="90" y="45" text-anchor="middle" font-size="10" fill="#991b1b">当前 policy π_θ</text>
    <text x="90" y="62" text-anchor="middle" font-size="10" fill="#991b1b">用 PPO 更新</text>
    <text x="90" y="85" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">6.7B</text>

    <rect x="200" y="0" width="180" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="290" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">Critic</text>
    <text x="290" y="45" text-anchor="middle" font-size="10" fill="#991b1b">估计 value V(x)</text>
    <text x="290" y="62" text-anchor="middle" font-size="10" fill="#991b1b">优势函数 GAE</text>
    <text x="290" y="85" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">6.7B</text>

    <rect x="400" y="0" width="180" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="490" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">Reward Model</text>
    <text x="490" y="45" text-anchor="middle" font-size="10" fill="#991b1b">r_φ(x, y) 标量</text>
    <text x="490" y="62" text-anchor="middle" font-size="10" fill="#991b1b">冻结</text>
    <text x="490" y="85" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">6.7B</text>

    <rect x="600" y="0" width="180" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="690" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">Reference SFT</text>
    <text x="690" y="45" text-anchor="middle" font-size="10" fill="#991b1b">算 KL 用 π_SFT</text>
    <text x="690" y="62" text-anchor="middle" font-size="10" fill="#991b1b">冻结</text>
    <text x="690" y="85" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">6.7B</text>
  </g>

  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">
    显存:4 × 6.7B = 27B 参数同时驻留 / 训练慢 / 调参困难
  </text>
  <text x="450" y="520" text-anchor="middle" font-size="11" fill="#dc2626" font-style="italic">
    → 2023 DPO 把 RM + PPO 折叠成 SFT-like loss,工程上简化 100×
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="540" x2="860" y2="540" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: 标准范式延续 ============== -->
  <text x="450" y="565" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三阶段流程被全部 LLM 对齐工作继承
  </text>

  <rect x="60" y="585" width="780" height="95" rx="6" fill="#1f2937" stroke="none"/>
  <g font-size="11" fill="#fef3c7">
    <text x="80" y="610">• InstructGPT(OpenAI 2022)— 把摘要单一任务推广到所有任务,产物 = ChatGPT</text>
    <text x="80" y="632">• Claude(Anthropic 2023)— 同三阶段 + Constitutional AI 改造</text>
    <text x="80" y="654">• LLaMA-Chat / Bard / Qwen-Chat / DeepSeek-Chat — 全部 SFT → RM → PPO 三阶段</text>
    <text x="80" y="676" font-weight="700" fill="#fbbf24">RLHF 范式自 2020 年 Stiennon 论文定型,至今仍是 LLM 对齐的标准基础</text>
  </g>
</svg>
