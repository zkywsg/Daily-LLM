<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="qf-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    BLIP-2 Q-Former 架构 + 训练成本对比
  </text>

  <!-- ============== TOP: BLIP-2 complete architecture ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    完整架构 — 冻结 ViT + Q-Former + 冻结 LLM
  </text>

  <!-- Image input -->
  <rect x="40" y="100" width="80" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="125" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700">Image</text>
  <text x="80" y="150" text-anchor="middle" font-size="24">🖼</text>

  <line x1="120" y1="130" x2="148" y2="130" stroke="#9d174d" stroke-width="1.5" marker-end="url(#qf-arr)"/>

  <!-- Frozen ViT -->
  <rect x="150" y="90" width="160" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="230" y="113" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="700">❄ ViT-G/14</text>
  <text x="230" y="130" text-anchor="middle" font-size="11" fill="#1e40af">1B 参数</text>
  <text x="230" y="148" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">完全冻结</text>
  <text x="230" y="162" text-anchor="middle" font-size="9" fill="#1e40af" font-style="italic">EVA CLIP</text>

  <line x1="310" y1="130" x2="330" y2="130" stroke="#9d174d" stroke-width="1.5" marker-end="url(#qf-arr)"/>

  <!-- Vision features -->
  <text x="345" y="135" font-size="9" fill="#1e40af">[N, 1408]</text>

  <!-- Q-Former (highlighted as trainable) -->
  <rect x="395" y="80" width="180" height="100" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
  <text x="485" y="103" text-anchor="middle" font-size="13" fill="#9d174d" font-weight="700">Q-Former ★</text>
  <text x="485" y="121" text-anchor="middle" font-size="11" fill="#9d174d">188M 参数</text>
  <text x="485" y="139" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">可训练(1.5%)</text>
  <text x="485" y="155" text-anchor="middle" font-size="10" fill="#9d174d">12 层 + 32 Q tokens</text>
  <text x="485" y="172" text-anchor="middle" font-size="9" fill="#9d174d" font-style="italic">cross-attn 视觉</text>

  <!-- 32 Q tokens visualization (small) -->
  <rect x="395" y="200" width="180" height="30" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="485" y="220" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="600">32 个可学习 Q tokens</text>
  <line x1="485" y1="198" x2="485" y2="182" stroke="#ea580c" stroke-width="1.5" marker-end="url(#qf-arr)"/>

  <line x1="575" y1="130" x2="608" y2="130" stroke="#9d174d" stroke-width="1.5" marker-end="url(#qf-arr)"/>

  <!-- Linear projection -->
  <rect x="610" y="115" width="80" height="30" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="135" text-anchor="middle" font-size="11" fill="#065f46">Linear</text>

  <line x1="690" y1="130" x2="710" y2="130" stroke="#9d174d" stroke-width="1.5" marker-end="url(#qf-arr)"/>

  <!-- Q tokens output -->
  <text x="730" y="135" font-size="9" fill="#065f46">[32, 4096]</text>

  <line x1="780" y1="130" x2="800" y2="130" stroke="#9d174d" stroke-width="1.5" marker-end="url(#qf-arr)"/>

  <!-- Frozen LLM -->
  <rect x="395" y="260" width="280" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="535" y="283" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="700">❄ Flan-T5 XXL</text>
  <text x="535" y="300" text-anchor="middle" font-size="11" fill="#1e40af">11B 参数</text>
  <text x="535" y="318" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">完全冻结</text>
  <text x="535" y="332" text-anchor="middle" font-size="9" fill="#1e40af" font-style="italic">或 OPT 6.7B</text>

  <line x1="650" y1="145" x2="635" y2="258" stroke="#9d174d" stroke-width="1.5" marker-end="url(#qf-arr)"/>

  <!-- Generated text -->
  <rect x="710" y="280" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="790" y="304" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">Generated text</text>

  <line x1="675" y1="300" x2="708" y2="300" stroke="#9d174d" stroke-width="1.5" marker-end="url(#qf-arr)"/>

  <!-- Parameter summary -->
  <rect x="60" y="370" width="780" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="395" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700">
    总参数 12.1B = ViT-G(1B,❄)+ Q-Former(188M,✓ 可训练)+ Flan-T5 XXL(11B,❄)
  </text>
  <text x="450" y="412" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">
    可训练参数只有 1.5% — 这是 BLIP-2 的核心
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="440" x2="860" y2="440" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: Training cost comparison ============== -->
  <text x="450" y="465" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    训练成本对比 — BLIP-2 vs Flamingo
  </text>

  <!-- Flamingo cost -->
  <rect x="60" y="485" width="370" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="245" y="508" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">Flamingo(DeepMind)</text>
  <g font-size="11" fill="#991b1b">
    <text x="75" y="533">• 总参数:80B(冻结 + cross-attn 适配层)</text>
    <text x="75" y="553">• 可训练:~10B(几乎全部新加层)</text>
    <text x="75" y="573">• 硬件:1500 TPU × 10 天</text>
    <text x="75" y="595" font-weight="700">• 成本:~$1M+</text>
  </g>

  <!-- BLIP-2 cost -->
  <rect x="470" y="485" width="370" height="125" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="655" y="508" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">BLIP-2(Salesforce)★</text>
  <g font-size="11" fill="#065f46">
    <text x="485" y="533">• 总参数:12B(全部冻结大模型)</text>
    <text x="485" y="553">• 可训练:188M Q-Former(1.5%)</text>
    <text x="485" y="573">• 硬件:16 A100 × 9 天</text>
    <text x="485" y="595" font-weight="700">• 成本:~$10K(降 100×)</text>
  </g>

  <!-- bottom callout -->
  <rect x="60" y="625" width="780" height="25" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="643" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">
    VQA 65.2(+8.9 vs Flamingo)/ NoCaps 121.0(+22)— 同水平 + 100× 便宜
  </text>
</svg>
