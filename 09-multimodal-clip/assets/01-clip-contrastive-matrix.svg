<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ============= Title ============= -->
  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    CLIP Contrastive Matrix · batch N=8 训练示意（真实 N=32768）
  </text>

  <!-- ============= Left column: 8 image icons → image encoder → 8 image emb ============= -->
  <!-- 8 image icons stacked vertically: x=40, y from 130 step 50 -->
  <g font-size="18">
    <rect x="30" y="120"  width="40" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="50" y="148" text-anchor="middle">🐱</text>
    <rect x="30" y="170"  width="40" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="50" y="198" text-anchor="middle">🐶</text>
    <rect x="30" y="220"  width="40" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="50" y="248" text-anchor="middle">🚗</text>
    <rect x="30" y="270"  width="40" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="50" y="298" text-anchor="middle">✈️</text>
    <rect x="30" y="320"  width="40" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="50" y="348" text-anchor="middle">🍕</text>
    <rect x="30" y="370"  width="40" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="50" y="398" text-anchor="middle">🌳</text>
    <rect x="30" y="420"  width="40" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="50" y="448" text-anchor="middle">⚽</text>
    <rect x="30" y="470"  width="40" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="50" y="498" text-anchor="middle">🎸</text>
  </g>

  <!-- image encoder box -->
  <rect x="95" y="270" width="80" height="90" rx="8"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="135" y="308" text-anchor="middle" font-size="12" fill="#9d174d">Image</text>
  <text x="135" y="324" text-anchor="middle" font-size="12" fill="#9d174d">Encoder</text>
  <text x="135" y="345" text-anchor="middle" font-size="10" fill="#9d174d">(ViT / RN)</text>

  <!-- arrows from 8 images converging into encoder -->
  <g stroke="#9d174d" stroke-width="1" fill="none" opacity="0.55">
    <line x1="72" y1="140" x2="95" y2="290"/>
    <line x1="72" y1="190" x2="95" y2="295"/>
    <line x1="72" y1="240" x2="95" y2="305"/>
    <line x1="72" y1="290" x2="95" y2="315"/>
    <line x1="72" y1="340" x2="95" y2="325"/>
    <line x1="72" y1="390" x2="95" y2="335"/>
    <line x1="72" y1="440" x2="95" y2="345"/>
    <line x1="72" y1="490" x2="95" y2="350"/>
  </g>

  <!-- I1..I8 embeddings column (left of matrix) -->
  <g font-size="12">
    <rect x="195" y="245" width="34" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="212" y="261" text-anchor="middle" fill="#065f46">I₁</text>
    <rect x="195" y="270" width="34" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="212" y="286" text-anchor="middle" fill="#065f46">I₂</text>
    <rect x="195" y="295" width="34" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="212" y="311" text-anchor="middle" fill="#065f46">I₃</text>
    <rect x="195" y="320" width="34" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="212" y="336" text-anchor="middle" fill="#065f46">I₄</text>
    <rect x="195" y="345" width="34" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="212" y="361" text-anchor="middle" fill="#065f46">I₅</text>
    <rect x="195" y="370" width="34" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="212" y="386" text-anchor="middle" fill="#065f46">I₆</text>
    <rect x="195" y="395" width="34" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="212" y="411" text-anchor="middle" fill="#065f46">I₇</text>
    <rect x="195" y="420" width="34" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="212" y="436" text-anchor="middle" fill="#065f46">I₈</text>
  </g>
  <line x1="175" y1="315" x2="193" y2="315" stroke="#9d174d" stroke-width="1.3" marker-end="url(#arr-pink)"/>
  <text x="212" y="232" text-anchor="middle" font-size="10" fill="#065f46">image emb [N,d]</text>

  <!-- ============= Top row: 8 texts → text encoder → 8 text emb ============= -->
  <g font-size="11" fill="#92400e">
    <rect x="265" y="55"  width="58" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="294" y="69" text-anchor="middle">"a cat"</text>
    <rect x="325" y="55"  width="58" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="354" y="69" text-anchor="middle">"a dog"</text>
    <rect x="385" y="55"  width="58" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="414" y="69" text-anchor="middle">"a car"</text>
    <rect x="445" y="55"  width="58" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="474" y="69" text-anchor="middle">"a plane"</text>
    <rect x="505" y="55"  width="58" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="534" y="69" text-anchor="middle">"a pizza"</text>
    <rect x="565" y="55"  width="58" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="594" y="69" text-anchor="middle">"a tree"</text>
    <rect x="625" y="55"  width="58" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="654" y="69" text-anchor="middle">"a ball"</text>
    <rect x="685" y="55"  width="58" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="714" y="69" text-anchor="middle">"a guitar"</text>
  </g>

  <!-- text encoder box -->
  <rect x="500" y="92" width="100" height="42" rx="8"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="550" y="110" text-anchor="middle" font-size="12" fill="#9d174d">Text Encoder</text>
  <text x="550" y="124" text-anchor="middle" font-size="10" fill="#9d174d">(Transformer)</text>

  <!-- arrows from texts converging into encoder -->
  <g stroke="#9d174d" stroke-width="1" fill="none" opacity="0.55">
    <line x1="294" y1="76" x2="510" y2="93"/>
    <line x1="354" y1="76" x2="520" y2="93"/>
    <line x1="414" y1="76" x2="535" y2="93"/>
    <line x1="474" y1="76" x2="545" y2="93"/>
    <line x1="534" y1="76" x2="555" y2="93"/>
    <line x1="594" y1="76" x2="565" y2="93"/>
    <line x1="654" y1="76" x2="580" y2="93"/>
    <line x1="714" y1="76" x2="590" y2="93"/>
  </g>

  <!-- T1..T8 row above matrix -->
  <g font-size="12">
    <rect x="265" y="160" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="285" y="176" text-anchor="middle" fill="#065f46">T₁</text>
    <rect x="305" y="160" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="325" y="176" text-anchor="middle" fill="#065f46">T₂</text>
    <rect x="345" y="160" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="365" y="176" text-anchor="middle" fill="#065f46">T₃</text>
    <rect x="385" y="160" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="405" y="176" text-anchor="middle" fill="#065f46">T₄</text>
    <rect x="425" y="160" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="445" y="176" text-anchor="middle" fill="#065f46">T₅</text>
    <rect x="465" y="160" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="485" y="176" text-anchor="middle" fill="#065f46">T₆</text>
    <rect x="505" y="160" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="525" y="176" text-anchor="middle" fill="#065f46">T₇</text>
    <rect x="545" y="160" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="565" y="176" text-anchor="middle" fill="#065f46">T₈</text>
  </g>
  <line x1="430" y1="138" x2="430" y2="158" stroke="#9d174d" stroke-width="1.3" marker-end="url(#arr-pink)"/>
  <text x="615" y="175" font-size="10" fill="#065f46">text emb [N,d]</text>

  <!-- ============= 8×8 cosine similarity matrix ============= -->
  <!-- matrix origin: x=265, y=195; cell 40×30 -->
  <g font-size="10" fill="#1f2937">
    <!-- Row 1 -->
    <rect x="265" y="195" width="40" height="30" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="285" y="214" text-anchor="middle" font-weight="600">I₁·T₁</text>
    <rect x="305" y="195" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="345" y="195" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="385" y="195" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="425" y="195" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="465" y="195" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="505" y="195" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="545" y="195" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 2 -->
    <rect x="265" y="225" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="305" y="225" width="40" height="30" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="325" y="244" text-anchor="middle" font-weight="600">I₂·T₂</text>
    <rect x="345" y="225" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="385" y="225" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="425" y="225" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="465" y="225" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="505" y="225" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="545" y="225" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 3 -->
    <rect x="265" y="255" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="305" y="255" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="345" y="255" width="40" height="30" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="365" y="274" text-anchor="middle" font-weight="600">I₃·T₃</text>
    <rect x="385" y="255" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="425" y="255" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="465" y="255" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="505" y="255" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="545" y="255" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 4 -->
    <rect x="265" y="285" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="305" y="285" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="345" y="285" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="385" y="285" width="40" height="30" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="405" y="304" text-anchor="middle" font-weight="600">I₄·T₄</text>
    <rect x="425" y="285" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="465" y="285" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="505" y="285" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="545" y="285" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 5 -->
    <rect x="265" y="315" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="305" y="315" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="345" y="315" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="385" y="315" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="425" y="315" width="40" height="30" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="445" y="334" text-anchor="middle" font-weight="600">I₅·T₅</text>
    <rect x="465" y="315" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="505" y="315" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="545" y="315" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 6 -->
    <rect x="265" y="345" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="305" y="345" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="345" y="345" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="385" y="345" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="425" y="345" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="465" y="345" width="40" height="30" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="485" y="364" text-anchor="middle" font-weight="600">I₆·T₆</text>
    <rect x="505" y="345" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="545" y="345" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 7 -->
    <rect x="265" y="375" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="305" y="375" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="345" y="375" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="385" y="375" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="425" y="375" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="465" y="375" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="505" y="375" width="40" height="30" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="525" y="394" text-anchor="middle" font-weight="600">I₇·T₇</text>
    <rect x="545" y="375" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 8 -->
    <rect x="265" y="405" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="305" y="405" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="345" y="405" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="385" y="405" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="425" y="405" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="465" y="405" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="505" y="405" width="40" height="30" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="545" y="405" width="40" height="30" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="565" y="424" text-anchor="middle" font-weight="600">I₈·T₈</text>
  </g>

  <!-- Right side legend for matrix -->
  <g font-size="12">
    <rect x="630" y="220" width="20" height="20" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
    <text x="657" y="235" fill="#065f46">正样本（N 个）— 拉近</text>
    <rect x="630" y="248" width="20" height="20" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="657" y="263" fill="#9d174d">负样本（N²−N=56 个）— 推远</text>
    <text x="630" y="293" font-size="11" fill="#6b7280">sim(I,T) = (I·T) / (‖I‖·‖T‖)</text>
    <text x="630" y="310" font-size="11" fill="#6b7280">  = 归一化后的内积（余弦相似度）</text>
    <text x="630" y="335" font-size="11" fill="#6b7280">logits = sim / τ（τ 可学）</text>
  </g>

  <!-- Matrix label -->
  <text x="425" y="455" text-anchor="middle" font-size="12" fill="#1f2937" font-style="italic">
    8 × 8 cosine similarity matrix
  </text>

  <!-- ============= Bottom: loss formula ============= -->
  <line x1="40" y1="510" x2="860" y2="510"
        stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="450" y="540" text-anchor="middle" font-size="15"
        fill="#1f2937" font-weight="600">
    InfoNCE 对称损失
  </text>

  <text x="450" y="580" text-anchor="middle" font-size="14" fill="#1f2937">
    L_i2t = − (1/N) Σᵢ log [ exp(Iᵢ·Tᵢ / τ) / Σⱼ exp(Iᵢ·Tⱼ / τ) ]   （图找文本）
  </text>
  <text x="450" y="606" text-anchor="middle" font-size="14" fill="#1f2937">
    L_t2i = − (1/N) Σᵢ log [ exp(Tᵢ·Iᵢ / τ) / Σⱼ exp(Tᵢ·Iⱼ / τ) ]   （文本找图）
  </text>
  <text x="450" y="640" text-anchor="middle" font-size="16" fill="#065f46" font-weight="700">
    L = ( L_i2t + L_t2i ) / 2
  </text>
  <text x="450" y="668" text-anchor="middle" font-size="11" fill="#6b7280">
    等价于：把相似度矩阵当 logits，标签是 arange(N)，行/列方向各做一次 cross-entropy 再平均
  </text>
</svg>
