<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="fl-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Flamingo 架构 + Gated Cross-Attention 训练动态
  </text>

  <!-- ============== TOP: Flamingo architecture ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    冻结视觉 + 冻结 LLM + 中间训 Perceiver Resampler + Gated Cross-Attn
  </text>

  <!-- Image / Video input -->
  <rect x="40" y="100" width="80" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="120" text-anchor="middle" font-size="11" fill="#92400e">Image/Video</text>
  <text x="80" y="140" text-anchor="middle" font-size="22">🎬</text>

  <line x1="120" y1="125" x2="148" y2="125" stroke="#9d174d" stroke-width="1.5" marker-end="url(#fl-arr)"/>

  <!-- Frozen Vision Encoder -->
  <rect x="150" y="100" width="120" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="210" y="120" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">❄ NF-ResNet F6</text>
  <text x="210" y="138" text-anchor="middle" font-size="9" fill="#1e40af">435M 冻结</text>

  <line x1="270" y1="125" x2="290" y2="125" stroke="#9d174d" stroke-width="1.5" marker-end="url(#fl-arr)"/>

  <!-- 可变 patch features -->
  <text x="305" y="130" font-size="9" fill="#6b7280">[N, d]</text>

  <line x1="335" y1="125" x2="355" y2="125" stroke="#9d174d" stroke-width="1.5" marker-end="url(#fl-arr)"/>

  <!-- Perceiver Resampler -->
  <rect x="360" y="90" width="160" height="80" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
  <text x="440" y="113" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="700">Perceiver Resampler</text>
  <text x="440" y="131" text-anchor="middle" font-size="10" fill="#9d174d">200M 可训练</text>
  <text x="440" y="148" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">64 q tokens</text>
  <text x="440" y="163" text-anchor="middle" font-size="9" fill="#9d174d" font-style="italic">压成固定 64 token</text>

  <line x1="520" y1="130" x2="540" y2="130" stroke="#9d174d" stroke-width="1.5" marker-end="url(#fl-arr)"/>

  <text x="555" y="135" font-size="9" fill="#9d174d">[64, d]</text>

  <!-- Visual tokens -->
  <rect x="595" y="115" width="60" height="30" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="625" y="135" text-anchor="middle" font-size="10" fill="#9a3412">visual</text>

  <!-- LLM blocks -->
  <text x="780" y="65" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">❄ Chinchilla 70B(冻结)</text>

  <rect x="690" y="85" width="180" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="780" y="105" text-anchor="middle" font-size="10" fill="#1e40af">Self-Attn + FFN(冻结)</text>

  <rect x="690" y="118" width="180" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="780" y="138" text-anchor="middle" font-size="10" fill="#1e40af">Self-Attn + FFN(冻结)</text>

  <rect x="690" y="151" width="180" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="780" y="171" text-anchor="middle" font-size="10" fill="#1e40af">Self-Attn + FFN(冻结)</text>

  <!-- Layer 7: gated cross-attn -->
  <rect x="690" y="184" width="180" height="35" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="780" y="200" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="700">★ Gated X-Attn(可训练)</text>
  <text x="780" y="213" text-anchor="middle" font-size="9" fill="#9d174d">每 7 层插入</text>

  <!-- arrow from visual to cross-attn -->
  <line x1="655" y1="200" x2="688" y2="200" stroke="#9d174d" stroke-width="1.5" marker-end="url(#fl-arr)"/>

  <rect x="690" y="222" width="180" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="780" y="242" text-anchor="middle" font-size="10" fill="#1e40af">Self-Attn + FFN(冻结)</text>

  <text x="780" y="278" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">... 共 80 层,每 7 层一个 Gated X-Attn ...</text>

  <!-- DIVIDER -->
  <line x1="40" y1="305" x2="860" y2="305" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: Gated Cross-Attention training dynamics ============== -->
  <text x="450" y="330" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    Gated Cross-Attention 训练动态 — tanh(0) 初始化保护 LLM
  </text>

  <!-- formula -->
  <rect x="60" y="345" width="780" height="50" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="370" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#fbbf24">
    x ← x + tanh(α_attn) · CrossAttn(x, V) + tanh(α_ffn) · FFN(x)
  </text>
  <text x="450" y="388" text-anchor="middle" font-size="11" fill="#fef3c7">
    α 初始化 0 → tanh(0) = 0 → Flamingo 初始等于原 LLM
  </text>

  <!-- chart: alpha vs training steps -->
  <line x1="120" y1="600" x2="780" y2="600" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="120" y1="415" x2="120" y2="600" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis tanh(alpha) 0 to 0.8 -->
  <g font-size="10" fill="#6b7280">
    <text x="113" y="603" text-anchor="end">0</text>
    <text x="113" y="555" text-anchor="end">0.2</text>
    <text x="113" y="510" text-anchor="end">0.4</text>
    <text x="113" y="465" text-anchor="end">0.6</text>
    <text x="113" y="420" text-anchor="end">0.8</text>
  </g>
  <text x="65" y="510" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600" transform="rotate(-90 65 510)">tanh(α)</text>

  <!-- x axis: training steps -->
  <g font-size="10" fill="#6b7280">
    <text x="160" y="615" text-anchor="middle">0</text>
    <text x="280" y="615" text-anchor="middle">1K</text>
    <text x="400" y="615" text-anchor="middle">5K</text>
    <text x="520" y="615" text-anchor="middle">10K</text>
    <text x="640" y="615" text-anchor="middle">50K</text>
    <text x="760" y="615" text-anchor="middle">100K+</text>
  </g>
  <text x="450" y="635" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600">训练 steps</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="120" y1="555" x2="780" y2="555"/>
    <line x1="120" y1="510" x2="780" y2="510"/>
    <line x1="120" y1="465" x2="780" y2="465"/>
    <line x1="120" y1="420" x2="780" y2="420"/>
  </g>

  <!-- alpha curve: starts at 0, slowly rises -->
  <path d="M 160 600 L 280 595 C 350 580, 400 530, 520 480 C 600 450, 700 440, 760 438"
        stroke="#7c3aed" stroke-width="3" fill="none"/>

  <!-- annotations on curve -->
  <circle cx="280" cy="595" r="5" fill="#7c3aed"/>
  <text x="300" y="585" font-size="10" fill="#7c3aed" font-style="italic">~0,Flamingo ≡ LLM</text>

  <circle cx="520" cy="480" r="5" fill="#7c3aed"/>
  <text x="540" y="475" font-size="10" fill="#7c3aed" font-style="italic">视觉影响开启</text>

  <circle cx="760" cy="438" r="6" fill="#7c3aed"/>
  <text x="730" y="430" font-size="10" fill="#7c3aed" font-style="italic">趋稳</text>

  <!-- annotations -->
  <line x1="280" y1="600" x2="280" y2="416" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">初始 identity</text>

  <line x1="520" y1="600" x2="520" y2="416" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="520" y="412" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">逐步开启视觉</text>
</svg>
