<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="hb-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="hb-arr-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="hb-arr-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/>
    </marker>
  </defs>

  <text x="490" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    HuBERT — 离线聚类生成伪标签 + 掩码分类 + 迭代重新聚类
  </text>

  <!-- raw features (MFCC) -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="150" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="75" y="-8" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">声学特征</text>
    <text x="75" y="20" text-anchor="middle" font-size="9" fill="#92400e" font-weight="700">MFCC(第一轮)</text>
    <rect x="14" y="34" width="14" height="26" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <rect x="34" y="34" width="14" height="26" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <rect x="54" y="34" width="14" height="26" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <rect x="74" y="34" width="14" height="26" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <rect x="94" y="34" width="14" height="26" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <rect x="114" y="34" width="14" height="26" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <rect x="134" y="34" width="14" height="26" fill="#fde68a" stroke="#92400e" stroke-width="1"/>
    <text x="75" y="80" text-anchor="middle" font-size="8" fill="#92400e">手工特征,与模型无关</text>
    <text x="75" y="94" text-anchor="middle" font-size="8" fill="#92400e">帧级序列</text>
    <text x="75" y="112" text-anchor="middle" font-size="8" fill="#b45309">(迭代轮次改用中间层表征)</text>
  </g>

  <line x1="170" y1="120" x2="212" y2="120" stroke="#2563eb" stroke-width="2.5" marker-end="url(#hb-arr-blue)"/>

  <!-- Mechanism 1: offline clustering -->
  <g transform="translate(215, 50)">
    <rect x="0" y="0" width="210" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="105" y="22" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="700">机制一 · 离线 k-means 聚类</text>
    <line x1="14" y1="32" x2="196" y2="32" stroke="#93c5fd" stroke-dasharray="3,3"/>
    <text x="105" y="52" text-anchor="middle" font-size="9" fill="#1d4ed8">对每一帧特征聚类,</text>
    <text x="105" y="67" text-anchor="middle" font-size="9" fill="#1d4ed8">映射到簇编号</text>
    <text x="105" y="82" text-anchor="middle" font-size="8.5" fill="#1d4ed8">不依赖被训练模型,离线执行</text>
    <rect x="55" y="95" width="100" height="30" rx="6" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="105" y="115" text-anchor="middle" font-size="10" fill="#1e3a8a" font-weight="700">伪标签(固定)</text>
  </g>

  <line x1="320" y1="195" x2="320" y2="230" stroke="#2563eb" stroke-width="2.5" marker-end="url(#hb-arr-blue)"/>

  <!-- Mechanism 2: masked prediction -->
  <g transform="translate(20, 233)">
    <rect x="0" y="0" width="230" height="150" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="115" y="22" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">Span Masking</text>
    <line x1="14" y1="32" x2="216" y2="32" stroke="#fca5a5" stroke-dasharray="3,3"/>
    <text x="115" y="50" text-anchor="middle" font-size="8.5" fill="#991b1b">随机选起点,整段</text>
    <text x="115" y="64" text-anchor="middle" font-size="8.5" fill="#991b1b">连续帧一起遮盖</text>
    <rect x="35" y="80" width="14" height="26" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>
    <rect x="55" y="80" width="14" height="26" fill="#7f1d1d" stroke="#991b1b" stroke-width="1"/>
    <rect x="75" y="80" width="14" height="26" fill="#7f1d1d" stroke="#991b1b" stroke-width="1"/>
    <rect x="95" y="80" width="14" height="26" fill="#7f1d1d" stroke="#991b1b" stroke-width="1"/>
    <rect x="115" y="80" width="14" height="26" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>
    <rect x="135" y="80" width="14" height="26" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>
    <text x="115" y="122" text-anchor="middle" font-size="8" fill="#991b1b">深色 = 被遮盖(MASK)</text>
    <text x="115" y="140" text-anchor="middle" font-size="8" fill="#991b1b">送入 Transformer 编码器</text>
  </g>

  <line x1="250" y1="308" x2="292" y2="308" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#hb-arr)"/>

  <g transform="translate(295, 233)">
    <rect x="0" y="0" width="230" height="150" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2.5"/>
    <text x="115" y="22" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">机制二 · 掩码分类预测</text>
    <line x1="14" y1="32" x2="216" y2="32" stroke="#86efac" stroke-dasharray="3,3"/>
    <text x="115" y="50" text-anchor="middle" font-size="9" fill="#047857">Transformer 双向编码</text>
    <text x="115" y="65" text-anchor="middle" font-size="9" fill="#047857">在 mask 位置分类预测</text>
    <text x="115" y="80" text-anchor="middle" font-size="9" fill="#047857">对应的伪标签类别</text>
    <rect x="55" y="95" width="120" height="30" rx="6" fill="#bbf7d0" stroke="#065f46" stroke-width="1.5"/>
    <text x="115" y="115" text-anchor="middle" font-size="9.5" fill="#065f46" font-weight="700">交叉熵分类损失</text>
    <text x="115" y="138" text-anchor="middle" font-size="8" fill="#047857">(无负采样,无多样性损失)</text>
  </g>

  <!-- link from pseudo-labels to classification -->
  <path d="M 320 190 C 320 210, 410 210, 410 230" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#hb-arr-blue)"/>
  <text x="430" y="205" font-size="8.5" fill="#1d4ed8">伪标签作为分类目标(训练中不变)</text>

  <line x1="530" y1="308" x2="572" y2="308" stroke="#d97706" stroke-width="2.5" marker-end="url(#hb-arr-amber)"/>

  <!-- Mechanism 3: iterative re-clustering -->
  <g transform="translate(575, 233)">
    <rect x="0" y="0" width="380" height="150" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="2.5"/>
    <text x="190" y="22" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700">机制三 · 迭代式重新聚类</text>
    <line x1="14" y1="32" x2="366" y2="32" stroke="#fcd34d" stroke-dasharray="3,3"/>
    <text x="190" y="52" text-anchor="middle" font-size="9" fill="#92400e">取训练好的模型中间隐藏层表征</text>
    <text x="190" y="67" text-anchor="middle" font-size="9" fill="#92400e">(比原始 MFCC 更贴近音素结构)</text>
    <text x="190" y="82" text-anchor="middle" font-size="9" fill="#92400e">重新做 k-means 聚类 → 更优伪标签</text>
    <text x="190" y="97" text-anchor="middle" font-size="9" fill="#92400e">用新伪标签重新训练 HuBERT</text>
    <text x="190" y="118" text-anchor="middle" font-size="9.5" fill="#b45309" font-weight="700">迭代 2-3 轮,标签质量逐轮提升</text>
    <text x="190" y="136" text-anchor="middle" font-size="8" fill="#92400e">→ 回到机制一,用新特征替代 MFCC</text>
  </g>

  <!-- loop back arrow -->
  <path d="M 765 383 C 765 430, 95 460, 95 190" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6,3" marker-end="url(#hb-arr-amber)"/>
  <text x="430" y="460" text-anchor="middle" font-size="9" fill="#b45309" font-weight="600">自举循环:模型表征 → 重新聚类 → 更好的伪标签 → 重新训练</text>

  <!-- three-piece synergy note -->
  <g transform="translate(20, 490)">
    <rect x="0" y="0" width="940" height="160" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="470" y="26" text-anchor="middle" font-size="12" fill="#9f1239" font-weight="700">三件套协同 — 缺一不可</text>
    <text x="18" y="52" font-size="10" fill="#881337">只有离线聚类(机制一)没有掩码分类(机制二):伪标签生成后无处可用,不会驱动任何表征学习。</text>
    <text x="18" y="76" font-size="10" fill="#881337">只有掩码分类没有离线聚类:没有离散训练目标,退回 Wav2Vec 2.0 式在线生成目标的不稳定问题。</text>
    <text x="18" y="100" font-size="10" fill="#881337">只有前两者没有迭代式重新聚类(机制三):伪标签质量锁死在第一轮 MFCC 聚类的粗糙水平,无法随模型提升同步提纯。</text>
    <text x="18" y="128" font-size="10.5" fill="#e11d48" font-weight="700">三者组合 → 聚类提供固定稳定目标 + 分类提供简单信号 + 迭代提升目标质量,训练比 Wav2Vec 2.0 联合优化更稳定。</text>
  </g>
</svg>
