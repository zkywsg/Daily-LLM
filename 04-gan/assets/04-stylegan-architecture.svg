<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="sg-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
    <marker id="sg-arr-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Traditional GAN vs StyleGAN — 架构根本差异
  </text>

  <!-- ============== LEFT: Traditional GAN ============== -->
  <text x="220" y="65" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="600">
    Traditional GAN(Progressive GAN)
  </text>

  <!-- z input -->
  <rect x="180" y="90" width="80" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="220" y="113" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">z(Gaussian)</text>

  <line x1="220" y1="130" x2="220" y2="150" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <!-- conv stack -->
  <rect x="100" y="155" width="240" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="220" y="180" text-anchor="middle" font-size="11" fill="#9d174d">Conv 4×4 → 8×8(进 z)</text>

  <line x1="220" y1="195" x2="220" y2="210" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <rect x="100" y="215" width="240" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="220" y="240" text-anchor="middle" font-size="11" fill="#9d174d">Conv 8×8 → 16×16</text>

  <line x1="220" y1="255" x2="220" y2="270" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <text x="220" y="285" text-anchor="middle" font-size="11" fill="#9d174d" font-style="italic">... 渐进式 upsample ...</text>

  <line x1="220" y1="295" x2="220" y2="315" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <rect x="100" y="320" width="240" height="40" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="220" y="345" text-anchor="middle" font-size="11" fill="#9d174d">Conv → 1024×1024</text>

  <line x1="220" y1="360" x2="220" y2="378" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <!-- output -->
  <rect x="160" y="383" width="120" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="220" y="408" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">image 1024²</text>

  <!-- problems -->
  <rect x="60" y="450" width="320" height="120" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="220" y="472" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">问题</text>
  <g font-size="11" fill="#991b1b">
    <text x="75" y="495">• z 直接喂 G,latent 高度纠缠</text>
    <text x="75" y="515">• 一个维度同时影响姿态/肤色/发型</text>
    <text x="75" y="535">• Style mixing 不可行</text>
    <text x="75" y="555">• Latent editing 困难</text>
  </g>

  <!-- ============== RIGHT: StyleGAN ============== -->
  <text x="680" y="65" text-anchor="middle" font-size="14" fill="#059669" font-weight="600">
    StyleGAN
  </text>

  <!-- z input -->
  <rect x="640" y="90" width="80" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="680" y="111" text-anchor="middle" font-size="11" fill="#92400e">z</text>

  <line x1="680" y1="122" x2="680" y2="140" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <!-- Mapping Network -->
  <rect x="600" y="145" width="160" height="50" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="680" y="167" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="700">Mapping Network</text>
  <text x="680" y="185" text-anchor="middle" font-size="10" fill="#5b21b6">8 层 MLP</text>

  <line x1="680" y1="195" x2="680" y2="210" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <!-- w -->
  <rect x="620" y="215" width="120" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="236" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700">w(style code)</text>

  <!-- Constant input + style blocks -->
  <rect x="520" y="280" width="100" height="40" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="570" y="298" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="700">常量 4×4×512</text>
  <text x="570" y="313" text-anchor="middle" font-size="9" fill="#9a3412">(学到的固定 tensor)</text>

  <line x1="570" y1="320" x2="570" y2="335" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <!-- style block 1: 4x4 -->
  <rect x="490" y="340" width="160" height="38" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="570" y="357" text-anchor="middle" font-size="11" fill="#9d174d">Conv + Noise + AdaIN(w)</text>
  <text x="570" y="372" text-anchor="middle" font-size="9" fill="#9d174d">4×4</text>

  <line x1="740" y1="232" x2="660" y2="355" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#sg-arr-blue)"/>
  <text x="730" y="290" font-size="9" fill="#2563eb" font-style="italic">w → AdaIN</text>

  <line x1="570" y1="378" x2="570" y2="390" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <rect x="490" y="395" width="160" height="38" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="570" y="412" text-anchor="middle" font-size="11" fill="#9d174d">Upsample + Conv + AdaIN</text>
  <text x="570" y="427" text-anchor="middle" font-size="9" fill="#9d174d">8×8</text>

  <line x1="740" y1="232" x2="660" y2="410" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#sg-arr-blue)"/>

  <line x1="570" y1="433" x2="570" y2="448" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <text x="570" y="463" text-anchor="middle" font-size="11" fill="#9d174d" font-style="italic">... ×9 层,渐进到 1024² ...</text>

  <line x1="570" y1="470" x2="570" y2="485" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sg-arr)"/>

  <rect x="510" y="490" width="120" height="38" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="570" y="514" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">image 1024²</text>

  <!-- benefits -->
  <rect x="510" y="555" width="320" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="670" y="577" text-anchor="middle" font-size="12" fill="#065f46" font-weight="600">优势</text>
  <g font-size="11" fill="#065f46">
    <text x="525" y="600">✓ W 空间解纠缠(PPL 减半)</text>
    <text x="525" y="620">✓ Style mixing + 分层语义控制</text>
  </g>

  <!-- DIVIDER between left and right -->
  <line x1="430" y1="60" x2="430" y2="580" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
