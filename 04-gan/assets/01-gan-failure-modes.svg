<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="17"
        fill="#1f2937" font-weight="600">
    GAN 三大经典失败模式 · 训练为什么是"调参艺术"
  </text>

  <!-- ============== Column 1: Mode Collapse ============== -->
  <rect x="30" y="60" width="270" height="500" rx="10"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="165" y="88" text-anchor="middle" font-size="15"
        fill="#991b1b" font-weight="600">① Mode Collapse</text>
  <text x="165" y="108" text-anchor="middle" font-size="11" fill="#7f1d1d">
    模式塌缩
  </text>

  <!-- 9 nearly identical small images (a "5" digit motif) -->
  <g>
    <!-- row 1 -->
    <rect x="58" y="135" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="88" y="178" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>

    <rect x="128" y="135" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="158" y="178" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>

    <rect x="198" y="135" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="228" y="178" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>

    <!-- row 2 -->
    <rect x="58" y="205" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="88" y="248" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>

    <rect x="128" y="205" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="158" y="248" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>

    <rect x="198" y="205" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="228" y="248" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>

    <!-- row 3 -->
    <rect x="58" y="275" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="88" y="318" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>

    <rect x="128" y="275" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="158" y="318" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>

    <rect x="198" y="275" width="60" height="60" rx="4" fill="#fff" stroke="#dc2626" stroke-width="1"/>
    <text x="228" y="318" text-anchor="middle" font-size="34" fill="#1f2937" font-weight="700">5</text>
  </g>

  <!-- expected vs got -->
  <text x="165" y="370" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">
    期望: 覆盖 0–9 全部 10 种 mode
  </text>
  <text x="165" y="390" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">
    实际: G 只学到 1 种,反复输出
  </text>

  <text x="165" y="430" text-anchor="middle" font-size="11" fill="#7f1d1d">
    G 发现某张图能稳定骗过 D
  </text>
  <text x="165" y="448" text-anchor="middle" font-size="11" fill="#7f1d1d">
    → 收敛到这个"局部最优"
  </text>
  <text x="165" y="466" text-anchor="middle" font-size="11" fill="#7f1d1d">
    → 多样性归零
  </text>

  <rect x="50" y="490" width="230" height="55" rx="6"
        fill="#fff" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="165" y="510" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">
    根因
  </text>
  <text x="165" y="528" text-anchor="middle" font-size="10" fill="#7f1d1d">
    minimax 没约束 G 覆盖 p_data
  </text>
  <text x="165" y="542" text-anchor="middle" font-size="10" fill="#7f1d1d">
    只要 D 一直被骗 G 就不动
  </text>

  <!-- ============== Column 2: D Wins ============== -->
  <rect x="315" y="60" width="270" height="500" rx="10"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="450" y="88" text-anchor="middle" font-size="15"
        fill="#991b1b" font-weight="600">② D 突然赢</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#7f1d1d">
    梯度消失
  </text>

  <!-- Loss curves chart -->
  <!-- axes -->
  <line x1="345" y1="320" x2="555" y2="320" stroke="#374151" stroke-width="1.2"
        marker-end="url(#arr-axis)"/>
  <line x1="345" y1="320" x2="345" y2="135" stroke="#374151" stroke-width="1.2"
        marker-end="url(#arr-axis)"/>

  <text x="560" y="335" font-size="10" fill="#374151">step</text>
  <text x="340" y="130" text-anchor="end" font-size="10" fill="#374151">loss</text>

  <!-- D loss: starts high, crashes to 0 -->
  <path d="M 350 160 C 380 175, 400 200, 420 250 C 440 295, 470 315, 545 318"
        stroke="#dc2626" stroke-width="2.2" fill="none"/>
  <text x="385" y="158" font-size="11" fill="#dc2626" font-weight="600">D loss → 0</text>

  <!-- G loss: starts mid, blows up -->
  <path d="M 350 280 C 380 270, 400 240, 420 200 C 445 170, 475 150, 545 138"
        stroke="#2563eb" stroke-width="2.2" fill="none"/>
  <text x="475" y="158" font-size="11" fill="#2563eb" font-weight="600">G loss → ∞</text>

  <!-- baseline -->
  <line x1="345" y1="318" x2="555" y2="318" stroke="#9ca3af"
        stroke-width="0.8" stroke-dasharray="3,3"/>

  <text x="450" y="370" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">
    D 把真假分得太开
  </text>
  <text x="450" y="390" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">
    → D(G(z)) ≈ 0 处梯度归零
  </text>

  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#7f1d1d">
    log(1−D(G(z))) 在 D≈0 处饱和
  </text>
  <text x="450" y="448" text-anchor="middle" font-size="11" fill="#7f1d1d">
    → ∂L/∂G ≈ 0
  </text>
  <text x="450" y="466" text-anchor="middle" font-size="11" fill="#7f1d1d">
    → G 永远学不动,训练僵死
  </text>

  <rect x="335" y="490" width="230" height="55" rx="6"
        fill="#fff" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">
    根因
  </text>
  <text x="450" y="528" text-anchor="middle" font-size="10" fill="#7f1d1d">
    JSD 在两分布无重叠时退化
  </text>
  <text x="450" y="542" text-anchor="middle" font-size="10" fill="#7f1d1d">
    → WGAN 用 Wasserstein 距离修
  </text>

  <!-- ============== Column 3: Oscillation ============== -->
  <rect x="600" y="60" width="270" height="500" rx="10"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="735" y="88" text-anchor="middle" font-size="15"
        fill="#991b1b" font-weight="600">③ Oscillation</text>
  <text x="735" y="108" text-anchor="middle" font-size="11" fill="#7f1d1d">
    博弈震荡
  </text>

  <!-- FID curve: oscillating -->
  <line x1="630" y1="320" x2="850" y2="320" stroke="#374151" stroke-width="1.2"
        marker-end="url(#arr-axis)"/>
  <line x1="630" y1="320" x2="630" y2="135" stroke="#374151" stroke-width="1.2"
        marker-end="url(#arr-axis)"/>

  <text x="855" y="335" font-size="10" fill="#374151">epoch</text>
  <text x="625" y="130" text-anchor="end" font-size="10" fill="#374151">FID</text>

  <!-- oscillating curve -->
  <path d="M 632 200
           C 650 160, 670 260, 690 180
           C 710 145, 730 270, 750 190
           C 770 150, 790 265, 810 195
           C 830 160, 845 260, 848 220"
        stroke="#dc2626" stroke-width="2.2" fill="none"/>

  <text x="735" y="158" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">
    FID 上下震荡,永不收敛
  </text>

  <!-- baseline -->
  <line x1="630" y1="220" x2="850" y2="220" stroke="#9ca3af"
        stroke-width="0.8" stroke-dasharray="3,3"/>

  <text x="735" y="370" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="600">
    G 学会骗 D → D 适应 → G 重学
  </text>
  <text x="735" y="390" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">
    两个网络循环拉扯
  </text>

  <text x="735" y="430" text-anchor="middle" font-size="11" fill="#7f1d1d">
    minimax 不是凸-凹问题
  </text>
  <text x="735" y="448" text-anchor="middle" font-size="11" fill="#7f1d1d">
    交替 SGD 不保证收敛
  </text>
  <text x="735" y="466" text-anchor="middle" font-size="11" fill="#7f1d1d">
    "早停"成为 GAN 标准技巧
  </text>

  <rect x="620" y="490" width="230" height="55" rx="6"
        fill="#fff" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="735" y="510" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">
    根因
  </text>
  <text x="735" y="528" text-anchor="middle" font-size="10" fill="#7f1d1d">
    博弈均衡 ≠ 梯度下降不动点
  </text>
  <text x="735" y="542" text-anchor="middle" font-size="10" fill="#7f1d1d">
    G/D 力量轮流占上风
  </text>

  <!-- ============== Bottom callout ============== -->
  <rect x="40" y="585" width="820" height="80" rx="8"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="610" text-anchor="middle" font-size="13"
        fill="#92400e" font-weight="600">
    GAN 训练 = 调参艺术
  </text>
  <text x="450" y="632" text-anchor="middle" font-size="12" fill="#92400e">
    这三件事直接催生了 2015–2019 整条稳定化研究线:
  </text>
  <text x="450" y="652" text-anchor="middle" font-size="12" fill="#92400e">
    DCGAN(架构规范)→ WGAN / WGAN-GP(换距离)→ Progressive GAN(分辨率渐进)→ StyleGAN(风格控制 + 大规模训练稳定)
  </text>
</svg>
