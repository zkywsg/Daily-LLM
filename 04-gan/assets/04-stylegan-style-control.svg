<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="sc-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Style 分层控制 + Style Mixing — 不同分辨率对应不同语义粒度
  </text>

  <!-- ============== LEFT: Layer 分辨率 → 语义粒度 ============== -->
  <text x="220" y="65" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    不同分辨率层 → 不同语义粒度
  </text>

  <!-- Coarse: 4-8 -->
  <circle cx="120" cy="130" r="32" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="120" y="125" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">粗</text>
  <text x="120" y="142" text-anchor="middle" font-size="10" fill="#991b1b">4×4 - 8×8</text>

  <rect x="180" y="105" width="200" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">姿态、脸型、整体结构</text>
  <text x="280" y="143" text-anchor="middle" font-size="9" fill="#991b1b" font-style="italic">高层语义 / 全局信息</text>

  <line x1="152" y1="130" x2="178" y2="130" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sc-arr)"/>

  <!-- Middle: 16-32 -->
  <circle cx="120" cy="220" r="28" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="700">中</text>
  <text x="120" y="232" text-anchor="middle" font-size="10" fill="#9a3412">16-32</text>

  <rect x="180" y="200" width="200" height="42" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="600">发型、眼神、嘴型</text>
  <text x="280" y="234" text-anchor="middle" font-size="9" fill="#9a3412" font-style="italic">局部特征</text>

  <line x1="148" y1="220" x2="178" y2="220" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sc-arr)"/>

  <!-- Fine: 64-1024 -->
  <circle cx="120" cy="305" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="303" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">细</text>
  <text x="120" y="317" text-anchor="middle" font-size="9" fill="#1e40af">64+</text>

  <rect x="180" y="285" width="200" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="280" y="303" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">肤色、雀斑、纹理</text>
  <text x="280" y="320" text-anchor="middle" font-size="9" fill="#1e40af" font-style="italic">纹理 / 光线 / 细节</text>

  <line x1="144" y1="305" x2="178" y2="305" stroke="#9d174d" stroke-width="1.5" marker-end="url(#sc-arr)"/>

  <!-- explanation -->
  <rect x="60" y="355" width="320" height="105" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="220" y="378" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">
    为什么粒度自然分层?
  </text>
  <g font-size="10" fill="#065f46">
    <text x="75" y="400">• 4×4 feature map 只有 16 个 pixel</text>
    <text x="75" y="418">  → 只能编码全局信息(姿态/脸型)</text>
    <text x="75" y="436">• 1024×1024 feature map 有百万 pixel</text>
    <text x="75" y="454">  → 自然编码细粒度信息(肤色/纹理)</text>
  </g>

  <!-- ============== RIGHT: Style Mixing demo ============== -->
  <text x="680" y="65" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    Style Mixing demo — 把 A 的粗略 + B 的细节组合
  </text>

  <!-- Source A -->
  <rect x="470" y="85" width="100" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="520" y="115" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">人 A</text>
  <text x="520" y="140" text-anchor="middle" font-size="32">👨‍🦱</text>
  <text x="520" y="170" text-anchor="middle" font-size="10" fill="#92400e">w_A</text>

  <!-- Source B -->
  <rect x="770" y="85" width="100" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="820" y="115" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">人 B</text>
  <text x="820" y="140" text-anchor="middle" font-size="32">👩‍🦰</text>
  <text x="820" y="170" text-anchor="middle" font-size="10" fill="#92400e">w_B</text>

  <!-- Mixing schemes -->
  <text x="670" y="215" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">三种 mixing 配置</text>

  <!-- Mix 1: A coarse + B fine -->
  <rect x="470" y="225" width="400" height="55" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="485" y="245" font-size="11" fill="#1e40af" font-weight="600">① w_A(粗,4-8)+ w_B(中+细,16-1024)</text>
  <text x="485" y="262" font-size="10" fill="#1e40af">→ A 的姿态 + B 的发型/肤色</text>
  <text x="800" y="262" text-anchor="middle" font-size="22">👨‍🦰</text>

  <!-- Mix 2: A coarse+mid + B fine -->
  <rect x="470" y="290" width="400" height="55" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="485" y="310" font-size="11" fill="#9a3412" font-weight="600">② w_A(粗+中,4-32)+ w_B(细,64+)</text>
  <text x="485" y="327" font-size="10" fill="#9a3412">→ A 的姿态+发型 + B 的肤色/纹理</text>
  <text x="800" y="327" text-anchor="middle" font-size="22">👨‍🦱</text>

  <!-- Mix 3: A all coarse-mid + B noise only -->
  <rect x="470" y="355" width="400" height="55" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="485" y="375" font-size="11" fill="#065f46" font-weight="600">③ w_A 全程 + 独立 noise(B 的随机细节)</text>
  <text x="485" y="392" font-size="10" fill="#065f46">→ A 完全保留 + 不同随机毛孔/发丝</text>
  <text x="800" y="392" text-anchor="middle" font-size="22">👨‍🦱</text>

  <!-- key insight -->
  <rect x="470" y="430" width="400" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="670" y="452" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">
    传统 GAN 做不到的可控性
  </text>
  <text x="485" y="472" font-size="10" fill="#92400e">不同层独立注入 style,推理时按需切换 w</text>
  <text x="485" y="485" font-size="9" fill="#92400e" font-style="italic">"A 的姿态 + B 的肤色" 一行代码就能做到</text>

  <!-- DIVIDER -->
  <line x1="40" y1="510" x2="860" y2="510" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: 反直觉点 - G 输入是常量 ============== -->
  <text x="450" y="535" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">
    最反直觉点 — G 输入是学到的常量 4×4 tensor,不是 z!
  </text>

  <rect x="60" y="555" width="780" height="75" rx="6" fill="#1f2937" stroke="none"/>
  <g font-size="11" fill="#fef3c7">
    <text x="80" y="580">• 传统 GAN:z 是 G 的输入,所有变化从 z 流入</text>
    <text x="80" y="600">• StyleGAN:G 输入是固定常量,所有变化通过 AdaIN(w) 在每层注入</text>
    <text x="80" y="620" font-weight="700" fill="#fbbf24">→ 这一架构差异是 StyleGAN 比 Progressive GAN 质量飞跃 + 解纠缠的根本原因</text>
  </g>
</svg>
