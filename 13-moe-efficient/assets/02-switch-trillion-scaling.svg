<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="sc-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Switch Transformer — 首个 trillion 模型 + T5-XXL 4× 提速
  </text>

  <!-- ============== TOP: scaling chart ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    总参数 vs 激活参数 vs C4 Perplexity
  </text>

  <line x1="180" y1="320" x2="780" y2="320" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="180" y1="90" x2="180" y2="320" stroke="#1f2937" stroke-width="1.5"/>

  <g font-size="9" fill="#6b7280">
    <text x="173" y="323" text-anchor="end">0</text>
    <text x="173" y="265" text-anchor="end">400B</text>
    <text x="173" y="207" text-anchor="end">800B</text>
    <text x="173" y="149" text-anchor="end">1.2T</text>
    <text x="173" y="93" text-anchor="end">1.6T</text>
  </g>
  <text x="135" y="205" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="600" transform="rotate(-90 135 205)">总参数</text>

  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="180" y1="265" x2="780" y2="265"/>
    <line x1="180" y1="207" x2="780" y2="207"/>
    <line x1="180" y1="149" x2="780" y2="149"/>
    <line x1="180" y1="93" x2="780" y2="93"/>
  </g>

  <!-- T5-Base: 220M -->
  <rect x="220" y="319" width="40" height="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="265" y="319" width="40" height="1" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="263" y="345" text-anchor="middle" font-size="10" fill="#1f2937">T5-Base</text>
  <text x="263" y="358" text-anchor="middle" font-size="9" fill="#1f2937">(dense)</text>
  <text x="263" y="375" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">PPL 5.85</text>

  <!-- Switch-Base 7B / 0.22B -->
  <rect x="325" y="319" width="40" height="1" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="370" y="319" width="40" height="1" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="368" y="345" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">Switch-Base</text>
  <text x="368" y="358" text-anchor="middle" font-size="9" fill="#1f2937">7B(N=128)</text>
  <text x="368" y="375" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">PPL 5.32 ★</text>
  <text x="368" y="390" text-anchor="middle" font-size="9" fill="#059669">2× 提速</text>

  <!-- T5-XXL 11B -->
  <rect x="430" y="318" width="40" height="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="475" y="318" width="40" height="2" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="473" y="345" text-anchor="middle" font-size="10" fill="#1f2937">T5-XXL</text>
  <text x="473" y="358" text-anchor="middle" font-size="9" fill="#1f2937">11B dense</text>
  <text x="473" y="375" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">PPL 4.65</text>

  <!-- Switch-XXL 395B / 11B -->
  <rect x="535" y="263" width="40" height="57" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="580" y="318" width="40" height="2" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="578" y="345" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">Switch-XXL</text>
  <text x="578" y="358" text-anchor="middle" font-size="9" fill="#1f2937" font-weight="700">395B(N=64)</text>
  <text x="578" y="375" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">PPL 4.41 ★★</text>
  <text x="578" y="390" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">4× 提速</text>

  <!-- Switch-C 1.57T / 11B -->
  <rect x="640" y="93" width="40" height="227" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <rect x="685" y="318" width="40" height="2" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="683" y="345" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">Switch-C</text>
  <text x="683" y="358" text-anchor="middle" font-size="9" fill="#1f2937" font-weight="700">1.57T(N=2048)</text>
  <text x="683" y="375" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">PPL 4.05 ★★★</text>
  <text x="683" y="390" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">首个 trillion 模型</text>

  <!-- numeric labels -->
  <text x="240" y="314" text-anchor="middle" font-size="9" fill="#92400e">0.22B</text>
  <text x="285" y="314" text-anchor="middle" font-size="9" fill="#065f46">0.22B</text>

  <text x="345" y="314" text-anchor="middle" font-size="9" fill="#92400e">7B</text>
  <text x="390" y="314" text-anchor="middle" font-size="9" fill="#065f46">0.22B</text>

  <text x="450" y="313" text-anchor="middle" font-size="9" fill="#92400e">11B</text>
  <text x="495" y="313" text-anchor="middle" font-size="9" fill="#065f46">11B</text>

  <text x="555" y="258" text-anchor="middle" font-size="9" fill="#92400e">395B</text>
  <text x="600" y="313" text-anchor="middle" font-size="9" fill="#065f46">11B</text>

  <text x="660" y="88" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">1.57T</text>
  <text x="705" y="313" text-anchor="middle" font-size="9" fill="#065f46" font-weight="700">11B</text>

  <!-- legend -->
  <rect x="220" y="105" width="14" height="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="114" font-size="10" fill="#1f2937">总参数</text>
  <rect x="220" y="122" width="14" height="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="240" y="131" font-size="10" fill="#1f2937">激活参数(每 token)</text>

  <!-- annotation: 4x speedup -->
  <path d="M 555 263 Q 510 200, 460 260" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="3,2" marker-end="url(#sc-arr)"/>
  <text x="500" y="195" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">395B 总参 / 11B 激活</text>
  <text x="500" y="210" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ T5-XXL 4× 提速</text>

  <!-- DIVIDER -->
  <line x1="40" y1="420" x2="860" y2="420" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: three pillars protect -->
  <text x="450" y="450" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,Switch 都跑不到 trillion
  </text>

  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="265" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 Top-1</text>
    <text x="15" y="48" font-size="10" fill="#991b1b">没有 f·P loss:</text>
    <text x="15" y="68" font-size="10" fill="#991b1b">expert 立即塌缩</text>
    <text x="15" y="88" font-size="10" fill="#991b1b">N-1 个 expert 空转</text>
    <text x="132" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 1.57T 参数白堆</text>

    <rect x="285" y="0" width="265" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 f·P Loss</text>
    <text x="300" y="48" font-size="10" fill="#991b1b">没有 capacity 兜底:</text>
    <text x="300" y="68" font-size="10" fill="#991b1b">推理时偏向某 expert</text>
    <text x="300" y="88" font-size="10" fill="#991b1b">撑爆 OOM 直接挂</text>
    <text x="417" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 部署不稳定</text>

    <rect x="570" y="0" width="250" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有稳定性兜底</text>
    <text x="585" y="48" font-size="10" fill="#991b1b">不简化路由:</text>
    <text x="585" y="68" font-size="10" fill="#991b1b">K=4 通信量 4×</text>
    <text x="585" y="88" font-size="10" fill="#991b1b">1024 TPU 跑不动</text>
    <text x="695" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 不到 trillion 量级</text>
  </g>

  <rect x="60" y="610" width="780" height="35" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="633" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    三件套首次组合 → 1.57T 首个 trillion 模型 / T5-XXL 同质量 4× 提速 / MoE 从研究 demo 成生产基建
  </text>
</svg>
