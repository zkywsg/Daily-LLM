<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="moe2-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    参数 ≠ 算力 — MoE 首次解开 dense 模型的扩参锁死
  </text>

  <!-- ============== TOP: parameter vs activated parameter ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    LM1B benchmark — 总参数 vs 激活参数 vs Perplexity
  </text>

  <!-- chart area -->
  <line x1="180" y1="320" x2="780" y2="320" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="180" y1="90" x2="180" y2="320" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis labels (total params, log-ish) -->
  <g font-size="9" fill="#6b7280">
    <text x="173" y="323" text-anchor="end">0</text>
    <text x="173" y="265" text-anchor="end">35B</text>
    <text x="173" y="207" text-anchor="end">70B</text>
    <text x="173" y="149" text-anchor="end">105B</text>
    <text x="173" y="93" text-anchor="end">140B</text>
  </g>
  <text x="135" y="205" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="600" transform="rotate(-90 135 205)">参数(B)</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="180" y1="265" x2="780" y2="265"/>
    <line x1="180" y1="207" x2="780" y2="207"/>
    <line x1="180" y1="149" x2="780" y2="149"/>
    <line x1="180" y1="93" x2="780" y2="93"/>
  </g>

  <!-- Model 1: LSTM-2048 baseline -->
  <rect x="220" y="318" width="50" height="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="280" y="318" width="50" height="2" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="275" y="345" text-anchor="middle" font-size="10" fill="#1f2937">LSTM-2048</text>
  <text x="275" y="358" text-anchor="middle" font-size="9" fill="#1f2937">baseline</text>
  <text x="275" y="375" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">PPL 67.5</text>

  <!-- Model 2: LSTM-Big -->
  <rect x="350" y="313" width="50" height="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="410" y="313" width="50" height="7" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="405" y="345" text-anchor="middle" font-size="10" fill="#1f2937">LSTM-Big</text>
  <text x="405" y="358" text-anchor="middle" font-size="9" fill="#1f2937">(dense)</text>
  <text x="405" y="375" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">PPL 39.8</text>
  <text x="405" y="390" text-anchor="middle" font-size="9" fill="#dc2626">算力 7×</text>

  <!-- Model 3: MoE-512 -->
  <rect x="480" y="298" width="50" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="540" y="318" width="50" height="2" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="535" y="345" text-anchor="middle" font-size="10" fill="#1f2937">MoE-512</text>
  <text x="535" y="358" text-anchor="middle" font-size="9" fill="#1f2937">(sparse)</text>
  <text x="535" y="375" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">PPL 31.3 ★</text>
  <text x="535" y="390" text-anchor="middle" font-size="9" fill="#059669">算力 1.4×</text>

  <!-- Model 4: MoE-2048 -->
  <rect x="610" y="93" width="50" height="227" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="670" y="313" width="50" height="7" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="665" y="345" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">MoE-2048</text>
  <text x="665" y="358" text-anchor="middle" font-size="9" fill="#1f2937" font-weight="700">(sparse)</text>
  <text x="665" y="375" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">PPL 28.0 ★★</text>
  <text x="665" y="390" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">算力 2.4×</text>

  <!-- numeric labels on bars -->
  <text x="245" y="313" text-anchor="middle" font-size="9" fill="#92400e">0.2B</text>
  <text x="305" y="313" text-anchor="middle" font-size="9" fill="#065f46">0.2B</text>

  <text x="375" y="308" text-anchor="middle" font-size="9" fill="#92400e">1.4B</text>
  <text x="435" y="308" text-anchor="middle" font-size="9" fill="#065f46">1.4B</text>

  <text x="505" y="293" text-anchor="middle" font-size="9" fill="#92400e">4.4B</text>
  <text x="565" y="313" text-anchor="middle" font-size="9" fill="#065f46">0.4B</text>

  <text x="635" y="88" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">137B</text>
  <text x="695" y="308" text-anchor="middle" font-size="9" fill="#065f46" font-weight="700">1.5B</text>

  <!-- legend -->
  <rect x="220" y="105" width="14" height="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="114" font-size="10" fill="#1f2937">总参数</text>
  <rect x="220" y="122" width="14" height="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="240" y="131" font-size="10" fill="#1f2937">激活参数(每 token)</text>

  <!-- annotation -->
  <path d="M 660 110 Q 740 150, 720 318" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="3,2" marker-end="url(#moe2-arr)"/>
  <text x="780" y="180" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">137B 总参</text>
  <text x="780" y="196" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">→ 1.5B 激活</text>
  <text x="780" y="212" text-anchor="middle" font-size="10" fill="#dc2626">稀疏度 ~1%</text>

  <!-- DIVIDER -->
  <line x1="40" y1="420" x2="860" y2="420" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: 三件套缺一会怎样 ============== -->
  <text x="450" y="450" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,稀疏 MoE 都崩
  </text>

  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="265" height="130" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 Top-K Gating</text>
    <text x="15" y="48" font-size="10" fill="#991b1b">没有 aux loss:</text>
    <text x="15" y="68" font-size="10" fill="#991b1b">gating 塌缩到少数 expert</text>
    <text x="15" y="88" font-size="10" fill="#991b1b">N-K 个永远学不到</text>
    <text x="132" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 容量浪费</text>

    <rect x="285" y="0" width="265" height="130" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 Auxiliary Loss</text>
    <text x="300" y="48" font-size="10" fill="#991b1b">没有 top-K 截断:</text>
    <text x="300" y="68" font-size="10" fill="#991b1b">gating 是 soft 的</text>
    <text x="300" y="88" font-size="10" fill="#991b1b">所有 expert 都要算</text>
    <text x="417" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 退化回 dense</text>

    <rect x="570" y="0" width="250" height="130" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 Expert Parallelism</text>
    <text x="585" y="48" font-size="10" fill="#991b1b">缺 sparse gating:</text>
    <text x="585" y="68" font-size="10" fill="#991b1b">算力还是 dense</text>
    <text x="585" y="88" font-size="10" fill="#991b1b">缺 aux loss:还是塌缩</text>
    <text x="695" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 工程白搭</text>
  </g>

  <rect x="60" y="615" width="780" height="35" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="638" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    三件套首次组合 → 137B 总参 / 1.5B 激活 / 用 LSTM-Big 1/3 算力跑赢 30% perplexity
  </text>
</svg>
