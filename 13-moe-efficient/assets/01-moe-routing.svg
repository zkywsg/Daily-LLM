<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="moe-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
    <marker id="moe-arr-active" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
    </marker>
    <marker id="moe-arr-dim" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d1d5db"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Sparsely-Gated MoE — 每 token 只激活 top-K 个 expert
  </text>

  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    N = 2048 experts,K = 4 — 实际算力只走 ~0.2% 参数
  </text>

  <!-- INPUT -->
  <rect x="60" y="90" width="160" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="115" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">输入 token x</text>
  <text x="140" y="135" text-anchor="middle" font-size="10" fill="#92400e">∈ ℝ^d</text>

  <line x1="220" y1="120" x2="270" y2="120" stroke="#9d174d" stroke-width="2" marker-end="url(#moe-arr)"/>

  <!-- GATING NETWORK -->
  <rect x="270" y="80" width="200" height="80" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="370" y="103" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">Gating 网络</text>
  <text x="370" y="123" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9d174d">G(x) = Softmax(</text>
  <text x="370" y="138" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9d174d">TopK(x·W_g + ε, K))</text>
  <text x="370" y="154" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">非选中 expert: 精确 0</text>

  <line x1="470" y1="120" x2="510" y2="120" stroke="#9d174d" stroke-width="2" marker-end="url(#moe-arr)"/>

  <!-- TOP-K SELECTION -->
  <rect x="510" y="80" width="200" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="610" y="103" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">Top-K 选择(K=4)</text>
  <text x="610" y="125" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1e40af">[12, 47, 893, 1502]</text>
  <text x="610" y="142" text-anchor="middle" font-size="10" fill="#1e40af">权重</text>
  <text x="610" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1e40af">[0.42, 0.31, 0.15, 0.12]</text>

  <!-- 路由 fan-out -->
  <line x1="610" y1="160" x2="220" y2="240" stroke="#059669" stroke-width="2" marker-end="url(#moe-arr-active)"/>
  <line x1="610" y1="160" x2="380" y2="240" stroke="#9d174d" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#moe-arr-dim)" opacity="0.4"/>
  <line x1="610" y1="160" x2="475" y2="240" stroke="#9d174d" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#moe-arr-dim)" opacity="0.4"/>
  <line x1="610" y1="160" x2="570" y2="240" stroke="#059669" stroke-width="2" marker-end="url(#moe-arr-active)"/>
  <line x1="610" y1="160" x2="665" y2="240" stroke="#9d174d" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#moe-arr-dim)" opacity="0.4"/>
  <line x1="610" y1="160" x2="760" y2="240" stroke="#059669" stroke-width="2" marker-end="url(#moe-arr-active)"/>

  <!-- 2048 EXPERTS POOL -->
  <text x="80" y="220" font-size="11" fill="#1f2937" font-weight="600">N = 2048 experts(每个是小 FFN)</text>

  <!-- Active experts (green) -->
  <rect x="180" y="245" width="80" height="50" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="220" y="263" text-anchor="middle" font-size="10" fill="#065f46" font-weight="700">E₁₂ ★</text>
  <text x="220" y="280" text-anchor="middle" font-size="9" fill="#065f46">激活 w=0.42</text>
  <text x="220" y="292" text-anchor="middle" font-size="8" fill="#059669" font-weight="600">计算</text>

  <!-- Dim expert (skip) -->
  <rect x="340" y="245" width="80" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="380" y="263" text-anchor="middle" font-size="10" fill="#9ca3af">E₂₃</text>
  <text x="380" y="280" text-anchor="middle" font-size="9" fill="#9ca3af">未选</text>
  <text x="380" y="292" text-anchor="middle" font-size="8" fill="#9ca3af">跳过</text>

  <!-- Active expert -->
  <rect x="435" y="245" width="80" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="475" y="263" text-anchor="middle" font-size="10" fill="#9ca3af">E₄₇</text>
  <text x="475" y="280" text-anchor="middle" font-size="9" fill="#9ca3af">未选</text>
  <text x="475" y="292" text-anchor="middle" font-size="8" fill="#9ca3af">跳过</text>

  <!-- Active expert E893 -->
  <rect x="530" y="245" width="80" height="50" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="570" y="263" text-anchor="middle" font-size="10" fill="#065f46" font-weight="700">E₈₉₃ ★</text>
  <text x="570" y="280" text-anchor="middle" font-size="9" fill="#065f46">激活 w=0.15</text>
  <text x="570" y="292" text-anchor="middle" font-size="8" fill="#059669" font-weight="600">计算</text>

  <rect x="625" y="245" width="80" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="665" y="263" text-anchor="middle" font-size="10" fill="#9ca3af">E₁₁₀₀</text>
  <text x="665" y="280" text-anchor="middle" font-size="9" fill="#9ca3af">未选</text>
  <text x="665" y="292" text-anchor="middle" font-size="8" fill="#9ca3af">跳过</text>

  <!-- Active expert E1502 -->
  <rect x="720" y="245" width="80" height="50" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="760" y="263" text-anchor="middle" font-size="10" fill="#065f46" font-weight="700">E₁₅₀₂ ★</text>
  <text x="760" y="280" text-anchor="middle" font-size="9" fill="#065f46">激活 w=0.12</text>
  <text x="760" y="292" text-anchor="middle" font-size="8" fill="#059669" font-weight="600">计算</text>

  <text x="450" y="320" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">… 其余 2044 个 expert 完全跳过(精确 0)…</text>

  <!-- AGGREGATE -->
  <line x1="220" y1="295" x2="450" y2="350" stroke="#059669" stroke-width="2" marker-end="url(#moe-arr-active)"/>
  <line x1="570" y1="295" x2="450" y2="350" stroke="#059669" stroke-width="2" marker-end="url(#moe-arr-active)"/>
  <line x1="760" y1="295" x2="450" y2="350" stroke="#059669" stroke-width="2" marker-end="url(#moe-arr-active)"/>

  <rect x="280" y="355" width="340" height="50" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="375" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24" font-weight="700">y = Σ G(x)_i · E_i(x)</text>
  <text x="450" y="395" text-anchor="middle" font-size="10" fill="#fef3c7">加权聚合 K=4 个 expert 输出</text>

  <!-- DIVIDER -->
  <line x1="40" y1="430" x2="860" y2="430" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM CALLOUTS — three mechanisms -->
  <text x="450" y="455" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三机制如何协同
  </text>

  <g transform="translate(40, 475)">
    <rect x="0" y="0" width="265" height="140" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">机制一:Top-K Gating</text>
    <text x="15" y="48" font-size="10" fill="#9d174d">• TopK 截断 → 非选中精确 0</text>
    <text x="15" y="68" font-size="10" fill="#9d174d">• Softmax 让 K 个权重可微</text>
    <text x="15" y="88" font-size="10" fill="#9d174d">• Noisy gate(+ε)促进探索</text>
    <text x="132" y="118" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 稀疏 + 可微</text>

    <rect x="285" y="0" width="265" height="140" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">机制二:Auxiliary Loss</text>
    <text x="300" y="48" font-size="10" fill="#92400e">• Importance loss → 均权重</text>
    <text x="300" y="68" font-size="10" fill="#92400e">• Load loss → 均 token 数</text>
    <text x="300" y="88" font-size="10" fill="#92400e">• CV² → 鼓励均匀分布</text>
    <text x="417" y="118" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 防 expert 塌缩</text>

    <rect x="570" y="0" width="250" height="140" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">机制三:Expert Parallelism</text>
    <text x="585" y="48" font-size="10" fill="#1e40af">• 2048 expert 分布 128 GPU</text>
    <text x="585" y="68" font-size="10" fill="#1e40af">• All-to-all 路由 token</text>
    <text x="585" y="88" font-size="10" fill="#1e40af">• 每 GPU 装 16 个 expert</text>
    <text x="695" y="118" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 算力真省下来</text>
  </g>
</svg>
