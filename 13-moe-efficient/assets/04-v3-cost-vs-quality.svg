<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="v3c-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    DeepSeek-V3 — 开源首次成本质量双反超闭源
  </text>

  <!-- ============== TOP: 质量对比 ============== -->
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    主流 benchmark 对比 — V3 持平甚至反超 GPT-4o / Claude-3.5
  </text>

  <!-- 4 benchmark bars -->
  <g transform="translate(60, 80)">
    <!-- MMLU -->
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">MMLU</text>
    <rect x="80" y="8" width="265" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="350" y="22" font-size="10" fill="#dc2626">GPT-4o 87.2</text>
    <rect x="430" y="8" width="265" height="16" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="700" y="22" font-size="10" fill="#9a3412">Claude-3.5 88.3</text>
    <rect x="430" y="28" width="266" height="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="700" y="42" font-size="10" fill="#059669" font-weight="700">V3 88.5 ★</text>

    <!-- MATH -->
    <text x="0" y="80" font-size="11" fill="#1f2937" font-weight="600">MATH</text>
    <rect x="80" y="68" width="230" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="315" y="82" font-size="10" fill="#dc2626">GPT-4o 76.6</text>
    <rect x="80" y="88" width="235" height="16" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="320" y="102" font-size="10" fill="#9a3412">Claude-3.5 78.3</text>
    <rect x="80" y="108" width="270" height="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="355" y="122" font-size="10" fill="#059669" font-weight="700">V3 90.2 ★★(反超!)</text>

    <!-- LiveCodeBench -->
    <text x="0" y="155" font-size="11" fill="#1f2937" font-weight="600">LiveCode</text>
    <rect x="80" y="143" width="100" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="185" y="157" font-size="10" fill="#dc2626">GPT-4o 33.4</text>
    <rect x="80" y="163" width="109" height="16" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="194" y="177" font-size="10" fill="#9a3412">Claude-3.5 36.3</text>
    <rect x="80" y="183" width="122" height="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="207" y="197" font-size="10" fill="#059669" font-weight="700">V3 40.5 ★(反超!)</text>

    <!-- MMLU-Pro -->
    <text x="0" y="225" font-size="11" fill="#1f2937" font-weight="600">MMLU-Pro</text>
    <rect x="80" y="213" width="218" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="303" y="227" font-size="10" fill="#dc2626">GPT-4o 72.6</text>
    <rect x="80" y="233" width="234" height="16" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="319" y="247" font-size="10" fill="#9a3412">Claude-3.5 78.0</text>
    <rect x="80" y="253" width="228" height="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="313" y="267" font-size="10" fill="#059669" font-weight="700">V3 75.9(中间档)</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="385" x2="860" y2="385" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: 成本对比 + 三件套 ============== -->
  <text x="450" y="410" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">
    训练成本对比 — V3 仅 $5.6M(GPT-4 的 1/20)
  </text>

  <g transform="translate(60, 430)">
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">GPT-4</text>
    <rect x="80" y="8" width="600" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="685" y="22" font-size="11" fill="#dc2626" font-weight="700">~$100M(估算)</text>

    <text x="0" y="50" font-size="11" fill="#1f2937" font-weight="600">LLaMA-3.1 405B</text>
    <rect x="80" y="38" width="360" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="445" y="52" font-size="11" fill="#dc2626">~$60M(估算)</text>

    <text x="0" y="80" font-size="11" fill="#1f2937" font-weight="600">DeepSeek-V3</text>
    <rect x="80" y="68" width="34" height="16" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="120" y="82" font-size="11" fill="#059669" font-weight="700">$5.6M ★★★(20× 便宜)</text>
  </g>

  <!-- 三件套缺一 -->
  <text x="450" y="540" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,V3 都达不到双指标
  </text>

  <g transform="translate(40, 560)">
    <rect x="0" y="0" width="265" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="20" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="700">只有 Fine-Grained</text>
    <text x="15" y="40" font-size="9" fill="#991b1b">aux loss 干扰 + BF16</text>
    <text x="15" y="55" font-size="9" fill="#991b1b">→ 成本 $50M+,失低成本</text>
    <text x="132" y="78" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 比 Mixtral 大而已</text>

    <rect x="285" y="0" width="265" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="20" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="700">只有 Aux-Free</text>
    <text x="300" y="40" font-size="9" fill="#991b1b">expert 还是 Mixtral 风格</text>
    <text x="300" y="55" font-size="9" fill="#991b1b">→ 质量天花板 = Mixtral</text>
    <text x="417" y="78" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 追不上 GPT-4</text>

    <rect x="570" y="0" width="250" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="20" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="700">只有 FP8 系统</text>
    <text x="585" y="40" font-size="9" fill="#991b1b">架构 + 训练用老方案</text>
    <text x="585" y="55" font-size="9" fill="#991b1b">→ 训出来还是 Mixtral 质量</text>
    <text x="695" y="78" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 只是更便宜的 Mixtral</text>
  </g>
</svg>
