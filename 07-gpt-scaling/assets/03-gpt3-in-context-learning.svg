<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-icl" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <!-- ============ TITLE ============ -->
  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    In-Context Learning · 三种 prompt 模式(权重一字节都没变)
  </text>

  <!-- ============ THREE COLUMNS (English → French translation) ============ -->
  <!-- Column 1: Zero-shot -->
  <rect x="40" y="60" width="260" height="280" rx="8"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="84" text-anchor="middle" font-size="14" fill="#92400e" font-weight="700">
    Zero-shot
  </text>
  <text x="170" y="102" text-anchor="middle" font-size="11" fill="#92400e">
    只有任务描述,0 个例子
  </text>

  <!-- prompt box -->
  <rect x="55" y="118" width="230" height="160" rx="4"
        fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="65" y="138" font-size="11" fill="#78350f" font-family="ui-monospace, Menlo, monospace">
    Translate English to French:
  </text>
  <text x="65" y="158" font-size="11" fill="#78350f" font-family="ui-monospace, Menlo, monospace">
  </text>
  <text x="65" y="178" font-size="11" fill="#78350f" font-family="ui-monospace, Menlo, monospace">
    cheese =&gt;
  </text>
  <text x="65" y="220" font-size="10" fill="#a16207" font-style="italic">
    模型猜:fromage?
  </text>
  <text x="65" y="240" font-size="10" fill="#a16207" font-style="italic">
    (可能输出"the cheese"等无关词)
  </text>

  <text x="170" y="305" text-anchor="middle" font-size="11" fill="#92400e">
    最难 · 模型不知道你要什么格式
  </text>
  <text x="170" y="322" text-anchor="middle" font-size="10" fill="#a16207">
    适合无样本场景 / 通用任务
  </text>

  <!-- Column 2: One-shot -->
  <rect x="320" y="60" width="260" height="280" rx="8"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="450" y="84" text-anchor="middle" font-size="14" fill="#9d174d" font-weight="700">
    One-shot
  </text>
  <text x="450" y="102" text-anchor="middle" font-size="11" fill="#9d174d">
    任务描述 + 1 个示范例子
  </text>

  <rect x="335" y="118" width="230" height="160" rx="4"
        fill="#fdf2f8" stroke="#db2777" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="345" y="138" font-size="11" fill="#831843" font-family="ui-monospace, Menlo, monospace">
    Translate English to French:
  </text>
  <text x="345" y="158" font-size="11" fill="#831843" font-family="ui-monospace, Menlo, monospace">
  </text>
  <text x="345" y="178" font-size="11" fill="#831843" font-family="ui-monospace, Menlo, monospace">
    sea otter =&gt; loutre de mer
  </text>
  <text x="345" y="198" font-size="11" fill="#831843" font-family="ui-monospace, Menlo, monospace">
    cheese =&gt;
  </text>
  <text x="345" y="240" font-size="10" fill="#be185d" font-style="italic">
    模型学到"X =&gt; Y"格式
  </text>
  <text x="345" y="256" font-size="10" fill="#be185d" font-style="italic">
    输出:fromage
  </text>

  <text x="450" y="305" text-anchor="middle" font-size="11" fill="#9d174d">
    1 个例子已经显著拉升
  </text>
  <text x="450" y="322" text-anchor="middle" font-size="10" fill="#be185d">
    格式 / 风格瞬间锁定
  </text>

  <!-- Column 3: Few-shot -->
  <rect x="600" y="60" width="260" height="280" rx="8"
        fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="84" text-anchor="middle" font-size="14" fill="#5b21b6" font-weight="700">
    Few-shot (k=3~32)
  </text>
  <text x="730" y="102" text-anchor="middle" font-size="11" fill="#5b21b6">
    任务描述 + 多个示范例子
  </text>

  <rect x="615" y="118" width="230" height="190" rx="4"
        fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="625" y="138" font-size="11" fill="#4c1d95" font-family="ui-monospace, Menlo, monospace">
    Translate English to French:
  </text>
  <text x="625" y="155" font-size="11" fill="#4c1d95" font-family="ui-monospace, Menlo, monospace">
  </text>
  <text x="625" y="172" font-size="11" fill="#4c1d95" font-family="ui-monospace, Menlo, monospace">
    sea otter =&gt; loutre de mer
  </text>
  <text x="625" y="189" font-size="11" fill="#4c1d95" font-family="ui-monospace, Menlo, monospace">
    peppermint =&gt; menthe poivrée
  </text>
  <text x="625" y="206" font-size="11" fill="#4c1d95" font-family="ui-monospace, Menlo, monospace">
    plush giraffe =&gt; girafe en peluche
  </text>
  <text x="625" y="223" font-size="11" fill="#4c1d95" font-family="ui-monospace, Menlo, monospace">
    cheese =&gt;
  </text>
  <text x="625" y="262" font-size="10" fill="#6d28d9" font-style="italic">
    多个例子建立稳定模式
  </text>
  <text x="625" y="278" font-size="10" fill="#6d28d9" font-style="italic">
    输出:fromage(高置信度)
  </text>

  <text x="730" y="328" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="600">
    最强 setting · 接近监督微调
  </text>

  <!-- ============ BAR CHART: GPT-3 175B performance ============ -->
  <text x="450" y="378" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    GPT-3 175B 性能对比(WMT'14 En→Fr, BLEU)
  </text>

  <!-- Chart axes -->
  <line x1="100" y1="510" x2="800" y2="510" stroke="#6b7280" stroke-width="1"/>
  <line x1="100" y1="400" x2="100" y2="510" stroke="#6b7280" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="92" y="404" text-anchor="end" font-size="10" fill="#6b7280">40</text>
  <text x="92" y="430" text-anchor="end" font-size="10" fill="#6b7280">30</text>
  <text x="92" y="458" text-anchor="end" font-size="10" fill="#6b7280">20</text>
  <text x="92" y="485" text-anchor="end" font-size="10" fill="#6b7280">10</text>
  <text x="92" y="513" text-anchor="end" font-size="10" fill="#6b7280">0</text>

  <!-- Bars: BLEU values for 175B model: 0-shot=25.2, 1-shot=28.3, few-shot=32.6 -->
  <!-- Scale: 40 BLEU = 110 pixels (y=400), 0 = y=510 -->
  <!-- 0-shot = 25.2 → height=69 → y=441 -->
  <rect x="180" y="441" width="100" height="69" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="431" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">25.2</text>
  <text x="230" y="528" text-anchor="middle" font-size="11" fill="#92400e">Zero-shot</text>

  <!-- 1-shot = 28.3 → height=78 → y=432 -->
  <rect x="400" y="432" width="100" height="78" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="450" y="422" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">28.3</text>
  <text x="450" y="528" text-anchor="middle" font-size="11" fill="#9d174d">One-shot</text>

  <!-- few-shot = 32.6 → height=90 → y=420 -->
  <rect x="620" y="420" width="100" height="90" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="410" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="600">32.6</text>
  <text x="670" y="528" text-anchor="middle" font-size="11" fill="#5b21b6">Few-shot (k=64)</text>

  <!-- delta annotation -->
  <line x1="290" y1="445" x2="395" y2="436"
        stroke="#9d174d" stroke-width="1" stroke-dasharray="3,2"
        marker-end="url(#arr-icl)"/>
  <text x="345" y="438" text-anchor="middle" font-size="10" fill="#9d174d">+3.1</text>

  <line x1="510" y1="436" x2="615" y2="424"
        stroke="#9d174d" stroke-width="1" stroke-dasharray="3,2"
        marker-end="url(#arr-icl)"/>
  <text x="565" y="425" text-anchor="middle" font-size="10" fill="#9d174d">+4.3</text>

  <text x="450" y="548" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">
    数据来源:Brown et al. 2020 Table H.1 · 175B model · WMT'14 En→Fr
  </text>

  <!-- ============ BOTTOM CALLOUT ============ -->
  <rect x="40" y="568" width="820" height="42" rx="6"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="60" y="588" font-size="12" fill="#991b1b" font-weight="600">
    最反直觉的事实 · 权重一个字节都没变
  </text>
  <text x="60" y="603" font-size="11" fill="#7f1d1d">
    三种模式跑的是同一个 GPT-3 175B checkpoint,差别只是 prompt 长度 — "learning" 完全发生在 attention 对上下文的处理里,而不是梯度更新里。
  </text>
</svg>
