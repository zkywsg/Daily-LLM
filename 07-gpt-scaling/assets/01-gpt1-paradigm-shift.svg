<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="ps-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    GPT-1 vs BERT + 2018-2024 LLM 路线演化
  </text>

  <!-- ============== TOP: GPT-1 vs BERT comparison ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    2018 同年两条路线 — Decoder-only vs Encoder-only
  </text>

  <!-- GPT-1 column -->
  <rect x="80" y="85" width="340" height="240" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="250" y="110" text-anchor="middle" font-size="13" fill="#9d174d" font-weight="700">GPT-1(OpenAI 2018.6)</text>

  <!-- comparison rows -->
  <g font-size="11" fill="#9d174d">
    <text x="95" y="138" font-weight="600">架构:</text>
    <text x="170" y="138">Decoder-only Transformer</text>

    <text x="95" y="165" font-weight="600">训练目标:</text>
    <text x="170" y="165">自回归 LM(单向)</text>

    <text x="95" y="192" font-weight="600">参数:</text>
    <text x="170" y="192">117M(12 层)</text>

    <text x="95" y="219" font-weight="600">微调方式:</text>
    <text x="170" y="219">序列接口 + linear head</text>

    <text x="95" y="246" font-weight="600">适合任务:</text>
    <text x="170" y="246">生成 + 分类(双能)</text>

    <text x="95" y="273" font-weight="600">2018 表现:</text>
    <text x="170" y="273">12 任务 9 SOTA</text>

    <text x="95" y="305" font-weight="700" fill="#dc2626">长期赢家 ★</text>
    <text x="170" y="305" fill="#dc2626">→ GPT-2/3/4 / LLaMA / Claude</text>
  </g>

  <!-- BERT column -->
  <rect x="480" y="85" width="340" height="240" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="650" y="110" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="700">BERT(Google 2018.10)</text>

  <g font-size="11" fill="#1e40af">
    <text x="495" y="138" font-weight="600">架构:</text>
    <text x="570" y="138">Encoder-only Transformer</text>

    <text x="495" y="165" font-weight="600">训练目标:</text>
    <text x="570" y="165">Masked LM(真双向)</text>

    <text x="495" y="192" font-weight="600">参数:</text>
    <text x="570" y="192">110M / 340M(base / large)</text>

    <text x="495" y="219" font-weight="600">微调方式:</text>
    <text x="570" y="219">CLS token + task head</text>

    <text x="495" y="246" font-weight="600">适合任务:</text>
    <text x="570" y="246">理解类(分类 / QA / NER)</text>

    <text x="495" y="273" font-weight="600">2018 表现:</text>
    <text x="570" y="273">GLUE 全面 SOTA(更亮眼)</text>

    <text x="495" y="305" font-weight="700">现状</text>
    <text x="570" y="305">→ 退守 retrieval / encoder 场景</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="355" x2="860" y2="355" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: 2018-2024 LLM 演化 ============== -->
  <text x="450" y="380" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    2018 → 2024 Decoder-only 路线演化 — GPT-1 范式不断进化
  </text>

  <!-- timeline -->
  <line x1="80" y1="500" x2="820" y2="500" stroke="#1f2937" stroke-width="2"/>

  <!-- GPT-1 -->
  <circle cx="120" cy="500" r="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <rect x="80" y="420" width="100" height="70" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="130" y="440" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">GPT-1</text>
  <text x="130" y="455" text-anchor="middle" font-size="9" fill="#9d174d">2018</text>
  <text x="130" y="470" text-anchor="middle" font-size="9" fill="#9d174d">117M</text>
  <text x="130" y="485" text-anchor="middle" font-size="9" fill="#9d174d">预训练范式</text>
  <text x="120" y="525" text-anchor="middle" font-size="10" fill="#1f2937">2018</text>

  <!-- GPT-2 -->
  <circle cx="270" cy="500" r="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <rect x="220" y="420" width="100" height="70" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="270" y="440" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">GPT-2</text>
  <text x="270" y="455" text-anchor="middle" font-size="9" fill="#9d174d">2019</text>
  <text x="270" y="470" text-anchor="middle" font-size="9" fill="#9d174d">1.5B</text>
  <text x="270" y="485" text-anchor="middle" font-size="9" fill="#9d174d">zero-shot</text>
  <text x="270" y="525" text-anchor="middle" font-size="10" fill="#1f2937">2019</text>

  <!-- GPT-3 -->
  <circle cx="420" cy="500" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="370" y="420" width="100" height="70" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="440" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">GPT-3 ★</text>
  <text x="420" y="455" text-anchor="middle" font-size="9" fill="#991b1b">2020</text>
  <text x="420" y="470" text-anchor="middle" font-size="9" fill="#991b1b" font-weight="700">175B</text>
  <text x="420" y="485" text-anchor="middle" font-size="9" fill="#991b1b">in-context</text>
  <text x="420" y="525" text-anchor="middle" font-size="10" fill="#1f2937">2020</text>

  <!-- ChatGPT -->
  <circle cx="570" cy="500" r="10" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <rect x="520" y="420" width="100" height="70" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="570" y="440" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="700">ChatGPT</text>
  <text x="570" y="455" text-anchor="middle" font-size="9" fill="#9a3412">2022</text>
  <text x="570" y="470" text-anchor="middle" font-size="9" fill="#9a3412">RLHF</text>
  <text x="570" y="485" text-anchor="middle" font-size="9" fill="#9a3412">+ instruct</text>
  <text x="570" y="525" text-anchor="middle" font-size="10" fill="#1f2937">2022</text>

  <!-- LLaMA / GPT-4 -->
  <circle cx="720" cy="500" r="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <rect x="670" y="420" width="100" height="70" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="720" y="440" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">LLaMA/GPT-4</text>
  <text x="720" y="455" text-anchor="middle" font-size="9" fill="#065f46">2023+</text>
  <text x="720" y="470" text-anchor="middle" font-size="9" fill="#065f46">7B-1T+</text>
  <text x="720" y="485" text-anchor="middle" font-size="9" fill="#065f46">RoPE/SwiGLU</text>
  <text x="720" y="525" text-anchor="middle" font-size="10" fill="#1f2937">2023+</text>

  <!-- annotations between nodes -->
  <text x="195" y="555" text-anchor="middle" font-size="9" fill="#7c3aed" font-style="italic">scale 13×</text>
  <text x="345" y="555" text-anchor="middle" font-size="9" fill="#7c3aed" font-style="italic">scale 117×</text>
  <text x="495" y="555" text-anchor="middle" font-size="9" fill="#7c3aed" font-style="italic">+ RLHF 对齐</text>
  <text x="645" y="555" text-anchor="middle" font-size="9" fill="#7c3aed" font-style="italic">+ 现代化配方</text>

  <!-- GPT-1 → GPT-3 highlight -->
  <path d="M 130 405 Q 275 380, 420 405" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <text x="275" y="378" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">"统一任务接口"思想极端化 → in-context learning</text>

  <!-- bottom callout -->
  <rect x="60" y="580" width="780" height="50" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="605" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    GPT-1 真正的功绩 — 不在赢得路线之争,而在第一次系统证明"预训练 + 微调"是 NLP 通用范式
  </text>
  <text x="450" y="623" text-anchor="middle" font-size="11" fill="#fef3c7">
    这一范式至今(2024)仍是 LLM 训练基础(只是 fine-tune 换成 RLHF / DPO)
  </text>
</svg>
