<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-sl" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- ============== TITLE ============== -->
  <text x="450" y="28" text-anchor="middle" font-size="17"
        fill="#1f2937" font-weight="600">
    Scaling Laws 的三条直线 · loss 在 log-log 空间是 power-law
  </text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6b7280">
    参数 N / 数据 D / 算力 C 三轴各自独立地决定 loss · 三条直线斜率即 α
  </text>

  <!-- ===== shared subplot drawing macros (3 panels) =====
       each subplot: outer 250×400 footprint
       plot area:   x_left=plotX, x_right=plotX+200, y_top=110, y_bottom=420
  -->

  <!-- =============================================== -->
  <!-- SUBPLOT 1: L(N)                                  -->
  <!-- =============================================== -->
  <g>
    <!-- panel header -->
    <text x="185" y="92" text-anchor="middle" font-size="14"
          fill="#1f2937" font-weight="700">L(N) · α_N ≈ 0.076</text>

    <!-- plot frame -->
    <rect x="85" y="115" width="200" height="290" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

    <!-- gridlines horizontal -->
    <g stroke="#e5e7eb" stroke-width="0.5">
      <line x1="85"  y1="160" x2="285" y2="160"/>
      <line x1="85"  y1="220" x2="285" y2="220"/>
      <line x1="85"  y1="280" x2="285" y2="280"/>
      <line x1="85"  y1="340" x2="285" y2="340"/>
    </g>
    <!-- gridlines vertical -->
    <g stroke="#e5e7eb" stroke-width="0.5">
      <line x1="125" y1="115" x2="125" y2="405"/>
      <line x1="165" y1="115" x2="165" y2="405"/>
      <line x1="205" y1="115" x2="205" y2="405"/>
      <line x1="245" y1="115" x2="245" y2="405"/>
    </g>

    <!-- axes -->
    <line x1="85"  y1="405" x2="285" y2="405" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="85"  y1="115" x2="85"  y2="405" stroke="#1f2937" stroke-width="1.2"/>

    <!-- x ticks labels (log N) -->
    <g font-size="10" fill="#4b5563" text-anchor="middle">
      <text x="85"  y="422">10⁶</text>
      <text x="125" y="422">10⁷</text>
      <text x="165" y="422">10⁸</text>
      <text x="205" y="422">10⁹</text>
      <text x="245" y="422">10¹⁰</text>
      <text x="285" y="422">10¹¹</text>
    </g>
    <text x="185" y="442" text-anchor="middle" font-size="11" fill="#1f2937">log N (参数量)</text>

    <!-- y ticks labels (log Loss) -->
    <g font-size="10" fill="#4b5563" text-anchor="end">
      <text x="78" y="164">6.0</text>
      <text x="78" y="224">4.5</text>
      <text x="78" y="284">3.3</text>
      <text x="78" y="344">2.5</text>
      <text x="78" y="404">1.9</text>
    </g>
    <text x="40" y="260" text-anchor="middle" font-size="11" fill="#1f2937"
          transform="rotate(-90 40 260)">log L (test loss)</text>

    <!-- power-law line: from (85,150) to (285,370) -->
    <line x1="85"  y1="150" x2="285" y2="370"
          stroke="#4338ca" stroke-width="2.5"/>

    <!-- data points: GPT-1 (0.117B≈10^8.07) GPT-2 (1.5B≈10^9.18) GPT-3 (175B≈10^11.24) -->
    <!-- map: x=85+40*(log10(N)-6); y=150+(220/(11-6))*(log10(N)-6)*... use along the line -->
    <!-- pick along line: pt1 at x=168 y=242, pt2 at x=212 y=290, pt3 at x=294 (cap at 285) -->
    <!-- We'll place 3 visually clear points on the line -->
    <circle cx="168" cy="242" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>
    <circle cx="212" cy="290" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>
    <circle cx="274" cy="358" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>

    <!-- annotations BELOW the line so they don't overlap -->
    <text x="160" y="262" text-anchor="end" font-size="10" fill="#9d174d">GPT-1 117M</text>
    <text x="204" y="310" text-anchor="end" font-size="10" fill="#9d174d">GPT-2 1.5B</text>
    <text x="266" y="378" text-anchor="end" font-size="10" fill="#9d174d">GPT-3 175B</text>
  </g>

  <!-- =============================================== -->
  <!-- SUBPLOT 2: L(D)                                  -->
  <!-- =============================================== -->
  <g>
    <text x="475" y="92" text-anchor="middle" font-size="14"
          fill="#1f2937" font-weight="700">L(D) · α_D ≈ 0.095</text>

    <rect x="375" y="115" width="200" height="290" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

    <g stroke="#e5e7eb" stroke-width="0.5">
      <line x1="375" y1="160" x2="575" y2="160"/>
      <line x1="375" y1="220" x2="575" y2="220"/>
      <line x1="375" y1="280" x2="575" y2="280"/>
      <line x1="375" y1="340" x2="575" y2="340"/>
    </g>
    <g stroke="#e5e7eb" stroke-width="0.5">
      <line x1="415" y1="115" x2="415" y2="405"/>
      <line x1="455" y1="115" x2="455" y2="405"/>
      <line x1="495" y1="115" x2="495" y2="405"/>
      <line x1="535" y1="115" x2="535" y2="405"/>
    </g>

    <line x1="375" y1="405" x2="575" y2="405" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="375" y1="115" x2="375" y2="405" stroke="#1f2937" stroke-width="1.2"/>

    <g font-size="10" fill="#4b5563" text-anchor="middle">
      <text x="375" y="422">10⁸</text>
      <text x="415" y="422">10⁹</text>
      <text x="455" y="422">10¹⁰</text>
      <text x="495" y="422">10¹¹</text>
      <text x="535" y="422">10¹²</text>
      <text x="575" y="422">10¹³</text>
    </g>
    <text x="475" y="442" text-anchor="middle" font-size="11" fill="#1f2937">log D (训练 tokens)</text>

    <g font-size="10" fill="#4b5563" text-anchor="end">
      <text x="368" y="164">6.0</text>
      <text x="368" y="224">4.3</text>
      <text x="368" y="284">3.0</text>
      <text x="368" y="344">2.2</text>
      <text x="368" y="404">1.7</text>
    </g>

    <!-- steeper line: α_D = 0.095 > 0.076 -->
    <line x1="375" y1="145" x2="575" y2="385"
          stroke="#4338ca" stroke-width="2.5"/>

    <!-- 3 data points -->
    <circle cx="438" cy="220" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>
    <circle cx="478" cy="268" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>
    <circle cx="552" cy="357" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>

    <text x="432" y="240" text-anchor="end" font-size="10" fill="#9d174d">GPT-1 5B</text>
    <text x="472" y="288" text-anchor="end" font-size="10" fill="#9d174d">GPT-2 40B</text>
    <text x="544" y="377" text-anchor="end" font-size="10" fill="#9d174d">GPT-3 300B</text>
  </g>

  <!-- =============================================== -->
  <!-- SUBPLOT 3: L(C)                                  -->
  <!-- =============================================== -->
  <g>
    <text x="765" y="92" text-anchor="middle" font-size="14"
          fill="#1f2937" font-weight="700">L(C) · α_C ≈ 0.050</text>

    <rect x="665" y="115" width="200" height="290" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>

    <g stroke="#e5e7eb" stroke-width="0.5">
      <line x1="665" y1="160" x2="865" y2="160"/>
      <line x1="665" y1="220" x2="865" y2="220"/>
      <line x1="665" y1="280" x2="865" y2="280"/>
      <line x1="665" y1="340" x2="865" y2="340"/>
    </g>
    <g stroke="#e5e7eb" stroke-width="0.5">
      <line x1="705" y1="115" x2="705" y2="405"/>
      <line x1="745" y1="115" x2="745" y2="405"/>
      <line x1="785" y1="115" x2="785" y2="405"/>
      <line x1="825" y1="115" x2="825" y2="405"/>
    </g>

    <line x1="665" y1="405" x2="865" y2="405" stroke="#1f2937" stroke-width="1.2"/>
    <line x1="665" y1="115" x2="665" y2="405" stroke="#1f2937" stroke-width="1.2"/>

    <g font-size="10" fill="#4b5563" text-anchor="middle">
      <text x="665" y="422">10⁻³</text>
      <text x="705" y="422">10⁻¹</text>
      <text x="745" y="422">10¹</text>
      <text x="785" y="422">10³</text>
      <text x="825" y="422">10⁵</text>
      <text x="865" y="422">10⁷</text>
    </g>
    <text x="765" y="442" text-anchor="middle" font-size="11" fill="#1f2937">log C (PF-days)</text>

    <g font-size="10" fill="#4b5563" text-anchor="end">
      <text x="658" y="164">6.5</text>
      <text x="658" y="224">5.0</text>
      <text x="658" y="284">3.8</text>
      <text x="658" y="344">2.8</text>
      <text x="658" y="404">2.1</text>
    </g>

    <!-- shallowest line: α_C = 0.05 -->
    <line x1="665" y1="155" x2="865" y2="345"
          stroke="#4338ca" stroke-width="2.5"/>

    <circle cx="724" cy="211" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>
    <circle cx="772" cy="257" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>
    <circle cx="848" cy="329" r="5" fill="#db2777" stroke="#fff" stroke-width="1.2"/>

    <text x="718" y="231" text-anchor="end" font-size="10" fill="#9d174d">GPT-1 ~0.01</text>
    <text x="766" y="277" text-anchor="end" font-size="10" fill="#9d174d">GPT-2 ~1</text>
    <text x="840" y="349" text-anchor="end" font-size="10" fill="#9d174d">GPT-3 ~3.6k</text>
  </g>

  <!-- section divider -->
  <line x1="40" y1="465" x2="860" y2="465"
        stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- =============================================== -->
  <!-- BOTTOM PANEL: 可加分解公式 callout                -->
  <!-- =============================================== -->
  <g>
    <rect x="60" y="480" width="780" height="80" rx="8"
          fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>

    <text x="450" y="504" text-anchor="middle" font-size="14"
          fill="#92400e" font-weight="700">
      可加分解形式:把"参数有限"和"数据有限"两个 bottleneck 拆开
    </text>

    <text x="450" y="530" text-anchor="middle" font-size="15"
          fill="#1f2937" font-weight="600" font-style="italic">
      L(N, D) = L_∞ + (N_c / N)^α_N + (D_c / D)^α_D
    </text>

    <text x="450" y="552" text-anchor="middle" font-size="11" fill="#6b7280">
      L_∞ 是理论 floor(语言本身的不可约熵)· N 项是"模型容量不够"·  D 项是"数据没看够" · 任一项主导都会卡住
    </text>
  </g>
</svg>
