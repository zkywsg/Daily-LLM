<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="g1-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    GPT-1 范式革命 — 预训练 + 微调替代专门模型
  </text>

  <!-- ============== TOP: 旧范式 vs 新范式 ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    范式对比
  </text>

  <!-- Old paradigm -->
  <rect x="60" y="80" width="370" height="170" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="245" y="103" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">旧范式:每个任务一个专门模型</text>

  <rect x="80" y="120" width="155" height="36" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="157" y="142" text-anchor="middle" font-size="11" fill="#92400e">分类:BiLSTM</text>

  <rect x="255" y="120" width="155" height="36" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="332" y="142" text-anchor="middle" font-size="11" fill="#92400e">阅读理解:BiDAF</text>

  <rect x="80" y="165" width="155" height="36" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="157" y="187" text-anchor="middle" font-size="11" fill="#92400e">NER:BiLSTM-CRF</text>

  <rect x="255" y="165" width="155" height="36" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="332" y="187" text-anchor="middle" font-size="11" fill="#92400e">NLI:ESIM</text>

  <text x="245" y="225" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">
    每个任务从头训,标注数据稀缺
  </text>
  <text x="245" y="242" text-anchor="middle" font-size="10" fill="#dc2626" font-style="italic">
    99%+ 无标注互联网文本浪费
  </text>

  <!-- arrow between -->
  <line x1="440" y1="165" x2="465" y2="165" stroke="#7c3aed" stroke-width="3" marker-end="url(#g1-arr)"/>
  <text x="452" y="155" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">替换</text>

  <!-- New paradigm -->
  <rect x="470" y="80" width="370" height="170" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="655" y="103" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">GPT-1 新范式:预训练 + 微调</text>

  <rect x="490" y="120" width="330" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="655" y="143" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="700">Decoder-only Transformer 117M</text>

  <text x="655" y="178" text-anchor="middle" font-size="11" fill="#065f46">+ 4 种 task-specific linear head</text>

  <rect x="490" y="190" width="330" height="36" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="655" y="212" text-anchor="middle" font-size="11" fill="#065f46">所有 NLP 任务统一序列输入接口</text>

  <text x="655" y="240" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">
    一个 backbone,12 任务 9 个 SOTA
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="280" x2="860" y2="280" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: complete pipeline ============== -->
  <text x="450" y="305" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    完整 Pipeline — Stage 1 预训练 → Stage 2 微调
  </text>

  <!-- Stage 1 -->
  <rect x="60" y="325" width="370" height="200" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="348" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="700">Stage 1: 预训练(无监督)</text>

  <!-- Data -->
  <rect x="80" y="365" width="330" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="245" y="384" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">BookCorpus(7000 本小说,800M token)</text>
  <text x="245" y="400" text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">选小说而非 Wiki:长程依赖更丰富</text>

  <line x1="245" y1="403" x2="245" y2="420" stroke="#9d174d" stroke-width="1.5" marker-end="url(#g1-arr)"/>

  <!-- Model -->
  <rect x="80" y="425" width="330" height="38" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="245" y="444" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">Decoder-only Transformer × 12 层</text>
  <text x="245" y="458" text-anchor="middle" font-size="9" fill="#9d174d">d=768, h=12, d_ff=3072, GELU, 117M 参数</text>

  <line x1="245" y1="463" x2="245" y2="480" stroke="#9d174d" stroke-width="1.5" marker-end="url(#g1-arr)"/>

  <!-- Loss -->
  <rect x="80" y="485" width="330" height="35" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="245" y="507" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#065f46" font-weight="700">
    L = -Σ log p(x_t | x_{&lt;t})  (自回归 LM)
  </text>

  <!-- arrow to Stage 2 -->
  <line x1="430" y1="425" x2="470" y2="425" stroke="#7c3aed" stroke-width="3" marker-end="url(#g1-arr)"/>
  <text x="450" y="415" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">权重迁移</text>

  <!-- Stage 2 -->
  <rect x="470" y="325" width="370" height="200" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="655" y="348" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="700">Stage 2: 微调(有监督)</text>

  <!-- Data -->
  <rect x="490" y="365" width="330" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="384" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">下游任务数据(几千到几万条)</text>
  <text x="655" y="400" text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">分类 / NLI / 相似度 / QA 等</text>

  <line x1="655" y1="403" x2="655" y2="420" stroke="#9d174d" stroke-width="1.5" marker-end="url(#g1-arr)"/>

  <!-- Same model + task head -->
  <rect x="490" y="425" width="330" height="38" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="655" y="444" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">同一 Transformer + task linear head</text>
  <text x="655" y="458" text-anchor="middle" font-size="9" fill="#9d174d">统一 `&lt;s&gt; ... &lt;$&gt; ... &lt;/s&gt;` 序列接口</text>

  <line x1="655" y1="463" x2="655" y2="480" stroke="#9d174d" stroke-width="1.5" marker-end="url(#g1-arr)"/>

  <!-- Loss with auxiliary -->
  <rect x="490" y="485" width="330" height="35" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="655" y="507" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#065f46" font-weight="700">
    L = L_task + λ·L_LM  (λ=0.5 防遗忘)
  </text>

  <!-- bottom callout -->
  <rect x="60" y="555" width="780" height="80" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="580" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    统一 backbone + 统一接口 — NLP 从"专门模型时代"进入"预训练时代"
  </text>
  <g font-size="11" fill="#fef3c7">
    <text x="80" y="605">• 12 个 benchmark 拿到 9 个 SOTA,平均比之前 SOTA 提升 +5 ~ +10 点</text>
    <text x="80" y="625">• HuggingFace Transformers / 所有现代 LLM 工程都建立在这一范式上</text>
  </g>
</svg>
