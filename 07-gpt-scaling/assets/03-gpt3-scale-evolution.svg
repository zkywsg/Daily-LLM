<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-evo" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
    <marker id="arr-perf" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ============ TITLE ============ -->
  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    GPT 系列规模演进:117M → 1.5B → 175B(参数 ~1500×)
  </text>

  <!-- ============ TOP PANEL: performance curve ============ -->
  <text x="60" y="62" font-size="12" fill="#1e40af" font-weight="600">
    LAMBADA few-shot acc(示意)
  </text>

  <!-- Y-axis -->
  <line x1="80" y1="80" x2="80" y2="180" stroke="#6b7280" stroke-width="1"/>
  <line x1="80" y1="180" x2="820" y2="180" stroke="#6b7280" stroke-width="1"/>
  <text x="68" y="86" text-anchor="end" font-size="10" fill="#6b7280">80%</text>
  <text x="68" y="133" text-anchor="end" font-size="10" fill="#6b7280">50%</text>
  <text x="68" y="184" text-anchor="end" font-size="10" fill="#6b7280">20%</text>

  <!-- X-axis ticks -->
  <text x="160" y="195" text-anchor="middle" font-size="10" fill="#6b7280">GPT-1</text>
  <text x="450" y="195" text-anchor="middle" font-size="10" fill="#6b7280">GPT-2</text>
  <text x="740" y="195" text-anchor="middle" font-size="10" fill="#6b7280">GPT-3</text>

  <!-- performance curve: flat then jump at GPT-3 -->
  <path d="M 160 170 Q 300 168, 450 158 Q 600 145, 740 90"
        stroke="#2563eb" stroke-width="2.5" fill="none"
        marker-end="url(#arr-perf)"/>

  <!-- performance points -->
  <circle cx="160" cy="170" r="4" fill="#2563eb"/>
  <circle cx="450" cy="158" r="4" fill="#2563eb"/>
  <circle cx="740" cy="92" r="5" fill="#2563eb"/>

  <text x="160" y="160" text-anchor="middle" font-size="10" fill="#1e40af">~25%</text>
  <text x="450" y="148" text-anchor="middle" font-size="10" fill="#1e40af">~45%</text>
  <text x="740" y="82" text-anchor="middle" font-size="10" fill="#1e40af">~76%</text>

  <!-- jump callout -->
  <text x="640" y="120" font-size="11" fill="#dc2626" font-weight="600">
    在 ~10B 后突然跳变
  </text>

  <!-- ============ MIDDLE PANEL: three rects by area ============ -->
  <!-- GPT-1: 117M, area scale = 1× → ~30×30 -->
  <rect x="145" y="290" width="30" height="30" rx="3"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="340" text-anchor="middle" font-size="13" fill="#92400e" font-weight="600">GPT-1 (2018)</text>
  <text x="160" y="357" text-anchor="middle" font-size="11" fill="#92400e">117M params</text>
  <text x="160" y="372" text-anchor="middle" font-size="10" fill="#78350f">12 layers · d=768</text>
  <text x="160" y="386" text-anchor="middle" font-size="10" fill="#78350f">12 heads</text>
  <text x="160" y="400" text-anchor="middle" font-size="10" fill="#78350f">~5B token (BookCorpus)</text>

  <!-- GPT-2: 1.5B, area scale ≈ 13× → ~108×108 → use 110×110 -->
  <rect x="395" y="245" width="110" height="110" rx="4"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="450" y="380" text-anchor="middle" font-size="13" fill="#9d174d" font-weight="600">GPT-2 XL (2019)</text>
  <text x="450" y="397" text-anchor="middle" font-size="11" fill="#9d174d">1.5B params (~13× GPT-1)</text>
  <text x="450" y="412" text-anchor="middle" font-size="10" fill="#831843">48 layers · d=1600</text>
  <text x="450" y="426" text-anchor="middle" font-size="10" fill="#831843">25 heads</text>
  <text x="450" y="440" text-anchor="middle" font-size="10" fill="#831843">~40B token (WebText)</text>

  <!-- GPT-3: 175B, area scale ≈ 1500× → side ≈ √1500 ≈ 38.7× → ~260 wide -->
  <rect x="610" y="220" width="260" height="100" rx="4"
        fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="740" y="280" text-anchor="middle" font-size="22" fill="#5b21b6" font-weight="700">175B</text>
  <text x="740" y="340" text-anchor="middle" font-size="13" fill="#5b21b6" font-weight="600">GPT-3 (2020)</text>
  <text x="740" y="357" text-anchor="middle" font-size="11" fill="#5b21b6">175B params (~117× GPT-2)</text>
  <text x="740" y="372" text-anchor="middle" font-size="10" fill="#4c1d95">96 layers · d=12288</text>
  <text x="740" y="386" text-anchor="middle" font-size="10" fill="#4c1d95">96 heads · d_head=128</text>
  <text x="740" y="400" text-anchor="middle" font-size="10" fill="#4c1d95">~300B token (CC + Books + Wiki)</text>

  <!-- evolution arrows between rects -->
  <line x1="180" y1="305" x2="390" y2="300"
        stroke="#9d174d" stroke-width="2" marker-end="url(#arr-evo)"/>
  <line x1="510" y1="295" x2="605" y2="275"
        stroke="#9d174d" stroke-width="2" marker-end="url(#arr-evo)"/>

  <text x="285" y="290" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">×13</text>
  <text x="558" y="275" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">×117</text>

  <!-- area ratio caption -->
  <text x="450" y="468" text-anchor="middle" font-size="11" fill="#374151" font-style="italic">
    矩形面积按参数量比例绘制(1× / 13× / 1500×)— 视觉传达"不是线性放大,是数量级跨越"
  </text>

  <!-- ============ BOTTOM CALLOUT ============ -->
  <rect x="60" y="495" width="780" height="65" rx="6"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="80" y="518" font-size="12" fill="#991b1b" font-weight="600">
    关键观察 · 涌现不是连续放大
  </text>
  <text x="80" y="538" font-size="11" fill="#7f1d1d">
    GPT-1 → GPT-2 是 13× 参数 + 8× 数据,性能温和提升;GPT-2 → GPT-3 是 117× 参数 + 7.5× 数据,
  </text>
  <text x="80" y="553" font-size="11" fill="#7f1d1d">
    in-context learning、few-shot 算术、CoT 雏形等能力在 ~10B 后突然 work — 是某些任务的相变,不是平滑曲线的延长。
  </text>
</svg>
