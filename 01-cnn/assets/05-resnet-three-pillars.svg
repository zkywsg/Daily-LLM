<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="rs-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    ResNet 三件套协同 — Plain 退化曲线 + 缺一会怎样
  </text>

  <!-- ============== TOP: Plain vs ResNet 训练曲线 ============== -->
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">
    Plain vs ResNet — 深度与 CIFAR-10 训练误差(论文 Figure 1)
  </text>

  <!-- Chart -->
  <line x1="120" y1="280" x2="780" y2="280" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="120" y2="280" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Y axis -->
  <g font-size="9" fill="#6b7280">
    <text x="113" y="283" text-anchor="end">0%</text>
    <text x="113" y="231" text-anchor="end">5%</text>
    <text x="113" y="180" text-anchor="end">10%</text>
    <text x="113" y="128" text-anchor="end">15%</text>
    <text x="113" y="92" text-anchor="end">20%</text>
  </g>
  <text x="75" y="185" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="600" transform="rotate(-90 75 185)">训练误差</text>

  <!-- X axis -->
  <g font-size="9" fill="#6b7280">
    <text x="190" y="295" text-anchor="middle">20 层</text>
    <text x="380" y="295" text-anchor="middle">56 层</text>
    <text x="570" y="295" text-anchor="middle">110 层</text>
    <text x="750" y="295" text-anchor="middle">152 层</text>
  </g>
  <text x="450" y="318" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="600">网络深度</text>

  <!-- Gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="120" y1="231" x2="780" y2="231"/>
    <line x1="120" y1="180" x2="780" y2="180"/>
    <line x1="120" y1="128" x2="780" y2="128"/>
  </g>

  <!-- Plain network — 20 层 5%, 56 层 12%(退化!) -->
  <polyline points="190,231 380,128" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="190" cy="231" r="5" fill="#dc2626"/>
  <text x="190" y="222" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">5%</text>
  <circle cx="380" cy="128" r="6" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="380" y="118" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">12% ✗ 退化</text>
  <text x="280" y="170" font-size="10" fill="#dc2626" font-weight="700">Plain(无三件套)</text>

  <!-- ResNet — 20 层 4%, 56 层 3%, 110 层 2%, 152 层 1.5% -->
  <polyline points="190,242 380,253 570,260 750,265" fill="none" stroke="#059669" stroke-width="2.5"/>
  <circle cx="190" cy="242" r="5" fill="#059669"/>
  <text x="190" y="258" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">4%</text>
  <circle cx="380" cy="253" r="5" fill="#059669"/>
  <circle cx="570" cy="260" r="5" fill="#059669"/>
  <circle cx="750" cy="265" r="6" fill="#059669" stroke="#065f46" stroke-width="2"/>
  <text x="750" y="277" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">1.5% ★</text>
  <text x="600" y="240" font-size="10" fill="#059669" font-weight="700">ResNet(三件套)</text>

  <!-- Insight callout -->
  <text x="450" y="345" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">
    反直觉:Plain 56 层比 20 层训练误差更高 — 这就是"优化退化"
  </text>
  <text x="450" y="362" text-anchor="middle" font-size="10" fill="#1f2937" font-style="italic">
    解空间包含浅网解(多余层学恒等),但 SGD 找不到 — 三件套把"恒等映射"变成默认解
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="385" x2="860" y2="385" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: 三件套缺一 -->
  <text x="450" y="410" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,ResNet-152 都跑不起来
  </text>

  <g transform="translate(40, 430)">
    <rect x="0" y="0" width="265" height="180" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 Shortcut</text>
    <text x="15" y="46" font-size="10" fill="#991b1b">就是 plain 网络</text>
    <text x="15" y="64" font-size="10" fill="#991b1b">论文实证:</text>
    <text x="15" y="82" font-size="10" fill="#991b1b">56 层比 20 层差</text>
    <text x="15" y="100" font-size="10" fill="#991b1b">↓</text>
    <text x="15" y="120" font-size="10" fill="#991b1b">深度本身成为障碍</text>
    <text x="15" y="138" font-size="10" fill="#991b1b">梯度消失 / 退化</text>
    <text x="132" y="165" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 50 层就训不动</text>

    <rect x="285" y="0" width="265" height="180" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 BatchNorm</text>
    <text x="300" y="46" font-size="10" fill="#991b1b">有 shortcut + He init</text>
    <text x="300" y="64" font-size="10" fill="#991b1b">仍有内部协变量偏移</text>
    <text x="300" y="82" font-size="10" fill="#991b1b">↓</text>
    <text x="300" y="102" font-size="10" fill="#991b1b">每层激活分布漂移</text>
    <text x="300" y="120" font-size="10" fill="#991b1b">前几个 epoch 不稳</text>
    <text x="300" y="138" font-size="10" fill="#991b1b">需要极小 lr</text>
    <text x="417" y="165" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 152 层训不稳</text>

    <rect x="570" y="0" width="250" height="180" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 He 初始化</text>
    <text x="585" y="46" font-size="10" fill="#991b1b">用 Xavier 初始化</text>
    <text x="585" y="64" font-size="10" fill="#991b1b">ReLU 把负半轴砍掉</text>
    <text x="585" y="82" font-size="10" fill="#991b1b">↓</text>
    <text x="585" y="102" font-size="10" fill="#991b1b">每层方差减半累积</text>
    <text x="585" y="120" font-size="10" fill="#991b1b">前几个 step</text>
    <text x="585" y="138" font-size="10" fill="#991b1b">loss 直接 NaN</text>
    <text x="695" y="165" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 第一步就崩</text>
  </g>

  <rect x="60" y="625" width="780" height="30" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="645" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">
    三件套首次组合 → ResNet-152 从随机初始化直接稳训 / Top-5 3.57% 首次低于人类 / 定义之后 10 年视觉范式
  </text>
</svg>
