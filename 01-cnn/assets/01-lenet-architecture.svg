<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="ln-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    LeNet-5 主干 — Conv × Pool × FC,端到端反传
  </text>

  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    输入 32×32 灰度图 → 6 层主干 → 10 类输出,全网约 60K 参数
  </text>

  <!-- pipeline blocks -->
  <g transform="translate(20, 90)">
    <!-- Input -->
    <rect x="0" y="80" width="80" height="80" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="40" y="105" text-anchor="middle" font-size="10" fill="#92400e" font-weight="700">Input</text>
    <text x="40" y="125" text-anchor="middle" font-size="9" fill="#92400e">1@32×32</text>
    <text x="40" y="142" text-anchor="middle" font-size="9" fill="#92400e">灰度图</text>

    <line x1="80" y1="120" x2="100" y2="120" stroke="#9d174d" stroke-width="1.5" marker-end="url(#ln-arr)"/>

    <!-- C1: Conv -->
    <rect x="100" y="65" width="100" height="110" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="150" y="84" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="700">C1 Conv</text>
    <text x="150" y="100" text-anchor="middle" font-size="9" fill="#9d174d">5×5 / 6</text>
    <text x="150" y="118" text-anchor="middle" font-size="9" fill="#9d174d">tanh</text>
    <line x1="115" y1="128" x2="185" y2="128" stroke="#fce7f3" stroke-width="0.5"/>
    <text x="150" y="142" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="700">6@28×28</text>
    <text x="150" y="160" text-anchor="middle" font-size="9" fill="#dc2626">~156 参数</text>

    <line x1="200" y1="120" x2="220" y2="120" stroke="#9d174d" stroke-width="1.5" marker-end="url(#ln-arr)"/>

    <!-- S2: Pool -->
    <rect x="220" y="75" width="100" height="90" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="270" y="94" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">S2 AvgPool</text>
    <text x="270" y="110" text-anchor="middle" font-size="9" fill="#1e40af">2×2 / s=2</text>
    <line x1="235" y1="120" x2="305" y2="120" stroke="#dbeafe" stroke-width="0.5"/>
    <text x="270" y="135" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">6@14×14</text>
    <text x="270" y="153" text-anchor="middle" font-size="9" fill="#dc2626">分辨率 ÷2</text>

    <line x1="320" y1="120" x2="340" y2="120" stroke="#9d174d" stroke-width="1.5" marker-end="url(#ln-arr)"/>

    <!-- C3: Conv -->
    <rect x="340" y="65" width="100" height="110" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="390" y="84" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="700">C3 Conv</text>
    <text x="390" y="100" text-anchor="middle" font-size="9" fill="#9d174d">5×5 / 16</text>
    <text x="390" y="116" text-anchor="middle" font-size="8" fill="#9d174d">(部分连接)</text>
    <line x1="355" y1="124" x2="425" y2="124" stroke="#fce7f3" stroke-width="0.5"/>
    <text x="390" y="140" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="700">16@10×10</text>
    <text x="390" y="158" text-anchor="middle" font-size="9" fill="#dc2626">~1.5K 参数</text>

    <line x1="440" y1="120" x2="460" y2="120" stroke="#9d174d" stroke-width="1.5" marker-end="url(#ln-arr)"/>

    <!-- S4: Pool -->
    <rect x="460" y="75" width="100" height="90" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="510" y="94" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">S4 AvgPool</text>
    <text x="510" y="110" text-anchor="middle" font-size="9" fill="#1e40af">2×2 / s=2</text>
    <line x1="475" y1="120" x2="545" y2="120" stroke="#dbeafe" stroke-width="0.5"/>
    <text x="510" y="135" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">16@5×5</text>
    <text x="510" y="153" text-anchor="middle" font-size="9" fill="#dc2626">感受野 ↑</text>

    <line x1="560" y1="120" x2="580" y2="120" stroke="#9d174d" stroke-width="1.5" marker-end="url(#ln-arr)"/>

    <!-- C5: Conv to 1x1 -->
    <rect x="580" y="75" width="100" height="90" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="630" y="94" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="700">C5 Conv</text>
    <text x="630" y="110" text-anchor="middle" font-size="9" fill="#9d174d">5×5 / 120</text>
    <line x1="595" y1="120" x2="665" y2="120" stroke="#fce7f3" stroke-width="0.5"/>
    <text x="630" y="135" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="700">120@1×1</text>
    <text x="630" y="153" text-anchor="middle" font-size="9" fill="#dc2626">~48K 参数</text>

    <line x1="680" y1="120" x2="700" y2="120" stroke="#9d174d" stroke-width="1.5" marker-end="url(#ln-arr)"/>

    <!-- F6: FC -->
    <rect x="700" y="80" width="80" height="80" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="740" y="105" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="700">F6 FC</text>
    <text x="740" y="123" text-anchor="middle" font-size="9" fill="#5b21b6">84 + tanh</text>
    <text x="740" y="142" text-anchor="middle" font-size="9" fill="#dc2626">~10K 参数</text>

    <line x1="780" y1="120" x2="800" y2="120" stroke="#9d174d" stroke-width="1.5" marker-end="url(#ln-arr)"/>

    <!-- Output -->
    <rect x="800" y="90" width="60" height="60" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="830" y="113" text-anchor="middle" font-size="10" fill="#065f46" font-weight="700">Output</text>
    <text x="830" y="132" text-anchor="middle" font-size="9" fill="#065f46">10 类</text>
  </g>

  <!-- backprop arrow -->
  <path d="M 850 320 Q 450 380, 50 320" stroke="#7c3aed" stroke-width="3" fill="none" stroke-dasharray="5,3" marker-end="url(#ln-arr)"/>
  <text x="450" y="365" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="700">↺ 端到端反向传播 — 误差送回所有 Conv / Pool / FC 权重</text>

  <!-- DIVIDER -->
  <line x1="40" y1="395" x2="860" y2="395" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: three mechanisms callout -->
  <text x="450" y="420" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    每层对应哪个机制
  </text>

  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="265" height="135" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">机制一:卷积层</text>
    <text x="132" y="42" text-anchor="middle" font-size="10" fill="#9d174d">C1 / C3 / C5</text>
    <text x="15" y="65" font-size="10" fill="#9d174d">• 5×5 小滤波器扫整图</text>
    <text x="15" y="83" font-size="10" fill="#9d174d">• 权值共享 → 参数与图</text>
    <text x="15" y="98" font-size="10" fill="#9d174d">  尺寸解耦</text>
    <text x="132" y="125" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">编码局部+共享先验</text>

    <rect x="285" y="0" width="265" height="135" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">机制二:降采样池化</text>
    <text x="417" y="42" text-anchor="middle" font-size="10" fill="#1e40af">S2 / S4</text>
    <text x="300" y="65" font-size="10" fill="#1e40af">• AvgPool 2×2 stride 2</text>
    <text x="300" y="83" font-size="10" fill="#1e40af">• 分辨率 ÷2,感受野 ×2</text>
    <text x="417" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">编码平移不变先验</text>

    <rect x="570" y="0" width="250" height="135" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="700">机制三:FC + 反传</text>
    <text x="695" y="42" text-anchor="middle" font-size="10" fill="#5b21b6">F6 → Output</text>
    <text x="585" y="65" font-size="10" fill="#5b21b6">• 把空间特征 collapse</text>
    <text x="585" y="83" font-size="10" fill="#5b21b6">• 反传送误差回所有层</text>
    <text x="695" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">端到端可微</text>
  </g>
</svg>
