<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="inc-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Inception Block — 4 分支并行 + 1×1 瓶颈降维
  </text>

  <!-- Input -->
  <rect x="380" y="60" width="140" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="78" text-anchor="middle" font-size="12" fill="#92400e">Input</text>
  <text x="450" y="93" text-anchor="middle" font-size="11" fill="#92400e">[B, C_in=192, H, W]</text>

  <!-- 4 branches diverge -->
  <g stroke="#9d174d" stroke-width="1.5" fill="none">
    <line x1="450" y1="100" x2="120" y2="135" marker-end="url(#inc-arr)"/>
    <line x1="450" y1="100" x2="320" y2="135" marker-end="url(#inc-arr)"/>
    <line x1="450" y1="100" x2="540" y2="135" marker-end="url(#inc-arr)"/>
    <line x1="450" y1="100" x2="780" y2="135" marker-end="url(#inc-arr)"/>
  </g>

  <!-- Branch 1: pure 1×1 -->
  <rect x="60" y="140" width="160" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="140" y="161" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">1×1 conv / 64</text>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#9d174d">看通道关系</text>
  <text x="140" y="220" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">分支 1</text>

  <!-- Branch 2: 1×1 → 3×3 -->
  <rect x="240" y="140" width="160" height="50" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="320" y="161" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="600">1×1 conv / 96</text>
  <text x="320" y="180" text-anchor="middle" font-size="10" fill="#9a3412" font-style="italic">瓶颈降维(192→96)</text>

  <line x1="320" y1="190" x2="320" y2="208" stroke="#9d174d" stroke-width="1.5" marker-end="url(#inc-arr)"/>

  <rect x="240" y="215" width="160" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="320" y="236" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">3×3 conv / 128</text>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="#9d174d">看小邻域</text>
  <text x="320" y="290" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">分支 2</text>

  <!-- Branch 3: 1×1 → 5×5 -->
  <rect x="460" y="140" width="160" height="50" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="540" y="161" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="600">1×1 conv / 16</text>
  <text x="540" y="180" text-anchor="middle" font-size="10" fill="#9a3412" font-style="italic">瓶颈降维(192→16)</text>

  <line x1="540" y1="190" x2="540" y2="208" stroke="#9d174d" stroke-width="1.5" marker-end="url(#inc-arr)"/>

  <rect x="460" y="215" width="160" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="540" y="236" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">5×5 conv / 32</text>
  <text x="540" y="255" text-anchor="middle" font-size="11" fill="#9d174d">看更大邻域</text>
  <text x="540" y="290" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">分支 3</text>

  <!-- Branch 4: MaxPool → 1×1 -->
  <rect x="680" y="140" width="160" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="161" text-anchor="middle" font-size="12" fill="#065f46" font-weight="600">3×3 MaxPool / s=1</text>
  <text x="760" y="180" text-anchor="middle" font-size="11" fill="#065f46">位置不变性</text>

  <line x1="760" y1="190" x2="760" y2="208" stroke="#9d174d" stroke-width="1.5" marker-end="url(#inc-arr)"/>

  <rect x="680" y="215" width="160" height="50" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="760" y="236" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="600">1×1 conv / 32</text>
  <text x="760" y="255" text-anchor="middle" font-size="10" fill="#9a3412" font-style="italic">pool 后压通道</text>
  <text x="760" y="290" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">分支 4</text>

  <!-- 4 branches merge to concat -->
  <g stroke="#9d174d" stroke-width="1.5" fill="none">
    <line x1="140" y1="200" x2="420" y2="335" marker-end="url(#inc-arr)"/>
    <line x1="320" y1="275" x2="430" y2="335" marker-end="url(#inc-arr)"/>
    <line x1="540" y1="275" x2="470" y2="335" marker-end="url(#inc-arr)"/>
    <line x1="760" y1="275" x2="480" y2="335" marker-end="url(#inc-arr)"/>
  </g>

  <!-- Concat -->
  <rect x="350" y="340" width="200" height="50" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" font-size="13" fill="#5b21b6" font-weight="600">Concat 通道维</text>
  <text x="450" y="380" text-anchor="middle" font-size="11" fill="#5b21b6">[B, 64+128+32+32=256, H, W]</text>

  <!-- Divider -->
  <line x1="40" y1="425" x2="860" y2="425" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: 参数对比 -->
  <text x="450" y="455" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">
    瓶颈降维的关键 — 把 5×5 计算从 192 通道压到 16 通道
  </text>

  <!-- without bottleneck -->
  <rect x="70" y="475" width="370" height="105" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="255" y="497" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">朴素方式(无瓶颈)</text>
  <text x="85" y="520" font-size="11" fill="#991b1b">5×5 conv 直接在 192 通道输入上算 → 32 通道</text>
  <text x="85" y="540" font-family="ui-monospace, monospace" font-size="12" fill="#991b1b">params = 5 × 5 × 192 × 32 = 153,600</text>
  <text x="85" y="565" font-size="11" fill="#dc2626" font-weight="600">→ 约 0.15M / 单分支</text>

  <!-- with bottleneck -->
  <rect x="460" y="475" width="370" height="105" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="645" y="497" text-anchor="middle" font-size="12" fill="#065f46" font-weight="600">Inception(1×1 瓶颈)</text>
  <text x="475" y="520" font-size="11" fill="#065f46">先 1×1(192→16),再 5×5(16→32)</text>
  <text x="475" y="540" font-family="ui-monospace, monospace" font-size="12" fill="#065f46">1×1: 192×16 = 3,072 + 5×5: 5×5×16×32 = 12,800</text>
  <text x="475" y="565" font-size="11" fill="#059669" font-weight="600">→ 共 15,872 ≈ 1/10 的参数</text>

  <!-- bottom callout -->
  <rect x="60" y="605" width="780" height="40" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="630" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    "先压再算"的 bottleneck 后来被 ResNet bottleneck / MobileNet / Transformer FFN 反复借用
  </text>
</svg>
