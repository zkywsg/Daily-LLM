<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="dn-o-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    DenseNet-121 整网 + 三模型参数效率对比
  </text>

  <!-- ============== TOP: Overall pipeline ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    Stem + 4 Dense block(6/12/24/16 层)+ transition + GAP + FC
  </text>

  <!-- Input -->
  <rect x="40" y="85" width="70" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="75" y="102" text-anchor="middle" font-size="11" fill="#92400e">Input</text>
  <text x="75" y="118" text-anchor="middle" font-size="10" fill="#92400e">224²×3</text>

  <!-- Stem -->
  <rect x="125" y="85" width="80" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="165" y="103" text-anchor="middle" font-size="11" fill="#065f46">Stem</text>
  <text x="165" y="118" text-anchor="middle" font-size="10" fill="#065f46">7×7 + pool</text>

  <!-- DB1 -->
  <rect x="220" y="85" width="100" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="270" y="102" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">Dense Block 1</text>
  <text x="270" y="118" text-anchor="middle" font-size="10" fill="#9d174d">6 层, k=32</text>

  <!-- T1 -->
  <rect x="335" y="95" width="40" height="20" rx="2" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="355" y="109" text-anchor="middle" font-size="9" fill="#5b21b6">trans</text>

  <!-- DB2 -->
  <rect x="385" y="85" width="100" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="435" y="102" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">Dense Block 2</text>
  <text x="435" y="118" text-anchor="middle" font-size="10" fill="#9d174d">12 层, k=32</text>

  <!-- T2 -->
  <rect x="500" y="95" width="40" height="20" rx="2" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="520" y="109" text-anchor="middle" font-size="9" fill="#5b21b6">trans</text>

  <!-- DB3 -->
  <rect x="550" y="85" width="100" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="600" y="102" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">Dense Block 3</text>
  <text x="600" y="118" text-anchor="middle" font-size="10" fill="#9d174d">24 层, k=32</text>

  <!-- T3 -->
  <rect x="665" y="95" width="40" height="20" rx="2" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="685" y="109" text-anchor="middle" font-size="9" fill="#5b21b6">trans</text>

  <!-- DB4 -->
  <rect x="715" y="85" width="100" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="765" y="102" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">Dense Block 4</text>
  <text x="765" y="118" text-anchor="middle" font-size="10" fill="#9d174d">16 层, k=32</text>

  <!-- arrows -->
  <g stroke="#9d174d" stroke-width="1.2" fill="none">
    <line x1="110" y1="105" x2="123" y2="105" marker-end="url(#dn-o-arr)"/>
    <line x1="205" y1="105" x2="218" y2="105" marker-end="url(#dn-o-arr)"/>
    <line x1="320" y1="105" x2="333" y2="105" marker-end="url(#dn-o-arr)"/>
    <line x1="375" y1="105" x2="383" y2="105" marker-end="url(#dn-o-arr)"/>
    <line x1="485" y1="105" x2="498" y2="105" marker-end="url(#dn-o-arr)"/>
    <line x1="540" y1="105" x2="548" y2="105" marker-end="url(#dn-o-arr)"/>
    <line x1="650" y1="105" x2="663" y2="105" marker-end="url(#dn-o-arr)"/>
    <line x1="705" y1="105" x2="713" y2="105" marker-end="url(#dn-o-arr)"/>
  </g>

  <!-- GAP + FC + softmax -->
  <text x="450" y="155" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="600">
    ↓ Global Avg Pool → 1024-d → FC → Softmax 1000 classes
  </text>

  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    transition = 1×1 conv(通道减半 θ=0.5)+ 2×2 AvgPool(空间减半)
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="215" x2="860" y2="215" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: scatter plot - params vs error ============== -->
  <text x="450" y="245" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="600">
    参数量 vs Top-5 错误率 — DenseNet 全程位于 ResNet 左下方(更少参数 + 更低错误)
  </text>

  <!-- chart area: x 100-820, y 285-540 -->
  <!-- axes -->
  <line x1="120" y1="540" x2="820" y2="540" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="120" y1="285" x2="120" y2="540" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis labels - error rate 4.5-7% -->
  <g font-size="10" fill="#6b7280">
    <text x="113" y="544" text-anchor="end">7.0%</text>
    <text x="113" y="503" text-anchor="end">6.5</text>
    <text x="113" y="462" text-anchor="end">6.0</text>
    <text x="113" y="421" text-anchor="end">5.5</text>
    <text x="113" y="380" text-anchor="end">5.0</text>
    <text x="113" y="339" text-anchor="end">4.5</text>
  </g>
  <text x="50" y="412" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600" transform="rotate(-90 50 412)">Top-5 Error (%)</text>

  <!-- x axis labels - params 5-65M -->
  <g font-size="10" fill="#6b7280">
    <text x="167" y="555" text-anchor="middle">5M</text>
    <text x="296" y="555" text-anchor="middle">15M</text>
    <text x="425" y="555" text-anchor="middle">25M</text>
    <text x="554" y="555" text-anchor="middle">35M</text>
    <text x="683" y="555" text-anchor="middle">45M</text>
    <text x="812" y="555" text-anchor="middle">60M</text>
  </g>
  <text x="450" y="585" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">Parameters</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="120" y1="503" x2="820" y2="503"/>
    <line x1="120" y1="462" x2="820" y2="462"/>
    <line x1="120" y1="421" x2="820" y2="421"/>
    <line x1="120" y1="380" x2="820" y2="380"/>
    <line x1="120" y1="339" x2="820" y2="339"/>
  </g>

  <!-- ResNet curve - 25.6M @ 6.7%, 60M @ 5.6% -->
  <!-- x: 25.6M = 120 + (25.6-5)/55*700 = 120 + 262 = 382 -->
  <!-- y: 6.7 = 540 - (7-6.7)/2.5*255 = 540 - 31 = 509 -->
  <!-- x: 60M = 120 + 55/55*700 = 820? actually scale 5-60M wider -->
  <!-- Let me recompute: range 5-60M, span 55M, plotwidth 700, so 1M = 12.7px -->
  <!-- ResNet-50: 25.6M → 120 + (25.6-5)*12.7 = 120 + 262 = 382, error 6.7 → 540 - (7-6.7)/2.5*255 = 509 -->
  <!-- ResNet-152: 60M → 120 + 55*12.7 = 820, error 5.6 → 540 - (7-5.6)/2.5*255 = 540-143 = 397 -->
  <path d="M 382 509 L 820 397" stroke="#dc2626" stroke-width="2" fill="none"/>

  <circle cx="382" cy="509" r="6" fill="#dc2626"/>
  <text x="395" y="513" font-size="10" fill="#dc2626" font-weight="600">ResNet-50 (25.6M, 6.7%)</text>

  <circle cx="820" cy="397" r="6" fill="#dc2626"/>
  <text x="810" y="392" text-anchor="end" font-size="10" fill="#dc2626" font-weight="600">ResNet-152 (60M, 5.6%)</text>

  <!-- DenseNet curve -->
  <!-- DenseNet-121: 7M → 120 + 2*12.7 = 145, error 6.1 → 540 - 0.9/2.5*255 = 448 -->
  <!-- DenseNet-169: 14.1M → 120 + 9.1*12.7 = 236, error 5.5 → 540 - 1.5/2.5*255 = 387 -->
  <!-- DenseNet-201: 20M → 120 + 15*12.7 = 311, error 5.2 → 540 - 1.8/2.5*255 = 356 -->
  <!-- DenseNet-264: 33.3M → 120 + 28.3*12.7 = 479, error 5.0 → 540 - 2/2.5*255 = 336 -->
  <path d="M 145 448 L 236 387 L 311 356 L 479 336" stroke="#059669" stroke-width="2.5" fill="none"/>

  <circle cx="145" cy="448" r="6" fill="#059669"/>
  <text x="158" y="452" font-size="10" fill="#059669" font-weight="600">DenseNet-121 (7M, 6.1%)</text>

  <circle cx="236" cy="387" r="6" fill="#059669"/>
  <text x="249" y="391" font-size="10" fill="#059669">DenseNet-169 (14M, 5.5%)</text>

  <circle cx="311" cy="356" r="6" fill="#059669"/>
  <text x="324" y="360" font-size="10" fill="#059669" font-weight="600">DenseNet-201 (20M, 5.2%)</text>

  <circle cx="479" cy="336" r="6" fill="#059669"/>
  <text x="492" y="340" font-size="10" fill="#059669">DenseNet-264 (33M, 5.0%)</text>

  <!-- callout arrow comparing DenseNet-201 to ResNet-152 -->
  <line x1="320" y1="356" x2="800" y2="397" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="560" y="370" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="600">DenseNet-201 用 1/3 参数达到 ResNet-152 同档精度</text>

  <!-- legend -->
  <g transform="translate(620, 290)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#dc2626" stroke-width="2"/>
    <circle cx="11" cy="0" r="5" fill="#dc2626"/>
    <text x="30" y="4" font-size="11" fill="#1f2937">ResNet</text>

    <line x1="0" y1="20" x2="22" y2="20" stroke="#059669" stroke-width="2.5"/>
    <circle cx="11" cy="20" r="5" fill="#059669"/>
    <text x="30" y="24" font-size="11" fill="#1f2937">DenseNet</text>
  </g>

  <!-- bottom callout -->
  <rect x="60" y="595" width="780" height="40" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="619" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    CVPR 2017 Best Paper — 但工业部署仍用 ResNet,因为 DenseNet 训练显存大、推理 memory bandwidth 高
  </text>
</svg>
