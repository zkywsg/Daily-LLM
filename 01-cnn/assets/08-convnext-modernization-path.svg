<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    ResNet-50 → ConvNeXt 现代化路径 — 8 步累积精度提升
  </text>

  <!-- Chart: x = steps, y = Top-1 accuracy 75-82.5 -->
  <!-- chart area: x 100-820, y 90-440 -->
  <line x1="100" y1="440" x2="820" y2="440" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="100" y1="90" x2="100" y2="440" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis labels Top-1 % -->
  <g font-size="10" fill="#6b7280">
    <text x="93" y="444" text-anchor="end">76%</text>
    <text x="93" y="389" text-anchor="end">77</text>
    <text x="93" y="334" text-anchor="end">78</text>
    <text x="93" y="279" text-anchor="end">79</text>
    <text x="93" y="224" text-anchor="end">80</text>
    <text x="93" y="169" text-anchor="end">81</text>
    <text x="93" y="114" text-anchor="end">82</text>
  </g>
  <text x="48" y="265" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600" transform="rotate(-90 48 265)">ImageNet Top-1</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="100" y1="389" x2="820" y2="389"/>
    <line x1="100" y1="334" x2="820" y2="334"/>
    <line x1="100" y1="279" x2="820" y2="279"/>
    <line x1="100" y1="224" x2="820" y2="224"/>
    <line x1="100" y1="169" x2="820" y2="169"/>
    <line x1="100" y1="114" x2="820" y2="114"/>
  </g>

  <!-- Waterfall bars: step 0 → 8 -->
  <!-- y mapping: 76 → 440, 82.5 → 82.5 area; each 1% = 55px -->
  <!-- 76.1 → 434.5; 78.8 → 286; 79.4 → 253; 79.5 → 247.5; 80.5 → 192.5; 80.6 → 187; 81.3 → 148.5; 82.0 → 110; 82.1 actual 82.0 -->
  <!-- bar widths: each step 80px -->

  <!-- step 0 baseline ResNet-50 76.1% -->
  <rect x="120" y="434" width="60" height="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="150" y="430" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">76.1</text>
  <text x="150" y="455" text-anchor="middle" font-size="10" fill="#6b7280">ResNet-50</text>
  <text x="150" y="468" text-anchor="middle" font-size="10" fill="#6b7280">baseline</text>

  <!-- step 1 training recipe +2.7 → 78.8 (max single gain!) -->
  <rect x="200" y="286" width="60" height="148" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="280" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">78.8</text>
  <text x="240" y="365" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="700">+2.7 ★</text>
  <text x="230" y="455" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">训练 recipe</text>
  <text x="230" y="468" text-anchor="middle" font-size="9" fill="#6b7280">AdamW+300ep</text>

  <!-- step 2 stage ratio +0.6 → 79.4 -->
  <rect x="280" y="253" width="60" height="33" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="310" y="247" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">79.4</text>
  <text x="310" y="275" text-anchor="middle" font-size="10" fill="#dc2626">+0.6</text>
  <text x="310" y="455" text-anchor="middle" font-size="10" fill="#6b7280">stage 比例</text>
  <text x="310" y="468" text-anchor="middle" font-size="9" fill="#6b7280">(3,3,9,3)</text>

  <!-- step 3 patchify stem +0.1 → 79.5 -->
  <rect x="360" y="247" width="60" height="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="390" y="241" text-anchor="middle" font-size="11" fill="#9d174d">79.5</text>
  <text x="390" y="263" text-anchor="middle" font-size="10" fill="#dc2626">+0.1</text>
  <text x="390" y="455" text-anchor="middle" font-size="10" fill="#6b7280">patchify</text>
  <text x="390" y="468" text-anchor="middle" font-size="9" fill="#6b7280">4×4 stem</text>

  <!-- step 4 depthwise +1.0 → 80.5 -->
  <rect x="440" y="192" width="60" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="470" y="186" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">80.5</text>
  <text x="470" y="225" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="700">+1.0</text>
  <text x="470" y="455" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">depthwise</text>
  <text x="470" y="468" text-anchor="middle" font-size="9" fill="#6b7280">conv</text>

  <!-- step 5 inverted bottleneck +0.1 → 80.6 -->
  <rect x="520" y="186" width="60" height="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="550" y="180" text-anchor="middle" font-size="11" fill="#9d174d">80.6</text>
  <text x="550" y="202" text-anchor="middle" font-size="10" fill="#dc2626">+0.1</text>
  <text x="550" y="455" text-anchor="middle" font-size="10" fill="#6b7280">inverted</text>
  <text x="550" y="468" text-anchor="middle" font-size="9" fill="#6b7280">bottleneck</text>

  <!-- step 6 large kernel 7×7 +0.7 → 81.3 -->
  <rect x="600" y="148" width="60" height="38" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="630" y="142" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="600">81.3</text>
  <text x="630" y="172" text-anchor="middle" font-size="10" fill="#9a3412">+0.7</text>
  <text x="630" y="455" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="600">7×7 kernel</text>
  <text x="630" y="468" text-anchor="middle" font-size="9" fill="#6b7280">depthwise</text>

  <!-- step 7 norm/act minimal +0.7 → 82.0 -->
  <rect x="680" y="110" width="60" height="38" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="710" y="104" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="600">82.0</text>
  <text x="710" y="135" text-anchor="middle" font-size="10" fill="#9a3412">+0.7</text>
  <text x="710" y="455" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="600">LN+GELU</text>
  <text x="710" y="468" text-anchor="middle" font-size="9" fill="#6b7280">少 norm/act</text>

  <!-- step 8 sep downsample +0.5 (but already at 82.0 in path, use 82.1 final) -->
  <rect x="760" y="105" width="60" height="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="790" y="99" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">82.1 ★</text>
  <text x="790" y="125" text-anchor="middle" font-size="10" fill="#065f46">+0.5</text>
  <text x="790" y="455" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600">独立</text>
  <text x="790" y="468" text-anchor="middle" font-size="9" fill="#065f46">downsample</text>

  <!-- Connecting line through tops -->
  <path d="M 150 434 L 230 286 L 310 253 L 390 247 L 470 192 L 550 186 L 630 148 L 710 110 L 790 105"
        stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,2" fill="none" opacity="0.6"/>

  <!-- Annotations -->
  <text x="450" y="60" text-anchor="middle" font-size="11" fill="#dc2626" font-style="italic">
    ★ 标记的两步 — 训练 recipe(+2.7)和 depthwise(+1.0)— 单步收益最大
  </text>

  <!-- Bottom: source annotations -->
  <line x1="100" y1="490" x2="820" y2="490" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="450" y="515" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    每一步对应的来源
  </text>

  <g font-size="11" fill="#1f2937">
    <text x="100" y="545">① 训练 recipe → ViT/Swin/DeiT(AdamW + Mixup + CutMix + 300 ep + stochastic depth)</text>
    <text x="100" y="565">② stage 比例 → Swin(3,3,9,3)、③ patchify stem → ViT(不重叠 patch)、④ depthwise → ResNeXt</text>
    <text x="100" y="585">⑤ inverted bottleneck → MobileNet v2 / Transformer FFN(4× hidden)、⑥ 7×7 → Swin window=7</text>
    <text x="100" y="605">⑦ 减少 norm/act + GELU + LN → Transformer block 极简风格、⑧ 独立 downsample → Swin patch merging</text>
  </g>

  <rect x="60" y="625" width="780" height="28" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="645" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    训练 recipe 单步占总改造 ~45% — ViT 的胜利大半在训练 recipe 不在算子
  </text>
</svg>
