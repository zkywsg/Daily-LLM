<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    EfficientNet B0-B7 模型族 — 帕累托线全程压制 ResNet
  </text>

  <!-- Main scatter plot -->
  <!-- chart area: x 100-820, y 70-490 -->
  <!-- axes -->
  <line x1="120" y1="490" x2="820" y2="490" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="120" y1="70" x2="120" y2="490" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis: Top-1 accuracy 75-85% -->
  <g font-size="10" fill="#6b7280">
    <text x="113" y="494" text-anchor="end">75%</text>
    <text x="113" y="452" text-anchor="end">76</text>
    <text x="113" y="410" it-anchor="end" text-anchor="end">77</text>
    <text x="113" y="368" text-anchor="end">78</text>
    <text x="113" y="326" text-anchor="end">79</text>
    <text x="113" y="284" text-anchor="end">80</text>
    <text x="113" y="242" text-anchor="end">81</text>
    <text x="113" y="200" text-anchor="end">82</text>
    <text x="113" y="158" text-anchor="end">83</text>
    <text x="113" y="116" text-anchor="end">84</text>
    <text x="113" y="74" text-anchor="end">85</text>
  </g>
  <text x="55" y="280" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600" transform="rotate(-90 55 280)">ImageNet Top-1 Accuracy</text>

  <!-- x axis: parameters log scale 5M to 600M -->
  <!-- log10(5)=0.7, log10(600)=2.78, span 2.08, plotwidth 700 -->
  <!-- 5M → 120, 10M → 120 + (1-0.7)/2.08*700 = 120 + 101 = 221, 30M → 120 + (1.477-0.7)/2.08*700 = 120 + 262 = 382 -->
  <!-- 100M → 120 + (2-0.7)/2.08*700 = 120 + 437 = 557, 300M → 120 + (2.477-0.7)/2.08*700 = 120 + 598 = 718, 600M → 820 -->
  <g font-size="10" fill="#6b7280">
    <text x="120" y="504" text-anchor="middle">5M</text>
    <text x="221" y="504" text-anchor="middle">10M</text>
    <text x="382" y="504" text-anchor="middle">30M</text>
    <text x="557" y="504" text-anchor="middle">100M</text>
    <text x="718" y="504" text-anchor="middle">300M</text>
    <text x="820" y="504" text-anchor="middle">600M</text>
  </g>
  <text x="470" y="525" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">Parameters(log scale)</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="120" y1="452" x2="820" y2="452"/>
    <line x1="120" y1="410" x2="820" y2="410"/>
    <line x1="120" y1="368" x2="820" y2="368"/>
    <line x1="120" y1="326" x2="820" y2="326"/>
    <line x1="120" y1="284" x2="820" y2="284"/>
    <line x1="120" y1="242" x2="820" y2="242"/>
    <line x1="120" y1="200" x2="820" y2="200"/>
    <line x1="120" y1="158" x2="820" y2="158"/>
    <line x1="120" y1="116" x2="820" y2="116"/>
  </g>

  <!-- ResNet/competitor points (red) -->
  <!-- ResNet-50: 25.6M, 76.0% → x=120+(log10(25.6)-0.7)/2.08*700 = 120+241 = 361, y=490-(76-75)/10*420 = 448 -->
  <circle cx="361" cy="448" r="6" fill="#dc2626"/>
  <text x="370" y="462" font-size="10" fill="#dc2626">ResNet-50 (25.6M, 76.0%)</text>

  <!-- ResNet-152: 60M, 78.3% → x=120+(log10(60)-0.7)/2.08*700 = 120+349 = 469, y=490-(78.3-75)/10*420 = 351 -->
  <circle cx="469" cy="351" r="6" fill="#dc2626"/>
  <text x="478" y="365" font-size="10" fill="#dc2626">ResNet-152 (60M, 78.3%)</text>

  <!-- ResNeXt-101 (64x4d): 84M, 80.9% → x=120+(log10(84)-0.7)/2.08*700 = 120+393 = 513, y=490-(80.9-75)/10*420 = 242 -->
  <circle cx="513" cy="242" r="6" fill="#dc2626"/>
  <text x="522" y="246" font-size="10" fill="#dc2626">ResNeXt-101 (84M, 80.9%)</text>

  <!-- GPipe: 557M, 84.3% → x=120+(log10(557)-0.7)/2.08*700 = 120+604 = 724, y=490-(84.3-75)/10*420 = 100 -->
  <circle cx="724" cy="100" r="6" fill="#dc2626"/>
  <text x="710" y="93" text-anchor="end" font-size="10" fill="#dc2626" font-weight="600">GPipe (557M, 84.3%)</text>

  <!-- connect ResNet line -->
  <path d="M 361 448 L 469 351 L 513 242" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- EfficientNet B0-B7 (green) -->
  <!-- B0: 5.3M, 77.1% → x=120+(log10(5.3)-0.7)/2.08*700 = 120+11 = 131, y=490-(77.1-75)/10*420 = 402 -->
  <!-- B1: 7.8M, 79.1% → x=120+(log10(7.8)-0.7)/2.08*700 = 120+125 = 245... wait recalculate -->
  <!-- log10(7.8)=0.892, (0.892-0.7)/2.08*700 = 64.6 → 184.6 -->
  <!-- B1: 7.8M, 79.1% → x=185, y=490-(79.1-75)/10*420 = 318 -->
  <!-- B2: 9.2M, 80.1% → log10(9.2)=0.964, x=120+89=209, y=490-(80.1-75)/10*420 = 276 -->
  <!-- B3: 12M, 81.6% → log10(12)=1.079, x=120+128=248, y=490-(81.6-75)/10*420 = 213 -->
  <!-- B4: 19M, 82.9% → log10(19)=1.279, x=120+195=315, y=490-(82.9-75)/10*420 = 158 -->
  <!-- B5: 30M, 83.6% → log10(30)=1.477, x=120+262=382, y=490-(83.6-75)/10*420 = 129 -->
  <!-- B6: 43M, 84.0% → log10(43)=1.633, x=120+314=434, y=490-(84.0-75)/10*420 = 112 -->
  <!-- B7: 66M, 84.3% → log10(66)=1.82, x=120+377=497, y=490-(84.3-75)/10*420 = 100 -->

  <path d="M 131 402 L 185 318 L 209 276 L 248 213 L 315 158 L 382 129 L 434 112 L 497 100"
        stroke="#059669" stroke-width="3" fill="none"/>

  <g fill="#059669">
    <circle cx="131" cy="402" r="6"/>
    <circle cx="185" cy="318" r="6"/>
    <circle cx="209" cy="276" r="6"/>
    <circle cx="248" cy="213" r="6"/>
    <circle cx="315" cy="158" r="6"/>
    <circle cx="382" cy="129" r="6"/>
    <circle cx="434" cy="112" r="6"/>
    <circle cx="497" cy="100" r="7"/>
  </g>

  <!-- B0, B7 labels -->
  <text x="138" y="395" font-size="10" fill="#059669" font-weight="600">B0 (5.3M, 77.1%)</text>
  <text x="190" y="313" font-size="10" fill="#059669">B1</text>
  <text x="218" y="270" font-size="10" fill="#059669">B2</text>
  <text x="254" y="207" font-size="10" fill="#059669">B3 (12M, 81.6%)</text>
  <text x="320" y="155" font-size="10" fill="#059669">B4</text>
  <text x="387" y="125" font-size="10" fill="#059669">B5 (30M, 83.6%)</text>
  <text x="439" y="108" font-size="10" fill="#059669">B6</text>
  <text x="505" y="95" font-size="11" fill="#059669" font-weight="700">B7 (66M, 84.3%) ★</text>

  <!-- callout: B7 vs GPipe -->
  <path d="M 510 100 Q 600 90, 700 100" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <text x="608" y="85" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="600">B7 用 GPipe 1/8.4 参数同精度</text>

  <!-- legend -->
  <g transform="translate(600, 350)">
    <rect x="-10" y="-25" width="220" height="80" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" rx="4"/>

    <line x1="0" y1="-5" x2="22" y2="-5" stroke="#dc2626" stroke-width="2"/>
    <circle cx="11" cy="-5" r="5" fill="#dc2626"/>
    <text x="30" y="-2" font-size="11" fill="#1f2937">ResNet 系列</text>

    <line x1="0" y1="20" x2="22" y2="20" stroke="#059669" stroke-width="3"/>
    <circle cx="11" cy="20" r="5" fill="#059669"/>
    <text x="30" y="23" font-size="11" fill="#1f2937">EfficientNet B0-B7</text>

    <text x="105" y="44" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">2019 ImageNet 帕累托线</text>
  </g>

  <!-- bottom callout -->
  <rect x="60" y="555" width="780" height="80" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="580" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    EfficientNet 帕累托线主导 2019-2021,直到 ConvNeXt 用现代训练 recipe 超越
  </text>
  <g font-size="11" fill="#fef3c7">
    <text x="80" y="605">• 正则随规模线性涨:B0 dropout=0.2 → B7=0.5,stochastic depth 同 schedule(B7 关掉掉 1%)</text>
    <text x="80" y="625">• FLOPs 便宜不等于 wall-clock 快 — depthwise conv 在 GPU 上只快 1.5-2× 而非 FLOPs 暗示的 8-9×</text>
  </g>
</svg>
