<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="lv-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    LoRA vs Adapter vs Prefix — 工业部署三维对比
  </text>

  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    参数 / 推理延迟 / 部署灵活度 — LoRA 三维全胜
  </text>

  <!-- ============== 3-column comparison ============== -->
  <!-- col 1: Adapter -->
  <text x="170" y="85" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="700">
    Adapter(2019)
  </text>
  <rect x="40" y="100" width="260" height="200" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>

  <text x="170" y="125" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="600">参数:0.9M / 任务(0.9%)</text>
  <text x="170" y="150" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="600">推理延迟:+5-10%(无法合并)</text>
  <text x="170" y="175" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="600">部署:每次 forward 多算 adapter</text>

  <text x="170" y="210" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">⚠ 非线性 ReLU 不能合并回 W₀</text>

  <rect x="60" y="225" width="220" height="60" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="170" y="245" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#92400e">x → W_up(ReLU(W_down x))</text>
  <text x="170" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#92400e">→ 残差加回</text>
  <text x="170" y="278" text-anchor="middle" font-size="9" fill="#dc2626">非线性 → 无法合并</text>

  <!-- col 2: Prefix -->
  <text x="450" y="85" text-anchor="middle" font-size="13" fill="#5b21b6" font-weight="700">
    Prefix Tuning(2021)
  </text>
  <rect x="320" y="100" width="260" height="200" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>

  <text x="450" y="125" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="600">参数:0.24M / 任务(0.07%)</text>
  <text x="450" y="150" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="600">推理延迟:seq +m → O((n+m)²)</text>
  <text x="450" y="175" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="600">部署:attention 每次多 m 个位置</text>

  <text x="450" y="210" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">⚠ K/V 拼 prefix → 序列变长</text>

  <rect x="340" y="225" width="220" height="60" rx="4" fill="#fce7f3" stroke="#db2777"/>
  <text x="450" y="245" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#9d174d">K = [P_K, k_1..k_n]</text>
  <text x="450" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#9d174d">V = [P_V, v_1..v_n]</text>
  <text x="450" y="278" text-anchor="middle" font-size="9" fill="#dc2626">长序列代价倍增</text>

  <!-- col 3: LoRA -->
  <text x="730" y="85" text-anchor="middle" font-size="13" fill="#059669" font-weight="700">
    LoRA(2021)★
  </text>
  <rect x="600" y="100" width="260" height="200" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>

  <text x="730" y="125" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600">参数:4.5M / 任务(0.06%)</text>
  <text x="730" y="150" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600">推理延迟:0(合并到 W₀)</text>
  <text x="730" y="175" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600">部署:跟全参微调一样快</text>

  <text x="730" y="210" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">★ 纯线性可合并 → 零延迟</text>

  <rect x="620" y="225" width="220" height="60" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="730" y="245" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1e40af">h = W₀x + BAx</text>
  <text x="730" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1e40af">→ W = W₀ + BA</text>
  <text x="730" y="278" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">部署后零开销</text>

  <!-- DIVIDER -->
  <line x1="40" y1="320" x2="860" y2="320" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- GPT-3 175B performance -->
  <text x="450" y="345" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    GPT-3 175B 上对比(WikiSQL Acc)
  </text>

  <g transform="translate(60, 365)">
    <text x="0" y="20" font-size="10" fill="#1f2937">GPT-3 Full FT(175B)</text>
    <rect x="180" y="10" width="296" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="483" y="21" font-size="10" fill="#9a3412">73.8</text>

    <text x="0" y="42" font-size="10" fill="#1f2937">Adapter(41M)</text>
    <rect x="180" y="32" width="289" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="476" y="43" font-size="10" fill="#9a3412">72.3</text>

    <text x="0" y="64" font-size="10" fill="#1f2937">Prefix Tuning(35M)</text>
    <rect x="180" y="54" width="287" height="14" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="474" y="65" font-size="10" fill="#5b21b6">71.7</text>

    <text x="0" y="86" font-size="10" fill="#1f2937" font-weight="700">LoRA r=4(4.7M ★)</text>
    <rect x="180" y="76" width="294" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="481" y="87" font-size="10" fill="#059669" font-weight="700">73.4</text>

    <text x="0" y="108" font-size="10" fill="#1f2937" font-weight="700">LoRA r=8(9.4M ★★)</text>
    <rect x="180" y="98" width="296" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="483" y="109" font-size="10" fill="#059669" font-weight="700">74.0 反超 Full!</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="495" x2="860" y2="495" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: 三件套缺一 -->
  <text x="450" y="520" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,LoRA 都失去优势
  </text>

  <g transform="translate(40, 540)">
    <rect x="0" y="0" width="265" height="105" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 低秩分解</text>
    <text x="15" y="44" font-size="10" fill="#991b1b">满秩 ΔW(d×d)</text>
    <text x="15" y="62" font-size="10" fill="#991b1b">参数 = 全参微调</text>
    <text x="132" y="92" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 不省存储</text>

    <rect x="285" y="0" width="265" height="105" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 零初始化</text>
    <text x="300" y="44" font-size="10" fill="#991b1b">BA 训练开始就随机扰动</text>
    <text x="300" y="62" font-size="10" fill="#991b1b">小数据下训练不稳</text>
    <text x="417" y="92" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 需要复杂 warmup</text>

    <rect x="570" y="0" width="250" height="105" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 推理合并</text>
    <text x="585" y="44" font-size="10" fill="#991b1b">如果 ΔW 有非线性</text>
    <text x="585" y="62" font-size="10" fill="#991b1b">合不回 W₀ → 退回 Adapter</text>
    <text x="695" y="92" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 失去零延迟优势</text>
  </g>
</svg>
