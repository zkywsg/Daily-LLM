<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="qs-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    QLoRA 显存账 — fp16 LoRA 150GB → QLoRA 41GB(LLaMA-65B)
  </text>

  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    单卡 A6000-48GB 就能跑 65B,LLM 微调从机构级降到个人级
  </text>

  <!-- LEFT: fp16 LoRA stack -->
  <text x="225" y="85" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">
    fp16 LoRA(150GB)
  </text>

  <rect x="100" y="100" width="250" height="370" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>

  <!-- base 130GB -->
  <rect x="100" y="100" width="250" height="280" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="225" y="135" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">Base model(fp16)</text>
  <text x="225" y="155" text-anchor="middle" font-size="11" fill="#991b1b">130 GB</text>
  <text x="225" y="220" text-anchor="middle" font-size="22" fill="#991b1b" font-weight="700">130 GB</text>
  <text x="225" y="250" text-anchor="middle" font-size="11" fill="#991b1b">87% of 总显存</text>

  <!-- LoRA 60MB (very thin) -->
  <rect x="100" y="380" width="250" height="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="370" y="383" font-size="9" fill="#92400e">LoRA 60MB</text>

  <!-- Optimizer 15GB -->
  <rect x="100" y="383" width="250" height="55" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="225" y="402" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="700">AdamW Optimizer 15 GB</text>
  <text x="225" y="420" text-anchor="middle" font-size="10" fill="#5b21b6">Adam m, v 状态(fp32)</text>

  <!-- Activation 5GB -->
  <rect x="100" y="438" width="250" height="32" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="225" y="458" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="700">Activation 5 GB</text>

  <!-- total -->
  <text x="225" y="495" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">总:150 GB</text>
  <text x="225" y="515" text-anchor="middle" font-size="10" fill="#dc2626">需要 2× A100-80GB(机构级)</text>

  <!-- ARROW between -->
  <line x1="370" y1="285" x2="430" y2="285" stroke="#7c3aed" stroke-width="3" marker-end="url(#qs-arr)"/>
  <text x="400" y="275" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">3 机制</text>
  <text x="400" y="300" text-anchor="middle" font-size="9" fill="#7c3aed">NF4 + DQ + Paged</text>

  <!-- RIGHT: QLoRA stack -->
  <text x="675" y="85" text-anchor="middle" font-size="13" fill="#059669" font-weight="700">
    QLoRA(41GB)★
  </text>

  <rect x="550" y="280" width="250" height="190" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>

  <!-- base 33GB (NF4 + DQ) -->
  <rect x="550" y="280" width="250" height="100" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="675" y="305" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">Base(NF4 + DQ)</text>
  <text x="675" y="345" text-anchor="middle" font-size="18" fill="#065f46" font-weight="700">33 GB</text>
  <text x="675" y="365" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">★ 机制一 + 机制二</text>

  <!-- LoRA 60MB -->
  <rect x="550" y="380" width="250" height="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="820" y="383" font-size="9" fill="#92400e">LoRA 60MB</text>

  <!-- Optimizer 3GB (paged) -->
  <rect x="550" y="383" width="250" height="20" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="675" y="397" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="700">AdamW paged 3 GB ★ 机制三</text>

  <!-- Optimizer CPU (paged out) -->
  <rect x="550" y="410" width="250" height="25" fill="#e5e7eb" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="675" y="427" text-anchor="middle" font-size="10" fill="#374151" font-style="italic">12 GB → paged 到 CPU 内存</text>

  <!-- Activation 5GB -->
  <rect x="550" y="438" width="250" height="32" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="675" y="458" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="700">Activation 5 GB</text>

  <!-- total -->
  <text x="675" y="495" text-anchor="middle" font-size="13" fill="#059669" font-weight="700">总:41 GB(GPU)</text>
  <text x="675" y="515" text-anchor="middle" font-size="10" fill="#059669">单卡 A6000-48GB ★(个人可得)</text>

  <!-- DIVIDER -->
  <line x1="40" y1="540" x2="860" y2="540" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: 三机制对应 -->
  <text x="450" y="565" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三机制分别砍掉哪一块?
  </text>

  <g transform="translate(40, 585)">
    <text x="0" y="20" font-size="10" fill="#1f2937">
      <tspan fill="#059669" font-weight="700">★ 机制一 NF4</tspan>:base 130 GB → 33 GB(4 倍压缩,精度损失可控)
    </text>
    <text x="0" y="40" font-size="10" fill="#1f2937">
      <tspan fill="#9d174d" font-weight="700">★ 机制二 DQ</tspan>:scale factor 自身再量化,base 再省 ~3 GB
    </text>
    <text x="0" y="60" font-size="10" fill="#1f2937">
      <tspan fill="#7c3aed" font-weight="700">★ 机制三 Paged</tspan>:Optimizer 15 GB → 3 GB(其余 12 GB 在 CPU 内存待命)
    </text>
  </g>
</svg>
