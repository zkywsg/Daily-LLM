<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="17"
        fill="#1f2937" font-weight="700">
    Test-Time Compute Scaling · 推理算力是新 scaling 轴
  </text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#6b7280">
    固定模型,thinking tokens 翻倍 → 准确率持续上升 (log-log)
  </text>

  <!-- ============== 主图: log-log 准确率 vs thinking tokens ============== -->
  <!-- 坐标区域 plot: x ∈ [90, 580], y ∈ [90, 470] -->
  <!-- Y axis -->
  <line x1="90" y1="90" x2="90" y2="470"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <!-- X axis -->
  <line x1="90" y1="470" x2="600" y2="470"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <!-- X axis ticks: log scale 10^2, 10^3, 10^4, 10^5 (4 ticks) -->
  <g font-size="10" fill="#374151" text-anchor="middle">
    <line x1="160" y1="470" x2="160" y2="475" stroke="#374151"/>
    <text x="160" y="488">10²</text>
    <line x1="280" y1="470" x2="280" y2="475" stroke="#374151"/>
    <text x="280" y="488">10³</text>
    <line x1="400" y1="470" x2="400" y2="475" stroke="#374151"/>
    <text x="400" y="488">10⁴</text>
    <line x1="520" y1="470" x2="520" y2="475" stroke="#374151"/>
    <text x="520" y="488">10⁵</text>
  </g>
  <text x="345" y="510" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">
    thinking tokens / query  (log scale)
  </text>

  <!-- Y axis ticks: 0, 25, 50, 75, 100 -->
  <g font-size="10" fill="#374151" text-anchor="end">
    <line x1="85" y1="470" x2="90" y2="470" stroke="#374151"/>
    <text x="80" y="474">0</text>
    <line x1="85" y1="375" x2="90" y2="375" stroke="#374151"/>
    <text x="80" y="379">25</text>
    <line x1="85" y1="280" x2="90" y2="280" stroke="#374151"/>
    <text x="80" y="284">50</text>
    <line x1="85" y1="185" x2="90" y2="185" stroke="#374151"/>
    <text x="80" y="189">75</text>
    <line x1="85" y1="90" x2="90" y2="90" stroke="#374151"/>
    <text x="80" y="94">100</text>
  </g>
  <text x="35" y="280" text-anchor="middle" font-size="12" fill="#374151" font-weight="600"
        transform="rotate(-90 35 280)">
    准确率 (%)
  </text>

  <!-- 网格 (浅色) -->
  <g stroke="#e5e7eb" stroke-width="0.6" stroke-dasharray="2,3">
    <line x1="90" y1="375" x2="600" y2="375"/>
    <line x1="90" y1="280" x2="600" y2="280"/>
    <line x1="90" y1="185" x2="600" y2="185"/>
    <line x1="160" y1="90" x2="160" y2="470"/>
    <line x1="280" y1="90" x2="280" y2="470"/>
    <line x1="400" y1="90" x2="400" y2="470"/>
    <line x1="520" y1="90" x2="520" y2="470"/>
  </g>

  <!-- 三条曲线 (近似 log-linear 上升直线) -->
  <!-- AIME: 10²→10%, 10³→40%, 10⁴→70%, 10⁵→83% -->
  <!-- y_pixel = 470 - acc*3.8;  10% → 432, 40% → 318, 70% → 204, 83% → 154 -->
  <polyline points="160,432 280,318 400,204 520,154"
            fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <g fill="#dc2626">
    <circle cx="160" cy="432" r="4"/>
    <circle cx="280" cy="318" r="4"/>
    <circle cx="400" cy="204" r="4"/>
    <circle cx="520" cy="154" r="4"/>
  </g>
  <text x="528" y="150" font-size="11" fill="#dc2626" font-weight="600">AIME</text>

  <!-- Codeforces (percentile): 10²→20%, 10³→55%, 10⁴→78%, 10⁵→89% -->
  <!-- 20%→394, 55%→261, 78%→174, 89%→132 -->
  <polyline points="160,394 280,261 400,174 520,132"
            fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <g fill="#2563eb">
    <circle cx="160" cy="394" r="4"/>
    <circle cx="280" cy="261" r="4"/>
    <circle cx="400" cy="174" r="4"/>
    <circle cx="520" cy="132" r="4"/>
  </g>
  <text x="528" y="128" font-size="11" fill="#2563eb" font-weight="600">Codeforces</text>

  <!-- GPQA: 10²→35%, 10³→55%, 10⁴→70%, 10⁵→77% -->
  <!-- 35%→337, 55%→261, 70%→204, 77%→177 -->
  <polyline points="160,337 280,261 400,204 520,177"
            fill="none" stroke="#059669" stroke-width="2.5"/>
  <g fill="#059669">
    <circle cx="160" cy="337" r="4"/>
    <circle cx="280" cy="261" r="4"/>
    <circle cx="400" cy="204" r="4"/>
    <circle cx="520" cy="177" r="4"/>
  </g>
  <text x="528" y="173" font-size="11" fill="#059669" font-weight="600">GPQA</text>

  <!-- 标题 in plot -->
  <text x="345" y="78" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    o1: 同一模型,推理算力翻倍 → 准确率持续涨
  </text>

  <!-- 直线斜率注解 -->
  <text x="380" y="245" font-size="10" fill="#6b7280" font-style="italic">
    斜率 = test-time scaling exponent
  </text>
  <text x="380" y="259" font-size="10" fill="#6b7280" font-style="italic">
    (新 scaling 法则)
  </text>

  <!-- ============== 右侧 callout: 训练 scaling vs 推理 scaling ============== -->
  <rect x="630" y="90" width="250" height="200" rx="8"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="755" y="112" text-anchor="middle" font-size="12"
        fill="#92400e" font-weight="700">
    新旧 scaling 维度对比
  </text>

  <text x="645" y="135" font-size="11" fill="#92400e" font-weight="600">
    传统 (Kaplan / Chinchilla):
  </text>
  <text x="645" y="152" font-size="10" fill="#92400e">
    • 训练算力 ↑ → 模型容量 ↑
  </text>
  <text x="645" y="167" font-size="10" fill="#92400e">
    • 一次成本,固化在权重里
  </text>
  <text x="645" y="182" font-size="10" fill="#92400e">
    • Loss ∝ C_train^(-α)
  </text>

  <line x1="645" y1="195" x2="865" y2="195"
        stroke="#d97706" stroke-width="0.8" stroke-dasharray="3,3"/>

  <text x="645" y="215" font-size="11" fill="#92400e" font-weight="600">
    o1 新轴 (test-time):
  </text>
  <text x="645" y="232" font-size="10" fill="#92400e">
    • 推理算力 ↑ → thinking ↑
  </text>
  <text x="645" y="247" font-size="10" fill="#92400e">
    • 按 query 付费,可调节
  </text>
  <text x="645" y="262" font-size="10" fill="#92400e">
    • Acc ∝ log(C_inference)
  </text>
  <text x="645" y="280" font-size="10" fill="#9d174d" font-style="italic" font-weight="600">
    → 算力可从训练挪到推理
  </text>

  <!-- ============== 右侧第二块: 商业含义 ============== -->
  <rect x="630" y="310" width="250" height="160" rx="8"
        fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="755" y="332" text-anchor="middle" font-size="12"
        fill="#1e40af" font-weight="700">
    推理算力分层定价
  </text>

  <g font-size="10" fill="#1e3a8a">
    <text x="645" y="354">GPT-4o:</text>
    <text x="870" y="354" text-anchor="end" font-weight="600">$0.02 / query</text>

    <text x="645" y="375">o1-preview:</text>
    <text x="870" y="375" text-anchor="end" font-weight="600">$0.50 / query</text>

    <text x="645" y="396">o1:</text>
    <text x="870" y="396" text-anchor="end" font-weight="600">$1-5 / query</text>

    <text x="645" y="417">o1-pro:</text>
    <text x="870" y="417" text-anchor="end" font-weight="600">$200 / 月</text>

    <text x="645" y="438">o3 (企业):</text>
    <text x="870" y="438" text-anchor="end" font-weight="600">~$1000 / query</text>
  </g>
  <text x="755" y="460" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">
    分层 100× 价差,按需选算力
  </text>

  <!-- ============== 底部 callout ============== -->
  <rect x="40" y="540" width="820" height="65" rx="8"
        fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="450" y="562" text-anchor="middle" font-size="13"
        fill="#075985" font-weight="700">
    o1 之后,LLM 算力分配多了一个维度可调
  </text>
  <text x="450" y="582" text-anchor="middle" font-size="11" fill="#075985">
    训练完一个 base 后,再花 100× 推理算力可把简单任务模型推到专家水平 — 比从头训更大模型便宜得多
  </text>
  <text x="450" y="599" text-anchor="middle" font-size="11" fill="#075985">
    "想得更久" 取代 "模型更大",成为 2024+ LLM 能力提升的主路径
  </text>
</svg>
