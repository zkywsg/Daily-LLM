<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="cot-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    CoT 是涌现能力 — 在 ~100B 参数后才显著有效
  </text>

  <!-- ============== MAIN CHART (left ~600px) ============== -->
  <!-- Chart area: x 60-560, y 80-440 -->
  <!-- Axes -->
  <line x1="80" y1="420" x2="580" y2="420" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="420" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Y axis labels (accuracy %) -->
  <text x="70" y="425" text-anchor="end" font-size="11" fill="#6b7280">0</text>
  <text x="70" y="345" text-anchor="end" font-size="11" fill="#6b7280">20</text>
  <text x="70" y="265" text-anchor="end" font-size="11" fill="#6b7280">40</text>
  <text x="70" y="185" text-anchor="end" font-size="11" fill="#6b7280">60</text>
  <text x="70" y="105" text-anchor="end" font-size="11" fill="#6b7280">80</text>
  <text x="40" y="250" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600" transform="rotate(-90 40 250)">GSM8K Accuracy (%)</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="80" y1="345" x2="580" y2="345"/>
    <line x1="80" y1="265" x2="580" y2="265"/>
    <line x1="80" y1="185" x2="580" y2="185"/>
    <line x1="80" y1="105" x2="580" y2="105"/>
  </g>

  <!-- X axis labels (log scale: 0.1B, 1B, 10B, 100B, 540B) -->
  <!-- positions: 0.1B=120, 1B=220, 10B=340, 100B=480, 540B=560 -->
  <g font-size="11" fill="#6b7280">
    <text x="120" y="438" text-anchor="middle">0.1B</text>
    <text x="220" y="438" text-anchor="middle">1B</text>
    <text x="340" y="438" text-anchor="middle">10B</text>
    <text x="480" y="438" text-anchor="middle">100B</text>
    <text x="560" y="438" text-anchor="middle">540B</text>
  </g>
  <text x="330" y="460" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">模型参数(log scale)</text>

  <!-- Standard prompting curve (gray, gently rising) -->
  <!-- pts: (120, 410) (220, 400) (340, 390) (480, 380) (560, 370) -->
  <path d="M 120 410 Q 220 405, 340 392 Q 440 385, 560 370"
        stroke="#9ca3af" stroke-width="2.5" fill="none"/>
  <!-- dots on standard -->
  <g fill="#9ca3af">
    <circle cx="120" cy="410" r="4"/>
    <circle cx="220" cy="402" r="4"/>
    <circle cx="340" cy="390" r="4"/>
    <circle cx="480" cy="380" r="4"/>
    <circle cx="560" cy="370" r="4"/>
  </g>

  <!-- CoT prompting curve (pink, dip then steep rise) -->
  <!-- < 10B: at or below standard, then steep climb past 100B -->
  <!-- pts: (120, 416) (220, 411) (340, 388) (480, 200) (560, 120) -->
  <path d="M 120 416 Q 220 415, 340 388 C 420 360, 440 260, 480 200 Q 530 150, 560 120"
        stroke="#db2777" stroke-width="2.8" fill="none"/>
  <g fill="#db2777">
    <circle cx="120" cy="416" r="4"/>
    <circle cx="220" cy="411" r="4"/>
    <circle cx="340" cy="388" r="4"/>
    <circle cx="480" cy="200" r="4"/>
    <circle cx="560" cy="120" r="4"/>
  </g>

  <!-- crossover annotation -->
  <circle cx="345" cy="389" r="9" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="345" y1="378" x2="345" y2="335" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="345" y="330" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">CoT 在此涌现</text>
  <text x="345" y="316" text-anchor="middle" font-size="10" fill="#dc2626">~10-60B 参数交叉</text>

  <!-- Legend -->
  <g transform="translate(100, 100)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#9ca3af" stroke-width="2.5"/>
    <circle cx="11" cy="0" r="4" fill="#9ca3af"/>
    <text x="30" y="4" font-size="12" fill="#1f2937">Standard prompting</text>

    <line x1="0" y1="22" x2="22" y2="22" stroke="#db2777" stroke-width="2.8"/>
    <circle cx="11" cy="22" r="4" fill="#db2777"/>
    <text x="30" y="26" font-size="12" fill="#1f2937">Chain-of-Thought prompting</text>
  </g>

  <!-- Side note for small-model regression -->
  <text x="220" y="395" font-size="10" fill="#dc2626" font-style="italic" text-anchor="start">小模型 CoT 反而更差</text>

  <!-- ============== RIGHT PANEL: task list ============== -->
  <text x="730" y="100" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    最受益于 CoT 的任务
  </text>

  <rect x="610" y="115" width="240" height="200" rx="6"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <g font-size="12" fill="#92400e">
    <text x="625" y="140">• Arithmetic(GSM8K +39)</text>
    <text x="625" y="165">• Symbolic reasoning</text>
    <text x="625" y="190">• Logical reasoning</text>
    <text x="625" y="215">• Multi-hop QA</text>
    <text x="625" y="240">• Commonsense reasoning</text>
    <text x="625" y="265">• Date understanding(+34)</text>
    <text x="625" y="290">• Algebra word problems</text>
  </g>

  <text x="730" y="335" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">
    共同点:需要多步分解
  </text>

  <!-- ============== BOTTOM CALLOUT ============== -->
  <rect x="60" y="490" width="780" height="120" rx="6"
        fill="#1f2937" stroke="none"/>
  <text x="450" y="515" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    Emergent Abilities 最被引用的例子
  </text>
  <g font-size="12" fill="#fef3c7">
    <text x="80" y="545">• &lt; 10B 模型 CoT 反而拖后腿 — 小模型生成的推理过程经常出错,错误传染到最终答案</text>
    <text x="80" y="568">• 60B+ 模型 CoT 显著超越,540B 上 GSM8K 从 18% → 57%(+39)</text>
    <text x="80" y="591">• 这一发现直接催生 self-consistency / least-to-most / tree-of-thought / o1 一整条 reasoning 路线</text>
  </g>
</svg>
