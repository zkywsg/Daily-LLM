<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="17"
        fill="#1f2937" font-weight="700">
    Standard Prompting  vs.  Chain-of-Thought Prompting
  </text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#6b7280">
    同一个模型(PaLM 540B)、同一道题、只改 prompt 格式
  </text>

  <!-- ============== LEFT: Standard Prompting ============== -->
  <rect x="30" y="80" width="400" height="450" rx="10"
        fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="230" y="108" text-anchor="middle" font-size="15"
        fill="#991b1b" font-weight="600">Standard Prompting</text>
  <text x="230" y="126" text-anchor="middle" font-size="11" fill="#991b1b">
    few-shot:仅给 (Q, A),不展示思路
  </text>

  <!-- Example block -->
  <rect x="50" y="148" width="360" height="100" rx="6"
        fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="62" y="168" font-size="11" fill="#6b7280">范例(few-shot):</text>
  <text x="62" y="188" font-size="12" fill="#1f2937">Q: 食堂有 23 个苹果,用掉 20 个,</text>
  <text x="62" y="204" font-size="12" fill="#1f2937">     又买了 6 个,现在有多少个?</text>
  <text x="62" y="226" font-size="12" fill="#1f2937" font-weight="600">A: 9</text>

  <!-- Test question -->
  <rect x="50" y="268" width="360" height="116" rx="6"
        fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="62" y="288" font-size="11" fill="#6b7280">测试题:</text>
  <text x="62" y="308" font-size="12" fill="#1f2937">Q: 罗杰有 5 个网球。他买了 2 罐,</text>
  <text x="62" y="324" font-size="12" fill="#1f2937">     每罐 3 个。他现在共有多少?</text>
  <text x="62" y="348" font-size="12" fill="#1f2937" font-weight="600">A: </text>
  <text x="82" y="348" font-size="12" fill="#9ca3af" font-style="italic">（让模型续写）</text>

  <!-- Arrow down -->
  <line x1="230" y1="395" x2="230" y2="425" stroke="#dc2626"
        stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Model output -->
  <rect x="50" y="432" width="360" height="64" rx="6"
        fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="62" y="452" font-size="11" fill="#991b1b">模型直接输出:</text>
  <text x="62" y="474" font-size="14" fill="#991b1b" font-weight="700">A: 27</text>
  <text x="380" y="474" text-anchor="end" font-size="22" fill="#dc2626" font-weight="700">✗</text>

  <text x="230" y="516" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">
    一步内完成多步乘加,超出 Transformer 单 forward 能力
  </text>

  <!-- ============== RIGHT: Chain-of-Thought ============== -->
  <rect x="470" y="80" width="400" height="450" rx="10"
        fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="670" y="108" text-anchor="middle" font-size="15"
        fill="#065f46" font-weight="600">Chain-of-Thought Prompting</text>
  <text x="670" y="126" text-anchor="middle" font-size="11" fill="#065f46">
    few-shot:给 (Q, 推理步骤, A),展示思路
  </text>

  <!-- Example block -->
  <rect x="490" y="148" width="360" height="100" rx="6"
        fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="502" y="168" font-size="11" fill="#6b7280">范例(few-shot):</text>
  <text x="502" y="188" font-size="12" fill="#1f2937">Q: 食堂有 23 个苹果,用掉 20 个,</text>
  <text x="502" y="204" font-size="12" fill="#1f2937">     又买了 6 个,现在有多少个?</text>
  <text x="502" y="224" font-size="12" fill="#047857">A: 原有 23,用掉 20 剩 3。又买 6,</text>
  <text x="502" y="240" font-size="12" fill="#047857" font-weight="600">     3 + 6 = 9。答案是 9。</text>

  <!-- Test question -->
  <rect x="490" y="268" width="360" height="116" rx="6"
        fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="502" y="288" font-size="11" fill="#6b7280">测试题(同一道):</text>
  <text x="502" y="308" font-size="12" fill="#1f2937">Q: 罗杰有 5 个网球。他买了 2 罐,</text>
  <text x="502" y="324" font-size="12" fill="#1f2937">     每罐 3 个。他现在共有多少?</text>
  <text x="502" y="348" font-size="12" fill="#1f2937" font-weight="600">A: </text>
  <text x="522" y="348" font-size="12" fill="#9ca3af" font-style="italic">（让模型续写）</text>

  <!-- Arrow down -->
  <line x1="670" y1="395" x2="670" y2="425" stroke="#059669"
        stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Model output -->
  <rect x="490" y="432" width="360" height="64" rx="6"
        fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="502" y="452" font-size="11" fill="#065f46">模型自然 mimic 范例格式:</text>
  <text x="502" y="472" font-size="12" fill="#065f46">A: 罗杰原有 5。2 罐 × 3 = 6 个新的。</text>
  <text x="502" y="488" font-size="13" fill="#065f46" font-weight="700">     5 + 6 = 11。答案是 11。</text>
  <text x="822" y="476" text-anchor="end" font-size="22" fill="#059669" font-weight="700">✓</text>

  <text x="670" y="516" text-anchor="middle" font-size="11" fill="#065f46" font-style="italic">
    中间步骤进入 context,后续 token 在其基础上继续算
  </text>

  <!-- ============== BOTTOM: GSM8K bar chart ============== -->
  <text x="450" y="566" text-anchor="middle" font-size="14"
        fill="#1f2937" font-weight="600">
    GSM8K 准确率(PaLM 540B,论文 Table 1)
  </text>

  <!-- Chart frame -->
  <line x1="180" y1="650" x2="720" y2="650" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="180" y1="590" x2="180" y2="650" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- Y axis ticks -->
  <text x="172" y="654" text-anchor="end" font-size="10" fill="#6b7280">0%</text>
  <text x="172" y="624" text-anchor="end" font-size="10" fill="#6b7280">30%</text>
  <text x="172" y="594" text-anchor="end" font-size="10" fill="#6b7280">60%</text>
  <line x1="178" y1="620" x2="182" y2="620" stroke="#9ca3af"/>
  <line x1="178" y1="590" x2="182" y2="590" stroke="#9ca3af"/>

  <!-- Bar 1: Standard 17.9% -->
  <rect x="260" y="614" width="120" height="36" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="608" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="700">17.9%</text>
  <text x="320" y="668" text-anchor="middle" font-size="11" fill="#991b1b">Standard</text>

  <!-- Bar 2: CoT 56.9% -->
  <rect x="500" y="536" width="120" height="114" fill="#6ee7b7" stroke="#059669" stroke-width="1.5"/>
  <text x="560" y="530" text-anchor="middle" font-size="13" fill="#065f46" font-weight="700">56.9%</text>
  <text x="560" y="668" text-anchor="middle" font-size="11" fill="#065f46">Chain-of-Thought</text>

  <!-- Delta callout -->
  <text x="730" y="595" font-size="13" fill="#1f2937" font-weight="700">+39 个点</text>
  <text x="730" y="612" font-size="11" fill="#6b7280">同模型 / 同 API</text>
  <text x="730" y="626" font-size="11" fill="#6b7280">只改 prompt 格式</text>
  <text x="730" y="640" font-size="11" fill="#6b7280">几乎"免费"的提升</text>
</svg>
