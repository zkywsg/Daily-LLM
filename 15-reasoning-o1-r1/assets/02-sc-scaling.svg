<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="sl-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Self-Consistency — Test-time compute 第一条 scaling 曲线
  </text>

  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    准确率对数线性 ∝ log(N) — 直接启发 o1 / R1 把 "采样多路径" 训练化
  </text>

  <!-- ============== SCALING CURVE ============== -->
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">
    GSM8K 准确率 vs 采样次数 N(PaLM 540B)
  </text>

  <!-- chart axes -->
  <line x1="100" y1="340" x2="490" y2="340" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="100" y2="340" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis labels -->
  <g font-size="9" fill="#6b7280">
    <text x="93" y="343" text-anchor="end">50%</text>
    <text x="93" y="293" text-anchor="end">60%</text>
    <text x="93" y="243" text-anchor="end">70%</text>
    <text x="93" y="193" text-anchor="end">80%</text>
    <text x="93" y="143" text-anchor="end">90%</text>
  </g>
  <text x="55" y="225" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="600" transform="rotate(-90 55 225)">准确率</text>

  <!-- x axis labels (log scale) -->
  <g font-size="9" fill="#6b7280">
    <text x="110" y="355" text-anchor="middle">1</text>
    <text x="200" y="355" text-anchor="middle">5</text>
    <text x="270" y="355" text-anchor="middle">10</text>
    <text x="360" y="355" text-anchor="middle">20</text>
    <text x="450" y="355" text-anchor="middle">40</text>
  </g>
  <text x="295" y="378" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="600">N(采样次数,log scale)</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="100" y1="293" x2="490" y2="293"/>
    <line x1="100" y1="243" x2="490" y2="243"/>
    <line x1="100" y1="193" x2="490" y2="193"/>
    <line x1="100" y1="143" x2="490" y2="143"/>
  </g>

  <!-- CoT single baseline horizontal -->
  <line x1="100" y1="308" x2="490" y2="308" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="500" y="312" font-size="10" fill="#dc2626" font-weight="600">CoT 单次 56.5%</text>

  <!-- data points: N=1 56.5%, N=5 65.4, N=10 70.0, N=20 72.5, N=40 74.4 -->
  <!-- mapping: y = 340 - (acc - 50) * 5 ; x positions per labels -->
  <polyline points="110,313 200,267 270,240 360,228 450,218" fill="none" stroke="#059669" stroke-width="2.5"/>

  <circle cx="110" cy="313" r="5" fill="#059669"/>
  <text x="110" y="305" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">56.5</text>

  <circle cx="200" cy="267" r="5" fill="#059669"/>
  <text x="200" y="259" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">65.4</text>

  <circle cx="270" cy="240" r="5" fill="#059669"/>
  <text x="270" y="232" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">70.0</text>

  <circle cx="360" cy="228" r="5" fill="#059669"/>
  <text x="360" y="220" text-anchor="middle" font-size="9" fill="#059669" font-weight="700">72.5</text>

  <circle cx="450" cy="218" r="6" fill="#059669" stroke="#065f46" stroke-width="2"/>
  <text x="450" y="207" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">74.4 ★</text>

  <!-- annotation: log-linear growth -->
  <text x="295" y="120" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">对数线性增长 — 新 scaling 轴</text>

  <!-- ============== RIGHT: benchmark table ============== -->
  <text x="690" y="80" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">
    多个 reasoning benchmark 的提升
  </text>

  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="320" height="245" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Header -->
    <text x="15" y="22" font-size="10" fill="#1f2937" font-weight="700">Benchmark(PaLM 540B)</text>
    <text x="180" y="22" font-size="10" fill="#1f2937" font-weight="700">CoT</text>
    <text x="220" y="22" font-size="10" fill="#1f2937" font-weight="700">SC@40</text>
    <text x="280" y="22" font-size="10" fill="#1f2937" font-weight="700">Δ</text>
    <line x1="10" y1="30" x2="310" y2="30" stroke="#9ca3af" stroke-width="1"/>

    <!-- GSM8K -->
    <text x="15" y="52" font-size="10" fill="#1f2937">GSM8K</text>
    <text x="180" y="52" font-size="10" fill="#dc2626">56.5</text>
    <text x="220" y="52" font-size="10" fill="#059669" font-weight="700">74.4</text>
    <text x="280" y="52" font-size="10" fill="#7c3aed" font-weight="700">+17.9</text>

    <!-- AQuA-RAT -->
    <text x="15" y="78" font-size="10" fill="#1f2937">AQuA-RAT</text>
    <text x="180" y="78" font-size="10" fill="#dc2626">35.8</text>
    <text x="220" y="78" font-size="10" fill="#059669" font-weight="700">48.3</text>
    <text x="280" y="78" font-size="10" fill="#7c3aed" font-weight="700">+12.5</text>

    <!-- MultiArith -->
    <text x="15" y="104" font-size="10" fill="#1f2937">MultiArith</text>
    <text x="180" y="104" font-size="10" fill="#dc2626">92.4</text>
    <text x="220" y="104" font-size="10" fill="#059669" font-weight="700">99.3</text>
    <text x="280" y="104" font-size="10" fill="#7c3aed" font-weight="700">+6.9</text>

    <!-- StrategyQA -->
    <text x="15" y="130" font-size="10" fill="#1f2937">StrategyQA</text>
    <text x="180" y="130" font-size="10" fill="#dc2626">75.3</text>
    <text x="220" y="130" font-size="10" fill="#059669" font-weight="700">81.6</text>
    <text x="280" y="130" font-size="10" fill="#7c3aed" font-weight="700">+6.3</text>

    <!-- Cost callout -->
    <rect x="10" y="150" width="300" height="85" rx="4" fill="#1f2937" stroke="none"/>
    <text x="160" y="172" text-anchor="middle" font-size="11" fill="#fbbf24" font-weight="700">代价 / 收益</text>
    <text x="20" y="192" font-size="10" fill="#fef3c7">• 算力开销线性:40 次贵 40×</text>
    <text x="20" y="208" font-size="10" fill="#fef3c7">• 准确率提升对数</text>
    <text x="20" y="226" font-size="10" fill="#fbbf24" font-weight="700">→ 不可无限 scale,催生 o1 路线</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="400" x2="860" y2="400" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 三件套缺一 -->
  <text x="450" y="425" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,Self-Consistency 都崩
  </text>

  <g transform="translate(40, 445)">
    <rect x="0" y="0" width="265" height="135" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 Temperature</text>
    <text x="15" y="48" font-size="10" fill="#991b1b">N 次跑出多路径,但答案</text>
    <text x="15" y="68" font-size="10" fill="#991b1b">"196" / "196 升" / "the answer</text>
    <text x="15" y="88" font-size="10" fill="#991b1b">is 196" 各算各的</text>
    <text x="15" y="108" font-size="10" fill="#991b1b">→ 投票分裂</text>
    <text x="132" y="128" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">准确率不升反降</text>

    <rect x="285" y="0" width="265" height="135" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 Normalization</text>
    <text x="300" y="48" font-size="10" fill="#991b1b">T=0 贪婪解码 N 次</text>
    <text x="300" y="68" font-size="10" fill="#991b1b">全是同一条路径同一答案</text>
    <text x="300" y="88" font-size="10" fill="#991b1b">归一化后投票 N 票同一</text>
    <text x="300" y="108" font-size="10" fill="#991b1b">→ 等于 CoT 单次</text>
    <text x="417" y="128" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">提升 0</text>

    <rect x="570" y="0" width="250" height="135" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有多数投票</text>
    <text x="585" y="48" font-size="10" fill="#991b1b">没 diversity 也没归一化</text>
    <text x="585" y="68" font-size="10" fill="#991b1b">投票机制空转</text>
    <text x="585" y="88" font-size="10" fill="#991b1b">N×CoT 但只有一个答案</text>
    <text x="585" y="108" font-size="10" fill="#991b1b">→ 算 N 次浪费</text>
    <text x="695" y="128" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">提升 0,成本 N×</text>
  </g>

  <rect x="60" y="600" width="780" height="40" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="625" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    三件套首次组合 → test-time compute scaling 概念诞生 → 直接启发 o1 / R1 设计
  </text>
</svg>
