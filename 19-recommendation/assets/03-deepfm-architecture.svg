<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="none"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">DeepFM</text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#666">FM(一阶+二阶)与 Deep(高阶)共享同一套特征 embedding</text>

  <!-- Shared embedding layer -->
  <rect x="270" y="86" width="360" height="60" rx="8" fill="#eef0f4" stroke="#555" stroke-width="1.5"/>
  <text x="450" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">共享隐向量 / Embedding 层</text>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#666">原始特征 x → 每个特征一个隐向量 v_i(FM 与 Deep 共用)</text>

  <!-- Split arrows -->
  <path d="M370,146 L260,190" stroke="#a0641a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M530,146 L640,190" stroke="#1a4fa0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- FM branch -->
  <g>
    <rect x="60" y="190" width="330" height="260" rx="10" fill="#fdf3e7" stroke="#d99a3f" stroke-width="1.5"/>
    <text x="225" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#a0641a">FM 组件(低阶)</text>

    <rect x="90" y="240" width="270" height="44" rx="6" fill="#fff" stroke="#d99a3f"/>
    <text x="225" y="267" text-anchor="middle" font-size="13" fill="#333">一阶项  w₀ + Σ wᵢ xᵢ</text>

    <rect x="90" y="300" width="270" height="60" rx="6" fill="#fff" stroke="#d99a3f"/>
    <text x="225" y="325" text-anchor="middle" font-size="13" fill="#333">二阶项  Σᵢ Σⱼ&gt;ᵢ ⟨vᵢ, vⱼ⟩ xᵢ xⱼ</text>
    <text x="225" y="343" text-anchor="middle" font-size="10.5" fill="#888">隐向量点积,无需人工设计交叉</text>

    <rect x="90" y="380" width="270" height="44" rx="6" fill="#f7e2c4" stroke="#a0641a" stroke-width="1.5"/>
    <text x="225" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4c14">y_FM = 一阶 + 二阶</text>
  </g>

  <!-- Deep branch -->
  <g>
    <rect x="510" y="190" width="330" height="260" rx="10" fill="#e9f1fb" stroke="#3f7fd9" stroke-width="1.5"/>
    <text x="675" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a4fa0">Deep 组件(高阶)</text>

    <rect x="540" y="240" width="270" height="44" rx="6" fill="#fff" stroke="#3f7fd9"/>
    <text x="675" y="267" text-anchor="middle" font-size="13" fill="#333">同一套隐向量拼接</text>

    <rect x="540" y="300" width="270" height="60" rx="6" fill="#fff" stroke="#3f7fd9"/>
    <text x="675" y="325" text-anchor="middle" font-size="13" fill="#333">多层 MLP(ReLU)</text>
    <text x="675" y="343" text-anchor="middle" font-size="10.5" fill="#888">隐式学习高阶非线性交互</text>

    <rect x="540" y="380" width="270" height="44" rx="6" fill="#c4dbf7" stroke="#1a4fa0" stroke-width="1.5"/>
    <text x="675" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#123a78">y_Deep = 最后一层输出</text>
  </g>

  <!-- Arrows down within branches -->
  <path d="M225,284 L225,300" stroke="#d99a3f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M225,360 L225,380" stroke="#d99a3f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M675,284 L675,300" stroke="#3f7fd9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M675,360 L675,380" stroke="#3f7fd9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Convergence to joint training -->
  <path d="M225,424 L225,490 L420,530" stroke="#a0641a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M675,424 L675,490 L480,530" stroke="#1a4fa0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Sum box -->
  <rect x="330" y="530" width="240" height="52" rx="8" fill="#eee" stroke="#555" stroke-width="1.5"/>
  <text x="450" y="552" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">相加</text>
  <text x="450" y="570" text-anchor="middle" font-size="11" fill="#555">y_FM + y_Deep</text>

  <path d="M450,582 L450,604" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="604" width="180" height="32" rx="8" fill="#333"/>
  <text x="450" y="625" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Sigmoid → CTR</text>
</svg>
