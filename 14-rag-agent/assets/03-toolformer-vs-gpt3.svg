<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="tv-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Toolformer 6.7B vs GPT-3 175B — 工具能力压缩进参数
  </text>

  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    参数少 25×,但在数学 / QA 上反超 — 工具能力比参数容量更重要
  </text>

  <!-- ============== TOP: benchmark bars ============== -->
  <g transform="translate(60, 80)">
    <!-- ASDiv 数学 -->
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">ASDiv(数学应用题)</text>

    <text x="0" y="48" font-size="10" fill="#1f2937">GPT-J 6.7B</text>
    <rect x="160" y="38" width="38" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="205" y="49" font-size="10" fill="#dc2626">7.5</text>

    <text x="0" y="68" font-size="10" fill="#1f2937">OPT 66B</text>
    <rect x="160" y="58" width="30" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="197" y="69" font-size="10" fill="#dc2626">6.0</text>

    <text x="0" y="88" font-size="10" fill="#1f2937">GPT-3 175B</text>
    <rect x="160" y="78" width="70" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="237" y="89" font-size="10" fill="#9a3412">14.0</text>

    <text x="0" y="108" font-size="10" fill="#1f2937" font-weight="700">Toolformer 6.7B</text>
    <rect x="160" y="98" width="202" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="370" y="109" font-size="10" fill="#059669" font-weight="700">40.4 ★★ 5× 提升</text>
  </g>

  <g transform="translate(490, 80)">
    <!-- LAMA 事实问答 -->
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">LAMA(事实问答)</text>

    <text x="0" y="48" font-size="10" fill="#1f2937">GPT-J 6.7B</text>
    <rect x="160" y="38" width="89" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="256" y="49" font-size="10" fill="#dc2626">17.8</text>

    <text x="0" y="68" font-size="10" fill="#1f2937">OPT 66B</text>
    <rect x="160" y="58" width="112" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="279" y="69" font-size="10" fill="#dc2626">22.5</text>

    <text x="0" y="88" font-size="10" fill="#1f2937">GPT-3 175B</text>
    <rect x="160" y="78" width="156" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="323" y="89" font-size="10" fill="#9a3412">31.3</text>

    <text x="0" y="108" font-size="10" fill="#1f2937" font-weight="700">Toolformer 6.7B</text>
    <rect x="160" y="98" width="148" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="315" y="109" font-size="10" fill="#059669" font-weight="700">29.7 ★ 接近 175B</text>
  </g>

  <!-- SVAMP / MathQA / MLQA condensed -->
  <g transform="translate(60, 220)">
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">SVAMP(数学应用题)— Toolformer 调 Calculator</text>

    <text x="0" y="48" font-size="10" fill="#1f2937">GPT-3 175B</text>
    <rect x="160" y="38" width="50" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="217" y="49" font-size="10" fill="#9a3412">10.0</text>

    <text x="0" y="68" font-size="10" fill="#1f2937" font-weight="700">Toolformer 6.7B</text>
    <rect x="160" y="58" width="147" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="313" y="69" font-size="10" fill="#059669" font-weight="700">29.4 ★ 3× 提升</text>
  </g>

  <g transform="translate(490, 220)">
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">MLQA(跨语言 QA)— Toolformer 调 Translation</text>

    <text x="0" y="48" font-size="10" fill="#1f2937">GPT-3 175B</text>
    <rect x="160" y="38" width="128" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="295" y="49" font-size="10" fill="#9a3412">25.6</text>

    <text x="0" y="68" font-size="10" fill="#1f2937" font-weight="700">Toolformer 6.7B</text>
    <rect x="160" y="58" width="103" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="270" y="69" font-size="10" fill="#059669" font-weight="700">20.6(接近 175B)</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="320" x2="860" y2="320" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: 三件套缺一 -->
  <text x="450" y="345" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,self-supervised tool learning 都崩
  </text>

  <g transform="translate(40, 365)">
    <rect x="0" y="0" width="265" height="170" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 LM 自采样</text>
    <text x="15" y="48" font-size="10" fill="#991b1b">候选海量但质量参差</text>
    <text x="15" y="66" font-size="10" fill="#991b1b">大部分是无用调用</text>
    <text x="15" y="84" font-size="10" fill="#991b1b">↓</text>
    <text x="15" y="104" font-size="10" fill="#991b1b">微调后模型学到</text>
    <text x="15" y="122" font-size="10" fill="#991b1b">"在哪都乱调工具"</text>
    <text x="132" y="155" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 分数反而更差</text>

    <rect x="285" y="0" width="265" height="170" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 Perplexity 过滤</text>
    <text x="300" y="48" font-size="10" fill="#991b1b">没自采样提供大批候选</text>
    <text x="300" y="66" font-size="10" fill="#991b1b">只能筛人工标的小集合</text>
    <text x="300" y="84" font-size="10" fill="#991b1b">↓</text>
    <text x="300" y="104" font-size="10" fill="#991b1b">数据量从百万降到千</text>
    <text x="300" y="122" font-size="10" fill="#991b1b">失去 self-supervised 优势</text>
    <text x="417" y="155" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 退化为普通 SFT</text>

    <rect x="570" y="0" width="250" height="170" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有微调</text>
    <text x="585" y="48" font-size="10" fill="#991b1b">没过滤,无用调用都喂入</text>
    <text x="585" y="66" font-size="10" fill="#991b1b">↓</text>
    <text x="585" y="86" font-size="10" fill="#991b1b">工具能力没学到</text>
    <text x="585" y="104" font-size="10" fill="#991b1b">流畅性反而下降</text>
    <text x="585" y="122" font-size="10" fill="#991b1b">(被噪声训练 corrupted)</text>
    <text x="695" y="155" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 双输</text>
  </g>

  <rect x="60" y="555" width="780" height="40" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="580" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    三件套首次组合 → Tool use 从 prompt 技巧 → pretraining 能力 → 现代 function calling 训练范式起点
  </text>
</svg>
