<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="rv-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    四种范式对比 — ReAct 三件套协同 1+1+1 > 3
  </text>

  <!-- ============== TOP: pattern shapes ============== -->
  <!-- Standard -->
  <text x="120" y="60" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">Standard</text>
  <rect x="40" y="75" width="160" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="55" y="90" width="40" height="22" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="75" y="105" text-anchor="middle" font-size="9" fill="#92400e">x</text>
  <line x1="95" y1="101" x2="115" y2="101" stroke="#9d174d" stroke-width="1.5" marker-end="url(#rv-arr)"/>
  <rect x="120" y="90" width="40" height="22" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="140" y="105" text-anchor="middle" font-size="9" fill="#065f46">y</text>
  <text x="120" y="135" text-anchor="middle" font-size="9" fill="#dc2626">无推理 / 无工具</text>
  <text x="120" y="148" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">HotpotQA 28.7</text>

  <!-- CoT -->
  <text x="295" y="60" text-anchor="middle" font-size="12" fill="#ea580c" font-weight="700">CoT(机制一)</text>
  <rect x="215" y="75" width="160" height="80" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <rect x="225" y="90" width="30" height="22" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="240" y="105" text-anchor="middle" font-size="9" fill="#92400e">x</text>
  <line x1="255" y1="101" x2="265" y2="101" stroke="#9d174d" stroke-width="1" marker-end="url(#rv-arr)"/>
  <rect x="270" y="90" width="50" height="22" rx="3" fill="#fce7f3" stroke="#db2777"/>
  <text x="295" y="105" text-anchor="middle" font-size="9" fill="#9d174d">Thought</text>
  <line x1="320" y1="101" x2="330" y2="101" stroke="#9d174d" stroke-width="1" marker-end="url(#rv-arr)"/>
  <rect x="335" y="90" width="30" height="22" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="350" y="105" text-anchor="middle" font-size="9" fill="#065f46">y</text>
  <text x="295" y="135" text-anchor="middle" font-size="9" fill="#9a3412">闭门推理,易幻觉</text>
  <text x="295" y="148" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">HotpotQA 30.6</text>

  <!-- Act-only -->
  <text x="475" y="60" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="700">Act-only(机制二)</text>
  <rect x="395" y="75" width="160" height="80" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <rect x="405" y="90" width="25" height="22" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="417" y="105" text-anchor="middle" font-size="9" fill="#92400e">x</text>
  <line x1="430" y1="101" x2="438" y2="101" stroke="#9d174d" stroke-width="1" marker-end="url(#rv-arr)"/>
  <rect x="442" y="90" width="40" height="22" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="462" y="105" text-anchor="middle" font-size="9" fill="#1e40af">Act</text>
  <line x1="482" y1="101" x2="488" y2="101" stroke="#9d174d" stroke-width="1" marker-end="url(#rv-arr)"/>
  <rect x="492" y="90" width="35" height="22" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="510" y="105" text-anchor="middle" font-size="9" fill="#065f46">Obs</text>
  <line x1="527" y1="101" x2="533" y2="101" stroke="#9d174d" stroke-width="1" marker-end="url(#rv-arr)"/>
  <rect x="537" y="90" width="13" height="22" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="544" y="105" text-anchor="middle" font-size="9" fill="#065f46">y</text>
  <text x="475" y="135" text-anchor="middle" font-size="9" fill="#5b21b6">能查但不知何时停</text>
  <text x="475" y="148" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">HotpotQA 25.7</text>

  <!-- ReAct -->
  <text x="725" y="60" text-anchor="middle" font-size="12" fill="#059669" font-weight="700">ReAct(三件套)★</text>
  <rect x="595" y="75" width="270" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <rect x="605" y="90" width="22" height="22" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="616" y="105" text-anchor="middle" font-size="9" fill="#92400e">x</text>
  <line x1="627" y1="101" x2="633" y2="101" stroke="#9d174d" stroke-width="1" marker-end="url(#rv-arr)"/>
  <rect x="637" y="90" width="44" height="22" rx="3" fill="#fce7f3" stroke="#db2777"/>
  <text x="659" y="105" text-anchor="middle" font-size="9" fill="#9d174d">Thought</text>
  <line x1="681" y1="101" x2="687" y2="101" stroke="#9d174d" stroke-width="1" marker-end="url(#rv-arr)"/>
  <rect x="691" y="90" width="32" height="22" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="707" y="105" text-anchor="middle" font-size="9" fill="#1e40af">Act</text>
  <line x1="723" y1="101" x2="729" y2="101" stroke="#9d174d" stroke-width="1" marker-end="url(#rv-arr)"/>
  <rect x="733" y="90" width="32" height="22" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="749" y="105" text-anchor="middle" font-size="9" fill="#065f46">Obs</text>

  <!-- loop arrow back -->
  <path d="M 749 112 Q 700 132, 659 112" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#rv-arr)"/>
  <text x="700" y="142" text-anchor="middle" font-size="8" fill="#7c3aed" font-weight="700">↺ N 轮</text>

  <rect x="780" y="90" width="50" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="805" y="105" text-anchor="middle" font-size="9" fill="#065f46" font-weight="700">Finish[y]</text>
  <text x="725" y="148" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">HotpotQA 35.1 ★★</text>

  <!-- DIVIDER -->
  <line x1="40" y1="180" x2="860" y2="180" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== MIDDLE: HotpotQA + ALFWorld bars ============== -->
  <text x="450" y="205" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    实测数据 — ReAct 在多跳 QA 和 agent 任务上都全面胜出
  </text>

  <!-- HotpotQA EM -->
  <g transform="translate(60, 225)">
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">HotpotQA(多跳 QA)</text>
    <text x="180" y="20" font-size="9" fill="#6b7280">% EM</text>

    <text x="0" y="48" font-size="10" fill="#1f2937">Standard</text>
    <rect x="120" y="38" width="187" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="315" y="49" font-size="10" fill="#dc2626">28.7</text>

    <text x="0" y="70" font-size="10" fill="#1f2937">CoT(thought)</text>
    <rect x="120" y="60" width="199" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="327" y="71" font-size="10" fill="#9a3412">30.6</text>

    <text x="0" y="92" font-size="10" fill="#1f2937">Act-only(action)</text>
    <rect x="120" y="82" width="167" height="14" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="295" y="93" font-size="10" fill="#5b21b6">25.7</text>

    <text x="0" y="114" font-size="10" fill="#1f2937" font-weight="700">ReAct(三件套)</text>
    <rect x="120" y="104" width="228" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="356" y="115" font-size="10" fill="#059669" font-weight="700">35.1 ★ 全面胜出</text>
  </g>

  <!-- ALFWorld -->
  <g transform="translate(490, 225)">
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">ALFWorld(agent 文本游戏)</text>
    <text x="240" y="20" font-size="9" fill="#6b7280">% 成功率</text>

    <text x="0" y="48" font-size="10" fill="#1f2937">Standard</text>
    <rect x="125" y="38" width="12" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="145" y="49" font-size="10" fill="#dc2626">6%</text>

    <text x="0" y="70" font-size="10" fill="#1f2937">Imitation Learn</text>
    <rect x="125" y="60" width="74" height="14" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="207" y="71" font-size="10" fill="#9a3412">37%(SFT 基线)</text>

    <text x="0" y="92" font-size="10" fill="#1f2937" font-weight="700">ReAct(纯 prompt)</text>
    <rect x="125" y="82" width="142" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="275" y="93" font-size="10" fill="#059669" font-weight="700">71% ★★ 2× IL 基线</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="380" x2="860" y2="380" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: 三件套缺一会怎样 -->
  <text x="450" y="405" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,LLM agent 都 work 不起来
  </text>

  <g transform="translate(40, 425)">
    <rect x="0" y="0" width="265" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 Thought(= Act-only)</text>
    <text x="15" y="48" font-size="10" fill="#991b1b">直接调工具,没解释目的</text>
    <text x="15" y="68" font-size="10" fill="#991b1b">→ LLM 不知何时停</text>
    <text x="15" y="88" font-size="10" fill="#991b1b">→ 重复调用 / 跑偏</text>
    <text x="132" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">HotpotQA 25.7(最差)</text>

    <rect x="285" y="0" width="265" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 Action(= CoT)</text>
    <text x="300" y="48" font-size="10" fill="#991b1b">全程脑内推理</text>
    <text x="300" y="68" font-size="10" fill="#991b1b">→ 无外部信息接入</text>
    <text x="300" y="88" font-size="10" fill="#991b1b">→ 幻觉(氧 → 氢)</text>
    <text x="417" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">HotpotQA 30.6</text>

    <rect x="570" y="0" width="250" height="125" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 Observation</text>
    <text x="585" y="48" font-size="10" fill="#991b1b">Action 调完不喂回 LLM</text>
    <text x="585" y="68" font-size="10" fill="#991b1b">→ 闭环不闭合</text>
    <text x="585" y="88" font-size="10" fill="#991b1b">→ 工具调用白做</text>
    <text x="695" y="115" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">根本不成立</text>
  </g>

  <rect x="60" y="565" width="780" height="40" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="590" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="600">
    三件套首次组合 → Agent 范式起点,LangChain / AutoGPT / Function Calling 都是其工程化
  </text>
</svg>
