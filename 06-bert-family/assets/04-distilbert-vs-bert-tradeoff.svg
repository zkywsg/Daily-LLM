<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="dt-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    DistilBERT vs BERT vs ALBERT — 工业部署三维对比
  </text>

  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    参数 / 推理速度 / GLUE 性能 — 只有 DistilBERT 三维都改善
  </text>

  <!-- ============== 3 bars ============== -->
  <g transform="translate(60, 80)">
    <!-- 参数 row -->
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">参数量</text>

    <text x="0" y="48" font-size="10" fill="#1f2937">BERT-base</text>
    <rect x="120" y="38" width="220" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="345" y="49" font-size="10" fill="#dc2626">110M(baseline)</text>

    <text x="0" y="68" font-size="10" fill="#1f2937">ALBERT-base</text>
    <rect x="120" y="58" width="24" height="14" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="150" y="69" font-size="10" fill="#92400e">12M(-89%)</text>

    <text x="0" y="88" font-size="10" fill="#1f2937" font-weight="700">DistilBERT</text>
    <rect x="120" y="78" width="132" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="258" y="89" font-size="10" fill="#059669" font-weight="700">66M(-40%) ★</text>

    <!-- 推理速度(time) row -->
    <text x="0" y="130" font-size="11" fill="#1f2937" font-weight="600">推理时间(V100, batch 1)</text>

    <text x="0" y="158" font-size="10" fill="#1f2937">BERT-base</text>
    <rect x="180" y="148" width="225" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="410" y="159" font-size="10" fill="#dc2626">15 ms(baseline)</text>

    <text x="0" y="178" font-size="10" fill="#1f2937">ALBERT-base</text>
    <rect x="180" y="168" width="225" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="410" y="179" font-size="10" fill="#dc2626">15 ms(共享不省 FLOPs!)</text>

    <text x="0" y="198" font-size="10" fill="#1f2937" font-weight="700">DistilBERT</text>
    <rect x="180" y="188" width="135" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="320" y="199" font-size="10" fill="#059669" font-weight="700">9 ms(+60% 提速)★</text>

    <!-- 性能 row -->
    <text x="0" y="240" font-size="11" fill="#1f2937" font-weight="600">GLUE 平均</text>

    <text x="0" y="268" font-size="10" fill="#1f2937">BERT-base</text>
    <rect x="120" y="258" width="397" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="523" y="269" font-size="10" fill="#dc2626">79.5(baseline)</text>

    <text x="0" y="288" font-size="10" fill="#1f2937">ALBERT-base</text>
    <rect x="120" y="278" width="358" height="14" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="483" y="289" font-size="10" fill="#92400e">76.8(-2.7)</text>

    <text x="0" y="308" font-size="10" fill="#1f2937" font-weight="700">DistilBERT</text>
    <rect x="120" y="298" width="385" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="510" y="309" font-size="10" fill="#059669" font-weight="700">77.0(-2.5,保留 97%)★</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="425" x2="860" y2="425" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: 三件套缺一 -->
  <text x="450" y="450" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,DistilBERT 都达不到 sweet spot
  </text>

  <g transform="translate(40, 470)">
    <rect x="0" y="0" width="265" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 三损失</text>
    <text x="15" y="48" font-size="10" fill="#991b1b">从零训 6 层 BERT</text>
    <text x="15" y="68" font-size="10" fill="#991b1b">没 teacher 软标签信号</text>
    <text x="15" y="88" font-size="10" fill="#991b1b">→ GLUE 保留只 85%</text>
    <text x="132" y="125" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">达不到 97% 黄金线</text>

    <rect x="285" y="0" width="265" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 层数减半</text>
    <text x="300" y="48" font-size="10" fill="#991b1b">蒸馏后还是 12 层</text>
    <text x="300" y="68" font-size="10" fill="#991b1b">参数 / 速度都没真省</text>
    <text x="300" y="88" font-size="10" fill="#991b1b">部署问题没解决</text>
    <text x="417" y="125" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">变成"再训一遍 BERT"</text>

    <rect x="570" y="0" width="250" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">缺 隔层初始化</text>
    <text x="585" y="48" font-size="10" fill="#991b1b">random init 蒸馏</text>
    <text x="585" y="68" font-size="10" fill="#991b1b">收敛慢 5-10×</text>
    <text x="585" y="88" font-size="10" fill="#991b1b">90 小时 → 数百小时</text>
    <text x="695" y="125" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 训练成本爆炸</text>
  </g>

  <rect x="60" y="625" width="780" height="30" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="645" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">
    DistilBERT = HuggingFace 下载榜首 / 工业 BERT 部署默认 / 知识蒸馏在 NLP 经典案例
  </text>
</svg>
