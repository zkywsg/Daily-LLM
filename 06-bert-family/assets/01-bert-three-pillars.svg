<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="bp-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    BERT 三机制 → 一套预训练通吃 GLUE 所有任务
  </text>

  <!-- INPUT row showing [CLS] / [SEP] interface -->
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">
    机制三:统一输入接口 — `[CLS] my dog is hairy [SEP] he likes playing [SEP]`
  </text>

  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="50" height="32" rx="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="25" y="20" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="700">[CLS]</text>

    <rect x="55" y="0" width="50" height="32" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="80" y="20" text-anchor="middle" font-size="10" fill="#92400e">my</text>

    <rect x="110" y="0" width="50" height="32" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="135" y="20" text-anchor="middle" font-size="10" fill="#92400e">dog</text>

    <rect x="165" y="0" width="50" height="32" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="190" y="20" text-anchor="middle" font-size="10" fill="#92400e">is</text>

    <rect x="220" y="0" width="55" height="32" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="247" y="20" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">[MASK]</text>

    <rect x="280" y="0" width="50" height="32" rx="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="305" y="20" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="700">[SEP]</text>

    <rect x="335" y="0" width="50" height="32" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="360" y="20" text-anchor="middle" font-size="10" fill="#92400e">he</text>

    <rect x="390" y="0" width="50" height="32" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="415" y="20" text-anchor="middle" font-size="10" fill="#92400e">likes</text>

    <rect x="445" y="0" width="60" height="32" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="475" y="20" text-anchor="middle" font-size="10" fill="#92400e">playing</text>

    <rect x="510" y="0" width="50" height="32" rx="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="535" y="20" text-anchor="middle" font-size="10" fill="#5b21b6" font-weight="700">[SEP]</text>

    <!-- Segment row -->
    <text x="-50" y="55" font-size="9" fill="#6b7280" font-weight="600">Segment:</text>
    <text x="25" y="55" text-anchor="middle" font-size="9" fill="#1e40af">A</text>
    <text x="80" y="55" text-anchor="middle" font-size="9" fill="#1e40af">A</text>
    <text x="135" y="55" text-anchor="middle" font-size="9" fill="#1e40af">A</text>
    <text x="190" y="55" text-anchor="middle" font-size="9" fill="#1e40af">A</text>
    <text x="247" y="55" text-anchor="middle" font-size="9" fill="#1e40af">A</text>
    <text x="305" y="55" text-anchor="middle" font-size="9" fill="#1e40af">A</text>
    <text x="360" y="55" text-anchor="middle" font-size="9" fill="#9d174d">B</text>
    <text x="415" y="55" text-anchor="middle" font-size="9" fill="#9d174d">B</text>
    <text x="475" y="55" text-anchor="middle" font-size="9" fill="#9d174d">B</text>
    <text x="535" y="55" text-anchor="middle" font-size="9" fill="#9d174d">B</text>

    <text x="-50" y="72" font-size="9" fill="#6b7280" font-weight="600">Position:</text>
    <text x="25" y="72" text-anchor="middle" font-size="9" fill="#374151">0</text>
    <text x="80" y="72" text-anchor="middle" font-size="9" fill="#374151">1</text>
    <text x="135" y="72" text-anchor="middle" font-size="9" fill="#374151">2</text>
    <text x="190" y="72" text-anchor="middle" font-size="9" fill="#374151">3</text>
    <text x="247" y="72" text-anchor="middle" font-size="9" fill="#374151">4</text>
    <text x="305" y="72" text-anchor="middle" font-size="9" fill="#374151">5</text>
    <text x="360" y="72" text-anchor="middle" font-size="9" fill="#374151">6</text>
    <text x="415" y="72" text-anchor="middle" font-size="9" fill="#374151">7</text>
    <text x="475" y="72" text-anchor="middle" font-size="9" fill="#374151">8</text>
    <text x="535" y="72" text-anchor="middle" font-size="9" fill="#374151">9</text>
  </g>

  <!-- arrow down -->
  <line x1="450" y1="165" x2="450" y2="190" stroke="#9d174d" stroke-width="2" marker-end="url(#bp-arr)"/>

  <!-- BERT block -->
  <rect x="160" y="195" width="580" height="60" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="450" y="216" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="700">机制一 + 机制二:Bidirectional Encoder × N(MLM 预训练)</text>
  <text x="450" y="234" text-anchor="middle" font-size="10" fill="#9d174d">每位置看全文 + 15% 被遮 token 重建</text>
  <text x="450" y="248" text-anchor="middle" font-size="9" fill="#dc2626">BERT-large: 24 层 / 340M 参数</text>

  <!-- arrows out to downstream heads -->
  <line x1="240" y1="255" x2="120" y2="295" stroke="#9d174d" stroke-width="1.5" marker-end="url(#bp-arr)"/>
  <line x1="450" y1="255" x2="450" y2="295" stroke="#9d174d" stroke-width="1.5" marker-end="url(#bp-arr)"/>
  <line x1="660" y1="255" x2="780" y2="295" stroke="#9d174d" stroke-width="1.5" marker-end="url(#bp-arr)"/>

  <!-- 3 downstream heads -->
  <rect x="40" y="298" width="240" height="115" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="160" y="318" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="700">单句分类(SST-2)</text>
  <text x="160" y="338" text-anchor="middle" font-size="9" fill="#5b21b6">用 [CLS] 位 hidden state</text>
  <text x="160" y="354" text-anchor="middle" font-size="9" fill="#5b21b6">→ Linear → softmax</text>
  <rect x="60" y="365" width="200" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="160" y="380" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">SST-2 94.9 ★(+3.3)</text>
  <text x="160" y="402" text-anchor="middle" font-size="9" fill="#9d174d" font-style="italic">[CLS] 接口零适配</text>

  <rect x="330" y="298" width="240" height="115" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="318" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="700">句对推理(MNLI)</text>
  <text x="450" y="338" text-anchor="middle" font-size="9" fill="#5b21b6">用 [CLS] + Segment A/B</text>
  <text x="450" y="354" text-anchor="middle" font-size="9" fill="#5b21b6">→ 3 类(蕴含/矛盾/中性)</text>
  <rect x="350" y="365" width="200" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="380" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">MNLI 86.7 ★(+6.1)</text>
  <text x="450" y="402" text-anchor="middle" font-size="9" fill="#9d174d" font-style="italic">Segment 接口直接用</text>

  <rect x="620" y="298" width="240" height="115" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="740" y="318" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="700">Span 提取(SQuAD)</text>
  <text x="740" y="338" text-anchor="middle" font-size="9" fill="#5b21b6">每 token hidden state</text>
  <text x="740" y="354" text-anchor="middle" font-size="9" fill="#5b21b6">→ start / end 概率</text>
  <rect x="640" y="365" width="200" height="22" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="740" y="380" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">SQuAD F1 93.2 ★(超人类)</text>
  <text x="740" y="402" text-anchor="middle" font-size="9" fill="#9d174d" font-style="italic">[SEP] 标记 question/doc</text>

  <!-- DIVIDER -->
  <line x1="40" y1="435" x2="860" y2="435" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: 三件套缺一 -->
  <text x="450" y="460" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    三件套缺一,BERT 都不成立
  </text>

  <g transform="translate(40, 480)">
    <rect x="0" y="0" width="265" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="132" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有双向 encoder</text>
    <text x="15" y="48" font-size="10" fill="#991b1b">做自回归 LM:</text>
    <text x="15" y="68" font-size="10" fill="#991b1b">attention 直接看到 t 自己</text>
    <text x="15" y="88" font-size="10" fill="#991b1b">→ 模型作弊,loss = 0</text>
    <text x="132" y="118" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 什么也学不到</text>

    <rect x="285" y="0" width="265" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="417" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有 MLM</text>
    <text x="300" y="48" font-size="10" fill="#991b1b">套在 decoder + causal mask 上</text>
    <text x="300" y="68" font-size="10" fill="#991b1b">遮的 token 仍只能看左侧</text>
    <text x="300" y="88" font-size="10" fill="#991b1b">→ 退化成单向预测</text>
    <text x="417" y="118" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 等于 GPT-1</text>

    <rect x="570" y="0" width="250" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="695" y="22" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">只有统一接口</text>
    <text x="585" y="48" font-size="10" fill="#991b1b">没双向 + MLM 预训练</text>
    <text x="585" y="68" font-size="10" fill="#991b1b">[CLS] 就是普通 token</text>
    <text x="585" y="88" font-size="10" fill="#991b1b">downstream head 不接 ground</text>
    <text x="695" y="118" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">→ 接口空架子</text>
  </g>
</svg>
