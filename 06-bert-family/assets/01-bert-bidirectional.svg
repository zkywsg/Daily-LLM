<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="bb-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    BERT 双向 Encoder + MLM — 与 GPT 单向对比
  </text>

  <!-- LEFT: GPT-1 unidirectional -->
  <text x="225" y="60" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">
    GPT-1(decoder + 单向)
  </text>

  <rect x="40" y="78" width="370" height="270" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

  <text x="225" y="100" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="600">Causal Mask:第 t 个位置只看 1..t-1</text>

  <!-- tokens row -->
  <g transform="translate(60, 115)">
    <rect x="0" y="0" width="50" height="30" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="25" y="20" text-anchor="middle" font-size="10" fill="#92400e">The</text>

    <rect x="60" y="0" width="50" height="30" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="85" y="20" text-anchor="middle" font-size="10" fill="#92400e">cat</text>

    <rect x="120" y="0" width="50" height="30" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="145" y="20" text-anchor="middle" font-size="10" fill="#92400e">sat</text>

    <rect x="180" y="0" width="50" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="205" y="20" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">on</text>

    <rect x="240" y="0" width="50" height="30" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="265" y="20" text-anchor="middle" font-size="10" fill="#92400e">mat</text>
  </g>

  <text x="225" y="170" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="700">预测"on"时只能看到 ←</text>

  <!-- arrows only from left -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none">
    <path d="M 85 175 Q 145 215, 265 195" marker-end="url(#bb-arr)"/>
    <path d="M 145 175 Q 175 215, 265 195" marker-end="url(#bb-arr)"/>
    <path d="M 205 175 Q 230 215, 265 195" marker-end="url(#bb-arr)"/>
  </g>

  <!-- right side blocked -->
  <text x="325" y="220" text-anchor="middle" font-size="20" fill="#dc2626">✗</text>
  <text x="325" y="245" text-anchor="middle" font-size="9" fill="#dc2626">"mat" 信息</text>
  <text x="325" y="258" text-anchor="middle" font-size="9" fill="#dc2626">看不到</text>

  <!-- result -->
  <rect x="60" y="280" width="330" height="55" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="225" y="300" text-anchor="middle" font-size="10" fill="#92400e" font-weight="700">下游 NER 判断 "Apple" 是公司/水果</text>
  <text x="225" y="318" text-anchor="middle" font-size="9" fill="#dc2626">需要看右边 "stock" 才能判断 → 自缚一手</text>

  <!-- ARROW between -->
  <line x1="420" y1="200" x2="470" y2="200" stroke="#7c3aed" stroke-width="3" marker-end="url(#bb-arr)"/>
  <text x="445" y="188" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">去 mask</text>

  <!-- RIGHT: BERT bidirectional + MLM -->
  <text x="675" y="60" text-anchor="middle" font-size="13" fill="#059669" font-weight="700">
    BERT(encoder + 双向 + MLM)★
  </text>

  <rect x="490" y="78" width="370" height="270" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>

  <text x="675" y="100" text-anchor="middle" font-size="10" fill="#065f46" font-weight="600">无 causal mask:每位置看全文 + 15% 被遮</text>

  <!-- tokens row with [MASK] -->
  <g transform="translate(510, 115)">
    <rect x="0" y="0" width="50" height="30" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="25" y="20" text-anchor="middle" font-size="10" fill="#92400e">The</text>

    <rect x="60" y="0" width="60" height="30" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">[MASK]</text>

    <rect x="130" y="0" width="50" height="30" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="155" y="20" text-anchor="middle" font-size="10" fill="#92400e">sat</text>

    <rect x="190" y="0" width="50" height="30" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="215" y="20" text-anchor="middle" font-size="10" fill="#92400e">on</text>

    <rect x="250" y="0" width="50" height="30" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="275" y="20" text-anchor="middle" font-size="10" fill="#92400e">mat</text>
  </g>

  <text x="675" y="170" text-anchor="middle" font-size="10" fill="#065f46" font-weight="700">预测 [MASK] 时左右双向都看</text>

  <!-- arrows from both sides converging on [MASK] -->
  <g stroke="#059669" stroke-width="1.5" fill="none">
    <path d="M 535 175 Q 575 215, 600 195" marker-end="url(#bb-arr)"/>
    <path d="M 665 175 Q 640 215, 600 195" marker-end="url(#bb-arr)"/>
    <path d="M 725 175 Q 670 215, 600 195" marker-end="url(#bb-arr)"/>
    <path d="M 785 175 Q 700 215, 600 195" marker-end="url(#bb-arr)"/>
  </g>

  <!-- aha! -->
  <text x="600" y="240" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">→ cat ★</text>
  <text x="600" y="258" text-anchor="middle" font-size="9" fill="#059669">用 4 边上下文重建</text>

  <!-- 80/10/10 trick -->
  <rect x="510" y="280" width="330" height="55" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="675" y="298" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="700">15% 被选 token 的 80/10/10:</text>
  <text x="525" y="315" font-size="9" fill="#9d174d">80% → [MASK]  10% → 随机词  10% → 不变</text>
  <text x="675" y="328" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">→ 避免预训练-微调 mismatch</text>

  <!-- DIVIDER -->
  <line x1="40" y1="375" x2="860" y2="375" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- BOTTOM: GLUE bars -->
  <text x="450" y="400" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    双向能力的下游红利 — GLUE 全面 SOTA
  </text>

  <g transform="translate(60, 420)">
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">GLUE 平均</text>
    <rect x="150" y="8" width="377" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="535" y="22" font-size="10" fill="#dc2626">之前 SOTA 75.1</text>
    <rect x="150" y="28" width="398" height="16" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
    <text x="555" y="42" font-size="10" fill="#9a3412">BERT-base 79.6</text>
    <rect x="150" y="48" width="411" height="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="568" y="62" font-size="10" fill="#059669" font-weight="700">BERT-large 82.1 ★(+7.0)</text>

    <text x="0" y="100" font-size="11" fill="#1f2937" font-weight="600">SQuAD F1</text>
    <rect x="150" y="88" width="354" height="16" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="510" y="102" font-size="10" fill="#dc2626">之前 SOTA 88.5</text>
    <rect x="150" y="108" width="365" height="16" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="520" y="122" font-size="10" fill="#92400e">人类基准 91.2</text>
    <rect x="150" y="128" width="373" height="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="528" y="142" font-size="10" fill="#059669" font-weight="700">BERT-large 93.2 ★(超人类)</text>
  </g>
</svg>
