<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="db-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
    <marker id="db-arr-cool" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    DistilBERT 三损失训练 — KL × MLM × Cosine
  </text>

  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
    L = 0.5·L_distill + 0.2·L_MLM + 0.1·L_cos
  </text>

  <!-- INPUT -->
  <rect x="350" y="80" width="200" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">输入文本 + MLM mask</text>

  <line x1="350" y1="105" x2="200" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#db-arr-cool)"/>
  <line x1="550" y1="105" x2="700" y2="160" stroke="#9d174d" stroke-width="1.5" marker-end="url(#db-arr)"/>

  <!-- LEFT: TEACHER -->
  <rect x="60" y="165" width="280" height="170" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="187" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">BERT Teacher</text>
  <text x="200" y="205" text-anchor="middle" font-size="10" fill="#1e40af">12 层 / 110M / 冻结</text>

  <g transform="translate(80, 215)">
    <rect x="60" y="0" width="120" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="60" y="16" width="120" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="60" y="32" width="120" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <rect x="60" y="48" width="120" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="40" y="30" text-anchor="middle" font-size="9" fill="#1e40af">12×</text>

    <rect x="0" y="68" width="240" height="22" rx="3" fill="#1f2937"/>
    <text x="120" y="83" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700">soft logits p_T(x)</text>

    <rect x="0" y="92" width="240" height="22" rx="3" fill="#1e40af"/>
    <text x="120" y="107" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="700">hidden states h_T</text>
  </g>

  <!-- RIGHT: STUDENT -->
  <rect x="560" y="165" width="280" height="170" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="700" y="187" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">DistilBERT Student ★</text>
  <text x="700" y="205" text-anchor="middle" font-size="10" fill="#9d174d">6 层 / 66M / 训练中</text>

  <g transform="translate(580, 215)">
    <rect x="60" y="0" width="120" height="14" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <rect x="60" y="16" width="120" height="14" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <rect x="60" y="32" width="120" height="14" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="40" y="22" text-anchor="middle" font-size="9" fill="#9d174d">6×</text>
    <text x="40" y="36" text-anchor="middle" font-size="8" fill="#9d174d" font-style="italic">(隔层初始化)</text>

    <rect x="0" y="68" width="240" height="22" rx="3" fill="#1f2937"/>
    <text x="120" y="83" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="700">student logits p_S(x)</text>

    <rect x="0" y="92" width="240" height="22" rx="3" fill="#9d174d"/>
    <text x="120" y="107" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="700">hidden states h_S</text>
  </g>

  <!-- 3 losses below -->
  <!-- L1 distill: teacher logits + student logits -->
  <line x1="200" y1="305" x2="200" y2="350" stroke="#2563eb" stroke-width="1.5" marker-end="url(#db-arr-cool)"/>
  <line x1="700" y1="305" x2="200" y2="350" stroke="#9d174d" stroke-width="1.5" marker-end="url(#db-arr)"/>

  <rect x="60" y="355" width="260" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="190" y="378" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">L_distill(KL,温度 τ=2)</text>
  <text x="190" y="398" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#065f46">KL(p_T^τ ‖ p_S^τ) × τ²</text>
  <text x="190" y="416" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">权重 α = 0.5(主力)</text>
  <text x="190" y="430" text-anchor="middle" font-size="9" fill="#059669">学 teacher 的"软偏好"</text>

  <!-- L2 MLM: input ground truth + student logits -->
  <line x1="700" y1="335" x2="450" y2="350" stroke="#9d174d" stroke-width="1.5" marker-end="url(#db-arr)"/>
  <line x1="450" y1="120" x2="450" y2="350" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#db-arr)"/>

  <rect x="340" y="355" width="220" height="80" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#92400e" font-weight="700">L_MLM(任务 loss)</text>
  <text x="450" y="398" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#92400e">-Σ log p_S(x_t | x_\t)</text>
  <text x="450" y="416" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">权重 β = 0.2</text>
  <text x="450" y="430" text-anchor="middle" font-size="9" fill="#9d174d">防 teacher 错被无脑继承</text>

  <!-- L3 cos: hidden states -->
  <line x1="200" y1="328" x2="700" y2="350" stroke="#2563eb" stroke-width="1.5" marker-end="url(#db-arr-cool)"/>
  <line x1="700" y1="328" x2="700" y2="350" stroke="#9d174d" stroke-width="1.5" marker-end="url(#db-arr)"/>

  <rect x="580" y="355" width="260" height="80" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="710" y="378" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="700">L_cos(隐状态对齐)</text>
  <text x="710" y="398" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#5b21b6">1 - cos(h_S, h_T)</text>
  <text x="710" y="416" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">权重 γ = 0.1</text>
  <text x="710" y="430" text-anchor="middle" font-size="9" fill="#5b21b6">学 teacher 内部表征</text>

  <!-- Total loss -->
  <line x1="200" y1="438" x2="450" y2="475" stroke="#9d174d" stroke-width="1.5" marker-end="url(#db-arr)"/>
  <line x1="450" y1="438" x2="450" y2="475" stroke="#9d174d" stroke-width="1.5" marker-end="url(#db-arr)"/>
  <line x1="710" y1="438" x2="450" y2="475" stroke="#9d174d" stroke-width="1.5" marker-end="url(#db-arr)"/>

  <rect x="300" y="478" width="300" height="50" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="498" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24" font-weight="700">L = 0.5·L_distill + 0.2·L_MLM + 0.1·L_cos</text>
  <text x="450" y="516" text-anchor="middle" font-size="10" fill="#fef3c7">→ 只更新 Student 参数</text>

  <!-- BOTTOM: three roles -->
  <text x="450" y="555" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="600">
    三损失角色分工
  </text>

  <g transform="translate(40, 575)">
    <text x="0" y="20" font-size="10" fill="#1f2937">
      <tspan fill="#059669" font-weight="700">L_distill</tspan>:从 teacher 学软分布(类别相对关系)
      <tspan fill="#d97706" font-weight="700">L_MLM</tspan>:从真实数据学硬信号(防 teacher 错继承)
      <tspan fill="#7c3aed" font-weight="700">L_cos</tspan>:从 teacher 学中间表征结构
    </text>
    <text x="0" y="42" font-size="10" fill="#dc2626" font-weight="700">
      → 缺 distill 退化成普通小 MLM 训练 / 缺 MLM 错误传染 / 缺 cos 只学"输出"不学"思路"
    </text>
  </g>
</svg>
