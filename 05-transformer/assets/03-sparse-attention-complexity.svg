<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    复杂度对比 + 长上下文 benchmark 性能
  </text>

  <!-- ============== TOP: Memory vs sequence length chart ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    显存占用 vs 序列长度 — Sparse O(N) 让 16K 上下文可行
  </text>

  <!-- Chart -->
  <line x1="120" y1="350" x2="780" y2="350" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="120" y2="350" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis: memory log scale 0.5 - 64 GB -->
  <g font-size="10" fill="#6b7280">
    <text x="113" y="353" text-anchor="end">0.5GB</text>
    <text x="113" y="311" text-anchor="end">1</text>
    <text x="113" y="268" text-anchor="end">2</text>
    <text x="113" y="225" text-anchor="end">4</text>
    <text x="113" y="183" text-anchor="end">8</text>
    <text x="113" y="140" text-anchor="end">16</text>
    <text x="113" y="98" text-anchor="end">64</text>
  </g>
  <text x="70" y="220" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600" transform="rotate(-90 70 220)">显存(log,GB)</text>

  <!-- x axis: seq length -->
  <g font-size="10" fill="#6b7280">
    <text x="160" y="365" text-anchor="middle">512</text>
    <text x="280" y="365" text-anchor="middle">1K</text>
    <text x="400" y="365" text-anchor="middle">2K</text>
    <text x="520" y="365" text-anchor="middle">4K</text>
    <text x="640" y="365" text-anchor="middle">8K</text>
    <text x="750" y="365" text-anchor="middle">16K</text>
  </g>
  <text x="450" y="385" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600">序列长度</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="120" y1="311" x2="780" y2="311"/>
    <line x1="120" y1="268" x2="780" y2="268"/>
    <line x1="120" y1="225" x2="780" y2="225"/>
    <line x1="120" y1="183" x2="780" y2="183"/>
    <line x1="120" y1="140" x2="780" y2="140"/>
    <line x1="120" y1="98" x2="780" y2="98"/>
  </g>

  <!-- Dense O(N²) - red, steep -->
  <!-- 512 → ~0.06GB(below chart), 1K→0.25, 2K→1, 4K→4, 8K→16, 16K→64 -->
  <!-- Map to chart: 1GB=311, 2GB=268, 4GB=225, 8GB=183, 16GB=140, 64GB=98 -->
  <path d="M 160 360 L 280 340 L 400 311 L 520 225 L 640 140 L 750 98" stroke="#dc2626" stroke-width="3" fill="none"/>
  <g fill="#dc2626">
    <circle cx="160" cy="360" r="4"/>
    <circle cx="280" cy="340" r="4"/>
    <circle cx="400" cy="311" r="4"/>
    <circle cx="520" cy="225" r="5"/>
    <circle cx="640" cy="140" r="6"/>
    <circle cx="750" cy="98" r="6"/>
  </g>
  <text x="755" y="92" font-size="11" fill="#dc2626" font-weight="700">Dense O(N²) 64GB</text>

  <!-- threshold line - A100 40GB -->
  <line x1="120" y1="110" x2="780" y2="110" stroke="#dc2626" stroke-width="1" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="770" y="125" text-anchor="end" font-size="10" fill="#dc2626" font-style="italic">A100 显存上限 40GB</text>

  <!-- Reformer O(N log N) - orange -->
  <path d="M 160 358 L 280 350 L 400 338 L 520 318 L 640 290 L 750 268" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <g fill="#ea580c">
    <circle cx="520" cy="318" r="4"/>
    <circle cx="640" cy="290" r="4"/>
    <circle cx="750" cy="268" r="4"/>
  </g>
  <text x="755" y="280" font-size="10" fill="#ea580c">Reformer O(N log N)</text>

  <!-- Sparse Transformer O(N√N) - purple -->
  <path d="M 160 357 L 280 348 L 400 330 L 520 305 L 640 275 L 750 250" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
  <g fill="#7c3aed">
    <circle cx="520" cy="305" r="4"/>
    <circle cx="750" cy="250" r="4"/>
  </g>
  <text x="755" y="245" font-size="10" fill="#7c3aed">Sparse O(N√N)</text>

  <!-- Longformer/BigBird O(N) - green, nearly flat -->
  <path d="M 160 355 L 280 345 L 400 335 L 520 320 L 640 308 L 750 295" stroke="#059669" stroke-width="3" fill="none"/>
  <g fill="#059669">
    <circle cx="160" cy="355" r="4"/>
    <circle cx="280" cy="345" r="4"/>
    <circle cx="400" cy="335" r="4"/>
    <circle cx="520" cy="320" r="5"/>
    <circle cx="640" cy="308" r="5"/>
    <circle cx="750" cy="295" r="6"/>
  </g>
  <text x="755" y="312" font-size="11" fill="#059669" font-weight="700">Longformer / BigBird O(N) 2GB</text>

  <!-- callout: 4K threshold -->
  <line x1="520" y1="350" x2="520" y2="220" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="520" y="215" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">4K 临界点</text>

  <!-- DIVIDER -->
  <line x1="40" y1="410" x2="860" y2="410" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: Benchmark performance ============== -->
  <text x="450" y="438" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    长上下文 benchmark — Longformer 4K vs RoBERTa 512 全面胜出
  </text>

  <g transform="translate(80, 460)">
    <!-- header -->
    <rect x="0" y="0" width="740" height="28" fill="#1f2937"/>
    <text x="180" y="19" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">任务</text>
    <text x="430" y="19" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">RoBERTa-base(512)</text>
    <text x="640" y="19" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">Longformer-base(4K)</text>

    <!-- SQuAD -->
    <rect x="0" y="28" width="740" height="26" fill="#fef3c7"/>
    <text x="180" y="46" text-anchor="middle" font-size="11" fill="#92400e">SQuAD(QA F1)</text>
    <text x="430" y="46" text-anchor="middle" font-size="11" fill="#92400e">90.5</text>
    <text x="640" y="46" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">93.2 (+2.7)</text>

    <!-- HotpotQA -->
    <rect x="0" y="54" width="740" height="26" fill="#ecfdf5"/>
    <text x="180" y="72" text-anchor="middle" font-size="11" fill="#065f46">HotpotQA(multi-hop QA)</text>
    <text x="430" y="72" text-anchor="middle" font-size="11" fill="#92400e">73.5</text>
    <text x="640" y="72" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">81.0 (+7.5)</text>

    <!-- TriviaQA -->
    <rect x="0" y="80" width="740" height="26" fill="#fef3c7"/>
    <text x="180" y="98" text-anchor="middle" font-size="11" fill="#92400e">TriviaQA</text>
    <text x="430" y="98" text-anchor="middle" font-size="11" fill="#92400e">74.3</text>
    <text x="640" y="98" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">77.3 (+3.0)</text>

    <!-- IMDb -->
    <rect x="0" y="106" width="740" height="26" fill="#ecfdf5"/>
    <text x="180" y="124" text-anchor="middle" font-size="11" fill="#065f46">IMDb(长文档分类)</text>
    <text x="430" y="124" text-anchor="middle" font-size="11" fill="#92400e">95.3</text>
    <text x="640" y="124" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">95.7 (+0.4)</text>

    <!-- Hyperpartisan -->
    <rect x="0" y="132" width="740" height="26" fill="#fef3c7"/>
    <text x="180" y="150" text-anchor="middle" font-size="11" fill="#92400e">Hyperpartisan</text>
    <text x="430" y="150" text-anchor="middle" font-size="11" fill="#92400e">87.4</text>
    <text x="640" y="150" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">94.8 (+7.4) ★</text>
  </g>

  <!-- bottom callout -->
  <rect x="60" y="625" width="780" height="20" rx="4" fill="#1f2937" stroke="none"/>
  <text x="450" y="640" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">
    2022 FlashAttention 后部分淘汰(dense 在 64K 也可行),但 100K+ 超长仍是 Sparse + Flash 组合
  </text>
</svg>
