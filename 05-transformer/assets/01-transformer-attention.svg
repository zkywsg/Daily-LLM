<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-att" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arr-att-pink" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <!-- ============== TITLE ============== -->
  <text x="450" y="32" text-anchor="middle" font-size="17"
        fill="#1f2937" font-weight="600">
    Scaled Dot-Product Attention · "The cat sat on mat"
  </text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">
    跟踪 "sat" 这个 query 如何聚合序列里其他 token 的 value
  </text>

  <!-- ============================================================== -->
  <!-- ROW 1: Step 1 + Step 2 (tokens / Q-projection / scores)         -->
  <!-- ============================================================== -->

  <!-- ─── Step 1 label (LEFT block, x=40-320) ─── -->
  <text x="50" y="100" text-anchor="start" font-size="14"
        fill="#1f2937" font-weight="700">
    ① Token 序列 → 投影出 Q
  </text>
  <text x="50" y="118" text-anchor="start" font-size="11" fill="#6b7280">
    K, V 同理(此处省略整张矩阵,仅画 Q)
  </text>

  <!-- 5 tokens column -->
  <g font-size="13" fill="#1f2937">
    <text x="68" y="158" text-anchor="end">The</text>
    <text x="68" y="186" text-anchor="end">cat</text>
    <text x="68" y="214" text-anchor="end" font-weight="700">sat</text>
    <text x="68" y="242" text-anchor="end">on</text>
    <text x="68" y="270" text-anchor="end">mat</text>
  </g>

  <!-- X embeddings (5 rows) -->
  <g stroke="#d97706" stroke-width="1.2" fill="#fef3c7">
    <rect x="78" y="146" width="90" height="20" rx="3"/>
    <rect x="78" y="174" width="90" height="20" rx="3"/>
    <rect x="78" y="202" width="90" height="20" rx="3" stroke-width="2.5"/>
    <rect x="78" y="230" width="90" height="20" rx="3"/>
    <rect x="78" y="258" width="90" height="20" rx="3"/>
  </g>
  <text x="123" y="295" text-anchor="middle" font-size="11" fill="#92400e">
    X [5, d_model]
  </text>

  <!-- arrow to W_Q -->
  <line x1="172" y1="212" x2="198" y2="212"
        stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-att)"/>
  <text x="185" y="204" text-anchor="middle" font-size="11" fill="#6b7280">W_Q</text>

  <!-- Q matrix -->
  <g stroke="#db2777" stroke-width="1.2" fill="#fce7f3">
    <rect x="202" y="146" width="80" height="20" rx="3"/>
    <rect x="202" y="174" width="80" height="20" rx="3"/>
    <rect x="202" y="202" width="80" height="20" rx="3" stroke-width="2.5" fill="#fbcfe8"/>
    <rect x="202" y="230" width="80" height="20" rx="3"/>
    <rect x="202" y="258" width="80" height="20" rx="3"/>
  </g>
  <text x="290" y="216" text-anchor="start" font-size="11" fill="#9d174d" font-style="italic">
    ← q_sat
  </text>
  <text x="242" y="295" text-anchor="middle" font-size="11" fill="#9d174d">
    Q [5, d_k]
  </text>

  <!-- vertical divider between Step 1 and Step 2 -->
  <line x1="345" y1="90" x2="345" y2="320"
        stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ─── Step 2 label (RIGHT block, x=370-870) ─── -->
  <text x="380" y="100" text-anchor="start" font-size="14"
        fill="#1f2937" font-weight="700">
    ② Q · K^T / √d_k  →  scores [5×5]
  </text>
  <text x="380" y="118" text-anchor="start" font-size="11" fill="#6b7280">
    每个 (i,j) = q_i · k_j 的相似度 · 颜色越深越像
  </text>

  <!-- Score heatmap 5x5 -->
  <g>
    <!-- Column header labels (keys) above -->
    <g font-size="12" fill="#4b5563" text-anchor="middle">
      <text x="500" y="144">The</text>
      <text x="544" y="144">cat</text>
      <text x="588" y="144" font-weight="700" fill="#1f2937">sat</text>
      <text x="632" y="144">on</text>
      <text x="676" y="144">mat</text>
    </g>
    <text x="588" y="129" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
      key (列)
    </text>

    <!-- Row labels (queries) on the right side (will use left for clarity) -->
    <text x="468" y="167" text-anchor="end" font-size="12" fill="#4b5563">The</text>
    <text x="468" y="195" text-anchor="end" font-size="12" fill="#4b5563">cat</text>
    <text x="468" y="223" text-anchor="end" font-size="12" fill="#1f2937" font-weight="700">sat</text>
    <text x="468" y="251" text-anchor="end" font-size="12" fill="#4b5563">on</text>
    <text x="468" y="279" text-anchor="end" font-size="12" fill="#4b5563">mat</text>
    <text x="442" y="223" text-anchor="end" font-size="11" fill="#6b7280" font-style="italic">
      query →
    </text>

    <!-- 5x5 cells: each 28x22, starting at x=478, y=150 -->
    <!-- Row 1 (The) -->
    <rect x="478" y="152" width="44" height="22" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="500" y="167" text-anchor="middle" font-size="10" fill="#3730a3">1.2</text>
    <rect x="522" y="152" width="44" height="22" fill="#c7d2fe" stroke="#a5b4fc"/>
    <text x="544" y="167" text-anchor="middle" font-size="10" fill="#3730a3">2.1</text>
    <rect x="566" y="152" width="44" height="22" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="588" y="167" text-anchor="middle" font-size="10" fill="#3730a3">0.8</text>
    <rect x="610" y="152" width="44" height="22" fill="#eef2ff" stroke="#e0e7ff"/>
    <text x="632" y="167" text-anchor="middle" font-size="10" fill="#3730a3">0.3</text>
    <rect x="654" y="152" width="44" height="22" fill="#eef2ff" stroke="#e0e7ff"/>
    <text x="676" y="167" text-anchor="middle" font-size="10" fill="#3730a3">0.4</text>

    <!-- Row 2 (cat) -->
    <rect x="478" y="180" width="44" height="22" fill="#c7d2fe" stroke="#a5b4fc"/>
    <text x="500" y="195" text-anchor="middle" font-size="10" fill="#3730a3">2.0</text>
    <rect x="522" y="180" width="44" height="22" fill="#818cf8" stroke="#6366f1"/>
    <text x="544" y="195" text-anchor="middle" font-size="10" fill="#fff">3.5</text>
    <rect x="566" y="180" width="44" height="22" fill="#c7d2fe" stroke="#a5b4fc"/>
    <text x="588" y="195" text-anchor="middle" font-size="10" fill="#3730a3">1.9</text>
    <rect x="610" y="180" width="44" height="22" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="632" y="195" text-anchor="middle" font-size="10" fill="#3730a3">0.7</text>
    <rect x="654" y="180" width="44" height="22" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="676" y="195" text-anchor="middle" font-size="10" fill="#3730a3">0.6</text>

    <!-- Row 3 (sat) - HIGHLIGHTED -->
    <rect x="478" y="208" width="44" height="22" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="500" y="223" text-anchor="middle" font-size="10" fill="#3730a3" font-weight="700">1.0</text>
    <rect x="522" y="208" width="44" height="22" fill="#818cf8" stroke="#4338ca" stroke-width="2"/>
    <text x="544" y="223" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">3.2</text>
    <rect x="566" y="208" width="44" height="22" fill="#4f46e5" stroke="#4338ca" stroke-width="2"/>
    <text x="588" y="223" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">5.0</text>
    <rect x="610" y="208" width="44" height="22" fill="#a5b4fc" stroke="#4338ca" stroke-width="2"/>
    <text x="632" y="223" text-anchor="middle" font-size="10" fill="#3730a3" font-weight="700">2.4</text>
    <rect x="654" y="208" width="44" height="22" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
    <text x="676" y="223" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">4.1</text>

    <!-- Row 4 (on) -->
    <rect x="478" y="236" width="44" height="22" fill="#eef2ff" stroke="#e0e7ff"/>
    <text x="500" y="251" text-anchor="middle" font-size="10" fill="#3730a3">0.4</text>
    <rect x="522" y="236" width="44" height="22" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="544" y="251" text-anchor="middle" font-size="10" fill="#3730a3">0.9</text>
    <rect x="566" y="236" width="44" height="22" fill="#c7d2fe" stroke="#a5b4fc"/>
    <text x="588" y="251" text-anchor="middle" font-size="10" fill="#3730a3">2.2</text>
    <rect x="610" y="236" width="44" height="22" fill="#a5b4fc" stroke="#818cf8"/>
    <text x="632" y="251" text-anchor="middle" font-size="10" fill="#3730a3">2.8</text>
    <rect x="654" y="236" width="44" height="22" fill="#c7d2fe" stroke="#a5b4fc"/>
    <text x="676" y="251" text-anchor="middle" font-size="10" fill="#3730a3">1.7</text>

    <!-- Row 5 (mat) -->
    <rect x="478" y="264" width="44" height="22" fill="#eef2ff" stroke="#e0e7ff"/>
    <text x="500" y="279" text-anchor="middle" font-size="10" fill="#3730a3">0.5</text>
    <rect x="522" y="264" width="44" height="22" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="544" y="279" text-anchor="middle" font-size="10" fill="#3730a3">0.8</text>
    <rect x="566" y="264" width="44" height="22" fill="#c7d2fe" stroke="#a5b4fc"/>
    <text x="588" y="279" text-anchor="middle" font-size="10" fill="#3730a3">2.0</text>
    <rect x="610" y="264" width="44" height="22" fill="#a5b4fc" stroke="#818cf8"/>
    <text x="632" y="279" text-anchor="middle" font-size="10" fill="#3730a3">2.5</text>
    <rect x="654" y="264" width="44" height="22" fill="#6366f1" stroke="#4f46e5"/>
    <text x="676" y="279" text-anchor="middle" font-size="10" fill="#fff">3.8</text>
  </g>

  <!-- 注释:第 3 行高亮 -->
  <text x="720" y="223" text-anchor="start" font-size="11" fill="#4338ca" font-style="italic">
    ← q_sat 这一行
  </text>

  <!-- horizontal divider between row 1 and row 2 -->
  <line x1="40" y1="335" x2="860" y2="335"
        stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============================================================== -->
  <!-- ROW 2: Step 3 + Step 4 (softmax / weighted sum)                 -->
  <!-- ============================================================== -->

  <!-- ─── Step 3 label (LEFT block, x=40-440) ─── -->
  <text x="50" y="370" text-anchor="start" font-size="14"
        fill="#1f2937" font-weight="700">
    ③ softmax 行归一化 → α
  </text>
  <text x="50" y="388" text-anchor="start" font-size="11" fill="#6b7280">
    只看 "sat" 行:权重和 = 1
  </text>

  <!-- Single "sat" row with weights, drawn larger -->
  <g>
    <!-- Column headers -->
    <g font-size="11" fill="#4b5563" text-anchor="middle">
      <text x="105" y="415">The</text>
      <text x="155" y="415">cat</text>
      <text x="205" y="415" font-weight="700" fill="#1f2937">sat</text>
      <text x="255" y="415">on</text>
      <text x="305" y="415">mat</text>
    </g>
    <text x="60" y="442" text-anchor="end" font-size="12" fill="#1f2937" font-weight="700">sat</text>
    <!-- 5 weight cells -->
    <rect x="80" y="425" width="50" height="28" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
    <text x="105" y="444" text-anchor="middle" font-size="13" fill="#3730a3" font-weight="700">.02</text>
    <rect x="130" y="425" width="50" height="28" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
    <text x="155" y="444" text-anchor="middle" font-size="13" fill="#3730a3" font-weight="700">.18</text>
    <rect x="180" y="425" width="50" height="28" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
    <text x="205" y="444" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">.45</text>
    <rect x="230" y="425" width="50" height="28" fill="#a5b4fc" stroke="#4338ca" stroke-width="1.5"/>
    <text x="255" y="444" text-anchor="middle" font-size="13" fill="#3730a3" font-weight="700">.10</text>
    <rect x="280" y="425" width="50" height="28" fill="#6366f1" stroke="#4338ca" stroke-width="1.5"/>
    <text x="305" y="444" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">.25</text>

    <!-- Sum -->
    <text x="345" y="444" text-anchor="start" font-size="12" fill="#6b7280">= 1.00</text>

    <!-- Interpretation -->
    <text x="205" y="478" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">
      q_sat 重点关注 "sat" (.45) 和 "mat" (.25) —— 这就是 attention 的"对齐"
    </text>
  </g>

  <!-- vertical divider between Step 3 and Step 4 -->
  <line x1="450" y1="350" x2="450" y2="510"
        stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ─── Step 4 label (RIGHT block, x=470-870) ─── -->
  <text x="480" y="370" text-anchor="start" font-size="14"
        fill="#1f2937" font-weight="700">
    ④ α · V → z_sat
  </text>
  <text x="480" y="388" text-anchor="start" font-size="11" fill="#6b7280">
    α 给 V 的每一行加权求和
  </text>

  <!-- Show the weighted aggregation visually with 5 bars -->
  <g>
    <!-- 5 V row representations: width proportional to weight -->
    <!-- weight .02 → very narrow -->
    <rect x="500" y="412" width="6" height="14" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="490" y="423" text-anchor="end" font-size="10" fill="#9d174d">.02·v_The</text>

    <rect x="500" y="430" width="32" height="14" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="490" y="441" text-anchor="end" font-size="10" fill="#9d174d">.18·v_cat</text>

    <rect x="500" y="448" width="80" height="14" fill="#fbcfe8" stroke="#9d174d" stroke-width="2"/>
    <text x="490" y="459" text-anchor="end" font-size="10" fill="#9d174d" font-weight="700">.45·v_sat</text>

    <rect x="500" y="466" width="18" height="14" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="490" y="477" text-anchor="end" font-size="10" fill="#9d174d">.10·v_on</text>

    <rect x="500" y="484" width="45" height="14" fill="#fbcfe8" stroke="#db2777" stroke-width="1.5"/>
    <text x="490" y="495" text-anchor="end" font-size="10" fill="#9d174d">.25·v_mat</text>

    <!-- + sign and result -->
    <text x="595" y="455" text-anchor="middle" font-size="20" fill="#9ca3af" font-weight="700">Σ</text>

    <line x1="615" y1="455" x2="640" y2="455"
          stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-att)"/>

    <rect x="648" y="438" width="120" height="36" rx="6"
          fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="708" y="455" text-anchor="middle" font-size="13" fill="#065f46" font-weight="700">
      z_sat
    </text>
    <text x="708" y="468" text-anchor="middle" font-size="10" fill="#065f46">
      [d_v]
    </text>
  </g>

  <!-- horizontal divider between row 2 and bottom panel -->
  <line x1="40" y1="525" x2="860" y2="525"
        stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============================================================== -->
  <!-- BOTTOM PANEL: RNN vs Self-Attention                              -->
  <!-- ============================================================== -->
  <text x="450" y="558" text-anchor="middle" font-size="15"
        fill="#1f2937" font-weight="700">
    为什么这样赢了 RNN:一次矩阵乘搞定所有 (query, key) 配对
  </text>

  <!-- LEFT: RNN -->
  <g>
    <text x="200" y="595" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="700">
      RNN(2014 Seq2Seq)
    </text>

    <!-- 4 RNN cells with arrows between -->
    <g stroke="#fca5a5" stroke-width="1.5" fill="#fee2e2">
      <rect x="60" y="620" width="55" height="34" rx="5"/>
      <rect x="142" y="620" width="55" height="34" rx="5"/>
      <rect x="224" y="620" width="55" height="34" rx="5"/>
      <rect x="306" y="620" width="55" height="34" rx="5"/>
    </g>
    <g font-size="12" fill="#7f1d1d" text-anchor="middle">
      <text x="87" y="641">h_1</text>
      <text x="169" y="641">h_2</text>
      <text x="251" y="641">h_3</text>
      <text x="333" y="641">h_4</text>
    </g>
    <g stroke="#dc2626" stroke-width="1.5" fill="none">
      <line x1="117" y1="637" x2="140" y2="637" marker-end="url(#arr-att-pink)"/>
      <line x1="199" y1="637" x2="222" y2="637" marker-end="url(#arr-att-pink)"/>
      <line x1="281" y1="637" x2="304" y2="637" marker-end="url(#arr-att-pink)"/>
    </g>

    <text x="200" y="678" text-anchor="middle" font-size="11" fill="#7f1d1d">
      串行展开 · T 步 sequential GPU launch
    </text>
    <text x="200" y="700" text-anchor="middle" font-size="12" fill="#7f1d1d" font-weight="700">
      O(T·d²) 时间 · O(T) 串行
    </text>
    <text x="200" y="722" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">
      序列长度直接锁死训练时间
    </text>
  </g>

  <!-- middle big arrow -->
  <text x="450" y="650" text-anchor="middle" font-size="32" fill="#9ca3af" font-weight="300">→</text>

  <!-- RIGHT: Self-Attention -->
  <g>
    <text x="700" y="595" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="700">
      Self-Attention(2017 Transformer)
    </text>

    <!-- Single big matmul box -->
    <rect x="520" y="620" width="360" height="34" rx="5"
          fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="700" y="642" text-anchor="middle" font-size="14" fill="#1e3a8a" font-weight="600">
      softmax(Q · K^T / √d_k) · V
    </text>

    <text x="700" y="678" text-anchor="middle" font-size="11" fill="#1e40af">
      一次矩阵乘 · 所有 (i, j) 配对并行
    </text>
    <text x="700" y="700" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700">
      O(T²·d) 时间 · O(1) 串行
    </text>
    <text x="700" y="722" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">
      GPU 一次跑完,序列长度只影响显存
    </text>
  </g>

  <!-- Footnote -->
  <text x="450" y="752" text-anchor="middle" font-size="11" fill="#6b7280">
    任意 token 之间路径长度从 O(T) 缩到 O(1) · 代价是 O(T²) 复杂度,长上下文需 sparse / flash attention
  </text>

</svg>
