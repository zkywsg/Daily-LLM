<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-mh" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arr-mh-light" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ============== TITLE ============== -->
  <text x="400" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Multi-Head Attention · 把 d_model 切成 h 份,并行学不同关系
  </text>
  <text x="400" y="48" text-anchor="middle" font-size="12"
        fill="#6b7280">
    原版:d_model = 512, h = 8, 每头 d_k = 64 · 参数总量不变,只是分给 8 个角色
  </text>

  <!-- ============== UPPER PANEL: dimension slicing ============== -->
  <text x="50" y="85" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">
    1. d_model = 512 维输入被切成 h = 8 个子空间
  </text>

  <!-- Input X box -->
  <rect x="50" y="100" width="120" height="40" rx="6"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="110" y="119" text-anchor="middle" font-size="13" fill="#92400e" font-weight="600">x</text>
  <text x="110" y="133" text-anchor="middle" font-size="10" fill="#92400e">[N, 512]</text>

  <!-- Arrow to QKV projection -->
  <line x1="172" y1="120" x2="195" y2="120" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>

  <!-- QKV projection block -->
  <rect x="198" y="100" width="80" height="40" rx="6"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="238" y="120" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">W_Q,K,V</text>
  <text x="238" y="133" text-anchor="middle" font-size="9" fill="#9d174d">3·512×512</text>

  <!-- 输出 Q K V 三股 -->
  <line x1="280" y1="120" x2="305" y2="120" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>

  <!-- 8 颗切片 stacked vertically with brace -->
  <text x="395" y="98" text-anchor="middle" font-size="11" fill="#6b7280">
    沿特征维度切 8 份(每份 d_k=64)
  </text>

  <g>
    <!-- 8 narrow slices side by side -->
    <g stroke="#3b82f6" stroke-width="1" fill="#dbeafe">
      <rect x="310" y="108" width="18" height="22" rx="2"/>
      <rect x="330" y="108" width="18" height="22" rx="2"/>
      <rect x="350" y="108" width="18" height="22" rx="2"/>
      <rect x="370" y="108" width="18" height="22" rx="2"/>
      <rect x="390" y="108" width="18" height="22" rx="2"/>
      <rect x="410" y="108" width="18" height="22" rx="2"/>
      <rect x="430" y="108" width="18" height="22" rx="2"/>
      <rect x="450" y="108" width="18" height="22" rx="2"/>
    </g>
    <g font-size="9" fill="#1e3a8a" text-anchor="middle">
      <text x="319" y="123">h₁</text>
      <text x="339" y="123">h₂</text>
      <text x="359" y="123">h₃</text>
      <text x="379" y="123">h₄</text>
      <text x="399" y="123">h₅</text>
      <text x="419" y="123">h₆</text>
      <text x="439" y="123">h₇</text>
      <text x="459" y="123">h₈</text>
    </g>
    <text x="389" y="148" text-anchor="middle" font-size="10" fill="#1e40af">
      [N, 512] = concat( [N, 64] × 8 )
    </text>
  </g>

  <!-- 参数对比 callout -->
  <g>
    <rect x="500" y="100" width="260" height="50" rx="6"
          fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="630" y="118" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">
      参数预算 = 4 · d_model² · 与单头一样
    </text>
    <text x="630" y="133" text-anchor="middle" font-size="10" fill="#065f46">
      单头 d_k=512 vs 8 头各 d_k=64
    </text>
    <text x="630" y="146" text-anchor="middle" font-size="10" fill="#065f46">
      multi-head 不增参数,只把"表达能力"分给 8 个角色
    </text>
  </g>

  <!-- ============== DIVIDER 1 ============== -->
  <line x1="40" y1="175" x2="760" y2="175"
        stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============== MIDDLE: 8 heads run in parallel ============== -->
  <text x="50" y="200" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">
    2. 8 个 head 并行跑 scaled dot-product attention
  </text>

  <!-- 8 head boxes (show 3 + dots + 1 to keep readable) -->
  <g>
    <!-- Head 1 -->
    <g>
      <rect x="60" y="220" width="120" height="80" rx="6"
            fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="120" y="237" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="700">head 1</text>
      <text x="120" y="251" text-anchor="middle" font-size="9" fill="#1e40af" font-style="italic">→ 词法依赖</text>
      <!-- mini attention pattern (5x5 grid) -->
      <g stroke="#a5b4fc" stroke-width="0.5" fill="#dbeafe">
        <!-- 简化:对角线高亮 -->
        <rect x="80" y="258" width="6" height="6"/>
        <rect x="86" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="92" y="258" width="6" height="6"/>
        <rect x="98" y="258" width="6" height="6"/>
        <rect x="104" y="258" width="6" height="6"/>
        <rect x="80" y="264" width="6" height="6" fill="#1e40af"/>
        <rect x="86" y="264" width="6" height="6"/>
        <rect x="92" y="264" width="6" height="6" fill="#1e40af"/>
        <rect x="98" y="264" width="6" height="6"/>
        <rect x="104" y="264" width="6" height="6"/>
        <rect x="80" y="270" width="6" height="6"/>
        <rect x="86" y="270" width="6" height="6" fill="#1e40af"/>
        <rect x="92" y="270" width="6" height="6"/>
        <rect x="98" y="270" width="6" height="6" fill="#1e40af"/>
        <rect x="104" y="270" width="6" height="6"/>
        <rect x="80" y="276" width="6" height="6"/>
        <rect x="86" y="276" width="6" height="6"/>
        <rect x="92" y="276" width="6" height="6" fill="#1e40af"/>
        <rect x="98" y="276" width="6" height="6"/>
        <rect x="104" y="276" width="6" height="6" fill="#1e40af"/>
        <rect x="80" y="282" width="6" height="6"/>
        <rect x="86" y="282" width="6" height="6"/>
        <rect x="92" y="282" width="6" height="6"/>
        <rect x="98" y="282" width="6" height="6" fill="#1e40af"/>
        <rect x="104" y="282" width="6" height="6"/>
      </g>
      <text x="155" y="276" text-anchor="middle" font-size="9" fill="#6b7280">attn pattern</text>
    </g>

    <!-- Head 2 -->
    <g>
      <rect x="195" y="220" width="120" height="80" rx="6"
            fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="255" y="237" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="700">head 2</text>
      <text x="255" y="251" text-anchor="middle" font-size="9" fill="#1e40af" font-style="italic">→ 共指/指代</text>
      <!-- mini attention pattern: 块状 -->
      <g stroke="#a5b4fc" stroke-width="0.5" fill="#dbeafe">
        <rect x="215" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="221" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="227" y="258" width="6" height="6"/>
        <rect x="233" y="258" width="6" height="6"/>
        <rect x="239" y="258" width="6" height="6"/>
        <rect x="215" y="264" width="6" height="6" fill="#1e40af"/>
        <rect x="221" y="264" width="6" height="6" fill="#1e40af"/>
        <rect x="227" y="264" width="6" height="6"/>
        <rect x="233" y="264" width="6" height="6"/>
        <rect x="239" y="264" width="6" height="6"/>
        <rect x="215" y="270" width="6" height="6"/>
        <rect x="221" y="270" width="6" height="6"/>
        <rect x="227" y="270" width="6" height="6" fill="#1e40af"/>
        <rect x="233" y="270" width="6" height="6" fill="#1e40af"/>
        <rect x="239" y="270" width="6" height="6"/>
        <rect x="215" y="276" width="6" height="6"/>
        <rect x="221" y="276" width="6" height="6"/>
        <rect x="227" y="276" width="6" height="6" fill="#1e40af"/>
        <rect x="233" y="276" width="6" height="6" fill="#1e40af"/>
        <rect x="239" y="276" width="6" height="6"/>
        <rect x="215" y="282" width="6" height="6"/>
        <rect x="221" y="282" width="6" height="6"/>
        <rect x="227" y="282" width="6" height="6"/>
        <rect x="233" y="282" width="6" height="6"/>
        <rect x="239" y="282" width="6" height="6" fill="#1e40af"/>
      </g>
      <text x="290" y="276" text-anchor="middle" font-size="9" fill="#6b7280">attn pattern</text>
    </g>

    <!-- Head 3 -->
    <g>
      <rect x="330" y="220" width="120" height="80" rx="6"
            fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="390" y="237" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="700">head 3</text>
      <text x="390" y="251" text-anchor="middle" font-size="9" fill="#1e40af" font-style="italic">→ 句法结构</text>
      <!-- mini attention pattern: 上三角 -->
      <g stroke="#a5b4fc" stroke-width="0.5" fill="#dbeafe">
        <rect x="350" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="356" y="258" width="6" height="6"/>
        <rect x="362" y="258" width="6" height="6"/>
        <rect x="368" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="374" y="258" width="6" height="6"/>
        <rect x="350" y="264" width="6" height="6"/>
        <rect x="356" y="264" width="6" height="6" fill="#1e40af"/>
        <rect x="362" y="264" width="6" height="6"/>
        <rect x="368" y="264" width="6" height="6"/>
        <rect x="374" y="264" width="6" height="6" fill="#1e40af"/>
        <rect x="350" y="270" width="6" height="6"/>
        <rect x="356" y="270" width="6" height="6"/>
        <rect x="362" y="270" width="6" height="6" fill="#1e40af"/>
        <rect x="368" y="270" width="6" height="6"/>
        <rect x="374" y="270" width="6" height="6"/>
        <rect x="350" y="276" width="6" height="6" fill="#1e40af"/>
        <rect x="356" y="276" width="6" height="6"/>
        <rect x="362" y="276" width="6" height="6"/>
        <rect x="368" y="276" width="6" height="6" fill="#1e40af"/>
        <rect x="374" y="276" width="6" height="6"/>
        <rect x="350" y="282" width="6" height="6"/>
        <rect x="356" y="282" width="6" height="6" fill="#1e40af"/>
        <rect x="362" y="282" width="6" height="6"/>
        <rect x="368" y="282" width="6" height="6"/>
        <rect x="374" y="282" width="6" height="6" fill="#1e40af"/>
      </g>
      <text x="425" y="276" text-anchor="middle" font-size="9" fill="#6b7280">attn pattern</text>
    </g>

    <!-- "..." dots -->
    <text x="490" y="265" text-anchor="middle" font-size="18" fill="#9ca3af" font-weight="700">···</text>
    <text x="490" y="285" text-anchor="middle" font-size="10" fill="#9ca3af">4-7</text>

    <!-- Head 8 -->
    <g>
      <rect x="525" y="220" width="120" height="80" rx="6"
            fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="585" y="237" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="700">head 8</text>
      <text x="585" y="251" text-anchor="middle" font-size="9" fill="#1e40af" font-style="italic">→ 长距离依赖</text>
      <!-- mini attention pattern: 横向 -->
      <g stroke="#a5b4fc" stroke-width="0.5" fill="#dbeafe">
        <rect x="545" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="551" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="557" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="563" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="569" y="258" width="6" height="6" fill="#1e40af"/>
        <rect x="545" y="264" width="6" height="6"/>
        <rect x="551" y="264" width="6" height="6"/>
        <rect x="557" y="264" width="6" height="6"/>
        <rect x="563" y="264" width="6" height="6"/>
        <rect x="569" y="264" width="6" height="6"/>
        <rect x="545" y="270" width="6" height="6"/>
        <rect x="551" y="270" width="6" height="6"/>
        <rect x="557" y="270" width="6" height="6"/>
        <rect x="563" y="270" width="6" height="6"/>
        <rect x="569" y="270" width="6" height="6"/>
        <rect x="545" y="276" width="6" height="6"/>
        <rect x="551" y="276" width="6" height="6"/>
        <rect x="557" y="276" width="6" height="6"/>
        <rect x="563" y="276" width="6" height="6"/>
        <rect x="569" y="276" width="6" height="6"/>
        <rect x="545" y="282" width="6" height="6" fill="#1e40af"/>
        <rect x="551" y="282" width="6" height="6" fill="#1e40af"/>
        <rect x="557" y="282" width="6" height="6" fill="#1e40af"/>
        <rect x="563" y="282" width="6" height="6" fill="#1e40af"/>
        <rect x="569" y="282" width="6" height="6" fill="#1e40af"/>
      </g>
      <text x="620" y="276" text-anchor="middle" font-size="9" fill="#6b7280">attn pattern</text>
    </g>

    <!-- output per head -->
    <g font-size="9" fill="#6b7280">
      <text x="120" y="316" text-anchor="middle">→ z_1 [N, 64]</text>
      <text x="255" y="316" text-anchor="middle">→ z_2 [N, 64]</text>
      <text x="390" y="316" text-anchor="middle">→ z_3 [N, 64]</text>
      <text x="585" y="316" text-anchor="middle">→ z_8 [N, 64]</text>
    </g>
  </g>

  <!-- 标注:不同头学不同 pattern -->
  <text x="660" y="260" text-anchor="start" font-size="10" fill="#6b7280" font-style="italic">
    不同头学到
  </text>
  <text x="660" y="275" text-anchor="start" font-size="10" fill="#6b7280" font-style="italic">
    不同 attention
  </text>
  <text x="660" y="290" text-anchor="start" font-size="10" fill="#6b7280" font-style="italic">
    模式
  </text>

  <!-- ============== DIVIDER 2 ============== -->
  <line x1="40" y1="345" x2="760" y2="345"
        stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============== LOWER PANEL: concat + W^O ============== -->
  <text x="50" y="370" text-anchor="start" font-size="13" fill="#1f2937" font-weight="600">
    3. concat 8 个头输出 + W^O 投影回 d_model
  </text>

  <!-- 8 outputs stacked -->
  <g>
    <text x="100" y="392" text-anchor="middle" font-size="10" fill="#1e40af">z_1</text>
    <rect x="80" y="395" width="40" height="18" rx="2" stroke="#3b82f6" stroke-width="1" fill="#dbeafe"/>
    <text x="150" y="392" text-anchor="middle" font-size="10" fill="#1e40af">z_2</text>
    <rect x="130" y="395" width="40" height="18" rx="2" stroke="#3b82f6" stroke-width="1" fill="#dbeafe"/>
    <text x="200" y="392" text-anchor="middle" font-size="10" fill="#1e40af">z_3</text>
    <rect x="180" y="395" width="40" height="18" rx="2" stroke="#3b82f6" stroke-width="1" fill="#dbeafe"/>
    <text x="250" y="392" text-anchor="middle" font-size="10" fill="#9ca3af">···</text>
    <rect x="230" y="395" width="40" height="18" rx="2" stroke="#9ca3af" stroke-dasharray="2,2" stroke-width="1" fill="#f3f4f6"/>
    <text x="300" y="392" text-anchor="middle" font-size="10" fill="#1e40af">z_8</text>
    <rect x="280" y="395" width="40" height="18" rx="2" stroke="#3b82f6" stroke-width="1" fill="#dbeafe"/>
  </g>

  <!-- concat arrow -->
  <line x1="325" y1="404" x2="350" y2="404" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>
  <text x="338" y="395" text-anchor="middle" font-size="10" fill="#6b7280">concat</text>

  <!-- Concatenated -->
  <rect x="355" y="395" width="120" height="18" rx="2" stroke="#3b82f6" stroke-width="1.5" fill="#bfdbfe"/>
  <text x="415" y="408" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="600">[N, 512]</text>

  <!-- arrow to W^O -->
  <line x1="480" y1="404" x2="505" y2="404" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>

  <!-- W^O projection -->
  <rect x="508" y="394" width="70" height="22" rx="4"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="543" y="409" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">W^O</text>

  <!-- arrow to output -->
  <line x1="582" y1="404" x2="608" y2="404" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>

  <!-- Final output -->
  <rect x="612" y="390" width="120" height="30" rx="6"
        fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="672" y="409" text-anchor="middle" font-size="11" fill="#065f46" font-weight="700">
    MultiHead [N, 512]
  </text>

  <!-- callout: parameter count -->
  <g>
    <rect x="80" y="445" width="680" height="70" rx="6"
          fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="420" y="465" text-anchor="middle" font-size="12" fill="#78350f" font-weight="700">
      参数账:Multi-Head 与单头的真实对比
    </text>
    <text x="420" y="483" text-anchor="middle" font-size="11" fill="#78350f">
      单头 d_k=512: W_Q,K,V,O 各 512×512 → <tspan font-weight="600">4 × 262K = 1.05M 参数</tspan>
    </text>
    <text x="420" y="500" text-anchor="middle" font-size="11" fill="#78350f">
      8 头 d_k=64: 每头 W_Q,K,V 各 512×64 + W^O 一个 512×512 → <tspan font-weight="600">4 × 262K = 1.05M 参数</tspan>
    </text>
  </g>

</svg>
