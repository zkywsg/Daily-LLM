<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-mh" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- ============== TITLE ============== -->
  <text x="450" y="32" text-anchor="middle" font-size="17"
        fill="#1f2937" font-weight="600">
    Multi-Head Attention · 把 d_model 切成 h 份并行
  </text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">
    原版:d_model = 512, h = 8, 每头 d_k = 64 · 同样的参数预算分给 8 个角色
  </text>

  <!-- ============================================================== -->
  <!-- PANEL 1: 切片 — d_model = 512 → 8 个 d_k = 64                    -->
  <!-- ============================================================== -->
  <text x="50" y="100" text-anchor="start" font-size="14"
        fill="#1f2937" font-weight="700">
    ① 切片:沿特征维度把 d_model = 512 切成 8 个 d_k = 64
  </text>

  <!-- Input X box (left) -->
  <rect x="60" y="130" width="120" height="42" rx="6"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="151" text-anchor="middle" font-size="14" fill="#92400e" font-weight="600">x</text>
  <text x="120" y="166" text-anchor="middle" font-size="11" fill="#92400e">[N, 512]</text>

  <line x1="184" y1="151" x2="210" y2="151"
        stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>

  <!-- W_Q/K/V projection block -->
  <rect x="214" y="130" width="100" height="42" rx="6"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="264" y="151" text-anchor="middle" font-size="13" fill="#9d174d" font-weight="600">W_Q, W_K, W_V</text>
  <text x="264" y="166" text-anchor="middle" font-size="10" fill="#9d174d">3 × 512×512</text>

  <line x1="318" y1="151" x2="344" y2="151"
        stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>

  <!-- 8 slices side by side -->
  <!-- Labels above -->
  <g font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="600">
    <text x="365" y="120">h₁</text>
    <text x="395" y="120">h₂</text>
    <text x="425" y="120">h₃</text>
    <text x="455" y="120">h₄</text>
    <text x="485" y="120">h₅</text>
    <text x="515" y="120">h₆</text>
    <text x="545" y="120">h₇</text>
    <text x="575" y="120">h₈</text>
  </g>
  <!-- 8 slice rects -->
  <g stroke="#3b82f6" stroke-width="1.2" fill="#dbeafe">
    <rect x="352" y="130" width="26" height="42" rx="2"/>
    <rect x="382" y="130" width="26" height="42" rx="2"/>
    <rect x="412" y="130" width="26" height="42" rx="2"/>
    <rect x="442" y="130" width="26" height="42" rx="2"/>
    <rect x="472" y="130" width="26" height="42" rx="2"/>
    <rect x="502" y="130" width="26" height="42" rx="2"/>
    <rect x="532" y="130" width="26" height="42" rx="2"/>
    <rect x="562" y="130" width="26" height="42" rx="2"/>
  </g>
  <text x="470" y="194" text-anchor="middle" font-size="11" fill="#1e40af">
    每片 [N, 64] · 8 × 64 = 512
  </text>

  <!-- Callout: 参数预算 -->
  <g>
    <rect x="610" y="120" width="260" height="62" rx="6"
          fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="740" y="142" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">
      参数预算与单头一样
    </text>
    <text x="740" y="160" text-anchor="middle" font-size="11" fill="#065f46">
      单头 d_k=512 vs 8 头各 d_k=64
    </text>
    <text x="740" y="176" text-anchor="middle" font-size="11" fill="#065f46">
      都是 4 · d_model² = 1.05M 参数
    </text>
  </g>

  <!-- horizontal divider -->
  <line x1="40" y1="218" x2="860" y2="218"
        stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============================================================== -->
  <!-- PANEL 2: 并行 — 4 头并行跑(展示 + 省略)                          -->
  <!-- ============================================================== -->
  <text x="50" y="248" text-anchor="start" font-size="14"
        fill="#1f2937" font-weight="700">
    ② 并行:8 个 head 独立跑 scaled dot-product attention
  </text>
  <text x="50" y="266" text-anchor="start" font-size="11" fill="#6b7280">
    不同头学到不同关系模式(展示 4 个代表)
  </text>

  <!-- 4 head boxes side by side, each 180px wide -->
  <!-- head 1 -->
  <g>
    <rect x="50" y="285" width="190" height="160" rx="8"
          fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="145" y="307" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="700">head 1</text>
    <text x="145" y="324" text-anchor="middle" font-size="11" fill="#1e40af" font-style="italic">学到:词法依赖</text>

    <!-- 5x5 attention pattern, 12px cells, centered around x=145, y=335-395 -->
    <g stroke="#a5b4fc" stroke-width="0.5" fill="#dbeafe">
      <!-- 对角线 pattern: high on diagonal -->
      <rect x="113" y="345" width="12" height="12"/>
      <rect x="125" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="137" y="345" width="12" height="12"/>
      <rect x="149" y="345" width="12" height="12"/>
      <rect x="161" y="345" width="12" height="12"/>

      <rect x="113" y="357" width="12" height="12" fill="#1e40af"/>
      <rect x="125" y="357" width="12" height="12"/>
      <rect x="137" y="357" width="12" height="12" fill="#1e40af"/>
      <rect x="149" y="357" width="12" height="12"/>
      <rect x="161" y="357" width="12" height="12"/>

      <rect x="113" y="369" width="12" height="12"/>
      <rect x="125" y="369" width="12" height="12" fill="#1e40af"/>
      <rect x="137" y="369" width="12" height="12"/>
      <rect x="149" y="369" width="12" height="12" fill="#1e40af"/>
      <rect x="161" y="369" width="12" height="12"/>

      <rect x="113" y="381" width="12" height="12"/>
      <rect x="125" y="381" width="12" height="12"/>
      <rect x="137" y="381" width="12" height="12" fill="#1e40af"/>
      <rect x="149" y="381" width="12" height="12"/>
      <rect x="161" y="381" width="12" height="12" fill="#1e40af"/>

      <rect x="113" y="393" width="12" height="12"/>
      <rect x="125" y="393" width="12" height="12"/>
      <rect x="137" y="393" width="12" height="12"/>
      <rect x="149" y="393" width="12" height="12" fill="#1e40af"/>
      <rect x="161" y="393" width="12" height="12"/>
    </g>
    <text x="145" y="424" text-anchor="middle" font-size="10" fill="#6b7280">
      attention pattern
    </text>
    <text x="145" y="436" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600">
      → z₁ [N, 64]
    </text>
  </g>

  <!-- head 2 -->
  <g>
    <rect x="250" y="285" width="190" height="160" rx="8"
          fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="345" y="307" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="700">head 2</text>
    <text x="345" y="324" text-anchor="middle" font-size="11" fill="#1e40af" font-style="italic">学到:共指 / 指代</text>

    <!-- 块状 pattern: 左上 + 右下 high -->
    <g stroke="#a5b4fc" stroke-width="0.5" fill="#dbeafe">
      <rect x="313" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="325" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="337" y="345" width="12" height="12"/>
      <rect x="349" y="345" width="12" height="12"/>
      <rect x="361" y="345" width="12" height="12"/>

      <rect x="313" y="357" width="12" height="12" fill="#1e40af"/>
      <rect x="325" y="357" width="12" height="12" fill="#1e40af"/>
      <rect x="337" y="357" width="12" height="12"/>
      <rect x="349" y="357" width="12" height="12"/>
      <rect x="361" y="357" width="12" height="12"/>

      <rect x="313" y="369" width="12" height="12"/>
      <rect x="325" y="369" width="12" height="12"/>
      <rect x="337" y="369" width="12" height="12" fill="#1e40af"/>
      <rect x="349" y="369" width="12" height="12" fill="#1e40af"/>
      <rect x="361" y="369" width="12" height="12"/>

      <rect x="313" y="381" width="12" height="12"/>
      <rect x="325" y="381" width="12" height="12"/>
      <rect x="337" y="381" width="12" height="12" fill="#1e40af"/>
      <rect x="349" y="381" width="12" height="12" fill="#1e40af"/>
      <rect x="361" y="381" width="12" height="12"/>

      <rect x="313" y="393" width="12" height="12"/>
      <rect x="325" y="393" width="12" height="12"/>
      <rect x="337" y="393" width="12" height="12"/>
      <rect x="349" y="393" width="12" height="12"/>
      <rect x="361" y="393" width="12" height="12" fill="#1e40af"/>
    </g>
    <text x="345" y="424" text-anchor="middle" font-size="10" fill="#6b7280">
      attention pattern
    </text>
    <text x="345" y="436" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600">
      → z₂ [N, 64]
    </text>
  </g>

  <!-- head 3 -->
  <g>
    <rect x="450" y="285" width="190" height="160" rx="8"
          fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="545" y="307" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="700">head 3</text>
    <text x="545" y="324" text-anchor="middle" font-size="11" fill="#1e40af" font-style="italic">学到:句法结构</text>

    <!-- 散点 pattern -->
    <g stroke="#a5b4fc" stroke-width="0.5" fill="#dbeafe">
      <rect x="513" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="525" y="345" width="12" height="12"/>
      <rect x="537" y="345" width="12" height="12"/>
      <rect x="549" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="561" y="345" width="12" height="12"/>

      <rect x="513" y="357" width="12" height="12"/>
      <rect x="525" y="357" width="12" height="12" fill="#1e40af"/>
      <rect x="537" y="357" width="12" height="12"/>
      <rect x="549" y="357" width="12" height="12"/>
      <rect x="561" y="357" width="12" height="12" fill="#1e40af"/>

      <rect x="513" y="369" width="12" height="12"/>
      <rect x="525" y="369" width="12" height="12"/>
      <rect x="537" y="369" width="12" height="12" fill="#1e40af"/>
      <rect x="549" y="369" width="12" height="12"/>
      <rect x="561" y="369" width="12" height="12"/>

      <rect x="513" y="381" width="12" height="12" fill="#1e40af"/>
      <rect x="525" y="381" width="12" height="12"/>
      <rect x="537" y="381" width="12" height="12"/>
      <rect x="549" y="381" width="12" height="12" fill="#1e40af"/>
      <rect x="561" y="381" width="12" height="12"/>

      <rect x="513" y="393" width="12" height="12"/>
      <rect x="525" y="393" width="12" height="12" fill="#1e40af"/>
      <rect x="537" y="393" width="12" height="12"/>
      <rect x="549" y="393" width="12" height="12"/>
      <rect x="561" y="393" width="12" height="12" fill="#1e40af"/>
    </g>
    <text x="545" y="424" text-anchor="middle" font-size="10" fill="#6b7280">
      attention pattern
    </text>
    <text x="545" y="436" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600">
      → z₃ [N, 64]
    </text>
  </g>

  <!-- head 8 (with "..." gap) -->
  <g>
    <rect x="650" y="285" width="190" height="160" rx="8"
          fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="745" y="307" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="700">head 8</text>
    <text x="745" y="324" text-anchor="middle" font-size="11" fill="#1e40af" font-style="italic">学到:长距离依赖</text>

    <!-- 横向 pattern: top row + bottom row -->
    <g stroke="#a5b4fc" stroke-width="0.5" fill="#dbeafe">
      <rect x="713" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="725" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="737" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="749" y="345" width="12" height="12" fill="#1e40af"/>
      <rect x="761" y="345" width="12" height="12" fill="#1e40af"/>

      <rect x="713" y="357" width="12" height="12"/>
      <rect x="725" y="357" width="12" height="12"/>
      <rect x="737" y="357" width="12" height="12"/>
      <rect x="749" y="357" width="12" height="12"/>
      <rect x="761" y="357" width="12" height="12"/>

      <rect x="713" y="369" width="12" height="12"/>
      <rect x="725" y="369" width="12" height="12"/>
      <rect x="737" y="369" width="12" height="12"/>
      <rect x="749" y="369" width="12" height="12"/>
      <rect x="761" y="369" width="12" height="12"/>

      <rect x="713" y="381" width="12" height="12"/>
      <rect x="725" y="381" width="12" height="12"/>
      <rect x="737" y="381" width="12" height="12"/>
      <rect x="749" y="381" width="12" height="12"/>
      <rect x="761" y="381" width="12" height="12"/>

      <rect x="713" y="393" width="12" height="12" fill="#1e40af"/>
      <rect x="725" y="393" width="12" height="12" fill="#1e40af"/>
      <rect x="737" y="393" width="12" height="12" fill="#1e40af"/>
      <rect x="749" y="393" width="12" height="12" fill="#1e40af"/>
      <rect x="761" y="393" width="12" height="12" fill="#1e40af"/>
    </g>
    <text x="745" y="424" text-anchor="middle" font-size="10" fill="#6b7280">
      attention pattern
    </text>
    <text x="745" y="436" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="600">
      → z₈ [N, 64]
    </text>
  </g>

  <!-- 提示 head 4-7 省略 -->
  <text x="450" y="465" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">
    · · · (head 4-7 同理,各自学到不同 pattern) · · ·
  </text>

  <!-- horizontal divider -->
  <line x1="40" y1="485" x2="860" y2="485"
        stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============================================================== -->
  <!-- PANEL 3: concat + W^O                                            -->
  <!-- ============================================================== -->
  <text x="50" y="515" text-anchor="start" font-size="14"
        fill="#1f2937" font-weight="700">
    ③ 拼合:8 个 z_i [N, 64] 沿特征维度 concat → [N, 512],再过 W^O
  </text>

  <!-- 8 z_i boxes -->
  <g>
    <rect x="60" y="550" width="40" height="30" rx="3" stroke="#3b82f6" stroke-width="1.2" fill="#dbeafe"/>
    <text x="80" y="569" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="600">z₁</text>

    <rect x="105" y="550" width="40" height="30" rx="3" stroke="#3b82f6" stroke-width="1.2" fill="#dbeafe"/>
    <text x="125" y="569" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="600">z₂</text>

    <rect x="150" y="550" width="40" height="30" rx="3" stroke="#3b82f6" stroke-width="1.2" fill="#dbeafe"/>
    <text x="170" y="569" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="600">z₃</text>

    <rect x="195" y="550" width="60" height="30" rx="3" stroke="#9ca3af" stroke-dasharray="3,2" stroke-width="1.2" fill="#f3f4f6"/>
    <text x="225" y="569" text-anchor="middle" font-size="12" fill="#6b7280">z₄..z₇</text>

    <rect x="260" y="550" width="40" height="30" rx="3" stroke="#3b82f6" stroke-width="1.2" fill="#dbeafe"/>
    <text x="280" y="569" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="600">z₈</text>
  </g>

  <!-- arrow -->
  <line x1="310" y1="565" x2="350" y2="565"
        stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>
  <text x="330" y="555" text-anchor="middle" font-size="11" fill="#6b7280">concat</text>

  <!-- Concatenated -->
  <rect x="360" y="550" width="150" height="30" rx="3" stroke="#3b82f6" stroke-width="2" fill="#bfdbfe"/>
  <text x="435" y="569" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="700">
    [N, 512]
  </text>

  <line x1="520" y1="565" x2="560" y2="565"
        stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>

  <!-- W^O -->
  <rect x="566" y="548" width="80" height="34" rx="6"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="606" y="569" text-anchor="middle" font-size="14" fill="#9d174d" font-weight="700">W^O</text>

  <line x1="656" y1="565" x2="696" y2="565"
        stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-mh)"/>

  <!-- Final output -->
  <rect x="702" y="546" width="160" height="38" rx="6"
        fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="782" y="563" text-anchor="middle" font-size="13" fill="#065f46" font-weight="700">
    MultiHead 输出
  </text>
  <text x="782" y="577" text-anchor="middle" font-size="11" fill="#065f46">
    [N, 512]
  </text>

  <!-- Footnote -->
  <text x="450" y="630" text-anchor="middle" font-size="11" fill="#6b7280">
    实际中不同头确实学到不同模式 — Michel 2019 发现 80% 的头可剪掉而性能基本不掉
  </text>
  <text x="450" y="650" text-anchor="middle" font-size="11" fill="#6b7280">
    "Multi-Head 不增参数,只是把同样预算分给 h 个角色"
  </text>

</svg>
