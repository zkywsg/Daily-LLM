<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Sparse Attention 三类模式 — Local + Global + Random
  </text>

  <!-- ============== Common: N=16 grid for all 4 matrices ============== -->
  <!-- Each cell ~14px; 16x16 grid = 224px wide -->
  <!-- 4 panels: dense, local, +global, +random -->

  <!-- ===== Panel 1: Dense (full N×N) ===== -->
  <text x="130" y="65" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">
    Dense O(N²)
  </text>

  <g transform="translate(40, 80)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="180" height="180" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Full dense: every cell filled -->
    <g fill="#fee2e2" stroke="#dc2626" stroke-width="0.3">
      <!-- 16x16 = 256 cells, fill all -->
      <rect x="0" y="0" width="180" height="180" fill="#fee2e2"/>
      <!-- gridlines -->
      <g stroke="#dc2626" stroke-width="0.3" opacity="0.4">
        <line x1="11.25" y1="0" x2="11.25" y2="180"/>
        <line x1="22.5" y1="0" x2="22.5" y2="180"/>
        <line x1="33.75" y1="0" x2="33.75" y2="180"/>
        <line x1="45" y1="0" x2="45" y2="180"/>
        <line x1="56.25" y1="0" x2="56.25" y2="180"/>
        <line x1="67.5" y1="0" x2="67.5" y2="180"/>
        <line x1="78.75" y1="0" x2="78.75" y2="180"/>
        <line x1="90" y1="0" x2="90" y2="180"/>
        <line x1="101.25" y1="0" x2="101.25" y2="180"/>
        <line x1="112.5" y1="0" x2="112.5" y2="180"/>
        <line x1="123.75" y1="0" x2="123.75" y2="180"/>
        <line x1="135" y1="0" x2="135" y2="180"/>
        <line x1="146.25" y1="0" x2="146.25" y2="180"/>
        <line x1="157.5" y1="0" x2="157.5" y2="180"/>
        <line x1="168.75" y1="0" x2="168.75" y2="180"/>
        <line x1="0" y1="11.25" x2="180" y2="11.25"/>
        <line x1="0" y1="22.5" x2="180" y2="22.5"/>
        <line x1="0" y1="33.75" x2="180" y2="33.75"/>
        <line x1="0" y1="45" x2="180" y2="45"/>
        <line x1="0" y1="56.25" x2="180" y2="56.25"/>
        <line x1="0" y1="67.5" x2="180" y2="67.5"/>
        <line x1="0" y1="78.75" x2="180" y2="78.75"/>
        <line x1="0" y1="90" x2="180" y2="90"/>
        <line x1="0" y1="101.25" x2="180" y2="101.25"/>
        <line x1="0" y1="112.5" x2="180" y2="112.5"/>
        <line x1="0" y1="123.75" x2="180" y2="123.75"/>
        <line x1="0" y1="135" x2="180" y2="135"/>
        <line x1="0" y1="146.25" x2="180" y2="146.25"/>
        <line x1="0" y1="157.5" x2="180" y2="157.5"/>
        <line x1="0" y1="168.75" x2="180" y2="168.75"/>
      </g>
    </g>
  </g>

  <text x="130" y="285" text-anchor="middle" font-size="11" fill="#991b1b">256 个非零</text>

  <!-- ===== Panel 2: Local sliding window ===== -->
  <text x="350" y="65" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="600">
    ① Local 滑窗
  </text>

  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="180" height="180" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <!-- diagonal band (w=3 on each side) -->
    <g fill="#dbeafe">
      <!-- For each row i, fill columns [i-3, i+3] -->
      <!-- row 0: 0-3 -->
      <rect x="0" y="0" width="45" height="11.25"/>
      <rect x="0" y="11.25" width="56.25" height="11.25"/>
      <rect x="0" y="22.5" width="67.5" height="11.25"/>
      <rect x="0" y="33.75" width="78.75" height="11.25"/>
      <rect x="11.25" y="45" width="78.75" height="11.25"/>
      <rect x="22.5" y="56.25" width="78.75" height="11.25"/>
      <rect x="33.75" y="67.5" width="78.75" height="11.25"/>
      <rect x="45" y="78.75" width="78.75" height="11.25"/>
      <rect x="56.25" y="90" width="78.75" height="11.25"/>
      <rect x="67.5" y="101.25" width="78.75" height="11.25"/>
      <rect x="78.75" y="112.5" width="78.75" height="11.25"/>
      <rect x="90" y="123.75" width="78.75" height="11.25"/>
      <rect x="101.25" y="135" width="78.75" height="11.25"/>
      <rect x="112.5" y="146.25" width="67.5" height="11.25"/>
      <rect x="123.75" y="157.5" width="56.25" height="11.25"/>
      <rect x="135" y="168.75" width="45" height="11.25"/>
    </g>

    <!-- gridlines -->
    <g stroke="#2563eb" stroke-width="0.3" opacity="0.4">
      <line x1="11.25" y1="0" x2="11.25" y2="180"/>
      <line x1="22.5" y1="0" x2="22.5" y2="180"/>
      <line x1="33.75" y1="0" x2="33.75" y2="180"/>
      <line x1="45" y1="0" x2="45" y2="180"/>
      <line x1="56.25" y1="0" x2="56.25" y2="180"/>
      <line x1="67.5" y1="0" x2="67.5" y2="180"/>
      <line x1="78.75" y1="0" x2="78.75" y2="180"/>
      <line x1="90" y1="0" x2="90" y2="180"/>
      <line x1="101.25" y1="0" x2="101.25" y2="180"/>
      <line x1="112.5" y1="0" x2="112.5" y2="180"/>
      <line x1="123.75" y1="0" x2="123.75" y2="180"/>
      <line x1="135" y1="0" x2="135" y2="180"/>
      <line x1="146.25" y1="0" x2="146.25" y2="180"/>
      <line x1="157.5" y1="0" x2="157.5" y2="180"/>
      <line x1="168.75" y1="0" x2="168.75" y2="180"/>
      <line x1="0" y1="11.25" x2="180" y2="11.25"/>
      <line x1="0" y1="22.5" x2="180" y2="22.5"/>
      <line x1="0" y1="33.75" x2="180" y2="33.75"/>
      <line x1="0" y1="45" x2="180" y2="45"/>
      <line x1="0" y1="56.25" x2="180" y2="56.25"/>
      <line x1="0" y1="67.5" x2="180" y2="67.5"/>
      <line x1="0" y1="78.75" x2="180" y2="78.75"/>
      <line x1="0" y1="90" x2="180" y2="90"/>
      <line x1="0" y1="101.25" x2="180" y2="101.25"/>
      <line x1="0" y1="112.5" x2="180" y2="112.5"/>
      <line x1="0" y1="123.75" x2="180" y2="123.75"/>
      <line x1="0" y1="135" x2="180" y2="135"/>
      <line x1="0" y1="146.25" x2="180" y2="146.25"/>
      <line x1="0" y1="157.5" x2="180" y2="157.5"/>
      <line x1="0" y1="168.75" x2="180" y2="168.75"/>
    </g>
  </g>

  <text x="350" y="285" text-anchor="middle" font-size="11" fill="#1e40af">w=7,只看邻居</text>

  <!-- ===== Panel 3: + Global token ===== -->
  <text x="570" y="65" text-anchor="middle" font-size="13" fill="#ea580c" font-weight="600">
    ② + Global token
  </text>

  <g transform="translate(480, 80)">
    <rect x="0" y="0" width="180" height="180" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <!-- local diagonal band same as panel 2 -->
    <g fill="#dbeafe">
      <rect x="0" y="0" width="45" height="11.25"/>
      <rect x="0" y="11.25" width="56.25" height="11.25"/>
      <rect x="0" y="22.5" width="67.5" height="11.25"/>
      <rect x="0" y="33.75" width="78.75" height="11.25"/>
      <rect x="11.25" y="45" width="78.75" height="11.25"/>
      <rect x="22.5" y="56.25" width="78.75" height="11.25"/>
      <rect x="33.75" y="67.5" width="78.75" height="11.25"/>
      <rect x="45" y="78.75" width="78.75" height="11.25"/>
      <rect x="56.25" y="90" width="78.75" height="11.25"/>
      <rect x="67.5" y="101.25" width="78.75" height="11.25"/>
      <rect x="78.75" y="112.5" width="78.75" height="11.25"/>
      <rect x="90" y="123.75" width="78.75" height="11.25"/>
      <rect x="101.25" y="135" width="78.75" height="11.25"/>
      <rect x="112.5" y="146.25" width="67.5" height="11.25"/>
      <rect x="123.75" y="157.5" width="56.25" height="11.25"/>
      <rect x="135" y="168.75" width="45" height="11.25"/>
    </g>
    <!-- Global rows + cols (rows 0, 8 and cols 0, 8) -->
    <rect x="0" y="0" width="180" height="11.25" fill="#fed7aa" opacity="0.85"/>
    <rect x="0" y="90" width="180" height="11.25" fill="#fed7aa" opacity="0.85"/>
    <rect x="0" y="0" width="11.25" height="180" fill="#fed7aa" opacity="0.85"/>
    <rect x="90" y="0" width="11.25" height="180" fill="#fed7aa" opacity="0.85"/>

    <!-- gridlines -->
    <g stroke="#9ca3af" stroke-width="0.3" opacity="0.5">
      <line x1="11.25" y1="0" x2="11.25" y2="180"/>
      <line x1="22.5" y1="0" x2="22.5" y2="180"/>
      <line x1="33.75" y1="0" x2="33.75" y2="180"/>
      <line x1="45" y1="0" x2="45" y2="180"/>
      <line x1="56.25" y1="0" x2="56.25" y2="180"/>
      <line x1="67.5" y1="0" x2="67.5" y2="180"/>
      <line x1="78.75" y1="0" x2="78.75" y2="180"/>
      <line x1="90" y1="0" x2="90" y2="180"/>
      <line x1="101.25" y1="0" x2="101.25" y2="180"/>
      <line x1="112.5" y1="0" x2="112.5" y2="180"/>
      <line x1="123.75" y1="0" x2="123.75" y2="180"/>
      <line x1="135" y1="0" x2="135" y2="180"/>
      <line x1="146.25" y1="0" x2="146.25" y2="180"/>
      <line x1="157.5" y1="0" x2="157.5" y2="180"/>
      <line x1="168.75" y1="0" x2="168.75" y2="180"/>
      <line x1="0" y1="11.25" x2="180" y2="11.25"/>
      <line x1="0" y1="22.5" x2="180" y2="22.5"/>
      <line x1="0" y1="33.75" x2="180" y2="33.75"/>
      <line x1="0" y1="45" x2="180" y2="45"/>
      <line x1="0" y1="56.25" x2="180" y2="56.25"/>
      <line x1="0" y1="67.5" x2="180" y2="67.5"/>
      <line x1="0" y1="78.75" x2="180" y2="78.75"/>
      <line x1="0" y1="90" x2="180" y2="90"/>
      <line x1="0" y1="101.25" x2="180" y2="101.25"/>
      <line x1="0" y1="112.5" x2="180" y2="112.5"/>
      <line x1="0" y1="123.75" x2="180" y2="123.75"/>
      <line x1="0" y1="135" x2="180" y2="135"/>
      <line x1="0" y1="146.25" x2="180" y2="146.25"/>
      <line x1="0" y1="157.5" x2="180" y2="157.5"/>
      <line x1="0" y1="168.75" x2="180" y2="168.75"/>
    </g>
  </g>

  <text x="570" y="285" text-anchor="middle" font-size="11" fill="#9a3412">+ 2 个 global 枢纽</text>

  <!-- ===== Panel 4: + Random (BigBird) ===== -->
  <text x="790" y="65" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="600">
    ③ + Random(BigBird)
  </text>

  <g transform="translate(700, 80)">
    <rect x="0" y="0" width="180" height="180" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <!-- local band -->
    <g fill="#dbeafe">
      <rect x="0" y="0" width="45" height="11.25"/>
      <rect x="0" y="11.25" width="56.25" height="11.25"/>
      <rect x="0" y="22.5" width="67.5" height="11.25"/>
      <rect x="0" y="33.75" width="78.75" height="11.25"/>
      <rect x="11.25" y="45" width="78.75" height="11.25"/>
      <rect x="22.5" y="56.25" width="78.75" height="11.25"/>
      <rect x="33.75" y="67.5" width="78.75" height="11.25"/>
      <rect x="45" y="78.75" width="78.75" height="11.25"/>
      <rect x="56.25" y="90" width="78.75" height="11.25"/>
      <rect x="67.5" y="101.25" width="78.75" height="11.25"/>
      <rect x="78.75" y="112.5" width="78.75" height="11.25"/>
      <rect x="90" y="123.75" width="78.75" height="11.25"/>
      <rect x="101.25" y="135" width="78.75" height="11.25"/>
      <rect x="112.5" y="146.25" width="67.5" height="11.25"/>
      <rect x="123.75" y="157.5" width="56.25" height="11.25"/>
      <rect x="135" y="168.75" width="45" height="11.25"/>
    </g>
    <!-- global -->
    <rect x="0" y="0" width="180" height="11.25" fill="#fed7aa" opacity="0.85"/>
    <rect x="0" y="90" width="180" height="11.25" fill="#fed7aa" opacity="0.85"/>
    <rect x="0" y="0" width="11.25" height="180" fill="#fed7aa" opacity="0.85"/>
    <rect x="90" y="0" width="11.25" height="180" fill="#fed7aa" opacity="0.85"/>
    <!-- random scatters (purple) -->
    <g fill="#ddd6fe" stroke="#7c3aed" stroke-width="0.5">
      <rect x="135" y="22.5" width="11.25" height="11.25"/>
      <rect x="56.25" y="33.75" width="11.25" height="11.25"/>
      <rect x="146.25" y="56.25" width="11.25" height="11.25"/>
      <rect x="22.5" y="78.75" width="11.25" height="11.25"/>
      <rect x="168.75" y="101.25" width="11.25" height="11.25"/>
      <rect x="33.75" y="123.75" width="11.25" height="11.25"/>
      <rect x="123.75" y="146.25" width="11.25" height="11.25"/>
      <rect x="11.25" y="168.75" width="11.25" height="11.25"/>
    </g>

    <!-- gridlines -->
    <g stroke="#9ca3af" stroke-width="0.3" opacity="0.5">
      <line x1="11.25" y1="0" x2="11.25" y2="180"/>
      <line x1="22.5" y1="0" x2="22.5" y2="180"/>
      <line x1="33.75" y1="0" x2="33.75" y2="180"/>
      <line x1="45" y1="0" x2="45" y2="180"/>
      <line x1="56.25" y1="0" x2="56.25" y2="180"/>
      <line x1="67.5" y1="0" x2="67.5" y2="180"/>
      <line x1="78.75" y1="0" x2="78.75" y2="180"/>
      <line x1="90" y1="0" x2="90" y2="180"/>
      <line x1="101.25" y1="0" x2="101.25" y2="180"/>
      <line x1="112.5" y1="0" x2="112.5" y2="180"/>
      <line x1="123.75" y1="0" x2="123.75" y2="180"/>
      <line x1="135" y1="0" x2="135" y2="180"/>
      <line x1="146.25" y1="0" x2="146.25" y2="180"/>
      <line x1="157.5" y1="0" x2="157.5" y2="180"/>
      <line x1="168.75" y1="0" x2="168.75" y2="180"/>
      <line x1="0" y1="11.25" x2="180" y2="11.25"/>
      <line x1="0" y1="22.5" x2="180" y2="22.5"/>
      <line x1="0" y1="33.75" x2="180" y2="33.75"/>
      <line x1="0" y1="45" x2="180" y2="45"/>
      <line x1="0" y1="56.25" x2="180" y2="56.25"/>
      <line x1="0" y1="67.5" x2="180" y2="67.5"/>
      <line x1="0" y1="78.75" x2="180" y2="78.75"/>
      <line x1="0" y1="90" x2="180" y2="90"/>
      <line x1="0" y1="101.25" x2="180" y2="101.25"/>
      <line x1="0" y1="112.5" x2="180" y2="112.5"/>
      <line x1="0" y1="123.75" x2="180" y2="123.75"/>
      <line x1="0" y1="135" x2="180" y2="135"/>
      <line x1="0" y1="146.25" x2="180" y2="146.25"/>
      <line x1="0" y1="157.5" x2="180" y2="157.5"/>
      <line x1="0" y1="168.75" x2="180" y2="168.75"/>
    </g>
  </g>

  <text x="790" y="285" text-anchor="middle" font-size="11" fill="#5b21b6">+ 随机连接(直径 log N)</text>

  <!-- ============== Legend ============== -->
  <g transform="translate(60, 315)" font-size="11">
    <text x="0" y="0" fill="#1f2937" font-weight="600">图例:</text>

    <rect x="55" y="-10" width="14" height="14" fill="#fee2e2"/>
    <text x="75" y="2" fill="#991b1b">Dense(全填)</text>

    <rect x="190" y="-10" width="14" height="14" fill="#dbeafe"/>
    <text x="210" y="2" fill="#1e40af">Local 滑窗(对角线带)</text>

    <rect x="360" y="-10" width="14" height="14" fill="#fed7aa"/>
    <text x="380" y="2" fill="#9a3412">Global token(整行 + 整列)</text>

    <rect x="555" y="-10" width="14" height="14" fill="#ddd6fe"/>
    <text x="575" y="2" fill="#5b21b6">Random 连接(散点)</text>
  </g>

  <!-- DIVIDER -->
  <line x1="40" y1="350" x2="860" y2="350" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: 直觉解释 ============== -->
  <text x="450" y="378" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    每个模式解决一类问题 — 三者协同 = O(N) 复杂度 + 接近 dense 表达力
  </text>

  <g transform="translate(60, 400)">
    <!-- Local -->
    <rect x="0" y="0" width="250" height="105" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="22" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700">① Local 滑窗</text>
    <g font-size="10" fill="#1e40af">
      <text x="15" y="44">• 每位置看 w=512 个邻居</text>
      <text x="15" y="62">• 捕捉短距依赖</text>
      <text x="15" y="80">  (动词找主语 / 修饰关系)</text>
      <text x="15" y="98">• 复杂度 O(N × w) = O(N)</text>
    </g>

    <!-- Global -->
    <rect x="265" y="0" width="250" height="105" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <text x="390" y="22" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="700">② Global token</text>
    <g font-size="10" fill="#9a3412">
      <text x="280" y="44">• g=8-16 个信息枢纽</text>
      <text x="280" y="62">• CLS / question 看全文</text>
      <text x="280" y="80">  + 全文看它们(双向)</text>
      <text x="280" y="98">• 复杂度 O(N × g) = O(N)</text>
    </g>

    <!-- Random -->
    <rect x="530" y="0" width="250" height="105" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="655" y="22" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="700">③ Random(BigBird)</text>
    <g font-size="10" fill="#5b21b6">
      <text x="545" y="44">• 每位置额外 r=3 个随机</text>
      <text x="545" y="62">• small-world 让有效直径</text>
      <text x="545" y="80">  降到 O(log N)</text>
      <text x="545" y="98">• 理论保证 universal approx</text>
    </g>
  </g>

  <rect x="60" y="525" width="780" height="60" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="550" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    w + g + r ≈ 500-550 不随 N 增长 → 总复杂度 O(N × const) = O(N)
  </text>
  <text x="450" y="572" text-anchor="middle" font-size="11" fill="#fef3c7">
    Dense N×N → Sparse N×500,N=16K 时减少 32× 计算量,内存从 32GB → 1GB
  </text>
</svg>
