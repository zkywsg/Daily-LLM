<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="tx-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
    <marker id="tx-arr-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Segment-Level Recurrence — 段内并行 + 段间循环
  </text>

  <!-- ============== TOP: 原版 Transformer 切段问题 ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">
    原版 Transformer — 段与段独立,边界处零记忆
  </text>

  <!-- 3 segments, no recurrence -->
  <g>
    <rect x="80" y="90" width="200" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="180" y="115" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">Segment 1</text>
    <text x="180" y="135" text-anchor="middle" font-size="10" fill="#991b1b">Transformer(独立)</text>
    <text x="180" y="155" text-anchor="middle" font-size="10" fill="#dc2626" font-style="italic">N=512 token</text>

    <rect x="340" y="90" width="200" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="440" y="115" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">Segment 2</text>
    <text x="440" y="135" text-anchor="middle" font-size="10" fill="#991b1b">Transformer(独立)</text>
    <text x="440" y="155" text-anchor="middle" font-size="10" fill="#dc2626" font-style="italic">零记忆,从头算</text>

    <rect x="600" y="90" width="200" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="700" y="115" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="700">Segment 3</text>
    <text x="700" y="135" text-anchor="middle" font-size="10" fill="#991b1b">Transformer(独立)</text>
    <text x="700" y="155" text-anchor="middle" font-size="10" fill="#dc2626" font-style="italic">零记忆,从头算</text>
  </g>

  <!-- broken links -->
  <g stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3">
    <line x1="280" y1="130" x2="340" y2="130"/>
    <text x="310" y="125" text-anchor="middle" font-size="18" fill="#dc2626">✗</text>
    <line x1="540" y1="130" x2="600" y2="130"/>
    <text x="570" y="125" text-anchor="middle" font-size="18" fill="#dc2626">✗</text>
  </g>

  <text x="450" y="195" text-anchor="middle" font-size="11" fill="#dc2626" font-style="italic">
    跨段语义依赖完全丢失,5000 字文章被切成 10 段后 9 段从零开始
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="225" x2="860" y2="225" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM: Transformer-XL segment recurrence ============== -->
  <text x="450" y="255" text-anchor="middle" font-size="13" fill="#059669" font-weight="600">
    Transformer-XL — 段间循环,信息逐层向上累积
  </text>

  <!-- Layer 3 row -->
  <text x="55" y="305" text-anchor="end" font-size="11" fill="#1f2937" font-weight="600">Layer 3</text>

  <rect x="80" y="290" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="180" y="312" text-anchor="middle" font-size="11" fill="#9d174d">Layer 3(段 1)</text>

  <rect x="340" y="290" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="440" y="312" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">Layer 3(段 2)</text>

  <rect x="600" y="290" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="700" y="312" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">Layer 3(段 3)</text>

  <!-- Layer 2 row -->
  <text x="55" y="365" text-anchor="end" font-size="11" fill="#1f2937" font-weight="600">Layer 2</text>

  <rect x="80" y="350" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="180" y="372" text-anchor="middle" font-size="11" fill="#9d174d">Layer 2(段 1)</text>

  <rect x="340" y="350" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="440" y="372" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">Layer 2(段 2)</text>

  <rect x="600" y="350" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="700" y="372" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">Layer 2(段 3)</text>

  <!-- Layer 1 row -->
  <text x="55" y="425" text-anchor="end" font-size="11" fill="#1f2937" font-weight="600">Layer 1</text>

  <rect x="80" y="410" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="180" y="432" text-anchor="middle" font-size="11" fill="#9d174d">Layer 1(段 1)</text>

  <rect x="340" y="410" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="440" y="432" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">Layer 1(段 2)</text>

  <rect x="600" y="410" width="200" height="40" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="700" y="432" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="700">Layer 1(段 3)</text>

  <!-- Input row -->
  <text x="55" y="485" text-anchor="end" font-size="11" fill="#1f2937" font-weight="600">Input</text>

  <rect x="80" y="470" width="200" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="490" text-anchor="middle" font-size="11" fill="#92400e">Segment 1 tokens</text>

  <rect x="340" y="470" width="200" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="490" text-anchor="middle" font-size="11" fill="#92400e">Segment 2 tokens</text>

  <rect x="600" y="470" width="200" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="490" text-anchor="middle" font-size="11" fill="#92400e">Segment 3 tokens</text>

  <!-- vertical forward arrows -->
  <g stroke="#9d174d" stroke-width="1" fill="none">
    <line x1="180" y1="468" x2="180" y2="452" marker-end="url(#tx-arr)"/>
    <line x1="180" y1="408" x2="180" y2="392" marker-end="url(#tx-arr)"/>
    <line x1="180" y1="348" x2="180" y2="332" marker-end="url(#tx-arr)"/>

    <line x1="440" y1="468" x2="440" y2="452" marker-end="url(#tx-arr)"/>
    <line x1="440" y1="408" x2="440" y2="392" marker-end="url(#tx-arr)"/>
    <line x1="440" y1="348" x2="440" y2="332" marker-end="url(#tx-arr)"/>

    <line x1="700" y1="468" x2="700" y2="452" marker-end="url(#tx-arr)"/>
    <line x1="700" y1="408" x2="700" y2="392" marker-end="url(#tx-arr)"/>
    <line x1="700" y1="348" x2="700" y2="332" marker-end="url(#tx-arr)"/>
  </g>

  <!-- cached recurrence arrows (blue diagonal, layer N from layer N-1 of previous segment) -->
  <g stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5,3">
    <!-- Layer 1 (段 1) → Layer 2 (段 2) -->
    <line x1="280" y1="430" x2="340" y2="370" marker-end="url(#tx-arr-blue)"/>
    <!-- Layer 2 (段 1) → Layer 3 (段 2) -->
    <line x1="280" y1="370" x2="340" y2="310" marker-end="url(#tx-arr-blue)"/>

    <!-- Layer 1 (段 2) → Layer 2 (段 3) -->
    <line x1="540" y1="430" x2="600" y2="370" marker-end="url(#tx-arr-blue)"/>
    <!-- Layer 2 (段 2) → Layer 3 (段 3) -->
    <line x1="540" y1="370" x2="600" y2="310" marker-end="url(#tx-arr-blue)"/>
  </g>

  <text x="307" y="395" font-size="9" fill="#2563eb" font-style="italic">SG(cache)</text>
  <text x="567" y="395" font-size="9" fill="#2563eb" font-style="italic">SG(cache)</text>

  <!-- legend -->
  <g transform="translate(80, 525)" font-size="10">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#9d174d" stroke-width="1"/>
    <text x="25" y="3" fill="#1f2937">同段内 forward(并行)</text>

    <line x1="180" y1="0" x2="200" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="205" y="3" fill="#1f2937">跨段 cache(stop-gradient,信息逐层累积)</text>
  </g>

  <!-- bottom callout -->
  <rect x="60" y="555" width="780" height="80" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="580" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    理论最大上下文 O(N × L) — 第 1 段第 1 层信息能传到第 N 段第 N 层
  </text>
  <g font-size="11" fill="#fef3c7">
    <text x="80" y="603">• 有效上下文从原版 512 → 3800 token(7.4×),WikiText-103 perplexity 30.0 → 18.3(降 39%)</text>
    <text x="80" y="624">• 推理速度比 Al-Rfou sliding window 快 1874×(每段只算一次完整 attention)</text>
  </g>
</svg>
