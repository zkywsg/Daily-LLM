<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="gru-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    GRU Cell — 两门 + 单一状态,凸组合 (1-z, z) 替代 LSTM 独立 forget+input
  </text>

  <!-- ============== LEFT: GRU Cell internals ============== -->

  <!-- inputs at top -->
  <rect x="80" y="80" width="80" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="103" text-anchor="middle" font-size="12" fill="#92400e">h_{t-1}</text>

  <rect x="200" y="80" width="80" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="103" text-anchor="middle" font-size="12" fill="#92400e">x_t</text>

  <!-- concat -->
  <rect x="120" y="140" width="120" height="32" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="180" y="161" text-anchor="middle" font-size="11" fill="#374151">concat [h, x]</text>

  <line x1="120" y1="115" x2="155" y2="138" stroke="#9d174d" stroke-width="1.5" marker-end="url(#gru-arr)"/>
  <line x1="240" y1="115" x2="205" y2="138" stroke="#9d174d" stroke-width="1.5" marker-end="url(#gru-arr)"/>

  <!-- r gate (reset) -->
  <rect x="40" y="210" width="110" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="232" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700">r_t = σ(W_r·...)</text>
  <text x="95" y="250" text-anchor="middle" font-size="10" fill="#1e40af">重置门</text>

  <!-- z gate (update) -->
  <rect x="220" y="210" width="110" height="50" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="275" y="232" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="700">z_t = σ(W_z·...)</text>
  <text x="275" y="250" text-anchor="middle" font-size="10" fill="#9a3412">更新门</text>

  <line x1="140" y1="172" x2="95" y2="208" stroke="#2563eb" stroke-width="1.5" marker-end="url(#gru-arr)"/>
  <line x1="220" y1="172" x2="275" y2="208" stroke="#ea580c" stroke-width="1.5" marker-end="url(#gru-arr)"/>

  <!-- r ⊙ h_{t-1} -->
  <circle cx="120" cy="310" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="316" text-anchor="middle" font-size="14" fill="#1e40af" font-weight="700">⊙</text>

  <line x1="120" y1="115" x2="120" y2="292" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="95" y1="260" x2="115" y2="302" stroke="#2563eb" stroke-width="1.5" marker-end="url(#gru-arr)"/>

  <text x="60" y="315" text-anchor="middle" font-size="10" fill="#1e40af" font-style="italic">r⊙h_{t-1}</text>

  <!-- candidate h̃_t -->
  <rect x="40" y="350" width="200" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="140" y="370" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="700">h̃_t = tanh(W_h·[r⊙h_{t-1}, x_t])</text>
  <text x="140" y="389" text-anchor="middle" font-size="10" fill="#9d174d">候选状态</text>

  <line x1="120" y1="328" x2="120" y2="348" stroke="#9d174d" stroke-width="1.5" marker-end="url(#gru-arr)"/>
  <line x1="240" y1="115" x2="200" y2="348" stroke="#9d174d" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- z ⊙ h̃ -->
  <circle cx="180" cy="450" r="18" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="180" y="456" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="700">⊙</text>

  <line x1="140" y1="400" x2="170" y2="436" stroke="#9d174d" stroke-width="1.5" marker-end="url(#gru-arr)"/>
  <line x1="275" y1="260" x2="195" y2="438" stroke="#ea580c" stroke-width="1.5"/>

  <text x="155" y="490" font-size="10" fill="#9a3412" font-style="italic">z⊙h̃_t</text>

  <!-- (1-z) ⊙ h_{t-1} -->
  <circle cx="380" cy="310" r="18" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="380" y="316" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="700">⊙</text>

  <line x1="380" y1="100" x2="380" y2="292" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="395" y="200" font-size="10" fill="#7c3aed" font-style="italic">h_{t-1} 直通</text>
  <line x1="330" y1="240" x2="365" y2="298" stroke="#ea580c" stroke-width="1.5" marker-end="url(#gru-arr)"/>
  <text x="385" y="278" font-size="10" fill="#9a3412" font-style="italic">(1-z)</text>

  <text x="430" y="315" font-size="10" fill="#9a3412" font-style="italic">(1-z)⊙h_{t-1}</text>

  <!-- h_t = sum -->
  <circle cx="320" cy="540" r="22" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="320" y="546" text-anchor="middle" font-size="18" fill="#065f46" font-weight="700">+</text>

  <line x1="200" y1="468" x2="305" y2="527" stroke="#9d174d" stroke-width="1.5" marker-end="url(#gru-arr)"/>
  <line x1="380" y1="328" x2="333" y2="525" stroke="#9d174d" stroke-width="1.5" marker-end="url(#gru-arr)"/>

  <rect x="240" y="585" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="610" text-anchor="middle" font-size="13" fill="#065f46" font-weight="700">h_t(新隐状态)</text>

  <line x1="320" y1="562" x2="320" y2="583" stroke="#059669" stroke-width="1.5" marker-end="url(#gru-arr)"/>

  <!-- ============== RIGHT: Equations + comparison ============== -->
  <text x="650" y="65" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    GRU 数学公式
  </text>

  <rect x="490" y="80" width="380" height="200" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
  <text x="510" y="110" font-family="ui-monospace, monospace" font-size="13" fill="#1e40af">
    r_t = σ(W_r · [h_{t-1}, x_t])         重置门
  </text>
  <text x="510" y="140" font-family="ui-monospace, monospace" font-size="13" fill="#9a3412">
    z_t = σ(W_z · [h_{t-1}, x_t])         更新门
  </text>
  <text x="510" y="172" font-family="ui-monospace, monospace" font-size="13" fill="#9d174d">
    h̃_t = tanh(W_h · [r_t⊙h_{t-1}, x_t])
  </text>
  <text x="510" y="194" font-size="10" fill="#6b7280">
                                                   候选状态
  </text>
  <text x="510" y="225" font-family="ui-monospace, monospace" font-size="13" fill="#065f46" font-weight="700">
    h_t = (1-z_t)⊙h_{t-1} + z_t⊙h̃_t
  </text>
  <text x="510" y="246" font-size="10" fill="#6b7280">
                                                   凸组合
  </text>

  <text x="510" y="270" font-size="11" fill="#059669" font-weight="600">
    凸组合 (1-z) + z = 1 自动满足"忘 + 写 = 1"
  </text>

  <!-- LSTM vs GRU comparison -->
  <text x="650" y="310" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    参数对比
  </text>

  <g transform="translate(490, 330)">
    <!-- header -->
    <rect x="0" y="0" width="380" height="28" fill="#1f2937"/>
    <text x="190" y="19" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="600">单元 | 权重矩阵组 | 相对参数量</text>

    <!-- RNN -->
    <rect x="0" y="28" width="380" height="28" fill="#fef3c7"/>
    <text x="20" y="47" font-size="11" fill="#92400e">简单 RNN</text>
    <text x="180" y="47" text-anchor="middle" font-size="11" fill="#92400e">1</text>
    <text x="340" y="47" text-anchor="end" font-size="11" fill="#92400e">1× baseline</text>

    <!-- GRU -->
    <rect x="0" y="56" width="380" height="28" fill="#ecfdf5"/>
    <text x="20" y="75" font-size="11" fill="#065f46" font-weight="600">GRU</text>
    <text x="180" y="75" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">3(r, z, h̃)</text>
    <text x="340" y="75" text-anchor="end" font-size="11" fill="#065f46" font-weight="600">3× (省 25% vs LSTM)</text>

    <!-- LSTM -->
    <rect x="0" y="84" width="380" height="28" fill="#fee2e2"/>
    <text x="20" y="103" font-size="11" fill="#991b1b">LSTM</text>
    <text x="180" y="103" text-anchor="middle" font-size="11" fill="#991b1b">4(f, i, o, C̃)</text>
    <text x="340" y="103" text-anchor="end" font-size="11" fill="#991b1b">4×</text>
  </g>

  <!-- bottom callout -->
  <rect x="490" y="465" width="380" height="160" rx="6" fill="#1f2937" stroke="none"/>
  <text x="680" y="490" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    GRU vs LSTM 实战经验
  </text>
  <g font-size="11" fill="#fef3c7">
    <text x="505" y="515">• 小数据 / 短序列:GRU 通常更好(参数少)</text>
    <text x="505" y="538">• 大数据 / 长序列:LSTM 略胜(自由度多)</text>
    <text x="505" y="561">• 部署关心 latency:GRU,快 15-20%</text>
    <text x="505" y="584">• 复现 baseline:LSTM(大多数 paper 用 LSTM)</text>
    <text x="505" y="611" font-style="italic" fill="#a7f3d0">2017 Transformer 后两者一起退出主流</text>
  </g>
</svg>
