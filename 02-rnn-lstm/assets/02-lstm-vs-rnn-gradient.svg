<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-fwd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-grad-rnn" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-grad-lstm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="17"
        fill="#1f2937" font-weight="700">
    Vanilla RNN  vs  LSTM Cell Highway · 长程梯度对比
  </text>

  <!-- ============== UPPER PANEL: Vanilla RNN ============== -->
  <text x="50" y="64" font-size="14" fill="#991b1b" font-weight="700">
    上半 · Vanilla RNN:h_t = tanh(W_h h_{t-1} + W_x x_t)
  </text>
  <text x="50" y="82" font-size="11" fill="#7f1d1d" font-style="italic">
    梯度沿时间反传每步乘 W_h^T · diag(tanh') → 连乘 T 次,谱半径偏离 1 即指数衰减/爆炸
  </text>

  <!-- 7 h-nodes spaced from x=80 to x=820 -->
  <g>
    <!-- h_1 -->
    <circle cx="80" cy="140" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="80" y="146" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">h_1</text>
    <!-- h_2 -->
    <circle cx="200" cy="140" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="200" y="146" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">h_2</text>
    <!-- h_3 -->
    <circle cx="320" cy="140" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="320" y="146" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">h_3</text>
    <!-- h_4 -->
    <circle cx="440" cy="140" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="440" y="146" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">h_4</text>
    <!-- h_5 -->
    <circle cx="560" cy="140" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="560" y="146" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">h_5</text>
    <!-- h_6 -->
    <circle cx="680" cy="140" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="680" y="146" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">h_6</text>
    <!-- h_T -->
    <circle cx="800" cy="140" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="800" y="146" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">h_T</text>
  </g>

  <!-- Forward arrows (grey) labelled · W_h -->
  <g stroke="#6b7280" stroke-width="1.3" fill="none">
    <line x1="102" y1="140" x2="176" y2="140" marker-end="url(#arr-fwd)"/>
    <line x1="222" y1="140" x2="296" y2="140" marker-end="url(#arr-fwd)"/>
    <line x1="342" y1="140" x2="416" y2="140" marker-end="url(#arr-fwd)"/>
    <line x1="462" y1="140" x2="536" y2="140" marker-end="url(#arr-fwd)"/>
    <line x1="582" y1="140" x2="656" y2="140" marker-end="url(#arr-fwd)"/>
    <line x1="702" y1="140" x2="776" y2="140" marker-end="url(#arr-fwd)"/>
  </g>
  <g font-size="10" fill="#6b7280">
    <text x="139" y="132" text-anchor="middle">·W</text>
    <text x="259" y="132" text-anchor="middle">·W</text>
    <text x="379" y="132" text-anchor="middle">·W</text>
    <text x="499" y="132" text-anchor="middle">·W</text>
    <text x="619" y="132" text-anchor="middle">·W</text>
    <text x="739" y="132" text-anchor="middle">·W</text>
  </g>

  <!-- Gradient back-prop: red dashed, shrinking (right→left) -->
  <g fill="none" stroke="#dc2626" stroke-dasharray="5,3">
    <path d="M 778 195 L 702 195" stroke-width="3"/>
    <path d="M 656 195 L 582 195" stroke-width="2.5"/>
    <path d="M 536 195 L 462 195" stroke-width="2"/>
    <path d="M 416 195 L 342 195" stroke-width="1.5"/>
    <path d="M 296 195 L 222 195" stroke-width="1"/>
    <path d="M 176 195 L 102 195" stroke-width="0.6" marker-end="url(#arr-grad-rnn)"/>
  </g>
  <text x="820" y="192" font-size="11" fill="#dc2626" font-weight="600">∂L/∂h_T</text>
  <text x="50" y="192" font-size="11" fill="#dc2626" font-weight="600">∂L/∂h_1</text>

  <!-- Decay curve below upper panel -->
  <text x="50" y="232" font-size="11" fill="#7f1d1d" font-weight="600">|梯度幅值|:</text>
  <!-- baseline -->
  <line x1="120" y1="290" x2="820" y2="290" stroke="#9ca3af" stroke-width="1"/>
  <!-- decay curve from right (high) to left (near 0) -->
  <path d="M 800 240 C 600 245, 400 285, 120 289"
        stroke="#dc2626" stroke-width="2.5" fill="none"/>
  <text x="450" y="262" font-size="11" fill="#dc2626" font-style="italic" text-anchor="middle">
    指数衰减:|W|^(T-t) · |tanh'|^(T-t) → 长程梯度近似为 0(消失)
  </text>

  <!-- ============== DIVIDER ============== -->
  <line x1="40" y1="320" x2="860" y2="320"
        stroke="#d1d5db" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ============== LOWER PANEL: LSTM Cell Highway ============== -->
  <text x="50" y="350" font-size="14" fill="#065f46" font-weight="700">
    下半 · LSTM:C_t = f_t ⊙ C_{t-1} + i_t ⊙ g  (加法 + 元素门)
  </text>
  <text x="50" y="368" font-size="11" fill="#064e3b" font-style="italic">
    梯度沿 cell highway 每步只乘 f_t(0–1 的逐维门),模型学到 f_t ≈ 1 时近似 identity 直通
  </text>

  <!-- highway background band -->
  <rect x="40" y="408" width="820" height="56" rx="10"
        fill="#d1fae5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- 7 C-nodes -->
  <g>
    <circle cx="80" cy="436" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="80" y="442" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">C_1</text>
    <circle cx="200" cy="436" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="200" y="442" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">C_2</text>
    <circle cx="320" cy="436" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="320" y="442" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">C_3</text>
    <circle cx="440" cy="436" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="440" y="442" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">C_4</text>
    <circle cx="560" cy="436" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="560" y="442" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">C_5</text>
    <circle cx="680" cy="436" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="680" y="442" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">C_6</text>
    <circle cx="800" cy="436" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="800" y="442" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">C_T</text>
  </g>

  <!-- forward arrows + ·f_t labels -->
  <g stroke="#db2777" stroke-width="1.8" fill="none">
    <line x1="102" y1="436" x2="176" y2="436" marker-end="url(#arr-fwd)"/>
    <line x1="222" y1="436" x2="296" y2="436" marker-end="url(#arr-fwd)"/>
    <line x1="342" y1="436" x2="416" y2="436" marker-end="url(#arr-fwd)"/>
    <line x1="462" y1="436" x2="536" y2="436" marker-end="url(#arr-fwd)"/>
    <line x1="582" y1="436" x2="656" y2="436" marker-end="url(#arr-fwd)"/>
    <line x1="702" y1="436" x2="776" y2="436" marker-end="url(#arr-fwd)"/>
  </g>
  <g font-size="10" fill="#9d174d">
    <text x="139" y="428" text-anchor="middle">·f_t</text>
    <text x="259" y="428" text-anchor="middle">·f_t</text>
    <text x="379" y="428" text-anchor="middle">·f_t</text>
    <text x="499" y="428" text-anchor="middle">·f_t</text>
    <text x="619" y="428" text-anchor="middle">·f_t</text>
    <text x="739" y="428" text-anchor="middle">·f_t</text>
  </g>

  <!-- Back-prop arrows: green, constant width -->
  <g fill="none" stroke="#059669" stroke-dasharray="5,3" stroke-width="2.5">
    <path d="M 778 488 L 702 488"/>
    <path d="M 656 488 L 582 488"/>
    <path d="M 536 488 L 462 488"/>
    <path d="M 416 488 L 342 488"/>
    <path d="M 296 488 L 222 488"/>
    <path d="M 176 488 L 102 488" marker-end="url(#arr-grad-lstm)"/>
  </g>
  <text x="820" y="486" font-size="11" fill="#059669" font-weight="600">∂L/∂C_T</text>
  <text x="50" y="486" font-size="11" fill="#059669" font-weight="600">∂L/∂C_1</text>

  <!-- Flat gradient curve -->
  <text x="50" y="524" font-size="11" fill="#064e3b" font-weight="600">|梯度幅值|:</text>
  <line x1="120" y1="580" x2="820" y2="580" stroke="#9ca3af" stroke-width="1"/>
  <line x1="120" y1="540" x2="820" y2="540" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2,2"/>
  <path d="M 800 545 L 600 547 L 400 549 L 200 548 L 120 547"
        stroke="#059669" stroke-width="2.5" fill="none"/>
  <text x="450" y="568" font-size="11" fill="#059669" font-style="italic" text-anchor="middle">
    近似 identity:∏ f_t ≈ 1 → 长程梯度几乎不衰减,稳定学到 100+ 步依赖
  </text>

  <!-- bottom take-away -->
  <text x="450" y="608" text-anchor="middle" font-size="12"
        fill="#1f2937" font-weight="600">
    关键差别:RNN 反传乘"不可控的雅可比 W^T·diag(tanh')" / LSTM 反传只乘"可学习的 0–1 标量门 f_t"
  </text>

</svg>
