<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--bg:#000000;--ink:#ededed;--mute:#8a8a8a;--line:#242424;--panel:#0a0a0a;--accent:#3b82f6;--dim:#2a2a2a}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif}
.card{width:1080px;height:1920px;padding:170px 90px 400px;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:-40px}
.tag{font-size:34px;color:var(--accent);letter-spacing:3px;font-weight:700}
h1{font-size:96px;line-height:1.2;margin-top:34px;font-weight:700}
h2{font-size:76px;line-height:1.25;margin-top:28px;font-weight:700}
p{font-size:50px;line-height:1.55;margin-top:34px}
.mute{color:var(--mute)} .a{color:var(--accent)} .s{font-size:38px}
.small{font-size:30px;color:var(--mute);margin-top:24px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:36px 40px;margin-top:40px}
.row{display:grid;grid-template-columns:170px 1fr 120px;gap:20px;align-items:center;margin:16px 0;font-size:44px}
.bar{height:44px;background:var(--bg);border:2px solid var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.row.me .bar i{background:var(--dim)}.num{text-align:right;color:var(--mute);font-size:40px;font-variant-numeric:tabular-nums}
.big{font-size:60px;font-weight:700;line-height:1.5}
svg.viz text{fill:#ededed;font:20px ui-monospace,Menlo,monospace}svg.viz .vs{fill:#8a8a8a;font:20px "PingFang SC",sans-serif}svg.viz .vt{font:700 26px "PingFang SC",sans-serif}svg.viz .vn{fill:#fff;font:19px ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style></head><body><div class="card"><div class="main"><div class="tag">RNN</div><h2>像传话游戏</h2><p>一句话要一个词一个词地压进同一个向量。第 1 个词想影响第 50 个词，要经过 <b class="a">49 次转述</b>。</p><div style="margin-top:20px"><svg viewBox="0 0 900 260" width="900" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="60" r="30" fill="#e5a50a" stroke="#2e2e2e" stroke-width="3"/><line x1="82" y1="60" x2="132" y2="60" stroke="#3b82f6" stroke-width="4"/><circle cx="164" cy="60" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><line x1="196" y1="60" x2="246" y2="60" stroke="#3b82f6" stroke-width="4"/><circle cx="278" cy="60" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><line x1="310" y1="60" x2="360" y2="60" stroke="#3b82f6" stroke-width="4"/><circle cx="392" cy="60" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><line x1="424" y1="60" x2="474" y2="60" stroke="#3b82f6" stroke-width="4"/><circle cx="506" cy="60" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><line x1="538" y1="60" x2="588" y2="60" stroke="#3b82f6" stroke-width="4"/><circle cx="620" cy="60" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><line x1="652" y1="60" x2="702" y2="60" stroke="#3b82f6" stroke-width="4"/><circle cx="734" cy="60" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><line x1="766" y1="60" x2="816" y2="60" stroke="#3b82f6" stroke-width="4"/><circle cx="848" cy="60" r="30" fill="#3b82f6" stroke="#2e2e2e" stroke-width="3"/><text x="0" y="130" font-size="34" fill="#8a8a8a" font-family="PingFang SC">RNN：7 步才传到</text><circle cx="50" cy="200" r="30" fill="#e5a50a" stroke="#2e2e2e" stroke-width="3"/><circle cx="164" cy="200" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><circle cx="278" cy="200" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><circle cx="392" cy="200" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><circle cx="506" cy="200" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><circle cx="620" cy="200" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><circle cx="734" cy="200" r="30" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="3"/><circle cx="848" cy="200" r="30" fill="#3b82f6" stroke="#2e2e2e" stroke-width="3"/><path d="M50 168 Q450 100 848 168" fill="none" stroke="#3b82f6" stroke-width="5"/></svg></div></div><div class="small">2 / 5 · 为什么发明注意力</div></div></body></html>
