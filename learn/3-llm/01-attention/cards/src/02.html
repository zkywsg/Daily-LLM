<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--bg:#000000;--ink:#ededed;--mute:#8a8a8a;--line:#242424;--panel:#0a0a0a;--accent:#3b82f6;--dim:#2a2a2a}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif}
.card{width:1080px;height:1920px;padding:170px 90px 400px;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:-40px}
.tag{font-size:34px;color:var(--accent);letter-spacing:3px;font-weight:700}
h1{font-size:96px;line-height:1.2;margin-top:34px;font-weight:700}
h2{font-size:76px;line-height:1.25;margin-top:28px;font-weight:700}
p{font-size:50px;line-height:1.55;margin-top:34px}
.mute{color:var(--mute)} .a{color:var(--accent)} .s{font-size:38px}
.small{font-size:30px;color:var(--mute);margin-top:24px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:36px 40px;margin-top:40px}
.row{display:grid;grid-template-columns:170px 1fr 120px;gap:20px;align-items:center;margin:16px 0;font-size:44px}
.bar{height:44px;background:var(--bg);border:2px solid var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.row.me .bar i{background:var(--dim)}.num{text-align:right;color:var(--mute);font-size:40px;font-variant-numeric:tabular-nums}
.big{font-size:60px;font-weight:700;line-height:1.5}
svg.viz text{fill:#ededed;font:20px ui-monospace,Menlo,monospace}svg.viz .vs{fill:#8a8a8a;font:20px "PingFang SC",sans-serif}svg.viz .vt{font:700 26px "PingFang SC",sans-serif}svg.viz .vn{fill:#fff;font:19px ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style></head><body><div class="card"><div class="main"><div class="tag">问题</div><h2>“小猫没有过马路，因为<span class="a">它</span>太累了”</h2><p>模型读到“它”，手里只有一个孤立的词，没有“小猫”的信息。</p><div style="margin-top:30px"><svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg"><path d="M 710 300 Q 385 -196 60 300" fill="none" stroke="#3b82f6" stroke-width="19.1" stroke-linecap="round"/><path d="M 710 300 Q 450 -112.80000000000001 190 300" fill="none" stroke="#2a2a2a" stroke-width="5.8" stroke-linecap="round"/><path d="M 710 300 Q 515 -29.600000000000023 320 300" fill="none" stroke="#2a2a2a" stroke-width="5.3" stroke-linecap="round"/><path d="M 710 300 Q 580 53.599999999999994 450 300" fill="none" stroke="#2a2a2a" stroke-width="5.7" stroke-linecap="round"/><path d="M 710 300 Q 645 136.8 580 300" fill="none" stroke="#2a2a2a" stroke-width="5.8" stroke-linecap="round"/><path d="M 710 300 Q 775 136.8 840 300" fill="none" stroke="#3b82f6" stroke-width="12.0" stroke-linecap="round"/><text x="60" y="356" text-anchor="middle" font-size="40" font-weight="500" fill="#ededed" font-family="PingFang SC,sans-serif">小猫</text><text x="190" y="356" text-anchor="middle" font-size="40" font-weight="500" fill="#ededed" font-family="PingFang SC,sans-serif">没有</text><text x="320" y="356" text-anchor="middle" font-size="40" font-weight="500" fill="#ededed" font-family="PingFang SC,sans-serif">过</text><text x="450" y="356" text-anchor="middle" font-size="40" font-weight="500" fill="#ededed" font-family="PingFang SC,sans-serif">马路</text><text x="580" y="356" text-anchor="middle" font-size="40" font-weight="500" fill="#ededed" font-family="PingFang SC,sans-serif">因为</text><text x="710" y="356" text-anchor="middle" font-size="46" font-weight="800" fill="#3b82f6" font-family="PingFang SC,sans-serif">它</text><text x="840" y="356" text-anchor="middle" font-size="40" font-weight="500" fill="#ededed" font-family="PingFang SC,sans-serif">太累了</text></svg></div><p class="mute s" style="margin-top:10px">线越粗，“它”越要从那个词取信息。（示意值，非真实模型）</p></div><div class="small">2 / 9 · 注意力基础</div></div></body></html>
