<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--bg:#000000;--ink:#ededed;--mute:#8a8a8a;--line:#242424;--panel:#0a0a0a;--accent:#3b82f6;--dim:#2a2a2a}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif}
.card{width:1080px;height:1920px;padding:170px 90px 400px;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:-40px}
.tag{font-size:34px;color:var(--accent);letter-spacing:3px;font-weight:700}
h1{font-size:96px;line-height:1.2;margin-top:34px;font-weight:700}
h2{font-size:76px;line-height:1.25;margin-top:28px;font-weight:700}
p{font-size:50px;line-height:1.55;margin-top:34px}
.mute{color:var(--mute)} .a{color:var(--accent)} .s{font-size:38px}
.small{font-size:30px;color:var(--mute);margin-top:24px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:36px 40px;margin-top:40px}
.row{display:grid;grid-template-columns:170px 1fr 120px;gap:20px;align-items:center;margin:16px 0;font-size:44px}
.bar{height:44px;background:var(--bg);border:2px solid var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.row.me .bar i{background:var(--dim)}.num{text-align:right;color:var(--mute);font-size:40px;font-variant-numeric:tabular-nums}
.big{font-size:60px;font-weight:700;line-height:1.5}
svg.viz text{fill:#ededed;font:20px ui-monospace,Menlo,monospace}svg.viz .vs{fill:#8a8a8a;font:20px "PingFang SC",sans-serif}svg.viz .vt{font:700 26px "PingFang SC",sans-serif}svg.viz .vn{fill:#fff;font:19px ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style></head><body><div class="card"><div class="main"><div class="tag">看全貌</div><h2>权重 A 越深，<br>拿的越多</h2><div style="margin-top:40px"><svg class="viz" viewBox="0 0 768 466" width="900" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC,sans-serif"><text x="0" y="44" class="vt">A（权重）</text><text x="0" y="66" class="vs">每行和 = 1</text><text x="138" y="91" text-anchor="middle" class="vs">猫</text><text x="258" y="91" text-anchor="middle" class="vs">追</text><text x="378" y="91" text-anchor="middle" class="vs">鱼</text><text x="72" y="160" text-anchor="end" class="vs">猫</text><rect x="78" y="96" width="119" height="119" rx="2" fill="rgba(59,130,246,0.40)"/><text x="138" y="159.5" text-anchor="middle" class="vn">0.40</text><rect x="198" y="96" width="119" height="119" rx="2" fill="rgba(59,130,246,0.22)"/><text x="258" y="159.5" text-anchor="middle" class="vn">0.20</text><rect x="318" y="96" width="119" height="119" rx="2" fill="rgba(59,130,246,0.40)"/><text x="378" y="159.5" text-anchor="middle" class="vn">0.40</text><text x="72" y="280" text-anchor="end" class="vs">追</text><rect x="78" y="216" width="119" height="119" rx="2" fill="rgba(59,130,246,0.30)"/><text x="138" y="279.5" text-anchor="middle" class="vn">0.28</text><rect x="198" y="216" width="119" height="119" rx="2" fill="rgba(59,130,246,0.17)"/><text x="258" y="279.5" text-anchor="middle" class="vn">0.14</text><rect x="318" y="216" width="119" height="119" rx="2" fill="rgba(59,130,246,0.56)"/><text x="378" y="279.5" text-anchor="middle" class="vn">0.58</text><text x="72" y="400" text-anchor="end" class="vs">鱼</text><rect x="78" y="336" width="119" height="119" rx="2" fill="rgba(59,130,246,0.32)"/><text x="138" y="399.5" text-anchor="middle" class="vn">0.31</text><rect x="198" y="336" width="119" height="119" rx="2" fill="rgba(59,130,246,0.11)"/><text x="258" y="399.5" text-anchor="middle" class="vn">0.07</text><rect x="318" y="336" width="119" height="119" rx="2" fill="rgba(59,130,246,0.60)"/><text x="378" y="399.5" text-anchor="middle" class="vn">0.62</text><text x="466" y="276" class="vs" style="font-size:34px">→</text><text x="518" y="44" class="vt">O = A·V</text><text x="518" y="66" class="vs">新表示</text><text x="578" y="91" text-anchor="middle" class="vs">a</text><text x="698" y="91" text-anchor="middle" class="vs">b</text><rect x="518" y="96" width="119" height="119" rx="2" fill="rgba(59,130,246,0.54)"/><text x="578" y="159.5" text-anchor="middle" class="vn">0.80</text><rect x="638" y="96" width="119" height="119" rx="2" fill="rgba(59,130,246,0.79)"/><text x="698" y="159.5" text-anchor="middle" class="vn">1.20</text><rect x="518" y="216" width="119" height="119" rx="2" fill="rgba(59,130,246,0.58)"/><text x="578" y="279.5" text-anchor="middle" class="vn">0.86</text><rect x="638" y="216" width="119" height="119" rx="2" fill="rgba(59,130,246,0.90)"/><text x="698" y="279.5" text-anchor="middle" class="vn">1.43</text><rect x="518" y="336" width="119" height="119" rx="2" fill="rgba(59,130,246,0.62)"/><text x="578" y="399.5" text-anchor="middle" class="vn">0.93</text><rect x="638" y="336" width="119" height="119" rx="2" fill="rgba(59,130,246,0.90)"/><text x="698" y="399.5" text-anchor="middle" class="vn">1.39</text></svg></div><p class="mute s" style="margin-top:20px">颜色越深，数越大。“鱼”这一行：62% 的权重给了它自己，所以 O 里“鱼”的 v 占大头。</p></div><div class="small">6 / 6 · 手算注意力</div></div></body></html>
