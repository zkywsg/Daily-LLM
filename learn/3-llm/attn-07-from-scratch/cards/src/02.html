<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--bg:#000000;--ink:#ededed;--mute:#8a8a8a;--line:#242424;--panel:#0a0a0a;--accent:#3b82f6;--dim:#2a2a2a}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif}
.card{width:1080px;height:1920px;padding:170px 90px 400px;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:-40px}
.tag{font-size:34px;color:var(--accent);letter-spacing:3px;font-weight:700}
h1{font-size:96px;line-height:1.2;margin-top:34px;font-weight:700}
h2{font-size:76px;line-height:1.25;margin-top:28px;font-weight:700}
p{font-size:50px;line-height:1.55;margin-top:34px}
.mute{color:var(--mute)} .a{color:var(--accent)} .s{font-size:38px}
.small{font-size:30px;color:var(--mute);margin-top:24px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:36px 40px;margin-top:40px}
.row{display:grid;grid-template-columns:170px 1fr 120px;gap:20px;align-items:center;margin:16px 0;font-size:44px}
.bar{height:44px;background:var(--bg);border:2px solid var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.row.me .bar i{background:var(--dim)}.num{text-align:right;color:var(--mute);font-size:40px;font-variant-numeric:tabular-nums}
.big{font-size:60px;font-weight:700;line-height:1.5}
svg.viz text{fill:#ededed;font:20px ui-monospace,Menlo,monospace}svg.viz .vs{fill:#8a8a8a;font:20px "PingFang SC",sans-serif}svg.viz .vt{font:700 26px "PingFang SC",sans-serif}svg.viz .vn{fill:#fff;font:19px ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style></head><body><div class="card"><div class="main"><div class="tag">代码结构</div><h2>一次调用，<br>形状这样走</h2><div style="margin-top:20px"><svg viewBox="0 0 860 736" width="900" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC,sans-serif"><rect width="860" height="736" fill="#000"/><text x="20" y="32" font-size="20" font-weight="700" fill="#ededed">multi_head_attention 的一次调用：每一步的形状</text><rect x="20" y="56" width="420" height="52" rx="6" fill="#0a0a0a" stroke="#2e2e2e"/><text x="34" y="78" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">X</text><text x="34" y="98" font-size="13" fill="#8a8a8a">输入：n 个词，每词 d 维</text><text x="456" y="88" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[n, d]</text><path d="M50 108v18" stroke="#8a8a8a"/><path d="M46 122l4 6 4-6z" fill="#8a8a8a"/><rect x="20" y="130" width="420" height="52" rx="6" fill="#0a0a0a" stroke="#2e2e2e"/><text x="34" y="152" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">Q = X·Wq   K = X·Wk   V = X·Wv</text><text x="34" y="172" font-size="13" fill="#8a8a8a">三次矩阵乘</text><text x="456" y="162" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[n, d]</text><path d="M50 182v18" stroke="#8a8a8a"/><path d="M46 196l4 6 4-6z" fill="#8a8a8a"/><rect x="20" y="204" width="420" height="52" rx="6" fill="#0a0a0a" stroke="#2e2e2e"/><text x="34" y="226" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">reshape + 换轴：拆成 h 个头</text><text x="34" y="246" font-size="13" fill="#8a8a8a">d = h × dk</text><text x="456" y="236" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[h, n, dk]</text><path d="M50 256v18" stroke="#8a8a8a"/><path d="M46 270l4 6 4-6z" fill="#8a8a8a"/><rect x="20" y="278" width="420" height="52" rx="6" fill="#0f1c33" stroke="#3b82f6"/><text x="34" y="300" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">S = Q·Kᵀ / √dk</text><text x="34" y="320" font-size="13" fill="#8a8a8a">每个头一张 n×n 分数表</text><text x="456" y="310" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[h, n, n]</text><path d="M50 330v18" stroke="#8a8a8a"/><path d="M46 344l4 6 4-6z" fill="#8a8a8a"/><rect x="20" y="352" width="420" height="52" rx="6" fill="#0f1c33" stroke="#3b82f6"/><text x="34" y="374" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">S = where(mask, −∞, S)</text><text x="34" y="394" font-size="13" fill="#8a8a8a">causal_mask：未来位置设为 −∞</text><text x="456" y="384" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[h, n, n]</text><path d="M50 404v18" stroke="#8a8a8a"/><path d="M46 418l4 6 4-6z" fill="#8a8a8a"/><rect x="20" y="426" width="420" height="52" rx="6" fill="#0f1c33" stroke="#3b82f6"/><text x="34" y="448" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">A = softmax(S)</text><text x="34" y="468" font-size="13" fill="#8a8a8a">softmax：先减最大值再 exp</text><text x="456" y="458" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[h, n, n]</text><path d="M50 478v18" stroke="#8a8a8a"/><path d="M46 492l4 6 4-6z" fill="#8a8a8a"/><rect x="20" y="500" width="420" height="52" rx="6" fill="#0f1c33" stroke="#3b82f6"/><text x="34" y="522" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">O = A·V</text><text x="34" y="542" font-size="13" fill="#8a8a8a">加权取信息</text><text x="456" y="532" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[h, n, dk]</text><path d="M50 552v18" stroke="#8a8a8a"/><path d="M46 566l4 6 4-6z" fill="#8a8a8a"/><rect x="20" y="574" width="420" height="52" rx="6" fill="#0a0a0a" stroke="#2e2e2e"/><text x="34" y="596" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">换轴 + reshape：拼接各头</text><text x="34" y="616" font-size="13" fill="#8a8a8a">h × dk = d</text><text x="456" y="606" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[n, d]</text><path d="M50 626v18" stroke="#8a8a8a"/><path d="M46 640l4 6 4-6z" fill="#8a8a8a"/><rect x="20" y="648" width="420" height="52" rx="6" fill="#0a0a0a" stroke="#2e2e2e"/><text x="34" y="670" font-size="15" fill="#ededed" font-family="ui-monospace,Menlo,monospace">out = concat · Wo</text><text x="34" y="690" font-size="13" fill="#8a8a8a">输出形状与输入相同</text><text x="456" y="680" font-size="18" font-weight="700" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">[n, d]</text><path d="M590 278h10v274h-10" fill="none" stroke="#3b82f6"/><text x="616" y="409" font-size="14" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">scaled_dot_product</text><text x="616" y="427" font-size="14" fill="#3b82f6" font-family="ui-monospace,Menlo,monospace">_attention()</text></svg></div></div><div class="small">2 / 6 · 从零实现</div></div></body></html>
