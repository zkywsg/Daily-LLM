<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 736" font-family="system-ui,-apple-system,sans-serif"><rect width="860" height="736" fill="#fff"/><text x="20" y="32" font-size="20" font-weight="700" fill="#0f172a">multi_head_attention 的一次调用：每一步的形状</text><rect x="20" y="56" width="420" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="34" y="78" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">X</text><text x="34" y="98" font-size="13" fill="#64748b">输入：n 个词，每词 d 维</text><text x="456" y="88" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[n, d]</text><path d="M50 108v18" stroke="#64748b"/><path d="M46 122l4 6 4-6z" fill="#64748b"/><rect x="20" y="130" width="420" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="34" y="152" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">Q = X·Wq   K = X·Wk   V = X·Wv</text><text x="34" y="172" font-size="13" fill="#64748b">三次矩阵乘</text><text x="456" y="162" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[n, d]</text><path d="M50 182v18" stroke="#64748b"/><path d="M46 196l4 6 4-6z" fill="#64748b"/><rect x="20" y="204" width="420" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="34" y="226" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">reshape + 换轴：拆成 h 个头</text><text x="34" y="246" font-size="13" fill="#64748b">d = h × dk</text><text x="456" y="236" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[h, n, dk]</text><path d="M50 256v18" stroke="#64748b"/><path d="M46 270l4 6 4-6z" fill="#64748b"/><rect x="20" y="278" width="420" height="52" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="34" y="300" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">S = Q·Kᵀ / √dk</text><text x="34" y="320" font-size="13" fill="#64748b">每个头一张 n×n 分数表</text><text x="456" y="310" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[h, n, n]</text><path d="M50 330v18" stroke="#64748b"/><path d="M46 344l4 6 4-6z" fill="#64748b"/><rect x="20" y="352" width="420" height="52" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="34" y="374" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">S = where(mask, −∞, S)</text><text x="34" y="394" font-size="13" fill="#64748b">causal_mask：未来位置设为 −∞</text><text x="456" y="384" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[h, n, n]</text><path d="M50 404v18" stroke="#64748b"/><path d="M46 418l4 6 4-6z" fill="#64748b"/><rect x="20" y="426" width="420" height="52" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="34" y="448" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">A = softmax(S)</text><text x="34" y="468" font-size="13" fill="#64748b">softmax：先减最大值再 exp</text><text x="456" y="458" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[h, n, n]</text><path d="M50 478v18" stroke="#64748b"/><path d="M46 492l4 6 4-6z" fill="#64748b"/><rect x="20" y="500" width="420" height="52" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="34" y="522" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">O = A·V</text><text x="34" y="542" font-size="13" fill="#64748b">加权取信息</text><text x="456" y="532" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[h, n, dk]</text><path d="M50 552v18" stroke="#64748b"/><path d="M46 566l4 6 4-6z" fill="#64748b"/><rect x="20" y="574" width="420" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="34" y="596" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">换轴 + reshape：拼接各头</text><text x="34" y="616" font-size="13" fill="#64748b">h × dk = d</text><text x="456" y="606" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[n, d]</text><path d="M50 626v18" stroke="#64748b"/><path d="M46 640l4 6 4-6z" fill="#64748b"/><rect x="20" y="648" width="420" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="34" y="670" font-size="15" fill="#0f172a" font-family="ui-monospace,Menlo,monospace">out = concat · Wo</text><text x="34" y="690" font-size="13" fill="#64748b">输出形状与输入相同</text><text x="456" y="680" font-size="18" font-weight="700" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">[n, d]</text><path d="M590 278h10v274h-10" fill="none" stroke="#2563eb"/><text x="616" y="409" font-size="14" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">scaled_dot_product</text><text x="616" y="427" font-size="14" fill="#2563eb" font-family="ui-monospace,Menlo,monospace">_attention()</text></svg>