<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    FastText vs Word2Vec — 形态语言 + 罕见词的全面优势
  </text>

  <!-- ============== TOP: 形态丰富语言对比 ============== -->
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    Word Analogy 准确率 — 形态越丰富,FastText 优势越大
  </text>

  <!-- chart area -->
  <line x1="160" y1="290" x2="820" y2="290" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="160" y1="90" x2="160" y2="290" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y axis -->
  <g font-size="10" fill="#6b7280">
    <text x="153" y="293" text-anchor="end">0</text>
    <text x="153" y="253" text-anchor="end">10</text>
    <text x="153" y="213" text-anchor="end">20</text>
    <text x="153" y="173" text-anchor="end">30</text>
    <text x="153" y="133" text-anchor="end">40</text>
    <text x="153" y="93" text-anchor="end">50</text>
  </g>
  <text x="110" y="195" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600" transform="rotate(-90 110 195)">Analogy Acc (%)</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="160" y1="253" x2="820" y2="253"/>
    <line x1="160" y1="213" x2="820" y2="213"/>
    <line x1="160" y1="173" x2="820" y2="173"/>
    <line x1="160" y1="133" x2="820" y2="133"/>
    <line x1="160" y1="93" x2="820" y2="93"/>
  </g>

  <!-- 5 languages × 2 bars each -->
  <!-- positions: 200, 320, 440, 560, 680 -->
  <!-- bar width: 35 each, pair total: 75 -->

  <!-- German: w2v 38.9, ft 44.3 -->
  <rect x="195" y="135" width="35" height="155" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="212" y="130" text-anchor="middle" font-size="10" fill="#9d174d">38.9</text>
  <rect x="232" y="113" width="35" height="177" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="249" y="108" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">44.3</text>
  <text x="230" y="310" text-anchor="middle" font-size="11" fill="#1f2937">German</text>
  <text x="230" y="325" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="600">+5.4</text>

  <!-- Czech: w2v 32.7, ft 44.4 -->
  <rect x="315" y="159" width="35" height="131" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="332" y="154" text-anchor="middle" font-size="10" fill="#9d174d">32.7</text>
  <rect x="352" y="113" width="35" height="177" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="369" y="108" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">44.4</text>
  <text x="350" y="310" text-anchor="middle" font-size="11" fill="#1f2937">Czech</text>
  <text x="350" y="325" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="600">+11.7</text>

  <!-- Russian: w2v 38.6, ft 49.1 -->
  <rect x="435" y="136" width="35" height="154" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="452" y="131" text-anchor="middle" font-size="10" fill="#9d174d">38.6</text>
  <rect x="472" y="94" width="35" height="196" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="489" y="89" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">49.1</text>
  <text x="470" y="310" text-anchor="middle" font-size="11" fill="#1f2937">Russian</text>
  <text x="470" y="325" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="600">+10.5</text>

  <!-- Arabic: w2v 24.1, ft 45.2 -->
  <rect x="555" y="194" width="35" height="96" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="572" y="189" text-anchor="middle" font-size="10" fill="#9d174d">24.1</text>
  <rect x="592" y="109" width="35" height="181" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="609" y="104" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">45.2</text>
  <text x="590" y="310" text-anchor="middle" font-size="11" fill="#1f2937">Arabic</text>
  <text x="590" y="325" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">+21.1 ★</text>

  <!-- Turkish: w2v 21.8, ft 42.8 -->
  <rect x="675" y="203" width="35" height="87" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="692" y="198" text-anchor="middle" font-size="10" fill="#9d174d">21.8</text>
  <rect x="712" y="119" width="35" height="171" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="729" y="114" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">42.8</text>
  <text x="710" y="310" text-anchor="middle" font-size="11" fill="#1f2937">Turkish</text>
  <text x="710" y="325" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">+21.0 ★</text>

  <!-- legend -->
  <g transform="translate(170, 100)">
    <rect x="0" y="0" width="14" height="14" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="20" y="11" font-size="11" fill="#1f2937">Word2Vec</text>
    <rect x="0" y="20" width="14" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="20" y="31" font-size="11" fill="#1f2937">FastText</text>
  </g>

  <text x="690" y="365" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">
    形态越复杂的语言,FastText 优势越大
  </text>

  <!-- DIVIDER -->
  <line x1="40" y1="395" x2="860" y2="395" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============== BOTTOM LEFT: 罕见词 + 常见词对比 ============== -->
  <text x="240" y="425" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    罕见词 + 常见词上 FastText 双向都赢
  </text>

  <g transform="translate(60, 445)">
    <!-- RW (rare words) -->
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">RW(rare)</text>
    <rect x="80" y="8" width="170" height="18" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="260" y="22" font-size="10" fill="#9d174d">W2V 50</text>
    <rect x="80" y="30" width="187" height="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="277" y="44" font-size="10" fill="#059669" font-weight="700">FT 55 (+5)</text>

    <!-- WS353 (common) -->
    <text x="0" y="78" font-size="11" fill="#1f2937" font-weight="600">WS353</text>
    <rect x="80" y="66" width="245" height="18" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <text x="335" y="80" font-size="10" fill="#9d174d">W2V 70</text>
    <rect x="80" y="88" width="259" height="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="349" y="102" font-size="10" fill="#059669" font-weight="700">FT 74 (+4)</text>

    <text x="180" y="140" text-anchor="middle" font-size="11" fill="#059669" font-weight="600">
      罕见词 + 常见词都更准
    </text>
  </g>

  <!-- ============== BOTTOM RIGHT: subword 思想延续到 LLM ============== -->
  <text x="660" y="425" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    Subword 思想 → 现代 LLM tokenizer
  </text>

  <g transform="translate(490, 445)">
    <rect x="0" y="0" width="350" height="155" rx="6" fill="#1f2937" stroke="none"/>

    <text x="175" y="22" text-anchor="middle" font-size="12" fill="#fef3c7" font-weight="700">FastText subword → BPE → 现代 LLM</text>

    <g font-size="11" fill="#fef3c7">
      <text x="15" y="48">→ BPE(Sennrich 2016,用于神经机翻)</text>
      <text x="15" y="68">→ WordPiece(Schuster 2012,BERT 用)</text>
      <text x="15" y="88">→ SentencePiece(Kudo 2018,T5/LLaMA 用)</text>
      <text x="15" y="108">→ Byte-level BPE(GPT-2/3/4 用)</text>
      <text x="15" y="135" font-weight="700" fill="#fbbf24">→ GPT-4 / Claude / LLaMA 全部基于 subword</text>
    </g>
  </g>
</svg>
