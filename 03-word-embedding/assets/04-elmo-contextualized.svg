<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="el-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    Contextualized vs Static — 同一个 "bank" 在不同上下文
  </text>

  <!-- ============== LEFT: 静态词向量 ============== -->
  <text x="220" y="65" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="600">
    静态词向量(Word2Vec / GloVe / FastText)
  </text>

  <!-- sentence 1 -->
  <rect x="40" y="90" width="380" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="112" text-anchor="middle" font-size="12" fill="#92400e">
    "I deposited money at the bank"
  </text>
  <text x="230" y="130" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">("银行"义)</text>

  <line x1="230" y1="142" x2="230" y2="165" stroke="#dc2626" stroke-width="1.5" marker-end="url(#el-arr)"/>

  <!-- lookup table -->
  <rect x="100" y="170" width="260" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="195" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">lookup["bank"]</text>

  <line x1="230" y1="212" x2="230" y2="232" stroke="#dc2626" stroke-width="1.5" marker-end="url(#el-arr)"/>

  <!-- vec -->
  <rect x="100" y="235" width="260" height="35" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#991b1b" font-weight="700">
    [0.2, -0.5, 0.8, ...]
  </text>

  <!-- sentence 2 -->
  <rect x="40" y="295" width="380" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="317" text-anchor="middle" font-size="12" fill="#92400e">
    "I walked along the river bank"
  </text>
  <text x="230" y="335" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">("河岸"义)</text>

  <line x1="230" y1="347" x2="230" y2="370" stroke="#dc2626" stroke-width="1.5" marker-end="url(#el-arr)"/>

  <!-- same lookup -->
  <rect x="100" y="375" width="260" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="400" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">lookup["bank"](同一个 key)</text>

  <line x1="230" y1="417" x2="230" y2="437" stroke="#dc2626" stroke-width="1.5" marker-end="url(#el-arr)"/>

  <!-- same vec -->
  <rect x="100" y="440" width="260" height="35" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="463" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#991b1b" font-weight="700">
    [0.2, -0.5, 0.8, ...]
  </text>

  <!-- 结论 -->
  <text x="230" y="500" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">
    ✗ 完全相同的向量
  </text>
  <text x="230" y="518" text-anchor="middle" font-size="11" fill="#dc2626">
    cosine_sim = 1.0
  </text>
  <text x="230" y="538" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">
    多义词信息丢失
  </text>

  <!-- ============== RIGHT: ELMo Contextualized ============== -->
  <text x="680" y="65" text-anchor="middle" font-size="13" fill="#059669" font-weight="600">
    ELMo Contextualized(biLSTM)
  </text>

  <!-- sentence 1 -->
  <rect x="490" y="90" width="380" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="680" y="112" text-anchor="middle" font-size="12" fill="#92400e">
    "I deposited money at the bank"
  </text>
  <text x="680" y="130" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">("银行"义)</text>

  <line x1="680" y1="142" x2="680" y2="165" stroke="#059669" stroke-width="1.5" marker-end="url(#el-arr)"/>

  <!-- biLSTM path 1 (blue) -->
  <rect x="510" y="170" width="340" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="190" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">biLSTM 路径 ①</text>
  <text x="680" y="208" text-anchor="middle" font-size="10" fill="#1e40af">money / deposited 上下文激活"银行"特征</text>

  <line x1="680" y1="222" x2="680" y2="240" stroke="#059669" stroke-width="1.5" marker-end="url(#el-arr)"/>

  <rect x="540" y="243" width="280" height="35" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="266" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1e40af" font-weight="700">
    [0.7, 0.1, -0.3, ...]
  </text>

  <!-- sentence 2 -->
  <rect x="490" y="295" width="380" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="680" y="317" text-anchor="middle" font-size="12" fill="#92400e">
    "I walked along the river bank"
  </text>
  <text x="680" y="335" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">("河岸"义)</text>

  <line x1="680" y1="347" x2="680" y2="370" stroke="#059669" stroke-width="1.5" marker-end="url(#el-arr)"/>

  <!-- biLSTM path 2 (green) -->
  <rect x="510" y="375" width="340" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="680" y="395" text-anchor="middle" font-size="11" fill="#065f46" font-weight="600">biLSTM 路径 ②</text>
  <text x="680" y="413" text-anchor="middle" font-size="10" fill="#065f46">river / walked 上下文激活"河岸"特征</text>

  <line x1="680" y1="427" x2="680" y2="445" stroke="#059669" stroke-width="1.5" marker-end="url(#el-arr)"/>

  <rect x="540" y="448" width="280" height="35" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="680" y="471" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#065f46" font-weight="700">
    [-0.2, 0.6, 0.4, ...]
  </text>

  <!-- 结论 -->
  <text x="680" y="508" text-anchor="middle" font-size="12" fill="#059669" font-weight="700">
    ✓ 完全不同的向量
  </text>
  <text x="680" y="526" text-anchor="middle" font-size="11" fill="#059669">
    cosine_sim ≈ 0.3-0.5
  </text>
  <text x="680" y="546" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">
    语义聚类对应"银行"vs"河岸"
  </text>

  <!-- BOTTOM CALLOUT -->
  <rect x="60" y="565" width="780" height="40" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="590" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    词向量从"固定查表"变成"上下文的函数" — Contextualized Embedding 时代的起点
  </text>
</svg>
