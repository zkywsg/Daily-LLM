<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="glv-arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    GloVe 训练 pipeline + 加权函数 + vs Word2Vec 对比
  </text>

  <!-- ============== LEFT: Training pipeline ============== -->
  <text x="200" y="65" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    GloVe 训练 pipeline
  </text>

  <!-- Step 1: corpus → 共现矩阵 -->
  <rect x="60" y="85" width="290" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="205" y="108" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700">① 扫一遍全语料</text>
  <text x="205" y="126" text-anchor="middle" font-size="11" fill="#92400e">构建 V×V 共现矩阵 X_{ij}</text>
  <text x="205" y="142" text-anchor="middle" font-size="10" fill="#92400e">(±10 窗口 + distance weighting)</text>

  <line x1="205" y1="145" x2="205" y2="173" stroke="#9d174d" stroke-width="1.5" marker-end="url(#glv-arr)"/>

  <!-- Step 2: AdaGrad optimization -->
  <rect x="60" y="175" width="290" height="80" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="205" y="198" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="700">② AdaGrad 优化</text>
  <text x="205" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#9d174d">L = Σ f(X) · (v·v + b - log X)²</text>
  <text x="205" y="236" text-anchor="middle" font-size="10" fill="#9d174d">采样 (i, j, X_{ij}) 三元组</text>
  <text x="205" y="250" text-anchor="middle" font-size="10" fill="#9d174d">迭代 ~50 epoch</text>

  <line x1="205" y1="255" x2="205" y2="283" stroke="#9d174d" stroke-width="1.5" marker-end="url(#glv-arr)"/>

  <!-- Step 3: 输出 -->
  <rect x="60" y="285" width="290" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="205" y="308" text-anchor="middle" font-size="12" fill="#065f46" font-weight="700">③ 输出最终词向量</text>
  <text x="205" y="328" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#065f46">v_final = (v_embed + v_context) / 2</text>
  <text x="205" y="342" text-anchor="middle" font-size="10" fill="#065f46">论文建议两路求平均</text>

  <!-- 优势说明 -->
  <rect x="60" y="370" width="290" height="80" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="205" y="393" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">工程优势</text>
  <g font-size="10" fill="#1e40af">
    <text x="75" y="412">• 共现矩阵一次构建,多次复用</text>
    <text x="75" y="428">• 训不同维度 / 超参不用重扫语料</text>
    <text x="75" y="444">• 840B Common Crawl 上工程可行</text>
  </g>

  <!-- ============== RIGHT TOP: 加权函数曲线 ============== -->
  <text x="640" y="65" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    加权函数 f(x) — 平衡 rare 和 common pair
  </text>

  <!-- chart -->
  <line x1="450" y1="240" x2="830" y2="240" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="450" y1="90" x2="450" y2="240" stroke="#1f2937" stroke-width="1.5"/>

  <!-- y labels f(x) -->
  <g font-size="10" fill="#6b7280">
    <text x="443" y="243" text-anchor="end">0</text>
    <text x="443" y="205" text-anchor="end">0.25</text>
    <text x="443" y="168" text-anchor="end">0.5</text>
    <text x="443" y="130" text-anchor="end">0.75</text>
    <text x="443" y="95" text-anchor="end">1.0</text>
  </g>
  <text x="410" y="170" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600" transform="rotate(-90 410 170)">f(x) 权重</text>

  <!-- x labels x = co-occurrence -->
  <g font-size="10" fill="#6b7280">
    <text x="490" y="255" text-anchor="middle">0</text>
    <text x="570" y="255" text-anchor="middle">25</text>
    <text x="650" y="255" text-anchor="middle">50</text>
    <text x="730" y="255" text-anchor="middle">75</text>
    <text x="810" y="255" text-anchor="middle">100+</text>
  </g>
  <text x="640" y="275" text-anchor="middle" font-size="11" fill="#1f2937" font-weight="600">共现次数 X_{ij}</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,3">
    <line x1="450" y1="205" x2="830" y2="205"/>
    <line x1="450" y1="168" x2="830" y2="168"/>
    <line x1="450" y1="130" x2="830" y2="130"/>
    <line x1="450" y1="95" x2="830" y2="95"/>
  </g>

  <!-- f(x) curve: (x/100)^0.75 for x<100, then 1.0 -->
  <!-- pts: (490, 240) ramp to (770, 95) then flat to (830, 95) -->
  <path d="M 490 240 C 520 220, 580 155, 770 95 L 830 95"
        stroke="#7c3aed" stroke-width="3" fill="none"/>

  <!-- markers on curve -->
  <circle cx="490" cy="240" r="4" fill="#7c3aed"/>
  <circle cx="570" cy="180" r="4" fill="#7c3aed"/>
  <circle cx="650" cy="135" r="4" fill="#7c3aed"/>
  <circle cx="770" cy="95" r="5" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <circle cx="830" cy="95" r="4" fill="#7c3aed"/>

  <!-- annotations -->
  <text x="500" y="225" font-size="10" fill="#dc2626" font-weight="600">rare pair</text>
  <text x="500" y="237" font-size="9" fill="#dc2626">权重≈0</text>

  <text x="780" y="115" font-size="10" fill="#059669" font-weight="600">封顶 1.0</text>

  <text x="640" y="170" font-size="10" fill="#7c3aed" font-style="italic">(x/x_max)^0.75</text>

  <!-- ============== RIGHT BOTTOM: vs Word2Vec ============== -->
  <text x="640" y="305" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">
    Word Similarity 任务对比(Spearman ρ)
  </text>

  <g transform="translate(460, 325)">
    <!-- WS353 -->
    <text x="0" y="20" font-size="11" fill="#1f2937" font-weight="600">WS353</text>
    <rect x="80" y="8" width="170" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="260" y="22" font-size="11" fill="#991b1b">Word2Vec 65.6</text>
    <rect x="80" y="30" width="200" height="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="290" y="44" font-size="11" fill="#059669" font-weight="700">GloVe 75.9</text>

    <!-- MC -->
    <text x="0" y="78" font-size="11" fill="#1f2937" font-weight="600">MC</text>
    <rect x="80" y="66" width="200" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="290" y="80" font-size="11" fill="#991b1b">Word2Vec 75.4</text>
    <rect x="80" y="88" width="225" height="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="315" y="102" font-size="11" fill="#059669" font-weight="700">GloVe 83.6</text>

    <!-- RG -->
    <text x="0" y="136" font-size="11" fill="#1f2937" font-weight="600">RG</text>
    <rect x="80" y="124" width="190" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="280" y="138" font-size="11" fill="#991b1b">Word2Vec 72.4</text>
    <rect x="80" y="146" width="222" height="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="312" y="160" font-size="11" fill="#059669" font-weight="700">GloVe 82.9</text>

    <text x="160" y="195" text-anchor="middle" font-size="11" fill="#059669" font-weight="600">
      GloVe 全面胜出 5-10 个点
    </text>
  </g>

  <!-- bottom callout -->
  <rect x="60" y="585" width="780" height="50" rx="6" fill="#1f2937" stroke="none"/>
  <text x="450" y="610" text-anchor="middle" font-size="13" fill="#fef3c7" font-weight="600">
    Stanford glove.6B.300d.zip 是 2014-2018 NLP baseline 的默认输入
  </text>
  <text x="450" y="628" text-anchor="middle" font-size="11" fill="#fef3c7">
    Levy 2014 证明:Word2Vec SGNS ≡ 隐式 PMI 分解,GloVe ≡ 显式 log-X 分解,两者本质都是矩阵分解
  </text>
</svg>
