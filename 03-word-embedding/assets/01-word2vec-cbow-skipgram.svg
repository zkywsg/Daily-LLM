<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620"
     preserveAspectRatio="xMidYMid meet"
     font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arr-main" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9d174d"/>
    </marker>
    <marker id="arr-out" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="16"
        fill="#1f2937" font-weight="600">
    CBOW vs Skip-gram · 两种"上下文 ↔ 中心词"任务
  </text>

  <!-- Example sentence (top, shared) -->
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#6b7280">
    "the quick brown <tspan fill="#dc2626" font-weight="600">fox</tspan> jumps over"  ·  窗口大小 k = 2
  </text>

  <!-- ============ LEFT PANEL: CBOW ============ -->
  <text x="225" y="92" text-anchor="middle" font-size="15"
        fill="#1f2937" font-weight="600">CBOW</text>
  <text x="225" y="110" text-anchor="middle" font-size="11" fill="#6b7280">
    用 4 个 context 预测中心 "fox"
  </text>

  <!-- Panel background -->
  <rect x="30" y="125" width="390" height="380" rx="10"
        fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>

  <!-- Input one-hots (4 context words, left column) -->
  <g font-size="11">
    <rect x="55" y="150" width="80" height="28" rx="4"
          fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="95" y="168" text-anchor="middle" fill="#92400e">the   [1-hot]</text>

    <rect x="55" y="195" width="80" height="28" rx="4"
          fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="95" y="213" text-anchor="middle" fill="#92400e">quick [1-hot]</text>

    <rect x="55" y="240" width="80" height="28" rx="4"
          fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="95" y="258" text-anchor="middle" fill="#92400e">brown [1-hot]</text>

    <rect x="55" y="285" width="80" height="28" rx="4"
          fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="95" y="303" text-anchor="middle" fill="#92400e">jumps [1-hot]</text>
  </g>
  <text x="95" y="338" text-anchor="middle" font-size="10" fill="#92400e">|V| ≈ 1M 维</text>

  <!-- Embedding lookup → avg -->
  <rect x="170" y="195" width="80" height="80" rx="6"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="210" y="226" text-anchor="middle" font-size="12" fill="#9d174d">embed</text>
  <text x="210" y="243" text-anchor="middle" font-size="12" fill="#9d174d">+ 平均</text>
  <text x="210" y="260" text-anchor="middle" font-size="10" fill="#9d174d">300d</text>

  <!-- arrows from one-hots to avg -->
  <g stroke="#9d174d" stroke-width="1.2" fill="none">
    <line x1="137" y1="164" x2="168" y2="210" marker-end="url(#arr-main)"/>
    <line x1="137" y1="209" x2="168" y2="225" marker-end="url(#arr-main)"/>
    <line x1="137" y1="254" x2="168" y2="245" marker-end="url(#arr-main)"/>
    <line x1="137" y1="299" x2="168" y2="260" marker-end="url(#arr-main)"/>
  </g>

  <!-- Hidden h (300d) -->
  <rect x="280" y="220" width="60" height="30" rx="4"
        fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="240" text-anchor="middle" font-size="12" fill="#1e40af">h (300d)</text>
  <line x1="252" y1="235" x2="278" y2="235"
        stroke="#9d174d" stroke-width="1.2" fill="none" marker-end="url(#arr-main)"/>

  <!-- Softmax (output, vertical column) -->
  <rect x="350" y="180" width="50" height="110" rx="4"
        fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="375" y="202" text-anchor="middle" font-size="11" fill="#065f46">softmax</text>
  <text x="375" y="218" text-anchor="middle" font-size="10" fill="#065f46">|V| 维</text>
  <text x="375" y="245" text-anchor="middle" font-size="10" fill="#065f46">…</text>
  <text x="375" y="263" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">fox ★</text>
  <text x="375" y="280" text-anchor="middle" font-size="10" fill="#065f46">…</text>
  <line x1="342" y1="235" x2="348" y2="235"
        stroke="#059669" stroke-width="1.2" fill="none" marker-end="url(#arr-out)"/>

  <!-- Layer labels -->
  <text x="95" y="365" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">input</text>
  <text x="210" y="365" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">projection</text>
  <text x="375" y="365" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">output</text>

  <!-- Note (CBOW) -->
  <rect x="50" y="395" width="350" height="95" rx="6"
        fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="225" y="416" text-anchor="middle" font-size="11" fill="#78350f" font-weight="600">
    一次梯度更新看 2k 个 context 词
  </text>
  <text x="225" y="436" text-anchor="middle" font-size="10" fill="#78350f">
    优:大语料更快(每 step 信息密度高)
  </text>
  <text x="225" y="453" text-anchor="middle" font-size="10" fill="#78350f">
    缺:低频中心词的梯度被高频 context 稀释
  </text>
  <text x="225" y="475" text-anchor="middle" font-size="10" fill="#78350f" font-style="italic">
    L = -log P(fox | the, quick, brown, jumps)
  </text>

  <!-- ============ RIGHT PANEL: Skip-gram ============ -->
  <text x="675" y="92" text-anchor="middle" font-size="15"
        fill="#1f2937" font-weight="600">Skip-gram</text>
  <text x="675" y="110" text-anchor="middle" font-size="11" fill="#6b7280">
    用中心 "fox" 预测 4 个 context
  </text>

  <!-- Panel background -->
  <rect x="480" y="125" width="390" height="380" rx="10"
        fill="#fafaf9" stroke="#e7e5e4" stroke-width="1"/>

  <!-- Input one-hot: fox -->
  <rect x="510" y="220" width="80" height="30" rx="4"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="550" y="240" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">fox [1-hot]</text>

  <!-- Embedding lookup -->
  <rect x="620" y="220" width="70" height="30" rx="4"
        fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="655" y="240" text-anchor="middle" font-size="12" fill="#9d174d">embed</text>

  <!-- Hidden h -->
  <rect x="715" y="220" width="60" height="30" rx="4"
        fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="745" y="240" text-anchor="middle" font-size="12" fill="#1e40af">h (300d)</text>

  <g stroke="#9d174d" stroke-width="1.2" fill="none">
    <line x1="592" y1="235" x2="618" y2="235" marker-end="url(#arr-main)"/>
    <line x1="692" y1="235" x2="713" y2="235" marker-end="url(#arr-main)"/>
  </g>

  <!-- 4 softmax heads predicting context -->
  <g font-size="11">
    <rect x="800" y="150" width="55" height="28" rx="4"
          fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="827" y="168" text-anchor="middle" fill="#065f46">→ the</text>

    <rect x="800" y="190" width="55" height="28" rx="4"
          fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="827" y="208" text-anchor="middle" fill="#065f46">→ quick</text>

    <rect x="800" y="252" width="55" height="28" rx="4"
          fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="827" y="270" text-anchor="middle" fill="#065f46">→ brown</text>

    <rect x="800" y="292" width="55" height="28" rx="4"
          fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="827" y="310" text-anchor="middle" fill="#065f46">→ jumps</text>
  </g>

  <g stroke="#059669" stroke-width="1.2" fill="none">
    <line x1="775" y1="230" x2="798" y2="164" marker-end="url(#arr-out)"/>
    <line x1="775" y1="232" x2="798" y2="204" marker-end="url(#arr-out)"/>
    <line x1="775" y1="240" x2="798" y2="266" marker-end="url(#arr-out)"/>
    <line x1="775" y1="242" x2="798" y2="306" marker-end="url(#arr-out)"/>
  </g>

  <!-- Layer labels -->
  <text x="550" y="365" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">input</text>
  <text x="680" y="365" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">projection</text>
  <text x="827" y="365" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">output × 2k</text>

  <!-- Note (Skip-gram) -->
  <rect x="500" y="395" width="350" height="95" rx="6"
        fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="675" y="416" text-anchor="middle" font-size="11" fill="#1e3a8a" font-weight="600">
    每个中心词被预测 2k 次,产生 2k 个梯度
  </text>
  <text x="675" y="436" text-anchor="middle" font-size="10" fill="#1e3a8a">
    优:低频词梯度信号更强,语义任务更准
  </text>
  <text x="675" y="453" text-anchor="middle" font-size="10" fill="#1e3a8a">
    缺:每 step 计算量大,大语料时慢于 CBOW
  </text>
  <text x="675" y="475" text-anchor="middle" font-size="10" fill="#1e3a8a" font-style="italic">
    L = -Σⱼ log P(context_j | fox)
  </text>

  <!-- ============ Bottom callout ============ -->
  <rect x="60" y="530" width="780" height="70" rx="8"
        fill="#fdf2f8" stroke="#ec4899" stroke-width="1.2"/>
  <text x="450" y="554" text-anchor="middle" font-size="13"
        fill="#831843" font-weight="600">
    经验法则
  </text>
  <text x="450" y="575" text-anchor="middle" font-size="11" fill="#831843">
    CBOW —— 一个梯度更新看 2k 个词,信息密度高,<tspan font-weight="600">大语料更快</tspan>;高频词受益,低频词稀释
  </text>
  <text x="450" y="592" text-anchor="middle" font-size="11" fill="#831843">
    Skip-gram —— 一个中心词被预测 2k 次,<tspan font-weight="600">对低频词更友好</tspan>,semantic analogy 任务上反超 CBOW(55% vs 24%)
  </text>
</svg>
